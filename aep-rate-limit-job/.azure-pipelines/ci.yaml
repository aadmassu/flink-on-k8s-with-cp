# Pipeline:  aep-rate-limit-job CI
# Purpose:   Build the AEP rate-limit Flink job JAR (mvn clean package),
#            assemble the container image, and push it to Artifactory.
#
#            Deploy of the FlinkApplication CR into the Flink cluster is
#            performed by the existing flink-application pipeline.
#
# Author:    Ayele Admassu
# Created:   2026-05-06
#
# Variable Group: <env>-openshift-credentials
#   artifactory-svc-user          — Artifactory service account username
#   artifactory-svc-user-password — Artifactory service account password (secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd]

  - name: imageTag
    displayName: "Image Tag"
    type: string
    default: "1.0.0"

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
    - name: REGISTRY_REPO
      value: camdepositsharedservices-docker-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
    - name: REGISTRY_REPO
      value: camdepositsharedservices-docker-dev
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: uat-openshift-credentials
    - name: REGISTRY_REPO
      value: camdepositsharedservices-docker-dev
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials
    - name: REGISTRY_REPO
      value: camdepositsharedservices-docker-prod

stages:
  - stage: BuildAndPush
    displayName: "aep-rate-limit-job CI (${{ parameters.environment }} / ${{ parameters.imageTag }})"
    jobs:
      - job: BuildAndPush
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - task: Bash@3
            displayName: "Build JAR (mvn clean package)"
            inputs:
              targetType: inline
              workingDirectory: aep-rate-limit-job
              script: |
                set -euo pipefail

                echo "=== Java & Maven versions ==="
                java -version
                mvn --version

                echo ""
                echo "=== Git commit ==="
                git rev-parse HEAD

                echo ""
                echo "=== mvn clean package ==="
                mvn clean package -B

                echo ""
                echo "=== Built artifact ==="
                ls -lh target/aep-rate-limit-job.jar

          - task: Bash@3
            displayName: "Build & push image"
            inputs:
              targetType: inline
              workingDirectory: aep-rate-limit-job
              script: |
                set -euo pipefail

                REGISTRY="artifactory.fcbint.net/$REGISTRY_REPO"
                IMAGE="$REGISTRY/aep-rate-limit-job:$IMAGE_TAG"

                CONTAINER_CLI="docker"
                if command -v podman &>/dev/null; then
                  CONTAINER_CLI="podman"
                fi
                echo "Using $CONTAINER_CLI"

                echo ""
                echo "=== Logging in to Artifactory ==="
                echo "$ART_PWD" | $CONTAINER_CLI login artifactory.fcbint.net \
                  --username "$ART_USER" --password-stdin

                echo ""
                echo "=== Building $IMAGE ==="
                $CONTAINER_CLI build -t "$IMAGE" .

                echo ""
                echo "=== Pushing $IMAGE ==="
                $CONTAINER_CLI push "$IMAGE"

                echo ""
                echo "=== Done ==="
                echo "Image pushed: $IMAGE"
            env:
              IMAGE_TAG: ${{ parameters.imageTag }}
              REGISTRY_REPO: $(REGISTRY_REPO)
              ART_USER: $(artifactory-svc-user)
              ART_PWD: $(artifactory-svc-user-password)
