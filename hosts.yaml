---
# Cluster inventory for multi-environment Confluent Platform + Flink deployment
# Region: openshift

clusters:
  dev:
    name: dev-cluster
    environment: dev
    region: openshift
    server: https://dev-cluster.example.com
    namespace: confluent-dev
    argocdNamespace: argocd

  qa:
    name: qa-cluster
    environment: qa
    region: openshift
    server: https://qa-cluster.example.com
    namespace: confluent-qa
    argocdNamespace: argocd

  stg:
    name: stg-cluster
    environment: stg
    region: openshift
    server: https://stg-cluster.example.com
    namespace: confluent-stg
    argocdNamespace: argocd

  prd:
    name: prd-cluster
    environment: prd
    region: openshift
    server: https://prd-cluster.example.com
    namespace: confluent-prd
    argocdNamespace: argocd
