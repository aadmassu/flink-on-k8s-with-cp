# 3 brokers. Anti-affinity forces 1 broker per worker node so loss of a single
# node still leaves 2 brokers serving traffic.
# Broker node IDs use the 10+ range to keep them visually distinct from
# controller IDs (1-3) when reading logs / metadata.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
  namespace: kafka-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  serviceName: broker
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: kafka
                app.kubernetes.io/component: broker
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.7.0
        imagePullPolicy: IfNotPresent
        # Derive broker NODE_ID (10..12) and per-Pod advertised listener
        # from the Pod's hostname so each broker advertises itself by its
        # stable headless-Service DNS name.
        command:
        - sh
        - -c
        - |
          export KAFKA_NODE_ID=$((${HOSTNAME##*-} + 10))
          export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.broker.kafka-dev.svc.cluster.local:9092"
          exec /etc/confluent/docker/run
        env:
        - name: CLUSTER_ID
          value: "ASNFZ4mrze8BI0VniavN7w"      # MUST match the controller value
        - name: KAFKA_PROCESS_ROLES
          value: "broker"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@controller-0.controller.kafka-dev.svc.cluster.local:9093,2@controller-1.controller.kafka-dev.svc.cluster.local:9093,3@controller-2.controller.kafka-dev.svc.cluster.local:9093"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        # Replication factors for internal topics — use 3 since we have 3 brokers.
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "2"
        ports:
        - name: plaintext
          containerPort: 9092
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ssd
      resources:
        requests:
          storage: 1Gi
