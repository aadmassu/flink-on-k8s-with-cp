# Headless Service for the KRaft controller StatefulSet.
# Headless (clusterIP: None) gives each controller Pod its own stable DNS:
#   controller-0.controller.kafka-dev.svc.cluster.local
#   controller-1.controller.kafka-dev.svc.cluster.local
#   controller-2.controller.kafka-dev.svc.cluster.local
# These are the addresses listed in controller.quorum.voters so the controllers
# can find each other and form a quorum.
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: kafka-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: controller
spec:
  clusterIP: None              # headless — exposes per-Pod DNS, no virtual IP
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: controller
  ports:
  - name: controller
    port: 9093
    targetPort: 9093
    protocol: TCP
