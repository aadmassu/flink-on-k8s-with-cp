# 3 KRaft controllers. Anti-affinity forces 1 controller per worker node so
# loss of a single node can't take the quorum below majority.
# Node IDs are derived from the Pod ordinal (controller-0 -> 1, -1 -> 2, -2 -> 3)
# inside the entrypoint shim so we don't need three separate StatefulSets.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: controller
  namespace: kafka-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: controller
spec:
  serviceName: controller         # matches the headless Service in 10-*
  replicas: 3
  podManagementPolicy: Parallel   # start all 3 together; KRaft needs quorum to form
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: controller
    spec:
      # Required anti-affinity: no two controllers on the same node.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: kafka
                app.kubernetes.io/component: controller
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.7.0
        imagePullPolicy: IfNotPresent
        # Derive KAFKA_NODE_ID from the StatefulSet ordinal so node IDs
        # are stable: controller-0=1, controller-1=2, controller-2=3.
        command:
        - sh
        - -c
        - |
          export KAFKA_NODE_ID=$((${HOSTNAME##*-} + 1))
          exec /etc/confluent/docker/run
        env:
        # Static cluster ID — same value on every node, controllers and brokers.
        # 22-char URL-safe Base64 (16 bytes); regenerate per cluster if you ever
        # want a fresh one (kafka-storage random-uuid).
        - name: CLUSTER_ID
          value: "ASNFZ4mrze8BI0VniavN7w"
        - name: KAFKA_PROCESS_ROLES
          value: "controller"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@controller-0.controller.kafka-dev.svc.cluster.local:9093,2@controller-1.controller.kafka-dev.svc.cluster.local:9093,3@controller-2.controller.kafka-dev.svc.cluster.local:9093"
        - name: KAFKA_LISTENERS
          value: "CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        ports:
        - name: controller
          containerPort: 9093
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "384Mi"
          limits:
            cpu: "500m"
            memory: "640Mi"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
  # 1Gi per controller — cheap, kept on local-path under the ssd StorageClass.
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ssd
      resources:
        requests:
          storage: 1Gi
