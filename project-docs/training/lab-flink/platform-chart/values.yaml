# Lab-scale values for the umbrella chart. Every knob favors laptop-friendliness
# over production sizing. Do NOT reuse these numbers for real deployments.
#
# Value keys below are verified against the upstream chart schemas at the
# versions pinned in Chart.yaml. If you bump a dependency version and its
# schema changes, this file needs a corresponding update.

# ------------------------------------------------------------------------------
# CFK operator (Confluent for Kubernetes)
# ------------------------------------------------------------------------------
cfk:
  enabled: true

  # Namespaced watch keeps the operator light — reconciles only flink-lab.
  namespaced: true
  namespaceList:
    - flink-lab

  # Leave licenseKey empty for evaluation mode. Provide a real key
  # (or set license.secretRef) for anything beyond a laptop lab.
  licenseKey: ""

  # KRaft is used by cluster/kafka.yaml (no ZooKeeper).
  kRaftEnabled: true

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------------------
# Flink Kubernetes operator
# ------------------------------------------------------------------------------
flink-operator:
  enabled: true

  # Watch only the lab namespace.
  watchNamespaces:
    - flink-lab

  operatorPod:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # Webhook adds a cert-manager Certificate + admission webhook. The lab
  # already has cert-manager, so this can be true; we leave it default.

# ------------------------------------------------------------------------------
# CMF (Confluent Manager for Flink)
#
# Disabled by default — CMF requires a Confluent license Secret and asks for
# ~2 CPU / 2 GiB memory, which is heavier than Week 5 Mon+Tue exercises need.
# Enable this and set cmf.license.secretRef when you're ready to walk Week 5
# Thursday (Enterprise Components).
# ------------------------------------------------------------------------------
cmf:
  enabled: false

  image:
    repository: confluentinc
    name: cp-cmf
    tag: "2.4.0"

  # Set to the name of a K8s Secret in flink-lab containing key 'license.txt'
  # with the raw license blob. Required at CMF startup.
  license:
    secretRef: ""

  # Lab-scale requests. CMF's default is 2 CPU / 2 GiB; keep this at 1 / 1
  # for a laptop kind cluster.
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  # Persistence — CMF stores statements + catalog metadata. persistence.create
  # provisions a PVC of dataVolumeCapacity.
  persistence:
    create: true
    dataVolumeCapacity: 5Gi

  # Watch the lab namespace only.
  watchNamespaces:
    - flink-lab
