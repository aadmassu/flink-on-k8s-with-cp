# Custom Flink job — event-counter reads events-in, keys by user, counts per
# user, writes counts-out.
#
# Prereqs (see flink-job/README.md for the full walkthrough):
#   1. mvn package in ./src/ → target/event-counter.jar
#   2. Build the image: cp target/event-counter.jar src/ && docker build -t event-counter:local src/
#   3. Load into kind: kind load docker-image event-counter:local --name flink-lab
#   4. Kafka is up in flink-lab; topics events-in and counts-out exist.
#
# Application mode requires local:// jarURI -- the JAR is baked into the image
# above at /opt/flink/usrlib/event-counter.jar. HTTP jarURI does not work in
# application mode (see the LESSONS_LEARNED runbook for the full story).

apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: event-counter
  namespace: flink-lab
  labels:
    app: event-counter
spec:
  image: event-counter:local
  # imagePullPolicy: Never so kubelet uses the kind-loaded image and does not
  # try to pull from a registry (there is no registry hosting event-counter:local).
  imagePullPolicy: Never
  flinkVersion: v1_18
  serviceAccount: flink

  flinkConfiguration:
    # 2 slots per TM * 2 TMs = 4 slots. Parallelism 3 uses 3 of them, leaves 1
    # slot idle -- visible in the Flink UI, useful for Week 5 Wednesday's
    # slot-arithmetic walkthrough.
    taskmanager.numberOfTaskSlots: "2"

    # State is in memory (Flink default) -- no durability across JM restarts.
    # To checkpoint state to durable storage for Week 5 Thu exercises, install
    # MinIO into flink-lab and add these keys:
    #   state.checkpoints.dir: "s3://flink-checkpoints/event-counter/"
    #   state.backend: rocksdb
    #   execution.checkpointing.interval: "30 s"
    #   s3.endpoint: "http://minio.flink-lab.svc:9000"
    #   s3.access-key: "minio"
    #   s3.secret-key: "minio123"
    #   s3.path.style.access: "true"

  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    replicas: 2
    resource:
      memory: "1536m"
      cpu: 0.5

  job:
    jarURI: local:///opt/flink/usrlib/event-counter.jar
    entryClass: dev.lab.EventCounter
    args:
      - "--kafka.bootstrap"
      - "kafka.flink-lab.svc.cluster.local:9092"
      - "--source.topic"
      - "events-in"
      - "--sink.topic"
      - "counts-out"
    parallelism: 3
    upgradeMode: stateless
