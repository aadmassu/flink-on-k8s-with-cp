apiVersion: v2
name: flink-lab-platform
description: Umbrella chart for the Flink training lab — installs the CFK operator, the Flink Kubernetes operator, and CMF into a single laptop-friendly namespace.
type: application
version: 0.1.0
appVersion: "1.0.0"

# Upstream chart dependencies. Versions pinned to what was current at authoring time.
# The Flink operator chart repo URL is version-scoped (Apache moves older versions
# to archive.apache.org), so if you bump the flinkOperator version you must also
# update the repository URL to match. `helm dependency update` pulls charts into ./charts/.
dependencies:
  - name: confluent-for-kubernetes
    version: "0.1718.10"
    repository: "https://packages.confluent.io/helm"
    alias: cfk
    condition: cfk.enabled

  - name: flink-kubernetes-operator
    version: "1.14.0"
    repository: "https://downloads.apache.org/flink/flink-kubernetes-operator-1.14.0/"
    alias: flink-operator
    condition: flink-operator.enabled

  - name: confluent-manager-for-apache-flink
    version: "2.4.0"
    repository: "https://packages.confluent.io/helm"
    alias: cmf
    condition: cmf.enabled
