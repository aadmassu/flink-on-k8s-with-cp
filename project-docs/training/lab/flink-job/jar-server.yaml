# Trivial nginx serving the custom JAR to the cluster.
# Rebuilds via ConfigMap → Pod restart when you push a new JAR.
#
# Workflow to update the JAR:
#   1. cd src/ && mvn package
#   2. kubectl create configmap event-counter-jar --from-file=event-counter.jar=target/event-counter-1.0.jar -n flink-lab --dry-run=client -o yaml | kubectl apply -f -
#   3. kubectl rollout restart deployment/jar-server -n flink-lab
#
# The FlinkDeployment CR references http://jar-server.flink-lab.svc/event-counter.jar.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jar-server
  namespace: flink-lab
  labels:
    app: jar-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jar-server
  template:
    metadata:
      labels:
        app: jar-server
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: jar
              mountPath: /usr/share/nginx/html
      volumes:
        - name: jar
          configMap:
            name: event-counter-jar
---
apiVersion: v1
kind: Service
metadata:
  name: jar-server
  namespace: flink-lab
  labels:
    app: jar-server
spec:
  selector:
    app: jar-server
  ports:
    - port: 80
      targetPort: 80
