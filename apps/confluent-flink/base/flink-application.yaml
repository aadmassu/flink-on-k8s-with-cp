---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: flink-app
spec:
  flinkEnvironment: flink-env1
  image: confluentinc/cp-flink:2.1.1-cp1-java21
  flinkVersion: v1_19
  serviceAccount: flink

  flinkConfiguration:
    ## Java 17+ module access
    "env.java.opts.all": >
      --add-opens java.base/java.util=ALL-UNNAMED
      --add-opens java.base/java.lang=ALL-UNNAMED
      --add-opens java.base/sun.nio.ch=ALL-UNNAMED
      --add-opens java.base/java.io=ALL-UNNAMED
      --add-opens java.base/java.net=ALL-UNNAMED
      --add-opens java.base/java.nio=ALL-UNNAMED
      --add-opens java.base/java.time=ALL-UNNAMED
      --add-opens java.base/java.util.concurrent=ALL-UNNAMED
      --add-opens java.base/java.util.stream=ALL-UNNAMED

    ## Task slots and parallelism
    "taskmanager.numberOfTaskSlots": "1"

    ## State backend — RocksDB for production workloads
    "state.backend.type": "rocksdb"

    ## On-prem S3 configuration
    ## TODO: Get S3 endpoint URL from FCB (e.g. https://s3.fcbint.net)
    "s3.endpoint": "https://<fcb-s3-endpoint>"
    ## TODO: Get S3 credentials — access key/secret key or IAM/STS?
    "s3.access-key": "<from-k8s-secret>"
    "s3.secret-key": "<from-k8s-secret>"
    ## Required for most on-prem S3 implementations (MinIO, Dell ECS, NetApp StorageGRID, Ceph RGW)
    "s3.path-style-access": "true"
    ## TODO: Is the S3 endpoint HTTPS with a corporate CA? Flink may need the CA in its truststore
    ## TODO: Which S3 product? (MinIO, Dell ECS, NetApp StorageGRID, Ceph RGW)

    ## Checkpointing — writes state snapshots to S3 for fault tolerance
    "execution.checkpointing.interval": "10s"
    ## TODO: Confirm bucket name — one bucket per environment or shared?
    "state.checkpoints.dir": "s3://flink-state/checkpoints"
    "state.savepoints.dir": "s3://flink-state/savepoints"

    ## Periodic savepoints
    "kubernetes.operator.periodic.savepoint.interval": "5m"

    ## Metrics — Prometheus
    "metrics.reporter.prom.factory.class": "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
    "metrics.reporter.prom.port": "9250"
    "metrics.job.status.enable": "STATE"

    ## Profiling and classloading
    "rest.profiling.enabled": "true"
    "classloader.resolve-order": "parent-first"

  jobManager:
    resource:
      memory: 1024m
      cpu: 1
    podTemplate:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9250"
          # Dynatrace metrics scraping
          metrics.dynatrace.com/scrape: "true"
          metrics.dynatrace.com/port: "9250"
      spec:
        containers:
          - name: flink-main-container
            env:
              ## Load the S3 filesystem plugin so Flink can read/write to S3
              - name: ENABLE_BUILT_IN_PLUGINS
                value: "flink-s3-fs-hadoop-2.1.1-cp1.jar"

  taskManager:
    resource:
      memory: 1024m
      cpu: 1
    podTemplate:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9250"
          # Dynatrace metrics scraping
          metrics.dynatrace.com/scrape: "true"
          metrics.dynatrace.com/port: "9250"
      spec:
        containers:
          - name: flink-main-container
            env:
              ## Load the S3 filesystem plugin so Flink can read/write to S3
              - name: ENABLE_BUILT_IN_PLUGINS
                value: "flink-s3-fs-hadoop-2.1.1-cp1.jar"

  job:
    jarURI: local:///opt/flink/lib/app.jar
    state: running
    parallelism: 1
    upgradeMode: savepoint

  cmfRestClassRef:
    name: default
    namespace: confluent
