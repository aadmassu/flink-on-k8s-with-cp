---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: confluent-prd

patches:
  - target:
      kind: CMFRestClass
      name: default
    patch: |
      - op: replace
        path: /spec/cmfRest/endpoint
        value: http://cmf-service.confluent-prd.svc.cluster.local:80
  - target:
      kind: FlinkEnvironment
      name: flink-env1
    patch: |
      - op: replace
        path: /spec/kubernetesNamespace
        value: confluent-prd
      - op: replace
        path: /spec/cmfRestClassRef/namespace
        value: confluent-prd
  - target:
      kind: PersistentVolumeClaim
      name: flink-pvc
    patch: |
      - op: replace
        path: /spec/accessModes
        value:
          - ReadWriteOnce
