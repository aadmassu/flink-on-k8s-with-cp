---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-flink-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PLACEHOLDER_ORG/FCB.git
    path: apps/confluent-flink/prd/manifests
    targetRevision: HEAD
  destination:
    server: https://prd-cluster.aws-us-east-2.example.com
    namespace: confluent-prd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
