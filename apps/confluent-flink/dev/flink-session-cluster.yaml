---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-session
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/instance: flink-session
    app.kubernetes.io/component: flink-session-cluster
    fcbint.net/app-id: "11547"
spec:
  image: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-flink:2.1.1-cp1-java21
  flinkVersion: v2_1
  serviceAccount: flink-operator
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "1024m"
      cpu: 0.5
