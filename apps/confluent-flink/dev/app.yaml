---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-flink-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PLACEHOLDER_ORG/FCB.git
    path: apps/confluent-flink/dev/manifests
    targetRevision: HEAD
  destination:
    server: https://dev-cluster.aws-us-east-2.example.com
    namespace: confluent-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
