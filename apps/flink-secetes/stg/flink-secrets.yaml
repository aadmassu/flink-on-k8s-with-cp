apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dah-flink-dev
  namespace: dah-flink-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: namespace-secretstore-example
    kind: ClusterSecretStore
  target:
    name: kube-secret-to-be-created
    creationPolicy: Owner
  data:
  - secretKey: kube-secret-key-to-be-managed
    remoteRef:
      key: cyberark-username-field
      property: cyberark-address-field
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    reconcile.external-secrets.io/data-hash: ...
  labels:
    reconcile.external-secrets.io/created-by: ...
  name: kube-secret-to-be-created
  ownerReferences:
  - apiVersion: external-secrets.io/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: ExternalSecret
    name: example
data:
  kube-secret-key-to-be-managed: bmljZSB0cnksIG1heWJlIG5leHQgdGltZQ==
immutable: false
type: Opaque