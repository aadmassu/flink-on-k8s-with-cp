---
# cert-manager Helm values - qa

crds:
  enabled: true

serviceAccount:
  name: cert-manager
webhook:
  serviceAccount:
    name: cert-manager-webhook
cainjector:
  serviceAccount:
    name: cert-manager-cainjector
startupapicheck:
  serviceAccount:
    name: cert-manager-startupapicheck

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
