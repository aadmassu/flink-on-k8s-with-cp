---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 1.*
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://qa-cluster.aws-us-east-2.example.com
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
