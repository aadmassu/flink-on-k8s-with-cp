---
# cert-manager Helm values - stg

crds:
  enabled: true

serviceAccount:
  name: cert-manager
webhook:
  serviceAccount:
    name: cert-manager-webhook
cainjector:
  serviceAccount:
    name: cert-manager-cainjector
startupapicheck:
  serviceAccount:
    name: cert-manager-startupapicheck

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
