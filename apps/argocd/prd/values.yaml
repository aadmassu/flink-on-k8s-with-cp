---
# ArgoCD Helm values for prd environment
# HA configuration

global:
  domain: argocd-prd.example.com

server:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

controller:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

applicationSet:
  replicas: 2

configs:
  rbac:
    policy.default: role:readonly
