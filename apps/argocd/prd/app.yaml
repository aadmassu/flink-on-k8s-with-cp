---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 9.4.7
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://prd-cluster.example.com
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
