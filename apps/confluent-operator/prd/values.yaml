---
# Confluent for Kubernetes (CFK) operator values - prd

# Name of the operator deployment; used in resource naming
name: confluent-operator

# Raw license key string; use license.secretRef for production instead
licenseKey: ""

# License configuration for Confluent Platform components
license:
  # Secret containing license.txt; preferred over licenseKey for security
  secretRef: ""
  # Directory path in container for license file; takes precedence over secretRef
  directoryPathInContainer: ""

# CFK-managed certificate generation for Confluent Platform components
managedCerts:
  # Enable to let CFK generate TLS certs; causes cluster roll on first enable
  enabled: false
  # CA certificate pair used to sign auto-generated component certs
  caCertificate:
    # Secret with tls.crt and tls.key for the CA; required if enabled
    secretRef: ""
    # Directory path alternative to secretRef for CA cert files
    directoryPathInContainer: ""
  # Old CA pair for zero-downtime CA rotation; optional
  oldCaCertificate:
    # Secret with old CA tls.crt and tls.key; only during rotation
    secretRef: ""
    # Directory path alternative for old CA cert files
    directoryPathInContainer: ""
  # How long auto-generated certs are valid before renewal
  certDurationInDays: 60
  # Days before expiry to trigger certificate renewal
  renewBeforeInDays: 30
  # Extra SANs (e.g. wildcards) added to all auto-generated certs
  sans: ""

# Secret for pulling images from private registries like Artifactory
imagePullSecretRef: null

# Container image for the CFK operator
image:
  # Docker registry URL; change to Artifactory mirror for air-gapped clusters
  registry: docker.io
  # Image repository path
  repository: confluentinc/confluent-operator
  # IfNotPresent avoids unnecessary pulls; use Always for mutable tags
  pullPolicy: IfNotPresent
  # Pinned version; update deliberately after testing
  tag: "0.1351.59"

# PriorityClass to preempt lower-priority workloads during resource pressure
priorityClassName: ""

# 2 replicas enables leader election for HA; one active, one standby
replicas: 2

# If true, operator only manages namespaces in namespaceList (not cluster-wide)
namespaced: true

# Namespaces the operator watches; only used when namespaced=true
namespaceList:
  - confluent-prd

# CPU and memory for the operator; size based on number of managed CRs
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 1Gi

# Seconds to wait for graceful shutdown before SIGKILL
terminationGracePeriodSeconds: 30

# Enable debug logging; increases verbosity significantly
debug: false

# Enable FIPS 140-2 compliant crypto; required by FCB security policy
fipsmode: true

# Number of concurrent Day-2 operation workers; empty uses chart default
numDay2Worker: ""

# Enable CFK integration with CMF for Flink Day-2 operations
enableCMFDay2Ops: true

# Spread replicas across nodes so one node failure doesn't kill both
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - confluent-operator
          topologyKey: "kubernetes.io/hostname"

# Allow scheduling on tainted nodes (e.g. dedicated xlworker nodes)
tolerations: []

# Pod security context — disabled so OpenShift SCCs control user/group IDs
podSecurity:
  # false lets OpenShift SCC manage security contexts instead
  enabled: false
  securityContext:
    fsGroup: 1001
    runAsUser: 1001
    runAsNonRoot: true

# Container security context; overrides pod-level if enabled
containerSecurity:
  # Enable only if specific container-level overrides are needed
  enabled: false
  securityContext: {}

# Service account the operator runs as
serviceAccount:
  # Set false if platform team pre-creates service accounts
  create: true
  # Name of the service account; used in RBAC bindings
  name: confluent

# Whether CFK creates RBAC roles/bindings; false = managed out-of-band by platform team
rbac: false

# Extra ClusterRole configuration for OpenShift-specific API groups
clusterRole:
  # Adds OpenShift Route API group to the ClusterRole for ingress management
  openshift: true

# Confluent telemetry reporting; sends usage data to Confluent Cloud
telemetry:
  # Enable telemetry for the operator itself
  operator:
    enabled: false
  # Enable telemetry for managed Confluent Platform components
  enabled: false
  # Proxy configuration if telemetry needs to traverse a corporate proxy
  proxy:
    enabled: false
    credentialRequired: false
  # Secret with api.key and api.secret for telemetry authentication
  secretRef: ""
  # Directory path alternative for telemetry credentials
  directoryPathInContainer: ""

# Preserve KRaft ClusterID in PV annotations for disaster recovery
kRaftEnabled: true

# Admission webhooks validate/mutate CP CRs and protect against unsafe evictions
# Protects against: invalid CR configs, unsafe StatefulSet deletes, unsafe Kafka pod evictions
webhooks:
  # Enable to catch invalid configs before apply and prevent unsafe pod evictions
  enabled: true
  # Port for the webhook HTTPS server
  port: 8443
  # TLS cert for webhook; SAN must include confluent-operator.<namespace>.svc
  #
  # IMPORTANT: CFK expects PKCS12 binary format files named keystore.jks, truststore.jks,
  # and jksPassword.txt. It does NOT accept standard K8s TLS secrets or PEM files.
  # We use cert-manager with keystores.pkcs12.create=true, then project the secret
  # with renamed keys (keystore.p12 → keystore.jks, truststore.p12 → truststore.jks)
  # and merge in the jksPassword.txt from a separate secret.
  # See: docs/cfk-webhook-tls-manifests.txt for the full cert-manager setup.
  tls:
    # Leave empty — we use directoryPathInContainer with mountedVolumes instead
    secretRef: ""
    # Operator reads PKCS12 files from this path (keystore.jks, truststore.jks, jksPassword.txt)
    directoryPathInContainer: "/mnt/webhook-certs"

# Pod annotations and labels for the operator deployment
pod:
  # Prometheus annotations enable metric scraping without ServiceMonitor CRs
  annotations:
    prometheus.io/path: "/metrics"
    prometheus.io/port: "7778"
    metrics.dynatrace.com/port: "7778"
    prometheus.io/scrape: "true"
    # Dynatrace metrics scraping
    metrics.dynatrace.com/scrape: "true"
  # Additional labels for selection or grouping
  labels: {}

# Deprecated: use license.secretRef instead; kept for backward compatibility
licenseSecretRef: confluent-license

# Custom volumes and volume mounts for the operator pod
# Projects cert-manager PKCS12 keystores (renamed to .jks) + jksPassword.txt
mountedVolumes:
  volumes:
    - name: webhook-jks-certs
      projected:
        sources:
          - secret:
              name: confluent-operator-serving-cert
              items:
                - key: keystore.p12
                  path: keystore.jks
                - key: truststore.p12
                  path: truststore.jks
          - secret:
              name: cfk-jks-password-file
              items:
                - key: jksPassword.txt
                  path: jksPassword.txt
  volumeMounts:
    - name: webhook-jks-certs
      mountPath: /mnt/webhook-certs
      readOnly: true

# Inject custom env vars like HTTP_PROXY or feature flags
customEnvVars: []
