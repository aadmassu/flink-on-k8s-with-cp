---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-operator-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://packages.confluent.io/helm
    chart: confluent-for-kubernetes
    targetRevision: 0.*
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://prd-cluster.aws-us-east-2.example.com
    namespace: confluent-prd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
