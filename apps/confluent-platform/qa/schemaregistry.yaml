---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-07-01 (last-modified)
# Description: CFK SchemaRegistry CR — Phase 2. OAUTHBEARER to Kafka
#              INTERNAL :9071, OAUTH to MDS :8090, RBAC via
#              ConfluentRolebindings (runbook A22).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: dah-flink-qa
  annotations:
    platform.confluent.io/force-reconcile: "2026-08-18-platform-trust-bundle"
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 2

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-schema-registry:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # Gatekeeper [required-workload-labels] inspects the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/instance: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  license:
    secretRef: cfk-license

  # Like-for-like with the Ansible reference: expose the Schema Registry
  # REST listener over TLS. Dependencies and Ingress already use HTTPS.
  tls:
    secretRef: schemaregistry-tls

  # JVM-wide outbound trust store for OAuth token retrieval and FCB endpoints.
  mountedVolumes:
    volumes:
      - name: oidc-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.p12
              path: bundle.p12
    volumeMounts:
      - name: oidc-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  # RBAC on SR REST API. No superUsers — SR's own Okta client gets ResourceOwner on _schemas + Group via rolebindings.yaml.
  authorization:
    type: rbac

  pdb:
    enabled: true
    maxUnavailable: 1

  dependencies:
    # Dep-to-Kafka: flat oauth+jaasConfig+oauthSettings (runbook A22).
    kafka:
      bootstrapEndpoint: kafka.dah-flink-qa.svc.cluster.local:9092
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-schemaregistry
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(QA)
      tls:
        enabled: true
        secretRef: kafka-tls
    # Dep-to-MDS (HTTP API): nested oauth+configuration (runbook A22).
    mds:
      endpoint: https://kafka.dah-flink-qa.svc.cluster.local:8090
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-schemaregistry
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(QA)

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.p12"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=PKCS12"
    server:
      - confluent.metadata.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - confluent.metadata.ssl.truststore.password=changeit
      - confluent.metadata.ssl.truststore.type=PKCS12
      - schema.registry.group.id=schema-registry
      - kafkastore.topic=_schemas
      - kafkastore.topic.replication.factor=3
      - inter.instance.protocol=https
      - resource.extension.class=io.confluent.kafka.schemaregistry.security.SchemaRegistrySecurityResourceExtension,io.confluent.schema.exporter.SchemaExporterResourceExtension
      - kafkastore.update.handlers=io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "150m"
        memory: 768Mi
      limits:
        cpu: "500m"
        memory: 1536Mi
    probe:
      liveness:
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # OpenShift restricted-v2 SCC assigns the UID range (runbook E1).
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: schemaregistry
      app.kubernetes.io/instance: schemaregistry
      app.kubernetes.io/component: schema-registry
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
