---
## Placeholder secrets — structure matches what CyberArk External Secrets Operator produces
## In production, replace this file with ExternalSecret CRs that sync from CyberArk Linux Vault
## In dev/testing, create these secrets manually or via CI pipeline

## TLS certificates (PEM format recommended for cert-manager compatibility)
## CyberArk vault path (production): /confluent/<env>/tls-certs
## Created by: External Secrets Operator in production, manual K8s Secret in dev
## Keys: tls.crt (server cert chain), tls.key (private key), ca.crt (CA cert)
## TODO: Populate with certs from KeyFactor
apiVersion: v1
kind: Secret
metadata:
  name: tls-certs
  namespace: confluent-qa
type: kubernetes.io/tls
data:
  # Base64-encoded server certificate chain (leaf + intermediate CAs)
  tls.crt: ""
  # Base64-encoded private key for the server certificate
  tls.key: ""
  # Base64-encoded CA certificate(s) used to verify peer certificates
  ca.crt: ""
---
## OAuth JAAS config for service-to-service authentication (broker, connect, SR, etc.)
## CyberArk vault path (production): /confluent/<env>/oauth-s2s-credentials
## Created by: External Secrets Operator in production, manual K8s Secret in dev
## Keys: oauth.txt (contains username=<client-id>\npassword=<client-secret>)
## TODO: Populate with FCB's Okta OAuth client credentials for the S2S application
apiVersion: v1
kind: Secret
metadata:
  name: oauth-jass
  namespace: confluent-qa
type: Opaque
stringData:
  # OAuth client credentials in key=value format; used by all components to authenticate to Kafka
  oauth.txt: |
    username=<fcb-broker-oauth-client-id>
    password=<fcb-broker-oauth-client-secret>
---
## OAuth JAAS config for OIDC SSO (Control Center browser-based login)
## CyberArk vault path (production): /confluent/<env>/oauth-oidc-credentials
## Created by: External Secrets Operator in production, manual K8s Secret in dev
## Keys: oauth.txt (contains clientId=<id>\nclientSecret=<secret>)
## TODO: Populate with FCB's Okta OIDC application credentials (authorization code flow)
apiVersion: v1
kind: Secret
metadata:
  name: oauth-jass-oidc
  namespace: confluent-qa
type: Opaque
stringData:
  # OIDC client credentials; used by MDS to perform the authorization code exchange with Okta
  oauth.txt: |
    clientId=<fcb-oidc-client-id>
    clientSecret=<fcb-oidc-client-secret>
---
## MDS token key pair — RSA keys for signing and verifying RBAC tokens issued by MDS
## CyberArk vault path (production): /confluent/<env>/mds-token-keypair
## Created by: External Secrets Operator in production, manual K8s Secret in dev
## Keys: mdsPublicKey.pem (RSA public key), mdsTokenKeyPair.pem (RSA private key)
## TODO: Generate with: openssl genrsa -out mds-token.key 2048 && openssl rsa -in mds-token.key -pubout -out mds-token.pub
apiVersion: v1
kind: Secret
metadata:
  name: mds-token
  namespace: confluent-qa
type: Opaque
data:
  # Base64-encoded RSA public key; used by components to verify MDS tokens
  mdsPublicKey.pem: ""
  # Base64-encoded RSA private key; used by MDS to sign RBAC tokens
  mdsTokenKeyPair.pem: ""
---
