---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-07-01 (last-modified)
# Description: CFK ControlCenter CR — Phase 2. OIDC user auth via
#              dependencies.mds.ssoProtocol=oidc; top-level auth is
#              mtls+requested per CRD enum (runbook A24).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: dah-flink-qa
  annotations:
    platform.confluent.io/force-reconcile: "2026-08-19-oidc-client-trust"
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 1

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-qa/confluentinc/cp-enterprise-control-center-next-gen:2.5.0
    init: artifactory.fcbint.net/camdepositsharedservices-docker-qa/confluentinc/confluent-init-container:3.2.0

  # Gatekeeper [required-workload-labels] inspects the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  # Control Center working/RocksDB state. Prometheus has a separate 100 Gi PVC.
  dataVolumeCapacity: 100Gi
  storageClass:
    name: kafka

  license:
    secretRef: cfk-license

  tls:
    secretRef: controlcenter-tls

  # JVM-wide outbound trust store for Okta/OIDC and FCB endpoints. Created by create-prereqs.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.p12
              path: bundle.p12
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  # No superUsers — all access via ConfluentRolebindings.
  authorization:
    type: rbac

  pdb:
    enabled: true
    maxUnavailable: 1

  dependencies:
    # Control Center Next Gen reads metrics and alerts from its bundled
    # Prometheus/Alertmanager services. The same basic-auth Secrets are used
    # by the corresponding server and client blocks.
    prometheusClient:
      url: https://controlcenter.dah-flink-qa.svc.cluster.local:9090
      authentication:
        type: basic
        basic:
          secretRef: c3-prom-client-basic-auth
      tls:
        enabled: true
        secretRef: controlcenter-tls
    alertManagerClient:
      url: https://controlcenter.dah-flink-qa.svc.cluster.local:9093
      authentication:
        type: basic
        basic:
          secretRef: c3-alert-client-basic-auth
      tls:
        enabled: true
        secretRef: controlcenter-tls
    # Dep-to-Kafka: flat oauth+jaasConfig (runbook A22).
    kafka:
      bootstrapEndpoint: kafka.dah-flink-qa.svc.cluster.local:9092
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-controlcenter
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(QA)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls

    # Dep-to-SR (HTTP API): nested oauth+configuration.
    schemaRegistry:
      url: https://schemaregistry.dah-flink-qa.svc.cluster.local:8081
      tls:
        enabled: true
        secretRef: schemaregistry-tls
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(QA)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000

    connect:
      - name: connect-cluster
        url: https://connect.dah-flink-qa.svc.cluster.local:8083
        tls:
          enabled: true
          secretRef: connect-tls
        authentication:
          type: oauth
          oauth:
            secretRef: oauth-controlcenter
            configuration:
              audience: "Confluent,account,api://default"
              expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
              subClaimName: sub
              jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
              tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
              scope: 11547.DAH(QA)
              loginConnectTimeoutMs: 10000
              loginReadTimeoutMs: 30000
              loginRetryBackoffMaxMs: 5000
              loginRetryBackoffMs: 60000

    # OIDC SSO for the C3 UI is delivered through MDS.
    mds:
      endpoint: https://kafka.dah-flink-qa.svc.cluster.local:8090
      ssoProtocol: oidc
      tls:
        enabled: true
        secretRef: kafka-tls
        ignoreTrustStoreConfig: false
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(QA)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000

    kafkaRestClassRef:
      name: default
      namespace: dah-flink-qa

  # Control Center Next Gen bundled observability services. Confluent requires
  # C3, Prometheus, and Alertmanager to use the same release tag.
  services:
    prometheus:
      image: artifactory.fcbint.net/camdepositsharedservices-docker-qa/confluentinc/cp-enterprise-prometheus:2.5.0
      # OpenShift ResourceQuota validates every generated container. These
      # limits are for the bundled Prometheus container, not the main C3
      # container covered by spec.podTemplate.resources.
      containerTemplate:
        resources:
          requests:
            cpu: 375m
            memory: 1Gi
          limits:
            cpu: "1250m"
            memory: 3Gi
      authentication:
        type: basic
        basic:
          secretRef: c3-prom-server-basic-auth
      tls:
        secretRef: controlcenter-tls
      pvc:
        # CFK 3.2 does not propagate spec.storageClass to this nested PVC.
        # The pipeline pre-creates prometheus-data-controlcenter-0 from
        # controlcenter-prometheus-pvc.yaml with storageClassName: kafka.
        dataVolumeCapacity: 100Gi
    alertmanager:
      image: artifactory.fcbint.net/camdepositsharedservices-docker-qa/confluentinc/cp-enterprise-alertmanager:2.5.0
      # ResourceQuota also requires explicit resources for Alertmanager.
      containerTemplate:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
      authentication:
        type: basic
        basic:
          secretRef: c3-alert-server-basic-auth
      tls:
        secretRef: controlcenter-tls

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.p12"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=PKCS12"
      - "-Djavax.net.debug=ssl,handshake,trustmanager"
    server:
      # Do NOT set confluent.controlcenter.data.dir here — CFK mounts the PVC at /mnt/data/data0 (runbook A25).
      - confluent.controlcenter.streams.num.stream.threads=12
      - confluent.controlcenter.command.topic.replication=3
      - confluent.controlcenter.internal.topics.replication=3
      - confluent.controlcenter.metrics.topic.replication=3
      - confluent.controlcenter.monitoring.interceptor.topic.replication=3
      - confluent.controlcenter.cmf.healthcheck.interval.sec=600000

      # C3 streams client (CFK doesn't auto-derive per-prefix, same pattern as broker's confluent.license.* / confluent.kafkarest.*).
      - confluent.controlcenter.streams.security.protocol=SASL_SSL
      - confluent.controlcenter.streams.sasl.mechanism=OAUTHBEARER
      - confluent.controlcenter.streams.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.controlcenter.streams.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.controlcenter.streams.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.controlcenter.streams.sasl.oauthbearer.scope=11547.DAH(QA)

      # Explicit trustStore for C3's Armeria/Netty HTTP client to Okta -- JVM -Djavax.net.ssl.trustStore doesn't propagate to Netty SSL contexts (runbook A28).
      - confluent.metadata.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - confluent.metadata.ssl.truststore.password=changeit
      - confluent.metadata.ssl.truststore.type=PKCS12
      - confluent.controlcenter.streams.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - confluent.controlcenter.streams.ssl.truststore.password=changeit
      - confluent.controlcenter.streams.ssl.truststore.type=PKCS12

      # REST client truststore for Control Center's OIDC/OAuth token exchange (internal HTTP calls to Okta).
      - confluent.controlcenter.rest.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - confluent.controlcenter.rest.ssl.truststore.password=changeit
      - confluent.controlcenter.rest.ssl.truststore.type=PKCS12
      - confluent.controlcenter.rest.ssl.endpoint.identification.algorithm=https

      # Generic OAuth/OIDC client context. Control Center Next Gen uses this
      # context during the authorization-code callback and token exchange.
      - client.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - client.ssl.truststore.password=changeit
      - client.ssl.truststore.type=PKCS12
      - client.ssl.endpoint.identification.algorithm=https

      # Monitoring interceptor client.
      - confluent.monitoring.interceptor.security.protocol=SASL_SSL
      - confluent.monitoring.interceptor.sasl.mechanism=OAUTHBEARER
      - confluent.monitoring.interceptor.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.monitoring.interceptor.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.monitoring.interceptor.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.monitoring.interceptor.sasl.oauthbearer.scope=11547.DAH(QA)

  podTemplate:
    serviceAccountName: flink-operator
    # QA migration sizing within the namespace quota.
    resources:
      requests:
        cpu: "500m"
        memory: 3Gi
      limits:
        cpu: "1500m"
        memory: 6Gi
    # OpenShift restricted-v2 SCC assigns the UID range (runbook E1).
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: controlcenter
      app.kubernetes.io/instance: controlcenter
      app.kubernetes.io/component: control-center
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
