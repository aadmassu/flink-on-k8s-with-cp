---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-08-16 (last-modified)
# Description: Ingress exposing Control Center UI publicly (main
#              browser-facing CP dashboard). TLS passthrough sends the
#              encrypted connection directly to the HTTPS backend on 9021.
#              Control Center serves controlcenter-tls, whose SAN includes
#              the floating public hostname. The router does not terminate
#              TLS and does not use an ingress or destination-CA certificate.
########################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controlcenter
  namespace: dah-flink-qa
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    route.openshift.io/termination: passthrough
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: controlcenter.apps.qa.ocp.fcbint.net
      http:
        paths:
          # Passthrough TLS cannot use HTTP path-based routing because the
          # router does not decrypt the request. These values are required
          # by OpenShift when generating the passthrough Route.
          - backend:
              service:
                name: controlcenter
                port:
                  number: 9021
            path: ""
            pathType: ImplementationSpecific
