metadata:
  name: onboarding-group-kafka-clusteradmin
  namespace: dah-flink-qa
  labels:
    app.kubernetes.io/name: confluent-platform
    app.kubernetes.io/component: application-rbac
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
    rbac.fcbint.net/managed-by: application-onboarding
spec:
  principal:
    type: group
    name: "__ONBOARDING_DEVELOPER_GROUP__"
  role: ClusterAdmin
  kafkaRestClassRef:
    name: default
    namespace: dah-flink-qa
---
apiVersion: platform.confluent.io/v1beta1
