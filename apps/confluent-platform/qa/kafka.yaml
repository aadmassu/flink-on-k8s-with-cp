---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-06-29 (last-modified)
# Description: CFK Kafka CR — qa (3-broker, KRaft mode).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-qa
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.1.2
  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  # SIZING follows dev's TEMP allocation until the dah-flink-qa namespace
  # ResourceQuota is confirmed with Tom.
  dataVolumeCapacity: 2Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller

  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
    external:
      authentication:
        type: oauth
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          scope: 11547.DAH(UAT)         # TODO: switch to 11547.DAH(QA) once Okta admins confirm
          subClaimName: sub
          groupsClaimName: dahUAT_groups # TODO: switch to dahQA_groups once Okta admins confirm
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      tls:
        enabled: true
      externalAccess:
        type: loadBalancer
        loadBalancer:
          # TENTATIVE — confirm with Tom. Brokers will be advertised as
          # b<N>.kafka.qa.dah.fcbint.net and the bootstrap as
          # bootstrap.kafka.qa.dah.fcbint.net. Matching SANs are NOT in
          # kafka-tls-certificate.yaml yet (Keyfactor approver-policy
          # rejects *.dah.fcbint.net — allowed suffixes are *.svc,
          # *.svc.cluster.local, *.ocp.fcbint.net).
          domain: kafka.qa.dah.fcbint.net
          brokerPrefix: b
          bootstrapPrefix: bootstrap
    custom:
      - name: certonly
        port: 9094
        authentication:
          type: mtls
        tls:
          enabled: true

  tls:
    secretRef: kafka-tls
  license:
    secretRef: cfk-license

  # FCB org-wide trust bundle — see apps/confluent-platform/dev/kafka.yaml
  # for the full rationale.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  # FCB Gatekeeper [pod-disruption-budget] constraint rejects PDBs with
  # maxUnavailable=0. CFK auto-creates a PDB per workload; for this
  # single-replica StatefulSet the default lands at 0, which the policy
  # treats as "blocks drains forever". maxUnavailable=1 makes the
  # auto-generated PDB drainable.
  pdb:
    enabled: true
    maxUnavailable: 1

  services:
    mds:
      tokenKeyPair:
        secretRef: mds-token-keypair
      tls:
        enabled: true
      authentication:
        type: bearer
      provider:
        type: oauth
        oauth:
          clientCredentials:
            secretRef: oauth-mds-rest
          configurations:
            audience: "Confluent,account,api://default"
            authorizeBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/authorize
            issuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            refreshToken: true
            tokenBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            subClaimName: sub
            groupsClaimName: dahUAT_groups # TODO: switch to dahQA_groups once Okta admins confirm

  configOverrides:
    # JVM-default truststore → fcb-trust-bundle (see dev/kafka.yaml).
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - authorizer.class.name=io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
      - confluent.authorizer.access.rule.providers=CONFLUENT,KRAFT_ACL
      - super.users=User:admin
      - inter.broker.listener.name=internal
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.metrics.reporter.topic.replicas=3
      - confluent.security.event.logger.exporter.kafka.topic.replicas=3
      - confluent.consumer.lag.emitter.enabled=true
      - confluent.balancer.enable=true
      - confluent.balancer.data.enabled=true
      - confluent.balancer.heal.uneven.load.trigger=ANY_UNEVEN_LOAD
      - metric.reporters=io.confluent.telemetry.reporter.TelemetryReporter,io.confluent.metrics.reporter.ConfluentMetricsReporter
      - confluent.telemetry.enabled=true
      - confluent.reporters.telemetry.auto.enable=true
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kafka-broker
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
