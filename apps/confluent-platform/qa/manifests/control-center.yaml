---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent-qa
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  dataVolumeCapacity: 10Gi
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent-qa.svc.cluster.local:9071
    schemaRegistry:
      url: http://schemaregistry.confluent-qa.svc.cluster.local:8081
    connect:
      - name: connect
        url: http://connect.confluent-qa.svc.cluster.local:8083
    ksqldb:
      - name: ksqldb
        url: http://ksqldb.confluent-qa.svc.cluster.local:8088
