---
# CFK Connect CR — qa (2 workers, matching UAT topology)
#
# STG has a VM CP analog at FCB, but `cp-confluent/stg/` is not yet populated. Until then, This CR is modelled on the UAT CFK build at
# apps/confluent-platform/uat/connect.yaml.
#
# TODO — see apps/confluent-platform/stg/kafka.yaml for the OAuth-values
# rationale (UAT scope/groupsClaim reused verbatim until Okta admins
# confirm STG tenancy).

apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: dah-flink-stg
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 2
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server-connect:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.1.2
  injectLabels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-stg.svc.cluster.local:9092
      authentication:
        type: oauthbearer
        oauthbearer:
          secretRef: oauth-connect
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          scope: 11547.DAH(UAT)          # TODO: switch to STG scope once Okta admins confirm
          subClaimName: sub
          groupsClaimName: dahUAT_groups  # TODO: switch to STG groups claim once Okta admins confirm
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.dah-flink-stg.svc.cluster.local:8081
      tls:
        enabled: true
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-connect
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(UAT)          # TODO: switch to STG scope once Okta admins confirm
            subClaimName: sub
            groupsClaimName: dahUAT_groups  # TODO: switch to STG groups claim once Okta admins confirm
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    mds:
      endpoint: https://kafka.dah-flink-stg.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-connect
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(UAT)          # TODO: switch to STG scope once Okta admins confirm
            subClaimName: sub
            groupsClaimName: dahUAT_groups  # TODO: switch to STG groups claim once Okta admins confirm
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    kafkaRestClassRef:
      name: default
      namespace: dah-flink-stg
    interceptor:
      enabled: true
      consumer:
        bootstrapEndpoint: kafka.dah-flink-stg.svc.cluster.local:9092
        authentication:
          type: oauthbearer
          oauthbearer:
            secretRef: oauth-connect
          oauthSettings:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(UAT)          # TODO: switch to STG scope once Okta admins confirm
            subClaimName: sub
            groupsClaimName: dahUAT_groups  # TODO: switch to STG groups claim once Okta admins confirm
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      producer:
        bootstrapEndpoint: kafka.dah-flink-stg.svc.cluster.local:9092
        authentication:
          type: oauthbearer
          oauthbearer:
            secretRef: oauth-connect
          oauthSettings:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(UAT)          # TODO: switch to STG scope once Okta admins confirm
            subClaimName: sub
            groupsClaimName: dahUAT_groups  # TODO: switch to STG groups claim once Okta admins confirm
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token

  authentication:
    type: oauth
    oauth:
      secretRef: oauth-connect
      configuration:
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        audience: "Confluent,account,api://default"
        subClaimName: sub
        groupsClaimName: dahUAT_groups   # TODO: switch to STG groups claim once Okta admins confirm
        tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
        scope: 11547.DAH(UAT)            # TODO: switch to STG scope once Okta admins confirm

  authorization:
    type: rbac
    superUsers:
      - User:admin

  tls:
    secretRef: connect-tls
  license:
    secretRef: cfk-license

  pdb:
    enabled: true
    maxUnavailable: 1

  configOverrides:
    server:
      - group.id=connect-cluster
      - config.storage.topic=connect-cluster-configs
      - offset.storage.topic=connect-cluster-offsets
      - status.storage.topic=connect-cluster-status
      - config.storage.replication.factor=3
      - offset.storage.replication.factor=3
      - status.storage.replication.factor=3
      - offset.flush.interval.ms=10000
      - connector.client.config.override.policy=All
      - plugin.path=/usr/share/java/connect_plugins
      - key.converter=io.confluent.connect.avro.AvroConverter
      - value.converter=io.confluent.connect.avro.AvroConverter
      - internal.key.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.value.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.key.converter.schemas.enable=false
      - internal.value.converter.schemas.enable=false
      - rest.extension.classes=io.confluent.connect.security.ConnectSecurityExtension,io.confluent.connect.secretregistry.ConnectSecretRegistryExtension
      - config.providers=secret
      - config.providers.secret.class=io.confluent.connect.secretregistry.rbac.config.provider.InternalSecretConfigProvider
      - config.providers.secret.param.kafkastore.topic=_confluent-secrets
      - config.providers.secret.param.kafkastore.topic.replication.factor=3
      - confluent.monitoring.interceptor.topic=_confluent-monitoring
      - producer.interceptor.classes=io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor
      - consumer.interceptor.classes=io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "4"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 4Gi
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: connect
      app.kubernetes.io/instance: connect
      app.kubernetes.io/component: kafka-connect
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
