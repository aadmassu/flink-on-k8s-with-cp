---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: confluent-stg

patches:
  - target:
      kind: ControlCenter
      name: controlcenter
    patch: |
      - op: replace
        path: /spec/dependencies/schemaRegistry/url
        value: http://schemaregistry.confluent-stg.svc.cluster.local:8081
      - op: replace
        path: /spec/dependencies/connect/0/url
        value: http://connect.confluent-stg.svc.cluster.local:8083
  - target:
      kind: KafkaRestClass
      name: krc-cfk
    patch: |
      - op: replace
        path: /spec/kafkaRest/endpoint
        value: http://kafka.confluent-stg.svc.cluster.local:8090
  # Stg: increase replicas for HA
  - target:
      kind: KRaftController
      name: kraftcontroller
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Kafka
      name: kafka
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: SchemaRegistry
      name: schemaregistry
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
