---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-platform-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PLACEHOLDER_ORG/FCB.git
    path: apps/confluent-platform/stg/manifests
    targetRevision: HEAD
  destination:
    server: https://stg-cluster.aws-us-east-2.example.com
    namespace: confluent-stg
  ignoreDifferences:
    - group: platform.confluent.io
      kind: "*"
      jsonPointers:
        - /status
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
