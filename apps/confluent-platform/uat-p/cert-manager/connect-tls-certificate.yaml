---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: connect-tls
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect-tls
    app.kubernetes.io/component: kafka-connect
    fcbint.net/app-id: '11547'
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkfkaksupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Non-Prod-UAT
    metadata.command-issuer.keyfactor.com/Description: "Kafka Connect \u2014 HTTPS\
      \ REST listener"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: '11547'
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: connect.dah-flink-uat.svc.cluster.local
  dnsNames:
  - connect.dah-flink-uat.svc
  - connect.dah-flink-uat.svc.cluster.local
  - connect-0.connect.dah-flink-uat.svc.cluster.local
  - connect-1.connect.dah-flink-uat.svc.cluster.local
  - connect.apps.ut.ocp.fcbint.net
  - connect.apps.ut-p.ocp.fcbint.net
  duration: 8760h0m0s
  renewBefore: 1080h0m0s
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: connect-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: connect
      app.kubernetes.io/instance: connect-tls
      app.kubernetes.io/component: kafka-connect
      fcbint.net/app-id: '11547'
