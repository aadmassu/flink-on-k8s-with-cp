---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: controlcenter-tls
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter-tls
    app.kubernetes.io/component: control-center
    fcbint.net/app-id: '11547'
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkfkaksupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Non-Prod-UAT
    metadata.command-issuer.keyfactor.com/Description: "Control Center next-gen \u2014\
      \ REST + Prometheus + AlertManager listeners"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: '11547'
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: controlcenter.dah-flink-uat.svc.cluster.local
  dnsNames:
  - controlcenter.dah-flink-uat.svc
  - controlcenter.dah-flink-uat.svc.cluster.local
  - controlcenter-0.controlcenter.dah-flink-uat.svc.cluster.local
  - controlcenter.apps.ut.ocp.fcbint.net
  - controlcenter.apps.ut-p.ocp.fcbint.net
  duration: 8760h0m0s
  renewBefore: 1080h0m0s
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: controlcenter-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: controlcenter
      app.kubernetes.io/instance: controlcenter-tls
      app.kubernetes.io/component: control-center
      fcbint.net/app-id: '11547'
