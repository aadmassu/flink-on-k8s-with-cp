---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-mds
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-mds
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: '11547'
  annotations:
    route.openshift.io/termination: reencrypt
    route.openshift.io/destination-ca-certificate-secret: kafka-tls
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
  - host: kafka-mds.apps.ut.ocp.fcbint.net
    http:
      paths:
      - backend:
          service:
            name: kafka
            port:
              number: 8090
        path: /
        pathType: Prefix
  - host: kafka-mds.apps.ut-p.ocp.fcbint.net
    http:
      paths:
      - backend:
          service:
            name: kafka
            port:
              number: 8090
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - kafka-mds.apps.ut.ocp.fcbint.net
    - kafka-mds.apps.ut-p.ocp.fcbint.net
    secretName: kafka-mds-ingress-tls
