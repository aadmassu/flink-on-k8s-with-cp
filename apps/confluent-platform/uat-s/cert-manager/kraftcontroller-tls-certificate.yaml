---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kraftcontroller-tls
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: kraftcontroller
    app.kubernetes.io/instance: kraftcontroller-tls
    app.kubernetes.io/component: kraft-controller
    fcbint.net/app-id: '11547'
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkafkasupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Non-Prod-UAT
    metadata.command-issuer.keyfactor.com/Description: "KRaft controllers \u2014 quorum\
      \ listener"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: '11547'
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: kraftcontroller.dah-flink-uat.svc.cluster.local
  dnsNames:
  - kraftcontroller.dah-flink-uat.svc
  - kraftcontroller.dah-flink-uat.svc.cluster.local
  - kraftcontroller-0.kraftcontroller.dah-flink-uat.svc.cluster.local
  - kraftcontroller-1.kraftcontroller.dah-flink-uat.svc.cluster.local
  - kraftcontroller-2.kraftcontroller.dah-flink-uat.svc.cluster.local
  - kraftcontroller.apps.ut.ocp.fcbint.net
  - kraftcontroller-0.kraftcontroller.apps.ut-s.ocp.fcbint.net
  - kraftcontroller-1.kraftcontroller.apps.ut-s.ocp.fcbint.net
  - kraftcontroller-2.kraftcontroller.apps.ut-s.ocp.fcbint.net
  - kraftcontroller-0.kraftcontroller.apps.ut.ocp.fcbint.net
  - kraftcontroller-1.kraftcontroller.apps.ut.ocp.fcbint.net
  - kraftcontroller-2.kraftcontroller.apps.ut.ocp.fcbint.net
  duration: 8760h0m0s
  renewBefore: 1080h0m0s
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: kraftcontroller-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: kraftcontroller
      app.kubernetes.io/instance: kraftcontroller-tls
      app.kubernetes.io/component: kraft-controller
      fcbint.net/app-id: '11547'
