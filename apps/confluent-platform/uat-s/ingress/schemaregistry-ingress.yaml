---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-08-07 (last-modified)
# Description: Ingress exposing Schema Registry REST/UI publicly.
#              Backend HTTPS on 8081 (schemaregistry-tls); edge
#              termination reencrypt.
########################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schemaregistry
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/instance: schemaregistry
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    route.openshift.io/termination: reencrypt
    route.openshift.io/destination-ca-certificate-secret: reencrypt-bundle
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: schemaregistry.apps.ut.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: schemaregistry
                port:
                  number: 8081
            path: /
            pathType: Prefix
    - host: schemaregistry.apps.ut-s.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: schemaregistry
                port:
                  number: 8081
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - schemaregistry.apps.ut.ocp.fcbint.net
        - schemaregistry.apps.ut-s.ocp.fcbint.net
      secretName: schemaregistry-ingress-tls
