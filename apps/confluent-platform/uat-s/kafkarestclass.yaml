---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-07-01 (last-modified)
# Description: KafkaRestClass connection profile. Tells the operator how
#              to auth to the broker's embedded kafkaRest :8090 when
#              applying rolebindings (runbook A22).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: default
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: kafkarestclass
    app.kubernetes.io/instance: default
    app.kubernetes.io/component: kafka-rest-class
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  kafkaClusterRef:
    name: kafka
    namespace: dah-flink-uat
  kafkaRest:
    endpoint: https://kafka.dah-flink-uat.svc.cluster.local:8090
    authentication:
      type: mtls
      sslClientAuthentication: true
    tls:
      secretRef: cfk-operator-mds-client-tls
