---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
spec:
  # Single replica for dev; increase for production workloads
  replicas: 1
  # Confluent Platform license; secret must contain license.txt
  license:
    secretRef: confluent-license
  # Container images for Kafka Connect
  image:
    # Confluent Server Connect (enterprise, includes connectors)
    application: confluentinc/cp-server-connect:8.1.1
    # Init container for volume/permission setup
    init: confluentinc/confluent-init-container:3.1.1

  ## ASSUMPTION: FCB's corporate CA (in tls-certs) covers Okta's HTTPS endpoints,
  ## so no separate JKS truststore is needed for OAuth token/JWKS calls.
  ##
  ## IF THIS ASSUMPTION IS WRONG (Okta uses a different CA), uncomment below and
  ## add JVM overrides at the bottom of this file:
  ##
  ## mountedVolumes:
  ##   volumes:
  ##     - name: oauth-truststore
  ##       secret:
  ##         secretName: oauth-truststore
  ##   volumeMounts:
  ##     - name: oauth-truststore
  ##       mountPath: /mnt/oauth-truststore
  ##
  ## And add under configOverrides:
  ##   jvm:
  ##     - "-Djavax.net.ssl.trustStoreType=JKS"
  ##     - "-Djavax.net.ssl.trustStore=/mnt/oauth-truststore/truststore.jks"
  ##     - "-Djavax.net.ssl.trustStorePassword=<truststore-password>"

  podTemplate:
    # Pod annotations for monitoring discovery
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "7778"
      # Dynatrace metrics scraping
      metrics.dynatrace.com/scrape: "true"
      metrics.dynatrace.com/port: "7778"
    # CPU and memory allocation for each Connect worker pod
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    # Security context for file ownership on volumes
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
  # RBAC authorization via MDS; controls connector create/read/delete permissions
  authorization:
    type: rbac
  # TLS encryption for Connect REST API endpoint
  tls:
    secretRef: tls-certs
  # Expose Connect REST API via OpenShift Route for external connector management
  externalAccess:
    type: route
    route:
      ## TODO: Replace with FCB's OpenShift route domain
      domain: dev.confluent.fcbint.net
  dependencies:
    # Kafka dependency — Connect stores connector configs, offsets, and status in Kafka topics
    kafka:
      # Internal bootstrap endpoint (TLS port 9071)
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      # OAuth authentication to Kafka
      authentication:
        type: oauth
        # Secret containing OAuth client credentials
        jaasConfig:
          secretRef: oauth-jass
        # Okta OAuth settings for token validation
        oauthSettings:
          ## TODO: Replace all Okta endpoints with FCB's Okta org/authorization server
          # OAuth audience — must match Okta config
          audience: api://confluent
          # Expected JWT issuer
          expectedIssuer: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>
          # JWT claim for group memberships
          groupsClaimName: groups
          # JWT claim for user identity
          subClaimName: sub
          # JWKS endpoint for token signature verification
          jwksEndpointUri: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/keys
          # Token endpoint for obtaining access tokens
          tokenEndpointUri: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/token
          # OAuth scope
          scope: confluent
      # TLS for Connect → Kafka connection
      tls:
        enabled: true
        secretRef: tls-certs
    # Schema Registry dependency — connectors use SR for serialization/deserialization
    schemaRegistry:
      # Schema Registry HTTPS endpoint
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      # TLS for Connect → Schema Registry connection
      tls:
        enabled: true
        secretRef: tls-certs
    # MDS dependency — Connect registers with MDS for RBAC enforcement
    mds:
      # MDS REST API endpoint on the Kafka broker
      endpoint: https://kafka.confluent.svc.cluster.local:8090
      # TLS for Connect → MDS connection
      tls:
        enabled: true
        secretRef: tls-certs
      # RSA key pair for verifying MDS-issued RBAC tokens
      tokenKeyPair:
        secretRef: mds-token
      # OAuth authentication to MDS
      authentication:
        type: oauth
        oauth:
          # Secret containing OAuth client credentials
          secretRef: oauth-jass
          configuration:
            # OAuth audience
            audience: api://confluent
            # Expected JWT issuer
            expectedIssuer: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>
            # JWT claim for group memberships
            groupsClaimName: groups
            # JWT claim for user identity
            subClaimName: sub
            # JWKS endpoint for token verification
            jwksEndpointUri: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/keys
            # Token endpoint for obtaining access tokens
            tokenEndpointUri: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/token
            # OAuth scope
            scope: confluent
  configOverrides:
    server:
      # Replication factor for Connect's internal config topic
      - config.storage.replication.factor=3
      # Replication factor for Connect's internal offset topic
      - offset.storage.replication.factor=3
      # Replication factor for Connect's internal status topic
      - status.storage.replication.factor=3
      # Allow connectors to override producer/consumer configs (needed for per-connector auth)
      - connector.client.config.override.policy=All
