---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  ## Secrets — must be created before components; contains TLS certs, OAuth creds, MDS keys
  ## TODO: In production, replace with External Secrets Operator or Sealed Secrets
  - secrets.yaml

  ## Core platform — deployed in dependency order by CFK operator
  # KRaft metadata controller (replaces ZooKeeper); must be ready before Kafka starts
  - kraft-controller.yaml
  # Kafka brokers with OAuth, TLS, MDS, and RBAC
  - kafka.yaml
  # Schema Registry for Avro/JSON/Protobuf schema management
  - schema-registry.yaml
  # Kafka Connect for source/sink connector workloads
  - connect.yaml
  # Control Center UI for monitoring and management with Okta SSO
  - control-center.yaml

  ## RBAC — REST class and role bindings for Okta-based access control
  # Configures how CFK authenticates to Kafka REST API for RBAC operations
  - kafka-rest-class.yaml
  # SystemAdmin role bindings for FCB administrators (identified by Okta email)
  - rbac-rolebindings.yaml
