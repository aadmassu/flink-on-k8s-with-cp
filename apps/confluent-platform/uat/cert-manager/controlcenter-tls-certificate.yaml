---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-06-29 (last-modified)
# Description: Keyfactor Certificate for Control Center (backend serving
#              cert) — uat.
########################################################################

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: controlcenter-tls
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter-tls
    app.kubernetes.io/component: control-center
    fcbint.net/app-id: "11547"
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkfkaksupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Non-Prod-UAT
    metadata.command-issuer.keyfactor.com/Description: "Control Center next-gen — REST + Prometheus + AlertManager listeners"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: "11547"
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  # Internal-only SANs. The FCB Keyfactor approver-policy allows DNS names
  # under *.svc, *.svc.cluster.local, and *.ocp.fcbint.net — anything else
  # is rejected. When C3 needs external exposure, the OpenShift Route
  # hostname will follow the *.apps.<cluster>.ocp.fcbint.net pattern (per
  # the FCB cert-manager doc examples). Add that hostname here once
  # allocated.
  commonName: controlcenter.dah-flink-uat.svc.cluster.local
  dnsNames:
    - controlcenter.dah-flink-uat.svc
    - controlcenter.dah-flink-uat.svc.cluster.local
    - controlcenter-0.controlcenter.dah-flink-uat.svc.cluster.local
  duration: 8760h0m0s
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: controlcenter-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: controlcenter
      app.kubernetes.io/instance: controlcenter-tls
      app.kubernetes.io/component: control-center
      fcbint.net/app-id: "11547"
