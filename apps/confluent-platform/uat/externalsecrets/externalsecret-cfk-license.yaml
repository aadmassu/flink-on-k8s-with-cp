---
# ============================================================================
# STATUS: STUB / DRAFT — not yet applied in dah-flink-uat (as of 2026-06-11).
# ============================================================================
# Scaffolding for when the CyberArk account for the Confluent license JWT is
# provisioned in safe 11547_U_LNX_FP. Until then, the confluent-platform.yaml
# pipeline creates the K8s Secret `cfk-license` directly from the
# `uat-confluent-license` entry in the kafka-openshift-credentials-uat
# variable group, wrapping it as `license=<JWT>` for the CFK operator
# (see `apply_secret_from_literals cfk-license` around line 394 of
# confluent-platform.yaml; the ESO-snapshot logic at line 279 will
# automatically skip this manifest if/when an active ExternalSecret
# already owns the cfk-license name).
# ============================================================================
#
# ESO ExternalSecret — pulls the same Confluent license JWT from CyberArk
# as confluent-license (account uat-confluent-license in safe 11547_U_LNX_FP)
# but writes it into a Secret named `cfk-license` with the JWT wrapped as
# Java-properties `license=<JWT>` under key `license.txt`. The CFK operator
# itself (cfk-operator chart) consumes this wrapped form for its license
# override.
#
# The companion confluent-license ExternalSecret under
# apps/confluent-cmf/uat/externalsecrets/ materializes the SAME JWT in
# RAW form under `license.txt` — that variant is what the CP components
# (Kafka, Schema Registry, Connect, REST, Control Center) and CMF
# consume. One CyberArk account, two output shapes; the difference is
# just the `license=` prefix added by this template.
#
# See apps/confluent-cmf/dev/externalsecrets/README.md for the broader
# SecretStore-vs-ExternalSecret model and the SecretStore URL contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cfk-license
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: cfk-license
    app.kubernetes.io/instance: cfk-license
    app.kubernetes.io/component: cfk-prereq
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-u-lnx-fp
    kind: SecretStore
  target:
    name: cfk-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cfk-license
          app.kubernetes.io/instance: cfk-license
          app.kubernetes.io/component: cfk-prereq
          app.kubernetes.io/part-of: confluent-platform
          fcbint.net/app-id: "11547"
      data:
        license.txt: "license={{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: "uat-confluent-license"
        property: "Digital Analytics Hub"
