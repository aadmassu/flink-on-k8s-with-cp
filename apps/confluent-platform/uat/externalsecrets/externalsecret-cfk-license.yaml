---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-10 (created), 2026-06-29 (last-modified)
# Description: ExternalSecret — wraps Confluent license JWT into Secret
#              cfk-license for the CFK operator (Java-properties form) —
#              uat.
########################################################################

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cfk-license
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: cfk-license
    app.kubernetes.io/instance: cfk-license
    app.kubernetes.io/component: cfk-prereq
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-u-lnx-fp
    kind: SecretStore
  target:
    name: cfk-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cfk-license
          app.kubernetes.io/instance: cfk-license
          app.kubernetes.io/component: cfk-prereq
          app.kubernetes.io/part-of: confluent-platform
          fcbint.net/app-id: "11547"
      data:
        license.txt: "license={{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: "uat-confluent-license"
        property: "Digital Analytics Hub"
