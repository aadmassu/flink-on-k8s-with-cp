---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-10 (created), 2026-06-29 (last-modified)
# Description: Ingress exposing the broker MDS REST endpoint publicly
#              (MDS API only); reencrypt termination — uat.
########################################################################

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-mds
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-mds
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    route.openshift.io/termination: reencrypt
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: kafka-mds.apps.ut-p.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: kafka
                port:
                  number: 8090
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - kafka-mds.apps.ut-p.ocp.fcbint.net
      secretName: kafka-mds-ingress-tls
