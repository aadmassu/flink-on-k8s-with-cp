---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PLACEHOLDER_ORG/FCB.git
    path: apps/confluent-platform/dev/manifests
    targetRevision: HEAD
  destination:
    server: https://dev-cluster.aws-us-east-2.example.com
    namespace: confluent-dev
  ignoreDifferences:
    - group: platform.confluent.io
      kind: "*"
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
