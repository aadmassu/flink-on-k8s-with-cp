---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: confluent-dev

patches:
  # Dev: single replica, small volumes — already in base
  # ControlCenter dependency URLs use per-env namespace
  - target:
      kind: ControlCenter
      name: controlcenter
    patch: |
      - op: replace
        path: /spec/dependencies/schemaRegistry/url
        value: http://schemaregistry.confluent-dev.svc.cluster.local:8081
      - op: replace
        path: /spec/dependencies/connect/0/url
        value: http://connect.confluent-dev.svc.cluster.local:8083
  - target:
      kind: KafkaRestClass
      name: krc-cfk
    patch: |
      - op: replace
        path: /spec/kafkaRest/endpoint
        value: http://kafka.confluent-dev.svc.cluster.local:8090
