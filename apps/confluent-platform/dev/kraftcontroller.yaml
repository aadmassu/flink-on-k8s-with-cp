---
# CFK KRaftController CR — dev (3-node KRaft quorum). VM source:
# apps/confluent-platform/cp-confluent/dev/d11547varc-*-controller-*-server.properties.
# CONTROLLER:9093 SASL_SSL/PLAIN, KRAFT_ACL authz only (no MDS), telemetry
# + audit log disabled (chicken-and-egg with brokers; runbook A8/A9/A12).

apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: kraftcontroller
    app.kubernetes.io/component: kraft-controller
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # 3-controller quorum (HA-safe, tolerates one loss). Don't drop to 1 — loses quorum on first restart.
  replicas: 3
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0
  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet, not the CR — injectLabels is CFK's mechanism to push these onto every managed resource.
  injectLabels:
    app.kubernetes.io/name: kraftcontroller
    app.kubernetes.io/instance: kraftcontroller
    app.kubernetes.io/component: kraft-controller
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  # PVCs: data-kraftcontroller-{0,1,2} on Ceph RBD — KRaft metadata log survives pod/node failures. 1 Gi/controller; VM target was 64 Gi (over-provisioned). DO NOT add spec.volumeClaimTemplates — silently pruned by CRD admission.
  dataVolumeCapacity: 1Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  # CONTROLLER listener on 9093, SASL_SSL with PLAIN (matches VM).
  listeners:
    controller:
      tls:
        enabled: true
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
  tls:
    secretRef: kraftcontroller-tls
  license:
    secretRef: cfk-license

  # FCB trust bundle for outbound HTTPS (see kafka.yaml).
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  # FCB Gatekeeper [pod-disruption-budget] rejects CFK's auto-generated PDB at maxUnavailable=0; setting 1 makes it drainable.
  pdb:
    enabled: true
    maxUnavailable: 1
  # Carried over from controller .properties so the cluster keeps the same
  # internal-topic replication factors and authorizer config as the VM.
  configOverrides:
    # JVM default truststore -> fcb-trust-bundle (see kafka.yaml).
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - authorizer.class.name=io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
      # KRAFT_ACL-only on controller — CONFLUENT provider needs MDS bootstrap which doesn't exist before brokers come up (runbook A8). Brokers use CONFLUENT,KRAFT_ACL.
      - confluent.authorizer.access.rule.providers=KRAFT_ACL
      - super.users=User:admin
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.license.topic.replication.factor=3
      - confluent.balancer.enable=true
      - confluent.balancer.heal.uneven.load.trigger=ANY_UNEVEN_LOAD
      # ConfluentMetricsReporter + TelemetryReporter + audit log all stripped from controllers — chicken-and-egg with brokers (runbook A9/A12), and FCB has no telemetry API creds yet (memory project_fcb_telemetry_audit_reenable_later). Brokers keep them.
      - confluent.security.event.logger.enable=false
  podTemplate:
    serviceAccountName: flink-operator
    # ~2 GiB heap (CFK sizes -Xmx from memory.request). Prior 384 Mi was OOM-killing during metadata snapshot replay. memory.request == memory.limit -> Guaranteed QoS. Quota fits 3 controllers + 3 brokers + SR + kafkarest + CMF + 2 Flink jobs at ~6.7/11 CPU req.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 2Gi
    probe:
      liveness:
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # Disable operator-injected fsGroup/runAsUser=1001 so OpenShift restricted-v2 SCC picks the namespace UID range (see kafka.yaml).
    podSecurityContext: {}
    # Repeated here because FCB Gatekeeper [required-workload-labels] inspects the Pod resource at admission, not just the StatefulSet. cfk-role used by the anti-affinity rule below.
    labels:
      app.kubernetes.io/name: kraftcontroller
      app.kubernetes.io/instance: kraftcontroller
      app.kubernetes.io/component: kraft-controller
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kraft-controller
    # Spread controllers across nodes via cfk-role anti-affinity. Brokers carry a different cfk-role so a node may host one of each.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kraft-controller
            topologyKey: kubernetes.io/hostname
