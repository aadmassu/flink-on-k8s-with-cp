---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-09-29 (created)
# Description: Services that tell the Dynatrace ActiveGate to scrape the
#              CFK JMX Prometheus exporter (:7778/metrics) on every pod.
#              One Service per component; selectors match the CFK
#              podTemplate labels. FCB pattern per the Dynatrace wiki
#              (runbook H9). Plain HTTP inside the cluster only.
########################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-dynatrace-metrics
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-dynatrace-metrics
    app.kubernetes.io/component: dynatrace-metrics
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
    metrics.dynatrace.com/scrape: "true"
    metrics.dynatrace.com/port: "7778"
    metrics.dynatrace.com/path: "/metrics"
    metrics.dynatrace.com/secure: "false"
    # Optional include-list once the useful series are known, e.g.
    # metrics.dynatrace.com/filter: '{"mode":"include","names":["kafka_server_*","jvm_*"]}'
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: confluent-platform
  ports:
    - name: metrics
      port: 7778
      targetPort: 7778
      protocol: TCP
