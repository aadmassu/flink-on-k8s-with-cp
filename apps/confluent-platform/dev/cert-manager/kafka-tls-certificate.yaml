---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-06-30 (last-modified)
# Description: Keyfactor Certificate for the Kafka brokers (Secret
#              kafka-tls; consumed by the Kafka CR via tls.secretRef).
#              SANs cover headless per-pod DNS + round-robin Service DNS.
#              PEM-only — CFK init container does the JKS/PKCS12 render
#              at startup (runbook A21).
########################################################################
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-tls
    app.kubernetes.io/component: kafka-broker
    fcbint.net/app-id: "11547"
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkafkasupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Non-Prod-DEV
    metadata.command-issuer.keyfactor.com/Description: "Kafka brokers — internal listeners and MDS"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: "11547"
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  # Internal-only SANs. The FCB Keyfactor approver-policy allows DNS names
  # under *.svc, *.svc.cluster.local, and *.ocp.fcbint.net — anything else
  # is rejected. The earlier draft included external LB SANs under
  # kafka.dev.dah.fcbint.net (a stand-in for the eventual external hostname);
  # those tripped the policy and blocked the CertificateRequest.
  #
  # External LB exposure remains staged in kafka.yaml's externalAccess block.
  # External SANs will be re-added once either (a) Tom allocates an LB
  # hostname under *.ocp.fcbint.net, or (b) FCB binds a separate ClusterIssuer
  # to Keyfactor's wildcard template. Until then, external clients that
  # strictly validate TLS hostname will fail against the LB; in-cluster
  # traffic (CMF, Flink jobs) uses the *.svc.cluster.local listener and is
  # unaffected.
  commonName: kafka.dah-flink-dev.svc.cluster.local
  dnsNames:
    - kafka.dah-flink-dev.svc
    - kafka.dah-flink-dev.svc.cluster.local
    - kafka-0.kafka.dah-flink-dev.svc.cluster.local
    - kafka-1.kafka.dah-flink-dev.svc.cluster.local
    - kafka-2.kafka.dah-flink-dev.svc.cluster.local
    - kafka.apps.dv-p.ocp.fcbint.net
    - kafka-0.kafka.apps.dv.ocp.fcbint.net
    - kafka-1.kafka.apps.dv.ocp.fcbint.net
    - kafka-2.kafka.apps.dv.ocp.fcbint.net
    - kafka-0.kafka.apps.dv-p.ocp.fcbint.net
    - kafka-1.kafka.apps.dv-p.ocp.fcbint.net
    - kafka-2.kafka.apps.dv-p.ocp.fcbint.net
    # client listener through TLS-passthrough Ingress on 443 (runbook H10): names must be
    # one label under the router wildcard. Both bootstrap shapes CFK may advertise are listed.
    - kafka-client.apps.dv-p.ocp.fcbint.net
    - kafka-0.apps.dv-p.ocp.fcbint.net
    - kafka-1.apps.dv-p.ocp.fcbint.net
    - kafka-2.apps.dv-p.ocp.fcbint.net
    - kafka-client-0.apps.dv-p.ocp.fcbint.net
    - kafka-client-1.apps.dv-p.ocp.fcbint.net
    - kafka-client-2.apps.dv-p.ocp.fcbint.net
  duration: 8760h0m0s
  renewBefore: 1080h0m0s
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: kafka-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka-tls
      app.kubernetes.io/component: kafka-broker
      fcbint.net/app-id: "11547"
