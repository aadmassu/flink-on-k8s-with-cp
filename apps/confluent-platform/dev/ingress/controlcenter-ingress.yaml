---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-10 (created), 2026-06-10 (last-modified)
# Description: Ingress exposing Control Center UI publicly (main
#              browser-facing CP dashboard). Backend HTTPS on 9021
#              (controlcenter-tls); edge termination reencrypt.
########################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controlcenter
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    route.openshift.io/termination: reencrypt
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: controlcenter.apps.dv-p.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: controlcenter
                port:
                  number: 9021
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - controlcenter.apps.dv-p.ocp.fcbint.net
      secretName: controlcenter-ingress-tls
