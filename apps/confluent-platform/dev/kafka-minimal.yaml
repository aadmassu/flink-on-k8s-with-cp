---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-27 (created), 2026-06-27 (last-modified)
# Description: CFK Kafka CR — minimal variant (known-good baseline,
#              diagnostic). Selected via confluent-platform.yaml
#              kafkaCRVariant=minimal. Strips spec.listeners.{external,
#              custom}, spec.services.mds, and spec.configOverrides.server
#              from kafka.yaml; keeps only what's needed for sts/kafka to
#              come up. DO NOT use as a production manifest.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-27-minimal"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dataVolumeCapacity: 10Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  # See kafka.yaml comment for the CFK 3.2.0 v1beta1 schema details.
  # Short version: the controller-dial auth + tls config goes under
  # dependencies.kRaftController.controllerListener — NOT directly under
  # kRaftController as siblings of clusterRef (those sub-fields don't
  # exist in the schema and were silently stripped at admission, which
  # is why kafka-0/1/2 fatally failed broker registration on the
  # 2026-06-27 wipe-and-rebuild attempt before this restructure).
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true

  # ONLY internal listener — strip external (OAuth+LoadBalancer) and custom (mTLS)
  # so the operator has nothing exotic to provision before sts/kafka comes up.
  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true

  tls:
    secretRef: kafka-tls
  license:
    secretRef: cfk-license

  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kafka-broker
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
