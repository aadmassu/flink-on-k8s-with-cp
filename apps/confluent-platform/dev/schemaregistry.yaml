---
# CFK SchemaRegistry CR — dev (1 replica)
#
# Source: apps/confluent-platform/cp-confluent/dev/d11547varc-4559-schema-registry.properties
#
# Per-VM config carried over to the future-state (RBAC) target:
#   listeners=https://0.0.0.0:8081
#   kafkastore.bootstrap.servers=<3 brokers>:9092 (SASL_SSL OAUTHBEARER)
#   kafkastore.topic=_schemas, kafkastore.topic.replication.factor=3
#   confluent.schema.registry.authorizer.class=...rbac.RbacAuthorizer
#   confluent.schema.registry.auth.mechanism=JETTY_AUTH
#   OAuth via Okta — issuer myapps.firstcitizens.com/oauth2/default
#     scope 11547.DAH(Dev), audiences [Confluent, account, api://default]
#     sub claim sub, groups claim dahDev_groups
#   Schema Exporter resource extension enabled (for SR linking)
#   metadata.encoder.secret=<...> (carry over via Secret)
#
# Replica count is 1 to match the VM topology. CFK SR is HA-capable; if FCB
# wants HA, bump replicas to 3 and add a Service-level discovery config.
#
# ----------------------------------------------------------------------
# Interim state (2026-06-27, see runbook A15/A16 + project-docs/pump.txt)
# ----------------------------------------------------------------------
# The dev Kafka cluster currently runs without an authorizer and without
# MDS (services.mds + listeners.external OAuth blocks were silently
# stripped by CFK 3.2.0 v1beta1 admission — never actually took effect
# on this cluster; see memory project_cfk_v1beta1_silent_strips). Until
# the schema-fix workstream re-adds OAuth + MDS in the correct v1beta1
# shape, SR cannot use OAUTHBEARER to brokers, OAuth on its own HTTP
# API, or RBAC for authorization — there's no MDS to back any of them.
#
# Interim spec changes from the original full-RBAC target:
#   - dependencies.kafka: connect to the INTERNAL listener on :9071 with
#     SASL_SSL/PLAIN. The CFK operator runs in FIPS-strict mode and the
#     first SR install attempt failed admission with
#       cluster-ready=False ApplyFailed: "Cannot create http client: TLS
#       not Enabled in Application when FIPS mode is true in Operator"
#     because the anonymous PLAINTEXT-to-EXTERNAL:9092 dep block we
#     tried first had no tls sub-block. INTERNAL:9071 satisfies the
#     FIPS check (tls.enabled=true) AND has the SASL/PLAIN user database
#     CFK pre-wires from the sasl-plain-internal Secret (the same one
#     the broker uses). The OAUTHBEARER block is commented out below
#     for one-pass re-add.
#   - dependencies.mds: REMOVED (MDS doesn't exist on this cluster).
#   - spec.authentication: REMOVED. SR's HTTP API has no client auth
#     during the interim — anyone in dah-flink-dev who can reach the
#     ClusterIP can call SR. Acceptable for dev (NetworkPolicy already
#     scopes inbound to dah-flink-dev pods).
#   - spec.authorization: REMOVED. No RBAC without MDS.
#   - configOverrides.server: drop JETTY_AUTH (no auth to enforce) and
#     drop SchemaRegistrySecurityResourceExtension (requires auth).
#     Keep the Schema Exporter extension and topic/replication settings.
#
# All four removed/changed blocks are kept as commented-out yaml below
# so re-enable is mechanical once the schema-fix workstream finishes.

apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-27-sr-sasl-plain-tls"
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # TEMP — resources scaled down for the dah-flink-dev ResourceQuota.
  # Revert sizing to 4/4 req+limit when Tom raises the namespace quota.
  replicas: 1
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-schema-registry:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0
  # FCB Gatekeeper [required-workload-labels] inspects the auto-generated
  # StatefulSet (not the CR). injectLabels is CFK's mechanism for pushing
  # labels into every managed resource — keep aligned with the FCB common-
  # metadata standard (name, instance, component, part-of, app-id).
  injectLabels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/instance: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  # Resources MUST live under spec.podTemplate.resources — the SR CRD has
  # no top-level spec.resources field, so anything placed there gets
  # pruned silently at admission and the application container starts
  # with no requests/limits. FCB's namespace ResourceQuota then rejects
  # every pod with "must specify limits.cpu for: schemaregistry ...".

  dependencies:
    # Interim: SASL_SSL/PLAIN to the INTERNAL listener on :9071, using
    # the sasl-plain-internal Secret CFK already pre-wires for the
    # broker's own internal listener. INTERNAL has SASL_SSL (so FIPS
    # mode's tls.enabled=true requirement is satisfied) plus the user
    # database CFK auto-mounts at /mnt/secrets/sasl-plain-internal.
    # Re-enable OAUTHBEARER once OAuth+MDS are wired correctly in
    # v1beta1 shape. Original full-RBAC config for reference / re-add:
    #
    # kafka:
    #   bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
    #   authentication:
    #     type: oauthbearer
    #     oauthbearer:
    #       secretRef: oauth-schemaregistry
    #     oauthSettings:
    #       audience: "Confluent,account,api://default"
    #       expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
    #       jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
    #       scope: 11547.DAH(Dev)
    #       subClaimName: sub
    #       groupsClaimName: dahDev_groups
    #       tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    #   tls:
    #     enabled: true
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true

  # dependencies.mds — REMOVED for the interim (MDS not provisioned).
  # Re-add when MDS is wired:
  #
  # mds:
  #   endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
  #   tokenKeyPair:
  #     secretRef: mds-token-keypair
  #   authentication:
  #     type: oauth
  #     oauth:
  #       secretRef: oauth-schemaregistry
  #       configuration:
  #         audience: "Confluent,account,api://default"
  #         expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
  #         jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
  #         scope: 11547.DAH(Dev)
  #         subClaimName: sub
  #         groupsClaimName: dahDev_groups
  #         tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token

  # spec.authentication — REMOVED for the interim. SR HTTP API has no
  # client auth; in-cluster Flink jobs and other clients reach
  # https://schemaregistry.dah-flink-dev.svc.cluster.local:8081 directly.
  # NetworkPolicy + namespace scoping is the only access control today.
  # Re-add when OAuth is wired:
  #
  # authentication:
  #   type: oauth
  #   oauth:
  #     secretRef: oauth-schemaregistry
  #     configuration:
  #       jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
  #       expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
  #       audience: "Confluent,account,api://default"
  #       subClaimName: sub
  #       groupsClaimName: dahDev_groups
  #       tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
  #       scope: 11547.DAH(Dev)

  # spec.authorization — REMOVED for the interim (no RBAC without MDS).
  # Re-add when MDS is wired:
  #
  # authorization:
  #   type: rbac
  #   superUsers:
  #     - User:admin

  tls:
    secretRef: schemaregistry-tls
  license:
    secretRef: cfk-license

  # FCB org-wide trust bundle — see kafka.yaml for the full rationale.
  # SR uses the JVM default truststore for outbound HTTPS — during the
  # interim only the inter-SR replica probe matters; once OAuth is back
  # this also covers token / JWKS / MDS calls.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  # FCB Gatekeeper [pod-disruption-budget] constraint rejects PDBs with
  # maxUnavailable=0. CFK auto-creates a PDB per workload; for a single-
  # replica SR it defaults to maxUnavailable=0 (refuse any voluntary
  # disruption), which the policy treats as "blocks drains forever".
  # Setting maxUnavailable=1 here makes the auto-generated PDB drainable
  # — acceptable for dev (1 replica = brief outage on node drain). For HA,
  # bump replicas first, then revisit this number.
  pdb:
    enabled: true
    maxUnavailable: 1

  # Carry-over for SR linking (Schema Exporter), topic + replication
  # settings. JETTY_AUTH and the SchemaRegistrySecurityResourceExtension
  # are dropped in the interim (no auth = nothing to enforce); both come
  # back when OAuth + MDS are re-added.
  configOverrides:
    # JVM-default truststore → fcb-trust-bundle (see kafka.yaml for rationale).
    # Password is trust-manager's default ("changeit"); confirm with Container
    # team if the FCB Bundle was rebuilt with a custom password.
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - schema.registry.group.id=schema-registry
      - kafkastore.topic=_schemas
      - kafkastore.topic.replication.factor=3
      - inter.instance.protocol=https
      # Re-add when OAuth + RBAC are back:
      # - confluent.schema.registry.auth.mechanism=JETTY_AUTH
      # - resource.extension.class=io.confluent.kafka.schemaregistry.security.SchemaRegistrySecurityResourceExtension,io.confluent.schema.exporter.SchemaExporterResourceExtension
      # - kafkastore.update.handlers=io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler
      #
      # Interim: keep only the Schema Exporter extension (no security
      # extension). Schema Exporter doesn't require auth on the
      # source-side SR.
      - resource.extension.class=io.confluent.schema.exporter.SchemaExporterResourceExtension
      - kafkastore.update.handlers=io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler

  podTemplate:
    serviceAccountName: flink-operator
    # Raised from prior TEMP (75m/256Mi req, 150m/512Mi lim). The CFK
    # init-container floor (~500m CPU / ~1 GiB mem) already dominates
    # pod-level quota accounting, so the main-container bump is "free"
    # against ResourceQuota and just gives SR a heap that won't OOM
    # under any real subject load. Heap lands at ~512 MiB (sized from
    # memory.request); non-heap headroom up to the 1 GiB main-container
    # limit covers TLS buffers + the Avro schema cache.
    resources:
      requests:
        cpu: "200m"
        memory: 512Mi
      limits:
        cpu: "500m"
        memory: 1Gi
    probe:
      liveness:
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # Disable the operator-injected podSecurityContext (fsGroup/runAsUser=1001)
    # so OpenShift's restricted-v2 SCC assigns a namespace-range UID at
    # admission. See kafka.yaml for the full rationale.
    podSecurityContext: {}
    # podTemplate.labels lands on the Pod template inside the StatefulSet.
    # injectLabels above only labels the StatefulSet; FCB Gatekeeper's
    # [required-workload-labels] policy also inspects the Pod at admission,
    # so the FCB common-metadata labels must be repeated here.
    labels:
      app.kubernetes.io/name: schemaregistry
      app.kubernetes.io/instance: schemaregistry
      app.kubernetes.io/component: schema-registry
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
