---
# CFK SchemaRegistry CR — dev (1 replica, matching VM)
#
# Source: apps/confluent-platform/cp-confluent/dev/d11547varc-4559-schema-registry.properties
#
# Per-VM config carried over:
#   listeners=https://0.0.0.0:8081
#   kafkastore.bootstrap.servers=<3 brokers>:9092 (SASL_SSL OAUTHBEARER)
#   kafkastore.topic=_schemas, kafkastore.topic.replication.factor=3
#   confluent.schema.registry.authorizer.class=...rbac.RbacAuthorizer
#   confluent.schema.registry.auth.mechanism=JETTY_AUTH
#   OAuth via Okta — issuer myapps.firstcitizens.com/oauth2/default
#     scope 11547.DAH(Dev), audiences [Confluent, account, api://default]
#     sub claim sub, groups claim dahDev_groups
#   Schema Exporter resource extension enabled (for SR linking)
#   metadata.encoder.secret=<...> (carry over via Secret)
#
# Replica count is 1 to match the VM topology. CFK SR is HA-capable; if FCB
# wants HA, bump replicas to 3 and add a Service-level discovery config.

apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 1
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-schema-registry:8.1.0
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:0.1351.59
  resources:
    requests:
      cpu: "4"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 4Gi

  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
      authentication:
        type: oauth
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        subClaimName: sub
        groupsClaimName: dahDev_groups
        expectedAudiences:
          - Confluent
          - account
          - api://default
        oauthSettings:
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
          clientCredentials:
            secretRef: oauth-schemaregistry
      tls:
        enabled: true
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        clientCredentials:
          secretRef: oauth-schemaregistry

  # CFK 3.1.1 requires OAuth config nested under authentication.oauth.{secretRef,configuration}
  # — flat fields directly under authentication.* don't fit the schema.
  authentication:
    type: oauth
    oauth:
      secretRef: oauth-schemaregistry
      configuration:
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        audience: "Confluent,account,api://default"
        subClaimName: sub
        groupsClaimName: dahDev_groups
        tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
        scope: 11547.DAH(Dev)

  authorization:
    type: rbac
    superUsers:
      - User:admin

  tls:
    secretRef: schemaregistry-tls
  license:
    secretRef: confluent-license

  # Carry-over for SR linking (Schema Exporter), encoder secret, and the
  # JETTY_AUTH mechanism the VM cluster uses.
  configOverrides:
    server:
      - schema.registry.group.id=schema-registry
      - kafkastore.topic=_schemas
      - kafkastore.topic.replication.factor=3
      - inter.instance.protocol=https
      - confluent.schema.registry.auth.mechanism=JETTY_AUTH
      - resource.extension.class=io.confluent.kafka.schemaregistry.security.SchemaRegistrySecurityResourceExtension,io.confluent.schema.exporter.SchemaExporterResourceExtension
      - kafkastore.update.handlers=io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler

  podTemplate:
    serviceAccountName: flink-operator
