---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-06-30 (last-modified)
# Description: CFK SchemaRegistry CR — Phase 2 (HTTPS + SASL_SSL/PLAIN to
#              Kafka INTERNAL :9071, MDS dependency on broker :8090, OAuth on
#              SR REST API, RBAC via ConfluentRolebinding CRs).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-30-phase2-mds-rbac-okta"
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 1

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-schema-registry:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  injectLabels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/instance: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
    # OAuth client_credentials to MDS (runs on the broker at :8090). SR presents an Okta-issued bearer token; MDS validates and returns the SR-scoped RBAC token used for authz against Kafka resources (runbook A22).
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-schemaregistry
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token

  # Okta JWT auth on SR REST API — clients (Flink jobs, CMF, etc.) must present a valid token issued by myapps.firstcitizens.com.
  authentication:
    type: oauth
    oauth:
      secretRef: oauth-schemaregistry
      configuration:
        audience: "Confluent,account,api://default"
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        scope: 11547.DAH(Dev)
        subClaimName: sub
        groupsClaimName: dahDev_groups
        tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token

  authorization:
    type: rbac
    superUsers:
      - User:admin

  tls:
    secretRef: schemaregistry-tls

  license:
    secretRef: cfk-license

  # fcb-trust-bundle at /var/ssl/truststore — same shape as kafka.yaml (runbook A21). Broker keystore+truststore come from spec.tls.secretRef via the CFK init container at /mnt/sslcerts/; don't overlay our own JKS into the Secret.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - schema.registry.group.id=schema-registry
      - kafkastore.topic=_schemas
      - kafkastore.topic.replication.factor=3
      - inter.instance.protocol=https
      - resource.extension.class=io.confluent.schema.exporter.SchemaExporterResourceExtension
      - kafkastore.update.handlers=io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "200m"
        memory: 512Mi
      limits:
        cpu: "500m"
        memory: 1Gi
    probe:
      liveness:
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: schemaregistry
      app.kubernetes.io/instance: schemaregistry
      app.kubernetes.io/component: schema-registry
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
