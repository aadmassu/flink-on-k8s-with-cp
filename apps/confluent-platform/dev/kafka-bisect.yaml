---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-06-29 (last-modified)
# Description: CFK Kafka CR — bisect variant (diagnostic, mutable).
#              Selected via confluent-platform.yaml kafkaCRVariant=bisect.
#              Layers production-spec features back on top of the
#              minimal baseline one chunk at a time. Bisect rounds A-D
#              concluded the original production silent-bail was
#              operator-state corruption, not spec-driven. See
#              project-docs/pump.txt + runbook A15. DO NOT use as a
#              production manifest.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-27-bisect-D"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dataVolumeCapacity: 10Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true

  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
    # Round 4 (Try D) addition: spec.listeners.custom lifted verbatim
    # from kafka.yaml lines 176-182. mTLS certonly listener on port 9094.
    # listeners.external was REMOVED from the bisect file (gets silently
    # stripped at admission anyway per Round 3, so it would be inert
    # noise here). If THIS triggers silent-bail, listeners.custom is
    # the trigger; otherwise the original production silent-bail was
    # operator-state corruption rather than a spec-driven trigger.
    custom:
      - name: certonly
        port: 9094
        authentication:
          type: mtls
        tls:
          enabled: true

  tls:
    secretRef: kafka-tls
  license:
    secretRef: cfk-license

  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  # Round 1 (Try A) addition: full configOverrides.server[*] block lifted
  # verbatim from apps/confluent-platform/dev/kafka.yaml (lines 265-293).
  # If this round fails with empty events / no status on the kafka CR, the
  # trigger is in this block. Sub-bisect candidates inside the block:
  #   - metric.reporters / confluent.telemetry.* (telemetry reporter, no
  #     API creds at FCB — top suspect)
  #   - confluent.balancer.* (SBC; needs license + cluster healthy)
  #   - authorizer.class.name (Confluent authorizer + KRAFT_ACL provider)
  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      # ConfluentServerAuthorizer + access.rule.providers REMOVED in the
      # post-bisect cleanup (Ayu's 2026-06-27 correction): the
      # ConfluentServerAuthorizer class loads its RBAC provider on
      # startup regardless of the providers list, so leaving the class
      # in -- even with `providers=KRAFT_ACL` -- still requires
      # confluent.metadata.bootstrap.servers, which CFK auto-populates
      # from spec.services.mds (silently stripped). Brokers therefore
      # cannot start with ConfluentServerAuthorizer until MDS is wired
      # in the correct v1beta1 shape. Keep this bisect file aligned
      # with the interim kafka.yaml so future bisect rounds don't
      # re-introduce the broken combo.
      - super.users=User:admin
      # Match the interim kafka.yaml: do NOT set inter.broker.listener
      # .name=internal. CFK only wires client-side JAAS for its
      # auto-managed `replication` listener on :9072; forcing inter-
      # broker onto `internal` leaves outbound broker-broker without
      # credentials.
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.metrics.reporter.topic.replicas=3
      - confluent.security.event.logger.exporter.kafka.topic.replicas=3
      - confluent.consumer.lag.emitter.enabled=true
      - confluent.balancer.enable=true
      - confluent.balancer.data.enabled=true
      - confluent.balancer.heal.uneven.load.trigger=ANY_UNEVEN_LOAD
      - metric.reporters=io.confluent.telemetry.reporter.TelemetryReporter,io.confluent.metrics.reporter.ConfluentMetricsReporter
      - confluent.telemetry.enabled=true
      - confluent.reporters.telemetry.auto.enable=true
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kafka-broker
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
