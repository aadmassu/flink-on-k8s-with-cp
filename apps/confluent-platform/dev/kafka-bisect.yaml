---
# CFK Kafka CR — BISECT VARIANT for dev (diagnostic, mutable)
#
# Purpose: starting from kafka-minimal.yaml (the confirmed-working baseline
# from the 2026-06-27T16:14Z run), add back one chunk of features at a time
# from kafka.yaml (production) to find which chunk causes the operator to
# silently bail without writing status conditions or events on the Kafka
# CR. See project-docs/pump.txt for the bisect plan and step log.
#
# This file is MUTATED between bisect rounds. kafka-minimal.yaml stays
# pristine as the known-good fallback. Selected via
# confluent-platform.yaml install with kafkaCRVariant=bisect.
#
# Round 1 (Try A): minimal + spec.configOverrides.server[*]    [DONE — NOT
#                                                                THE TRIGGER]
#   Tested 2026-06-27T16:42Z. Operator reconciled cleanly: SuccessfulCreate
#   events present, status conditions populated (cluster-ready=False
#   ReplicasNotReady), sts/kafka 3/3 created, kafka-0/1/2 pods scheduled.
#   No silent-bail. Brokers DID crash with
#     org.apache.kafka.common.config.ConfigException: You must specify
#     confluent.metadata.bootstrap.servers to configure the RBAC provider.
#   because the configOverrides.server list includes
#   `confluent.authorizer.access.rule.providers=CONFLUENT,KRAFT_ACL` (RBAC
#   provider) but services.mds was stripped, so CFK had no MDS bootstrap
#   to auto-populate. That's expected collateral of the bisect — RBAC
#   wants MDS — and is fixed when services.mds gets added in Round 2.
#   It does NOT affect the silent-bail signal we're hunting.
#
# Round 2 (Try B): bisect-after-A + spec.services.mds   [INCONCLUSIVE —
#                                                        BLOCK IS STRIPPED
#                                                        AT ADMISSION]
#   Tested 2026-06-27T16:55Z. Operator reconciled cleanly (events +
#   status + sts/kafka 3/3 + 3 broker pods), but the kafka CR yaml AFTER
#   admission showed `services:` containing ONLY the auto-added
#   `kafka-rest.internalEndpoint`, NOT our `mds:` sub-block. CFK 3.2.0
#   v1beta1 silently dropped the entire `services.mds:` block we lifted
#   from kafka.yaml — same family of CRD-schema reshape rejections we
#   already hit with `dependencies.kRaftController.authentication`
#   (needed `controllerListener` wrapping) and with the flat OAuth
#   fields under `listeners.external.authentication.*` (needed
#   `oauthSettings` wrapping). Brokers consequently failed the same
#   RBAC-needs-MDS check as Round 1 because no MDS was actually
#   provisioned. CRITICAL implication: the production kafka.yaml's
#   services.mds block is ALSO being stripped on every apply — so the
#   original production silent-bail cannot be attributed to MDS (the
#   operator never sees MDS). The trigger must be in one of the two
#   remaining sections: spec.listeners.external or spec.listeners.custom.
#   diagnostics.yaml now explains kafka.spec.services / .services.mds /
#   .services.kafkaRest / .authorization / .identityProvider so the next
#   run captures the correct v1beta1 shape for MDS to use AFTER we
#   identify the silent-bail trigger.
#
# Round 3 (Try C): bisect-after-A + spec.listeners.external   [INCONCLUSIVE —
#                                                              BLOCK STRIPPED
#                                                              AT ADMISSION]
#   Tested 2026-06-27T17:09Z. Operator reconciled cleanly (events +
#   status + sts/kafka 3/3 + 3 pods). Brokers CrashLoopBackOff on same
#   RBAC-needs-MDS error as Rounds 1+2 (expected). Post-admission kafka
#   CR yaml showed `spec.listeners:` contained ONLY the `internal:`
#   block — the entire `external:` block we applied (authentication.type
#   =oauth + oauthSettings + tls.enabled=true) was silently dropped at
#   admission. CFK 3.2.0 still created an external listener with
#   PLAINTEXT defaults regardless (broker config line 792:
#   `advertised.listeners = EXTERNAL://...:9092` with
#   `security.protocol=PLAINTEXT`), so OAuth-on-external has NEVER
#   actually taken effect on this cluster either. Same silent-strip
#   pattern as services.mds in Round 2. The Round-3 oc explain queries
#   added to diagnostics.yaml at commit e67188f did NOT appear in this
#   dump's diagnostic output, so diagnostics.yaml needs to be synced to
#   the FCB ADO side before the next run.
#
# Round 4 (Try D): bisect-after-A + spec.listeners.custom        [CURRENT]
#   Adds the mTLS certonly listener on port 9094 lifted verbatim from
#   kafka.yaml lines 176-182. listeners.external (stripped) and
#   services.mds (stripped) are still NOT carried over since they don't
#   affect the operator-reconcile signal. This is the LAST remaining
#   block from the production spec to test. Two possible outcomes:
#   - Silent-bail returns -> listeners.custom IS the trigger (specifically
#     the certonly+mtls combination, or the port 9094 conflict with
#     something CFK 3.2.0 default-allocates).
#   - Operator stays happy -> NONE of the spec sections trigger
#     silent-bail. The original production silent-bail (2026-06-27
#     diagnostic showing zero events / zero conditions / no sts-kafka)
#     was operator-state corruption from a prior partial install rather
#     than a spec-driven trigger. Production kafka.yaml is then safe to
#     apply directly after wipe+install; the silent-bail was a one-time
#     stuck state cleared by the wipePVCs path.
#
# DO NOT use this as a production manifest under any circumstances. This
# file's spec is intentionally an in-progress diagnostic snapshot.

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-27-bisect-D"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dataVolumeCapacity: 10Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true

  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
    # Round 4 (Try D) addition: spec.listeners.custom lifted verbatim
    # from kafka.yaml lines 176-182. mTLS certonly listener on port 9094.
    # listeners.external was REMOVED from the bisect file (gets silently
    # stripped at admission anyway per Round 3, so it would be inert
    # noise here). If THIS triggers silent-bail, listeners.custom is
    # the trigger; otherwise the original production silent-bail was
    # operator-state corruption rather than a spec-driven trigger.
    custom:
      - name: certonly
        port: 9094
        authentication:
          type: mtls
        tls:
          enabled: true

  tls:
    secretRef: kafka-tls
  license:
    secretRef: cfk-license

  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  # Round 1 (Try A) addition: full configOverrides.server[*] block lifted
  # verbatim from apps/confluent-platform/dev/kafka.yaml (lines 265-293).
  # If this round fails with empty events / no status on the kafka CR, the
  # trigger is in this block. Sub-bisect candidates inside the block:
  #   - metric.reporters / confluent.telemetry.* (telemetry reporter, no
  #     API creds at FCB — top suspect)
  #   - confluent.balancer.* (SBC; needs license + cluster healthy)
  #   - authorizer.class.name (Confluent authorizer + KRAFT_ACL provider)
  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      # ConfluentServerAuthorizer + access.rule.providers REMOVED in the
      # post-bisect cleanup (Ayu's 2026-06-27 correction): the
      # ConfluentServerAuthorizer class loads its RBAC provider on
      # startup regardless of the providers list, so leaving the class
      # in -- even with `providers=KRAFT_ACL` -- still requires
      # confluent.metadata.bootstrap.servers, which CFK auto-populates
      # from spec.services.mds (silently stripped). Brokers therefore
      # cannot start with ConfluentServerAuthorizer until MDS is wired
      # in the correct v1beta1 shape. Keep this bisect file aligned
      # with the interim kafka.yaml so future bisect rounds don't
      # re-introduce the broken combo.
      - super.users=User:admin
      # Match the interim kafka.yaml: do NOT set inter.broker.listener
      # .name=internal. CFK only wires client-side JAAS for its
      # auto-managed `replication` listener on :9072; forcing inter-
      # broker onto `internal` leaves outbound broker-broker without
      # credentials.
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.metrics.reporter.topic.replicas=3
      - confluent.security.event.logger.exporter.kafka.topic.replicas=3
      - confluent.consumer.lag.emitter.enabled=true
      - confluent.balancer.enable=true
      - confluent.balancer.data.enabled=true
      - confluent.balancer.heal.uneven.load.trigger=ANY_UNEVEN_LOAD
      - metric.reporters=io.confluent.telemetry.reporter.TelemetryReporter,io.confluent.metrics.reporter.ConfluentMetricsReporter
      - confluent.telemetry.enabled=true
      - confluent.reporters.telemetry.auto.enable=true
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kafka-broker
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
