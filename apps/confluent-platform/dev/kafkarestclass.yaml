---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-05-11 (last-modified)
# Description: KafkaRestClass connection profile (no pods). Anchors to
#              the Kafka CR; the operator derives MDS endpoint + OAuth/TLS.
#              Referenced from C3/Connect via
#              dependencies.kafkaRestClassRef: {name: default, namespace: dah-flink-dev}.
########################################################################
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: default
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: kafkarestclass
    app.kubernetes.io/instance: default
    app.kubernetes.io/component: kafka-rest-class
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  kafkaClusterRef:
    name: kafka
    namespace: dah-flink-dev
