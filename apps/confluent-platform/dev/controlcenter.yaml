---
# CFK ControlCenter CR — dev (1 replica, matching VM)
#
# Source: apps/confluent-platform/cp-confluent/dev/d11547varc-g5w0-control-center.properties
#
# Per-VM config carried over:
#   confluent.controlcenter.rest.listeners=https://0.0.0.0:9021
#   confluent.controlcenter.data.dir=/var/lib/confluent/control-center
#   confluent.controlcenter.streams.num.stream.threads=12
#   confluent.controlcenter.command.topic.replication=3
#   confluent.controlcenter.internal.topics.replication=3
#   confluent.controlcenter.metrics.topic.replication=3
#   confluent.controlcenter.monitoring.interceptor.topic.replication=3
#   bootstrap.servers, schema.registry.url, connect cluster reference -> CFK service DNS
#   Prometheus enabled (port 9090, basic auth)
#   AlertManager URL (port 9093, basic auth)
#   OAuth (Okta) for streams + MDS
#   confluent.controlcenter.cmf.healthcheck.interval.sec=600000 (CMF noise quieted)

apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 1
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-enterprise-control-center-next-gen:8.1.0
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:0.1351.103
  # FCB Gatekeeper [required-workload-labels] inspects the auto-generated
  # StatefulSet (not the CR). injectLabels is CFK's mechanism for pushing
  # labels into every managed resource — keep aligned with the FCB common-
  # metadata standard (name, instance, component, part-of, app-id).
  injectLabels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  # Deterministic per-pod PVC via the StatefulSet's volumeClaimTemplate:
  # the single C3 pod always binds to PVC `data-controlcenter-0` on a Ceph
  # RBD PV. C3's RocksDB state under /var/lib/confluent/control-center
  # persists across pod restarts and node migrations.
  # TEMPORARY DEV SIZING — pending namespace ResourceQuota increase.
  # See kafka.yaml for the full quota math. Once Tom raises the quota,
  # bump this back to 300 GiB (matching the VM C3 disk).
  dataVolumeCapacity: 1Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd  # ODF/Ceph block — C3 RocksDB state under /var/lib/confluent/control-center
  resources:
    requests:
      cpu: "12"
      memory: 16Gi
    limits:
      cpu: "12"
      memory: 16Gi

  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
      authentication:
        type: oauthbearer
        oauthbearer:
          secretRef: oauth-controlcenter
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          scope: 11547.DAH(Dev)
          subClaimName: sub
          groupsClaimName: dahDev_groups
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      tls:
        enabled: true
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    connect:
      - name: connect-cluster
        url: https://connect.dah-flink-dev.svc.cluster.local:8083
        tls:
          enabled: true
        authentication:
          type: oauth
          oauth:
            secretRef: oauth-controlcenter
            configuration:
              audience: "Confluent,account,api://default"
              expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
              jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
              scope: 11547.DAH(Dev)
              subClaimName: sub
              groupsClaimName: dahDev_groups
              tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      # OIDC SSO for the C3 UI is delivered through MDS — clients hit C3,
      # get redirected to MDS (which fronts Okta), authenticate, and come
      # back with an MDS-issued bearer token. This is CFK's mechanism for
      # what the VM expressed as confluent.controlcenter.auth.sso.mode=oidc.
      ssoProtocol: oidc
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    kafkaRestClassRef:
      name: default
      namespace: dah-flink-dev

  # CFK 3.1.1's ControlCenter CR only allows basic|ldap|mtls for the
  # top-level inbound UI auth — `oauth` is not a valid type (unlike Kafka /
  # SR / Connect / REST, which all do allow oauth top-level). VM C3 uses
  # BEARER/OIDC, which CFK delivers via dependencies.mds.ssoProtocol=oidc
  # above. Set mtls/requested here to satisfy the CRD's required `type`
  # field without forcing a client cert on every UI request — the OIDC
  # redirect through MDS handles the actual user authentication.
  authentication:
    type: mtls
    mtls:
      sslClientAuthentication: requested

  authorization:
    type: rbac
    superUsers:
      - User:admin

  tls:
    secretRef: controlcenter-tls
  license:
    secretRef: cfk-license

  # FCB Gatekeeper [pod-disruption-budget] constraint rejects PDBs with
  # maxUnavailable=0. CFK auto-creates a PDB per workload; for the single-
  # replica C3 StatefulSet it defaults to maxUnavailable=0, which the
  # policy reads as "blocks drains forever". maxUnavailable=1 makes the
  # auto-generated PDB drainable. The C3 PVC is RBD-attached so on node
  # drain the pod reschedules to another node and re-binds the same PVC;
  # brief UI/monitoring outage during the move is acceptable for dev.
  pdb:
    enabled: true
    maxUnavailable: 1

  # NOTE — Next-gen Prometheus + AlertManager bundle deliberately omitted
  # for the initial install. The CFK ControlCenter CRD exposes monitoring
  # under spec.services.{prometheus,alertmanager} (NOT spec.monitoring),
  # and each block requires its own image, pvc.storageClass.name, basic-auth
  # secret, and (for prometheus) a sized PVC. Pulling those values together
  # for FCB needs a separate sizing/SC/secret review with Tom, so we ship
  # C3 without the embedded monitoring bundle first and add it once the
  # base install is green. The c3-prometheus-basic-auth and
  # c3-alertmanager-basic-auth secrets the pipeline creates remain in place
  # so re-enabling later is a CR-only change.

  configOverrides:
    server:
      - confluent.controlcenter.data.dir=/var/lib/confluent/control-center
      - confluent.controlcenter.streams.num.stream.threads=12
      - confluent.controlcenter.command.topic.replication=3
      - confluent.controlcenter.internal.topics.replication=3
      - confluent.controlcenter.metrics.topic.replication=3
      - confluent.controlcenter.monitoring.interceptor.topic.replication=3
      - confluent.controlcenter.cmf.healthcheck.interval.sec=600000

  podTemplate:
    serviceAccountName: flink-operator
    # Disable the operator-injected podSecurityContext (fsGroup/runAsUser=1001)
    # so OpenShift's restricted-v2 SCC assigns a namespace-range UID at
    # admission. See kafka.yaml for the full rationale.
    podSecurityContext: {}
