---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-06-29 (last-modified)
# Description: CFK ControlCenter CR — dev. Currently suspended
#              (replicas: 0; C3 needs 12 CPU / 16 GiB, dev quota can't
#              fit it). Production-target spec retained; OAuth+MDS+RBAC
#              will need v1beta1-shape rework before bring-online.
#              Runbook A15/A17.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # SUSPENDED — C3 next-gen wants 12/16 req+limit, no honest reduction fits dev quota. Revert to replicas: 1 after quota raise.
  replicas: 0
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-enterprise-control-center-next-gen:2.5.0
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0
  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet, not the CR.
  injectLabels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  # PVC data-controlcenter-0 on Ceph RBD — RocksDB state survives restarts. Temporary 1 Gi; bump to 300 Gi (VM target) after quota raise. Resources under spec.podTemplate.resources.
  dataVolumeCapacity: 1Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
      authentication:
        type: oauthbearer
        oauthbearer:
          secretRef: oauth-controlcenter
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          scope: 11547.DAH(Dev)
          subClaimName: sub
          groupsClaimName: dahDev_groups
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      tls:
        enabled: true
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    connect:
      - name: connect-cluster
        url: https://connect.dah-flink-dev.svc.cluster.local:8083
        tls:
          enabled: true
        authentication:
          type: oauth
          oauth:
            secretRef: oauth-controlcenter
            configuration:
              audience: "Confluent,account,api://default"
              expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
              jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
              scope: 11547.DAH(Dev)
              subClaimName: sub
              groupsClaimName: dahDev_groups
              tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      # OIDC SSO for the C3 UI is delivered through MDS — clients hit C3,
      # get redirected to MDS (which fronts Okta), authenticate, and come
      # back with an MDS-issued bearer token. This is CFK's mechanism for
      # what the VM expressed as confluent.controlcenter.auth.sso.mode=oidc.
      ssoProtocol: oidc
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    kafkaRestClassRef:
      name: default
      namespace: dah-flink-dev

  # CFK 3.1.1's ControlCenter CR only allows basic|ldap|mtls for the
  # top-level inbound UI auth — `oauth` is not a valid type (unlike Kafka /
  # SR / Connect / REST, which all do allow oauth top-level). VM C3 uses
  # BEARER/OIDC, which CFK delivers via dependencies.mds.ssoProtocol=oidc
  # above. Set mtls/requested here to satisfy the CRD's required `type`
  # field without forcing a client cert on every UI request — the OIDC
  # redirect through MDS handles the actual user authentication.
  authentication:
    type: mtls
    mtls:
      sslClientAuthentication: requested

  authorization:
    type: rbac
    superUsers:
      - User:admin

  tls:
    secretRef: controlcenter-tls
  license:
    secretRef: cfk-license

  # FCB trust bundle for outbound HTTPS (brokers/SR/Connect/MDS/Okta-OIDC).
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  # FCB Gatekeeper [pod-disruption-budget] rejects CFK's auto-generated PDB at maxUnavailable=0; setting 1 makes it drainable.
  pdb:
    enabled: true
    maxUnavailable: 1

  # Next-gen Prometheus + AlertManager bundle deferred — needs spec.services.{prometheus,alertmanager} blocks with image/pvc/basic-auth wiring. c3-prometheus-basic-auth + c3-alertmanager-basic-auth secrets exist so re-enable is CR-only.

  configOverrides:
    # JVM default truststore -> fcb-trust-bundle (see kafka.yaml).
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - confluent.controlcenter.data.dir=/var/lib/confluent/control-center
      - confluent.controlcenter.streams.num.stream.threads=12
      - confluent.controlcenter.command.topic.replication=3
      - confluent.controlcenter.internal.topics.replication=3
      - confluent.controlcenter.metrics.topic.replication=3
      - confluent.controlcenter.monitoring.interceptor.topic.replication=3
      - confluent.controlcenter.cmf.healthcheck.interval.sec=600000

  podTemplate:
    serviceAccountName: flink-operator
    # Dev-smoke sizing (runbook F2). VM/UAT target is 12/16; these numbers apply when replicas comes off 0.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Disable operator-injected fsGroup/runAsUser=1001 so OpenShift restricted-v2 SCC picks the namespace UID range (see kafka.yaml).
    podSecurityContext: {}
    # Repeated here because FCB Gatekeeper [required-workload-labels] inspects the Pod, not just the StatefulSet.
    labels:
      app.kubernetes.io/name: controlcenter
      app.kubernetes.io/instance: controlcenter
      app.kubernetes.io/component: control-center
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
