---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-07-01 (last-modified)
# Description: CFK ControlCenter CR -- Phase 2 shape. Dep-side Kafka
#              auth uses the live-CRD flat form (type: oauth + jaasConfig
#              + oauthSettings); MDS/SR/Connect deps use nested oauth+
#              configuration. Top-level UI auth stays mtls+requested
#              because the ControlCenter CRD's top-level authentication
#              enum is [basic|ldap|mtls] -- OIDC redirect is delivered
#              through dependencies.mds.ssoProtocol=oidc (runbook A24).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-07-01-c3-pvc-15gi"
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # Bringing online at dev-smoke sizing (1/2 CPU, 2/4 GiB) -- quota headroom confirmed after Phase 2 landed.
  replicas: 1

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-enterprise-control-center-next-gen:2.5.0
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet, not the CR.
  injectLabels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  # RocksDB state on Ceph RBD. 15 Gi for dev smoke-testing; VM target is 300 Gi.
  dataVolumeCapacity: 15Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  license:
    secretRef: cfk-license

  tls:
    secretRef: controlcenter-tls

  # FCB trust bundle for outbound HTTPS (brokers/SR/Connect/MDS/Okta-OIDC).
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  # Top-level UI auth: ControlCenter CRD enum is [basic|ldap|mtls] (no oauth).
  # mtls+requested is the documented workaround for OIDC -- actual user auth
  # flows through dependencies.mds.ssoProtocol=oidc below.
  authentication:
    type: mtls
    mtls:
      sslClientAuthentication: requested

  # RBAC enforcement on the C3 REST API. superUsers omitted so all access
  # flows through ConfluentRolebindings (matches SR/Connect/KafkaRest).
  authorization:
    type: rbac

  pdb:
    enabled: true
    maxUnavailable: 1

  dependencies:
    # C3's own Kafka clients (streams, monitoring interceptor) hit the INTERNAL
    # listener via OAUTHBEARER using oauth-controlcenter (client_id
    # 0oa1ov6h5mwmQTCKI358 per VM). Flat shape per live-CRD (runbook A22).
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9071
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-controlcenter
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahDev_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls

    # SR REST API dep. Nested oauth+configuration shape for HTTP deps (runbook A22).
    schemaRegistry:
      url: https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      tls:
        enabled: true
        secretRef: schemaregistry-tls
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            groupsClaimName: dahDev_groups
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Dev)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000

    connect:
      - name: connect-cluster
        url: https://connect.dah-flink-dev.svc.cluster.local:8083
        tls:
          enabled: true
          secretRef: connect-tls
        authentication:
          type: oauth
          oauth:
            secretRef: oauth-controlcenter
            configuration:
              audience: "Confluent,account,api://default"
              expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
              groupsClaimName: dahDev_groups
              subClaimName: sub
              jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
              tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
              scope: 11547.DAH(Dev)
              loginConnectTimeoutMs: 10000
              loginReadTimeoutMs: 30000
              loginRetryBackoffMaxMs: 5000
              loginRetryBackoffMs: 60000

    # OIDC SSO for the C3 UI is delivered through MDS -- users hit C3, get
    # redirected to MDS (which fronts Okta), authenticate, come back with an
    # MDS-issued bearer. CFK equivalent of VM's confluent.controlcenter.auth.sso.mode=oidc.
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      ssoProtocol: oidc
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-controlcenter
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            groupsClaimName: dahDev_groups
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Dev)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000

    kafkaRestClassRef:
      name: default
      namespace: dah-flink-dev

  # Next-gen Prometheus + AlertManager bundle deferred -- needs spec.services.{prometheus,alertmanager} blocks. c3-prometheus-basic-auth + c3-alertmanager-basic-auth Secrets exist so re-enable is CR-only.

  configOverrides:
    # JVM default truststore -> fcb-trust-bundle.
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      # C3-native settings retained from Phase 1.
      - confluent.controlcenter.data.dir=/var/lib/confluent/control-center
      - confluent.controlcenter.streams.num.stream.threads=12
      - confluent.controlcenter.command.topic.replication=3
      - confluent.controlcenter.internal.topics.replication=3
      - confluent.controlcenter.metrics.topic.replication=3
      - confluent.controlcenter.monitoring.interceptor.topic.replication=3
      - confluent.controlcenter.cmf.healthcheck.interval.sec=600000

      # C3 streams client -- VM property file lines 34-41. CFK does not
      # auto-derive these from dependencies.kafka.authentication for the
      # confluent.controlcenter.streams.* prefix (same pattern as broker's
      # confluent.license.* / confluent.kafkarest.* overrides). jaas.config
      # itself is omitted so operator can inject from oauth-controlcenter.
      - confluent.controlcenter.streams.security.protocol=SASL_SSL
      - confluent.controlcenter.streams.sasl.mechanism=OAUTHBEARER
      - confluent.controlcenter.streams.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.controlcenter.streams.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.controlcenter.streams.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.controlcenter.streams.sasl.oauthbearer.scope=11547.DAH(Dev)

      # Monitoring interceptor client -- VM property file lines 51-58.
      - confluent.monitoring.interceptor.security.protocol=SASL_SSL
      - confluent.monitoring.interceptor.sasl.mechanism=OAUTHBEARER
      - confluent.monitoring.interceptor.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.monitoring.interceptor.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.monitoring.interceptor.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.monitoring.interceptor.sasl.oauthbearer.scope=11547.DAH(Dev)

  podTemplate:
    serviceAccountName: flink-operator
    # Dev-smoke sizing (runbook F2). VM/UAT target is 12/16 when quota permits.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # OpenShift restricted-v2 SCC assigns the UID range.
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: controlcenter
      app.kubernetes.io/instance: controlcenter
      app.kubernetes.io/component: control-center
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
