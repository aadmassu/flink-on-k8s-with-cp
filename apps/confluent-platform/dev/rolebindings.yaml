---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-30 (created), 2026-07-01 (last-modified)
# Description: Phase 2 RBAC grants — one ConfluentRolebinding per
#              (component, resource) pair. Principals are Okta OAuth
#              CLIENT IDs (sub claim), not friendly names. Client IDs
#              sourced from the VM-side property files at
#              apps/confluent-platform/cp-confluent/dev/*.properties.
#              Applied AFTER Kafka cluster-ready in the pipeline
#              (runbook A22).
#
# Client ID map (matches oauth-<component> Secrets the pipeline creates):
#   Kafka broker  (oauth-broker):         0oa1owhtq2olDZWwf358  (super-user, no rolebinding needed)
#   Schema Registry (oauth-schemaregistry): 0oa1owiage2MyoHdt358
#   Connect       (oauth-connect):        0oa1owi0yntGMBvPS358
#   Kafka REST    (oauth-kafkarest):      0oa1owi3wkxJS3b3b358
#   Control Center (oauth-controlcenter):  <TBD — populate when C3 comes online>
########################################################################

# -- Schema Registry (0oa1owiage2MyoHdt358) --------------------------------

apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: schemaregistry-resourceowner-schemas
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  principal:
    type: user
    name: "0oa1owiage2MyoHdt358"
  role: ResourceOwner
  resourcePatterns:
    - resourceType: Topic
      name: _schemas
      patternType: LITERAL
  kafkaRestClassRef:
    name: default
    namespace: dah-flink-dev
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: schemaregistry-resourceowner-group
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/component: schema-registry
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  principal:
    type: user
    name: "0oa1owiage2MyoHdt358"
  role: ResourceOwner
  resourcePatterns:
    # schema.registry.group.id = schema-registry (per schemaregistry.yaml configOverrides.server).
    - resourceType: Group
      name: schema-registry
      patternType: LITERAL
  kafkaRestClassRef:
    name: default
    namespace: dah-flink-dev
---

# -- Kafka Connect (0oa1owi0yntGMBvPS358) ----------------------------------

apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: connect-resourceowner-config-topic
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  principal:
    type: user
    name: "0oa1owi0yntGMBvPS358"
  role: ResourceOwner
  resourcePatterns:
    - resourceType: Topic
      name: connect-cluster-configs
      patternType: LITERAL
    - resourceType: Topic
      name: connect-cluster-offsets
      patternType: LITERAL
    - resourceType: Topic
      name: connect-cluster-status
      patternType: LITERAL
  kafkaRestClassRef:
    name: default
    namespace: dah-flink-dev
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: connect-resourceowner-group
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  principal:
    type: user
    name: "0oa1owi0yntGMBvPS358"
  role: ResourceOwner
  resourcePatterns:
    # Connect's group.id = connect-cluster (per connect.yaml configOverrides.server).
    - resourceType: Group
      name: connect-cluster
      patternType: LITERAL
  kafkaRestClassRef:
    name: default
    namespace: dah-flink-dev
---

# -- Kafka REST Proxy (0oa1owi3wkxJS3b3b358) -------------------------------
# SystemAdmin at cluster scope for Phase 2 first pass — KafkaRest acts as a
# generic proxy; per-topic tightening after we know which topics REST clients
# actually exercise.

apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: kafkarest-systemadmin
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: kafkarest
    app.kubernetes.io/component: kafka-rest-proxy
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  principal:
    type: user
    name: "0oa1owi3wkxJS3b3b358"
  role: SystemAdmin
  kafkaRestClassRef:
    name: default
    namespace: dah-flink-dev
---

# -- Human super-admin via Okta SSO (email principal) ----------------------
# MDS SSO uses email as the sub claim (see spec.services.mds.provider.sso in
# kafka.yaml). Add per-user SystemAdmin grants for the humans who need to
# manage RBAC in C3 / kafka-rest CLI. Add more entries as team members onboard.

apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: aadmassu-sys-admin
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/component: rbac-user
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  principal:
    type: user
    name: aadmassu@psyncopate.com
  role: SystemAdmin
  kafkaRestClassRef:
    name: default
    namespace: dah-flink-dev
