---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-07-01 (last-modified)
# Description: CFK Kafka CR — Phase 2. OAUTHBEARER on all listeners (Okta
#              at myapps.firstcitizens.com), MDS with SSO for C3 browser
#              login, RBAC via ConfluentRolebinding CRs. Pattern adapted
#              from Psyncopate-Technologies/openshift-cfk-gitops dev
#              cluster (proven working) using FCB Okta client IDs and
#              FCB OpenShift conventions (runbook A22).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-07-01-brokers-pvc-15gi"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dataVolumeCapacity: 15Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  license:
    secretRef: cfk-license

  tls:
    secretRef: kafka-tls

  # fcb-trust-bundle provides the JVM-wide outbound trust store (Okta certs
  # chain through DigiCert / Entrust which are in the bundle). Runbook A21.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  # RBAC principals are OAuth client IDs (subClaimName=sub), NOT friendly names.
  # 0oa1owhtq2olDZWwf358 = broker's own OAuth client (oauth-broker Secret) — matches
  # the VM broker's super.users entry. Every other component gets access via
  # ConfluentRolebinding CRs in rolebindings.yaml.
  authorization:
    type: rbac
    superUsers:
      - User:0oa1owhtq2olDZWwf358

  # All listeners speak OAUTHBEARER against Okta. No PLAIN. MDS validates the
  # Okta-issued JWT via the jwks endpoint and enforces RBAC based on the sub
  # claim + rolebindings. Same Okta config on internal + external + kraftcontroller.
  listeners:
    internal:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahDev_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
          # Timeout tuning — Okta calls from inside the cluster can be slow (JWKS cache miss, TLS handshake). Defaults are too aggressive.
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls
    external:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahDev_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls

  # MDS provider: OAuth for API access + OIDC for C3 browser SSO. oauth-mds-rest
  # holds MDS's own OAuth client credentials (server-side token exchange with Okta);
  # oauth-mds-sso holds the OIDC client used by MDS for the browser login flow
  # (email = sub claim for identifying human users, dahDev_groups for group RBAC).
  services:
    mds:
      # MDS server-side authentication mode. Per Ayu's Confluent-provided example (2026-07-01) this is required; Psyncopate omitted it. Belt-and-suspenders.
      authentication:
        type: bearer
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      provider:
        oauth:
          # tls sub-block with ignoreTrustStoreConfig=true tells the OAuth validator to use JVM defaults for verifying Okta HTTPS instead of the component TLS truststore -- simpler and matches the Confluent example pattern.
          tls:
            enabled: true
            secretRef: kafka-tls
            ignoreTrustStoreConfig: true
          configurations:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            groupsClaimName: dahDev_groups
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Dev)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000
        sso:
          clientCredentials:
            secretRef: oauth-mds-sso
          configurations:
            issuer: https://myapps.firstcitizens.com/oauth2/default
            audience: "Confluent,account,api://default"
            authorizeBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/authorize
            tokenBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            groupsClaimName: dahDev_groups
            subClaimName: email
            groupsClaimScope: openid profile email
            refreshToken: true
      # impersonation.admins are the principals MDS lets act on behalf of other users. The CFK operator uses this list when applying ConfluentRolebinding CRs -- without it, rolebinding apply fails with authorization errors even when the operator's token is valid. Client IDs sourced from the VM-side apps/confluent-platform/cp-confluent/dev/*.properties files.
      impersonation:
        admins:
          - User:0oa1owhtq2olDZWwf358   # broker / kafka-rest embedded client (also in super.users)
          - User:0oa1owiage2MyoHdt358   # Schema Registry
          - User:0oa1owi0yntGMBvPS358   # Connect
          - User:0oa1owi3wkxJS3b3b358   # Kafka REST Proxy
          - User:0oa1ov6h5mwmQTCKI358   # Control Center (needs impersonation for OIDC user actions)

  # Broker's own kafka.raft controller connection uses OAUTHBEARER too (matches
  # spec.listeners on the controller side — see kraftcontroller.yaml).
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: oauth
          jaasConfig:
            secretRef: oauth-broker
          oauthSettings:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            groupsClaimName: dahDev_groups
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Dev)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000
        tls:
          enabled: true
          secretRef: kafka-tls
    # spec.dependencies.kafkaRest tells the operator how to authenticate when it hits the broker's embedded kafkaRest at :8090 for RBAC/rolebinding reconciliation. FCB operator (CFK 3.2.x) demands this block when spec.services.mds is set. Auth shape here uses the SAME flat form as spec.listeners.*.authentication above (type=oauth + jaasConfig.secretRef + oauthSettings) per Ayu's correction against the live CRD — the vendored 3.1.x CRD in this repo suggested a nested oauth+oauth.{secretRef,configuration} form which is NOT what the deployed 3.2.x operator accepts here (runbook A22).
    kafkaRest:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahDev_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls

  # First-class metricReporter (matches the Psyncopate pattern, NOT a manual
  # configOverrides block). The broker's ConfluentMetricsReporter dials the
  # internal listener at :9071 with OAUTHBEARER using the broker's own credentials.
  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9071
    tls:
      enabled: true
      secretRef: kafka-tls
    authentication:
      type: oauth
      jaasConfig:
        secretRef: oauth-broker
      oauthSettings:
        audience: "Confluent,account,api://default"
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        groupsClaimName: dahDev_groups
        subClaimName: sub
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
        scope: 11547.DAH(Dev)
        loginConnectTimeoutMs: 10000
        loginReadTimeoutMs: 30000
        loginRetryBackoffMaxMs: 5000
        loginRetryBackoffMs: 60000

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      # Inter-broker OAUTHBEARER JAAS override -- uses MDS-signed tokens (publicKeyPath=mdsPublicKey.pem) instead of Okta tokens for broker-to-broker traffic on internal + external listeners. Matches the Confluent-provided example pattern and the VM broker's listener.name.internal.oauthbearer.sasl.jaas.config setup (VM uses publicKeyPath=/var/ssl/private/public.pem; CFK operator mounts mds-token-keypair at /mnt/secrets/mds-token/mdsPublicKey.pem). Without these, inter-broker calls try to fetch an Okta token per hop and the cluster stalls at bootstrap.
      - listener.name.internal.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token/mdsPublicKey.pem";
      - listener.name.external.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token/mdsPublicKey.pem";

      # Broker as CLIENT: the JVM's own internal Kafka clients (used by inter-broker
      # traffic, license manager, MDS-side clients, etc.) speak OAUTHBEARER now that
      # every listener is OAUTHBEARER. These sasl.oauthbearer.* keys apply broker-
      # wide as defaults for any client without its own prefixed config.
      - security.protocol=SASL_SSL
      - sasl.mechanism=OAUTHBEARER
      - sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - sasl.oauthbearer.scope=11547.DAH(Dev)

      # License client (cp-server's licensing publishes to _confluent-command).
      - confluent.license.security.protocol=SASL_SSL
      - confluent.license.sasl.mechanism=OAUTHBEARER
      - confluent.license.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.license.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.license.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.license.sasl.oauthbearer.scope=11547.DAH(Dev)

      # Kafka REST security plugin (the broker's embedded kafkaRest at :8090).
      - confluent.kafkarest.security.protocol=SASL_SSL
      - confluent.kafkarest.sasl.mechanism=OAUTHBEARER
      - confluent.kafkarest.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.kafkarest.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.kafkarest.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.kafkarest.sasl.oauthbearer.scope=11547.DAH(Dev)

      # Broker defaults matched to Phase 1 baseline.
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      # Self-balancer stays off in dev — same call as Phase 1.
      - confluent.balancer.enable=false
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # OpenShift restricted-v2 SCC assigns the UID range — don't fight it (runbook E1).
    podSecurityContext: {}
    # Repeated because FCB Gatekeeper [required-workload-labels] inspects the Pod, not just the StatefulSet.
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      cfk-role: kafka-broker
      fcbint.net/app-id: "11547"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
