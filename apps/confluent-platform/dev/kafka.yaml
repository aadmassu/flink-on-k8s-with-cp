---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-06-30 (last-modified)
# Description: CFK Kafka CR — Phase 1 baseline (SASL_SSL/PLAIN on internal +
#              external, FIPS attested). Phase 2 layers MDS/OAuth/mTLS/telemetry.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-30-phase1-optionB-tls-fips-nested-path"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # FIPS attestation (runbook A17). Both paths set as belt-and-suspenders: top-level spec.fips is what cleared the original A17 error and is what the live CR currently has; spec.tls.fips.enabled is the path the CFK 3.2.0+ docs document (https://docs.confluent.io/operator/current/co-security-compliance.html#deploy-cp-in-the-fips-mode). If one is silent-stripped at admission the other still attests.
  fips:
    enabled: true

  replicas: 3

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dataVolumeCapacity: 10Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true

  # Internal + external SASL_SSL/PLAIN. External must be explicit or CFK auto-creates a PLAINTEXT default and trips FIPS (runbook A17).
  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
    external:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true

  tls:
    secretRef: kafka-tls
    fips:
      enabled: true

  license:
    secretRef: cfk-license

  # Two mounts matching the FCB-standard Flink ui-tls shape (runbook A19): fcb-trust-bundle for JVM-wide outbound trust, kafka-tls JKS material for the broker's own SSL identity (cert-manager-emitted via keystores.jks block on the Certificate).
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
      - name: kafka-tls-jks
        secret:
          secretName: kafka-tls
          items:
            - key: keystore.jks
              path: keystore.jks
            - key: truststore.jks
              path: truststore.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true
      - name: kafka-tls-jks
        mountPath: /var/ssl/kafka
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - super.users=User:admin
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      # ConfluentMetricsReporter wired up 1:1 with the VM brokers (apps/confluent-platform/cp-confluent/dev/d11547varc-*-server.properties), pointed at our headless CFK internal listener on 9071. Empty metric.reporters= still failed the FIPS validator after three iterations (commits 3724127, 8ce409c, 502cea5) so we wire the reporter properly rather than try to disable it.
      - metric.reporters=io.confluent.telemetry.reporter.TelemetryReporter,io.confluent.metrics.reporter.ConfluentMetricsReporter
      - confluent.metrics.reporter.bootstrap.servers=kafka-0.kafka.dah-flink-dev.svc.cluster.local:9071,kafka-1.kafka.dah-flink-dev.svc.cluster.local:9071,kafka-2.kafka.dah-flink-dev.svc.cluster.local:9071
      - confluent.metrics.reporter.security.protocol=SASL_SSL
      - confluent.metrics.reporter.sasl.mechanism=PLAIN
      - confluent.metrics.reporter.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";
      - confluent.metrics.reporter.ssl.truststore.location=/var/ssl/kafka/truststore.jks
      - confluent.metrics.reporter.ssl.truststore.password=changeit
      - confluent.metrics.reporter.ssl.truststore.type=JKS
      - confluent.metrics.reporter.ssl.keystore.location=/var/ssl/kafka/keystore.jks
      - confluent.metrics.reporter.ssl.keystore.password=changeit
      - confluent.metrics.reporter.ssl.keystore.type=JKS
      # ssl.key.password = password for the private key INSIDE the keystore (distinct from the keystore password). cert-manager's keystores.jks emits them under the same password by default. Confluent's recommended listing names this key alongside the keystore triple.
      - confluent.metrics.reporter.ssl.key.password=changeit
      - confluent.metrics.reporter.topic.replicas=3
      - confluent.support.metrics.enable=false
      # Other telemetry-shaped clients still off for Phase 1 (security event logger, consumer lag emitter, Self-Balancer); if the validator gates on any of their *.ssl.* keys we extend the same six-key block per offending client (runbook A19).
      - confluent.security.event.logger.enable=false
      - confluent.consumer.lag.emitter.enabled=false
      - confluent.balancer.enable=false
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kafka-broker
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
