---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-06-30 (last-modified)
# Description: CFK Kafka CR — Phase 1 baseline (SASL_SSL/PLAIN on internal +
#              external, FIPS attested). Phase 2 layers MDS/OAuth/mTLS/telemetry.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-30-phase2-services-mds-authentication-bearer"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # FIPS attestation removed (no top-level spec.fips, no spec.tls.fips). Rick disabled operator-side fipsmode=true for dev (helm upgrade 2026-06-30), but the post-rollout install showed spec.tls.fips.enabled on the CR ALONE re-triggers the FIPS-strict validator regardless of the operator-side flag (runbook A20). Phase 1 dev runs with neither toggle; stg/prd will turn both back on once the BCFKS conversion pipeline lands.

  replicas: 3

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dataVolumeCapacity: 10Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true
    # When spec.services.mds is set the operator demands spec.dependencies.kafkaRest.authentication be configured -- it uses the broker's embedded kafkaRest endpoint at :8090 for RBAC operations (creating ConfluentRolebindings, etc.). oauthSettings here uses FLAT fields (the dependency-side shape); spec.services.mds.provider.oauth.configurations uses the nested shape (runbook A22).
    kafkaRest:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      authentication:
        type: oauthbearer
        oauthbearer:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          scope: 11547.DAH(Dev)
          subClaimName: sub
          groupsClaimName: dahDev_groups
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      # Operator requires an explicit truststore source (secretRef OR directoryPathInContainer) here when the dependency is OAuth -- enabled:true alone isn't sufficient. Reusing kafka-tls since the kafkaRest endpoint is served by the broker itself (same cert chain).
      tls:
        enabled: true
        secretRef: kafka-tls

  # Internal + external SASL_SSL/PLAIN. External must be explicit or CFK auto-creates a PLAINTEXT default and trips FIPS (runbook A17).
  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
    external:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true

  tls:
    secretRef: kafka-tls

  # Phase 2: MDS service on the broker, Okta-backed OIDC provider. Authorizer (ConfluentServerAuthorizer) gets activated via spec.authorization below. MDS endpoint will be at https://kafka.dah-flink-dev.svc.cluster.local:8090. Memory project_cfk_v1beta1_silent_strips flags spec.services.mds as historically silent-stripped on this CFK version -- verify post-apply that the live CR retains this block.
  services:
    mds:
      # Same pattern as spec.dependencies.kafkaRest.tls -- the operator's reconcile path validates services.mds.tls separately from spec.tls and demands an explicit truststore source (secretRef OR directoryPathInContainer). enabled:true alone returns ApplyFailed: tls client secretRef or directoryPathInContainer must be set in kafka spec.
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      # Missing this block was the theory from ROUND 5 in pump.txt: with only tokenKeyPair + tls + provider set, the operator rendered MDS at :8090 but NOT the TOKEN Kafka listener at :9073. The CRD requires authentication.type=bearer inside this authentication block. Adding it now to test whether the operator's TOKEN-listener render logic keys off this field being present (runbook A22).
      authentication:
        type: bearer
      provider:
        type: oauth
        # spec.services.mds.provider.oauth uses `configurations` (plural) per the Kafka CRD; SR/Connect/KafkaRest client-side oauth blocks use `configuration` (singular). The plural lives on the provider side, the singular on the consumer side.
        oauth:
          configurations:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          secretRef: oauth-mds-rest

  authorization:
    type: rbac
    superUsers:
      - User:admin

  license:
    secretRef: cfk-license

  # fcb-trust-bundle mounted as the JVM-wide outbound truststore. The broker's OWN keystore + truststore are rendered by the CFK init container from spec.tls.secretRef=kafka-tls at /mnt/sslcerts/ (runbook A21) — do NOT overlay our own keystore.jks into the Secret or the init container's password rendering and our pre-baked file get out of sync and the broker can't open its own keystore at startup.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      # super.users moved to spec.authorization.superUsers above. Per-component access goes through ConfluentRolebinding CRs (rolebindings.yaml) -- only User:admin retains super-user privilege.
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      # ConfluentMetricsReporter wired against the broker's own internal listener at 9071 (matches the VM brokers' apps/confluent-platform/cp-confluent/dev/d11547varc-*-server.properties shape). SSL truststore omitted -- the reporter inherits the JVM-wide trustStore set in jvm: above (/var/ssl/truststore/bundle.jks). No keystore needed -- listener is SASL_SSL not mTLS.
      - metric.reporters=io.confluent.telemetry.reporter.TelemetryReporter,io.confluent.metrics.reporter.ConfluentMetricsReporter
      - confluent.metrics.reporter.bootstrap.servers=kafka-0.kafka.dah-flink-dev.svc.cluster.local:9071,kafka-1.kafka.dah-flink-dev.svc.cluster.local:9071,kafka-2.kafka.dah-flink-dev.svc.cluster.local:9071
      - confluent.metrics.reporter.security.protocol=SASL_SSL
      - confluent.metrics.reporter.sasl.mechanism=PLAIN
      - confluent.metrics.reporter.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";
      - confluent.metrics.reporter.topic.replicas=3
      - confluent.support.metrics.enable=false
      # Other telemetry-shaped clients still off for Phase 1 (security event logger, consumer lag emitter, Self-Balancer); re-enable in Phase 2 with proper SASL_SSL config per client.
      - confluent.security.event.logger.enable=false
      - confluent.consumer.lag.emitter.enabled=false
      - confluent.balancer.enable=false
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kafka-broker
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
