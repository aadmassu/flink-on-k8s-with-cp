---
# CFK Kafka CR — dev (3-broker, KRaft mode). VM source:
# apps/confluent-platform/cp-confluent/dev/d11547varc-*-broker-*-server.properties.
# Interim spec: no authorizer, no MDS, no OAuth listener, no mTLS-certonly,
# no telemetry. CFK 3.2.0 v1beta1 silently strips services.mds /
# listeners.external.{auth,tls} / listeners.custom on apply -- removed
# from file so yaml matches cluster. ConfluentServerAuthorizer also
# removed because its RBAC provider always demands MDS bootstrap (broker
# fatals "You must specify confluent.metadata.bootstrap.servers"). All
# four come back once the schema-fix workstream lands the v1beta1 shape
# (memory project_cfk_v1beta1_silent_strips, runbook A15/A17, pump.txt).

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-29-revert-inert-tls-enabled"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # 3-broker for RF=3 inter-broker replication. Storage tight under the dev 100 GiB quota (tracker 2.5) — bump after Container team grants raise toward the 1.272 TB workbook target.
  replicas: 3
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0
  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet, not the CR — injectLabels is CFK's mechanism to push these onto every managed resource.
  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  # PVCs: data-kafka-{0,1,2} on Ceph RBD; deterministic PVC<->broker.id binding survives pod restarts. Dev sizing 10 Gi/broker; VM-equivalent target 1 TiB+ once storage quota raise lands. Resources go under spec.podTemplate.resources -- top-level spec.resources is pruned at admission.
  dataVolumeCapacity: 10Gi
  storageClass:
    name: ocs-storagecluster-ceph-rbd

  # KRaft mode dial-up. v1beta1 only accepts clusterRef + controllerListener under dependencies.kRaftController; sibling authentication/tls get silent-stripped (commit adfc8d4 hit this). controllerListener must mirror kraftcontroller.yaml -> spec.listeners.controller exactly.
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true

  # Interim: only `internal` declared (PLAIN+TLS). CFK auto-creates a PLAINTEXT EXTERNAL on :9092. OAuth-on-external + mTLS certonly :9094 dropped pending schema-fix workstream.
  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true

  tls:
    secretRef: kafka-tls
  license:
    secretRef: cfk-license

  # FCB trust bundle (public roots + FCB Root CA) for outbound HTTPS to Okta/MDS/etc; per-listener Kafka SSL still uses kafka-tls.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  # FCB Gatekeeper [pod-disruption-budget] rejects CFK's auto-generated PDB at maxUnavailable=0; setting 1 makes it drainable.
  pdb:
    enabled: true
    maxUnavailable: 1

  # services.mds REMOVED — silent-stripped by v1beta1 (see top-of-file). Re-add in correct shape once schema-fix workstream lands.

  # Carry-over server config (keep aligned with VM broker.properties).
  configOverrides:
    # JVM default truststore points at fcb-trust-bundle for outbound HTTPS handshakes that have no listener-level truststore. Password is trust-manager default ("changeit").
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      # ConfluentServerAuthorizer + access.rule.providers removed — class always inits RBAC regardless of providers list, broker fatals on missing confluent.metadata.bootstrap.servers (runbook A15). Re-add together once MDS is wired:
      #   - authorizer.class.name=io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
      #   - confluent.authorizer.access.rule.providers=CONFLUENT,KRAFT_ACL
      - super.users=User:admin
      # inter.broker.listener.name NOT set — CFK only wires client-side JAAS for the auto-managed `replication` listener (runbook A16).
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.metrics.reporter.topic.replicas=3
      - confluent.security.event.logger.exporter.kafka.topic.replicas=3
      - confluent.consumer.lag.emitter.enabled=true
      - confluent.balancer.enable=true
      - confluent.balancer.data.enabled=true
      - confluent.balancer.heal.uneven.load.trigger=ANY_UNEVEN_LOAD
      # Telemetry reporters dropped — FCB has no telemetry API creds (memory project_fcb_telemetry_audit_reenable_later). Re-add together:
      #   - metric.reporters=io.confluent.telemetry.reporter.TelemetryReporter,io.confluent.metrics.reporter.ConfluentMetricsReporter
      #   - confluent.telemetry.enabled=true
      #   - confluent.reporters.telemetry.auto.enable=true
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    # Sized to fit FCB 16 vCPU/32 GiB workers co-located with a KRaft controller per node. CFK 3.1.x derives -Xmx from memory.request -> ~2 GiB heap. Higher 2/4 req + 4/8 lim "real dev" target would push the 3-broker requests.cpu past namespace quota (=11) once controllers + SR + KRest + CMF + Flink jobs are counted.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Only liveness + readiness exposed by CRD; startupProbe not in schema (Gatekeeper [startup] stays at WARN level).
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # Disable operator-injected fsGroup/runAsUser=1001 so OpenShift restricted-v2 SCC picks the namespace UID range and GID 0 supplemental group — CP 8.1 images are UID-agnostic with GID-0 group-write on runtime paths.
    podSecurityContext: {}
    # Repeated here because FCB Gatekeeper [required-workload-labels] inspects the Pod resource at admission, not just the StatefulSet. cfk-role used by the anti-affinity rule below.
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
      cfk-role: kafka-broker
    # Spread brokers across nodes via cfk-role anti-affinity. Brokers and controllers carry different cfk-role values, so one of each per node is allowed.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
