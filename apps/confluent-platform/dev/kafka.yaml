---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-07-01 (last-modified)
# Description: CFK Kafka CR — Phase 2. SASL/PLAIN+TLS for the internal
#              infrastructure listener, OAuth+TLS externally, MDS/OIDC,
#              and RBAC via ConfluentRolebindings.
#              Runbook A22/A23.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-08-18-mds-oidc-client-truststore"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # FCB Gatekeeper [required-workload-labels] inspects the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  # Migration capacity: 300 Gi per broker (3 x 300 Gi = 900 Gi).
  dataVolumeCapacity: 300Gi
  storageClass:
    name: kafka

  license:
    secretRef: cfk-license

  tls:
    secretRef: kafka-tls

  # JVM-wide outbound trust store for Okta/OIDC and FCB endpoints.
  mountedVolumes:
    volumes:
      - name: oidc-trust-bundle
        configMap:
          name: c3-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: oidc-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  # Keep the infrastructure superuser narrow. Managed components receive
  # scoped access through ConfluentRolebindings and their OAuth principals.
  authorization:
    type: rbac
    superUsers:
      - User:0oa1owhtq2olDZWwf358   # DEV broker/MDS superuser
      - User:admin                   # internal SASL/PLAIN infrastructure user
      - User:cfk-operator-rbac       # CFK operator mTLS for KafkaRestClass reconciliation
      - User:kafka.dah-flink-dev.svc.cluster.local  # Kafka brokers embedded kafkaRest mTLS to MDS

  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
        secretRef: kafka-tls
    external:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahDev_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls

  # MDS: OAuth for API, OIDC for C3 browser SSO. oauth-mds-rest = server-side; oauth-mds-sso = browser login.
  services:
    mds:
      authentication:
        type: bearer
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      provider:
        oauth:
          # ignoreTrustStoreConfig routes Okta HTTPS validation through JVM defaults (runbook A22).
          tls:
            enabled: true
            secretRef: kafka-tls
            ignoreTrustStoreConfig: true
          configurations:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Dev)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000
        mtls:
          sslClientAuthentication: requested
          principalMappingRules:
            - "RULE:.*CN=cfk-operator-rbac\\.apps\\.dv\\.ocp\\.fcbint\\.net.*$/cfk-operator-rbac/"
            - "RULE:.*CN=([a-zA-Z0-9.-]*).*$/$1/"
            - "DEFAULT"
        sso:
          clientCredentials:
            secretRef: oauth-mds-sso
          configurations:
            issuer: https://myapps.firstcitizens.com/oauth2/default
            audience: "Confluent,account,api://default"
            authorizeBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/authorize
            tokenBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            groupsClaimName: dahDev_groups
            subClaimName: sub
            groupsClaimScope: 11547.DAH(Dev)
            refreshToken: true
      # Client IDs the operator may act on-behalf-of when reconciling rolebindings (runbook A23).
      impersonation:
        admins:
          - User:0oa1owhtq2olDZWwf358   # MDS OAuth superuser
          - User:0oa1owiage2MyoHdt358   # Schema Registry
          - User:0oa1owi0yntGMBvPS358   # Connect
          - User:0oa1owi3wkxJS3b3b358   # Kafka REST Proxy
          - User:0oa1ov6h5mwmQTCKI358   # Control Center
          - User:cfk-operator-rbac       # CFK operator mTLS for KafkaRestClass reconciliation
          - User:kafka.dah-flink-dev.svc.cluster.local  # Kafka brokers embedded kafkaRest mTLS to MDS

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true
          secretRef: kafka-tls
    metricsClient:
      url: https://controlcenter.dah-flink-dev.svc.cluster.local:9090
      authentication:
        type: basic
        basic:
          secretRef: c3-prom-client-basic-auth
      tls:
        enabled: true
        secretRef: controlcenter-tls
    # kafkaRest uses mTLS to authenticate to Kafka brokers + MDS (runbook A22).
    kafkaRest:
      authentication:
        type: mtls
        sslClientAuthentication: true
      tls:
        enabled: true
        secretRef: kafka-tls

  # First-class metricReporter (Psyncopate pattern, not configOverrides).
  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9071
    tls:
      enabled: true
      secretRef: kafka-tls
    authentication:
      type: plain
      jaasConfig:
        secretRef: sasl-plain-internal

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=truststorepass"
      - "-Djavax.net.ssl.trustStoreType=PKCS12"
    server:
      # MDS outbound OIDC client trust. These are distinct from
      # confluent.metadata.server.ssl.* (the inbound HTTPS listener) and from
      # the JVM default truststore. MDS uses this client-specific namespace
      # for authorization-code exchange with the IdP.
      - confluent.metadata.ssl.truststore.location=/var/ssl/truststore/bundle.jks
      - confluent.metadata.ssl.truststore.password=truststorepass
      - confluent.metadata.ssl.truststore.type=PKCS12

      # The external application listener remains OAuth. The internal listener
      # and broker/controller infrastructure path are generated by CFK from
      # sasl-plain-internal; do not override their SASL mechanism here.
      - listener.name.external.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token/mdsPublicKey.pem";

      # Broker defaults.
      - confluent.telemetry.enabled=true
      - confluent.reporters.telemetry.auto.enable=true
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.balancer.enable=true
      - confluent.balancer.data.enabled=true
      - confluent.balancer.heal.uneven.load.trigger=ANY_UNEVEN_LOAD
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1250m"
        memory: 3Gi
      limits:
        cpu: "2500m"
        memory: 6Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # OpenShift restricted-v2 SCC assigns the UID range (runbook E1).
    podSecurityContext: {}
    # Gatekeeper [required-workload-labels] inspects the Pod, not just the STS.
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      cfk-role: kafka-broker
      fcbint.net/app-id: "11547"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
