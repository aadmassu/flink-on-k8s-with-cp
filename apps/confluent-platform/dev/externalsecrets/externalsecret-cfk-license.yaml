---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-10 (created), 2026-06-10 (last-modified)
# Description: ExternalSecret — wraps the CyberArk-stored Confluent
#              license JWT into Secret `cfk-license` with the JWT in
#              Java-properties form (`license=<JWT>` under license.txt)
#              for the CFK operator's license override. Companion
#              ExternalSecret under apps/confluent-cmf/dev/ materializes
#              the same JWT in raw form for CP components + CMF.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cfk-license
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: cfk-license
    app.kubernetes.io/instance: cfk-license
    app.kubernetes.io/component: cfk-prereq
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: cfk-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cfk-license
          app.kubernetes.io/instance: cfk-license
          app.kubernetes.io/component: cfk-prereq
          app.kubernetes.io/part-of: confluent-platform
          fcbint.net/app-id: "11547"
      data:
        license.txt: "license={{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: "dev-confluent-license"
        property: "Digital Analytics Hub"
