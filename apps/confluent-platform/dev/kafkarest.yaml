---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-07-01 (last-modified)
# Description: CFK KafkaRestProxy CR — Phase 2. OAUTHBEARER end-to-end
#              (Okta), RBAC via ConfluentRolebinding CRs (runbook A22).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestProxy
metadata:
  name: kafkarest
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-07-01-phase2-oauth-listeners-full-rewrite"
  labels:
    app.kubernetes.io/name: kafkarest
    app.kubernetes.io/component: kafka-rest-proxy
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 1

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-kafka-rest:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: kafkarest
    app.kubernetes.io/instance: kafkarest
    app.kubernetes.io/component: kafka-rest-proxy
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  license:
    secretRef: cfk-license

  tls:
    secretRef: kafkarest-tls

  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  authorization:
    type: rbac

  pdb:
    enabled: true
    maxUnavailable: 1

  # dependencies: OAUTHBEARER using oauth-kafkarest (client_id 0oa1owi3wkxJS3b3b358 per VM).
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9071
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-kafkarest
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahDev_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
      tls:
        enabled: true
        secretRef: kafka-tls
    schemaRegistry:
      url: https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      tls:
        enabled: true
        secretRef: schemaregistry-tls
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-kafkarest
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            groupsClaimName: dahDev_groups
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Dev)

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server: []

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "100m"
        memory: 256Mi
      limits:
        cpu: "250m"
        memory: 512Mi
    probe:
      liveness:
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # OpenShift restricted-v2 SCC assigns the UID range.
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: kafkarest
      app.kubernetes.io/instance: kafkarest
      app.kubernetes.io/component: kafka-rest-proxy
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
