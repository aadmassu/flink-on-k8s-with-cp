---
# cert-manager Certificate for the Kafka brokers — dev.
# Issued by FCB's Keyfactor ClusterIssuer; resulting Secret (kafka-tls) is
# consumed by the Kafka CR via tls.secretRef. SANs cover both the headless
# Service per-pod DNS and the round-robin Service DNS, since brokers are
# addressed both ways internally.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-tls
    app.kubernetes.io/component: kafka-broker
    fcbint.net/app-id: "11547"
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkfkaksupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Non-Prod-DEV
    metadata.command-issuer.keyfactor.com/Description: "Kafka brokers — internal listeners and MDS"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: "11547"
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: kafka.dah-flink-dev.svc.cluster.local
  dnsNames:
    - kafka.dah-flink-dev.svc
    - kafka.dah-flink-dev.svc.cluster.local
    - kafka-0.kafka.dah-flink-dev.svc.cluster.local
    - kafka-1.kafka.dah-flink-dev.svc.cluster.local
    - kafka-2.kafka.dah-flink-dev.svc.cluster.local
    # External LoadBalancer SANs — match the kafka.yaml externalAccess block:
    #   domain: kafka.dev.dah.fcbint.net
    #   brokerPrefix: b   bootstrapPrefix: bootstrap
    # If the LB domain changes (pending Tom's confirmation 2026-05-12), update
    # both this file and kafka.yaml in lockstep.
    - bootstrap.kafka.dev.dah.fcbint.net
    - b0.kafka.dev.dah.fcbint.net
    - b1.kafka.dev.dah.fcbint.net
    - b2.kafka.dev.dah.fcbint.net
  duration: 8760h0m0s
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: kafka-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka-tls
      app.kubernetes.io/component: kafka-broker
      fcbint.net/app-id: "11547"
