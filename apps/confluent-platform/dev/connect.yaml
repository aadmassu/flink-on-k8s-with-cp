---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-06-30 (last-modified)
# Description: CFK Connect CR — Phase 2 (PLAIN/SASL_SSL to Kafka INTERNAL
#              :9071, MDS dependency on broker :8090, OAuth on Connect REST,
#              RBAC via ConfluentRolebinding CRs). Suspended at replicas: 0
#              until dev quota is raised (runbook F1).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-06-30-phase2-deps-kafka-tls-secretref"
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # SUSPENDED — revert to replicas: 2 once dev quota is raised (CFK init container ~500m floor + 2 CPU quota leaves no room).
  replicas: 0
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server-connect:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0
  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet, not the CR.
  injectLabels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
        secretRef: kafka-tls
    schemaRegistry:
      url: https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      tls:
        enabled: true
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-connect
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    # MDS dependency — Connect authenticates to MDS via Okta OAuth client_credentials and uses the RBAC token for authz against Kafka resources (runbook A22).
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-connect
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    kafkaRestClassRef:
      name: default
      namespace: dah-flink-dev

  # Okta JWT auth on Connect REST API.
  authentication:
    type: oauth
    oauth:
      secretRef: oauth-connect
      configuration:
        audience: "Confluent,account,api://default"
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        scope: 11547.DAH(Dev)
        subClaimName: sub
        groupsClaimName: dahDev_groups
        tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token

  authorization:
    type: rbac
    superUsers:
      - User:admin

  tls:
    secretRef: connect-tls
  license:
    secretRef: cfk-license

  # fcb-trust-bundle at /var/ssl/truststore — same shape as kafka.yaml (runbook A21). Connect's own keystore comes from spec.tls.secretRef via the CFK init container.
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  # FCB Gatekeeper [pod-disruption-budget] rejects CFK's auto-generated PDB at maxUnavailable=0; setting 1 makes it drainable.
  pdb:
    enabled: true
    maxUnavailable: 1

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - group.id=connect-cluster
      - config.storage.topic=connect-cluster-configs
      - offset.storage.topic=connect-cluster-offsets
      - status.storage.topic=connect-cluster-status
      - config.storage.replication.factor=3
      - offset.storage.replication.factor=3
      - status.storage.replication.factor=3
      - offset.flush.interval.ms=10000
      - connector.client.config.override.policy=All
      - plugin.path=/usr/share/java/connect_plugins
      - key.converter=io.confluent.connect.avro.AvroConverter
      - key.converter.schema.registry.url=https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      - value.converter=io.confluent.connect.avro.AvroConverter
      - value.converter.schema.registry.url=https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      - internal.key.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.value.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.key.converter.schemas.enable=false
      - internal.value.converter.schemas.enable=false

  podTemplate:
    serviceAccountName: flink-operator
    # Sized for when replicas comes off 0 — fits 2 replicas in the raised quota with margin (runbook F1).
    resources:
      requests:
        cpu: "250m"
        memory: 768Mi
      limits:
        cpu: "500m"
        memory: 1.5Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # Disable operator-injected fsGroup/runAsUser=1001 so OpenShift restricted-v2 SCC picks the namespace UID range (see kafka.yaml).
    podSecurityContext: {}
    # Repeated here because FCB Gatekeeper [required-workload-labels] inspects the Pod, not just the StatefulSet.
    labels:
      app.kubernetes.io/name: connect
      app.kubernetes.io/instance: connect
      app.kubernetes.io/component: kafka-connect
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
