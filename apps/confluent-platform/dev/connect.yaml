---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-07-01 (last-modified)
# Description: CFK Connect CR — Phase 2. OAUTHBEARER end-to-end, RBAC (runbook A22).
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: dah-flink-dev
  annotations:
    platform.confluent.io/force-reconcile: "2026-08-18-platform-trust-bundle"
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 2

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server-connect:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # Gatekeeper [required-workload-labels] inspects the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  license:
    secretRef: cfk-license

  # Like-for-like with the Ansible reference: Connect REST is TLS-enabled.
  tls:
    secretRef: connect-tls

  mountedVolumes:
    volumes:
      - name: oidc-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.p12
              path: bundle.p12
    volumeMounts:
      - name: oidc-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  authorization:
    type: rbac

  pdb:
    enabled: true
    maxUnavailable: 1

  # Dep-to-Kafka: flat oauth+jaasConfig. Dep-to-SR/MDS: nested oauth+configuration (runbook A22).
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-connect
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Dev)
      tls:
        enabled: true
        secretRef: kafka-tls
    schemaRegistry:
      url: https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      tls:
        enabled: true
        secretRef: schemaregistry-tls
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-connect
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Dev)
    kafkaRestClassRef:
      name: default
      namespace: dah-flink-dev

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.p12"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=PKCS12"
    server:
      # Explicit trustStore for the Kafka-common HttpJwtRetriever / metadata client Okta HTTPS calls -- JVM -Djavax.net.ssl.trustStore doesn't propagate here (runbook A28).
      - confluent.metadata.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - confluent.metadata.ssl.truststore.password=changeit
      - confluent.metadata.ssl.truststore.type=PKCS12

      - group.id=connect-cluster
      - config.storage.topic=connect-cluster-configs
      - offset.storage.topic=connect-cluster-offsets
      - status.storage.topic=connect-cluster-status
      - config.storage.replication.factor=3
      - offset.storage.replication.factor=3
      - status.storage.replication.factor=3
      - offset.flush.interval.ms=10000
      - connector.client.config.override.policy=All
      - plugin.path=/usr/share/java/connect_plugins
      - key.converter=io.confluent.connect.avro.AvroConverter
      - key.converter.schema.registry.url=https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      - value.converter=io.confluent.connect.avro.AvroConverter
      - value.converter.schema.registry.url=https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      - internal.key.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.value.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.key.converter.schemas.enable=false
      - internal.value.converter.schemas.enable=false

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "250m"
        memory: 1Gi
      limits:
        cpu: "500m"
        memory: 2Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # OpenShift restricted-v2 SCC assigns the UID range (runbook E1).
    podSecurityContext: {}
    labels:
      app.kubernetes.io/name: connect
      app.kubernetes.io/instance: connect
      app.kubernetes.io/component: kafka-connect
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
