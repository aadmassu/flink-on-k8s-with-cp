---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-06-29 (last-modified)
# Description: CFK Connect CR — dev. Currently suspended (replicas: 0;
#              dev quota fits four CFK pods, Connect is the lowest-value
#              for smoke-testing). Production-target spec retained;
#              OAuth+MDS+RBAC will need the same v1beta1-shape rework as
#              kafka.yaml/schemaregistry.yaml before this can be brought
#              online. Runbook A15/A17.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  # SUSPENDED — revert to replicas: 2 once dev quota is raised (CFK init container ~500m floor + 2 CPU quota leaves no room).
  replicas: 0
  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server-connect:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0
  # FCB Gatekeeper [required-workload-labels] checks the StatefulSet, not the CR.
  injectLabels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  # Resources under spec.podTemplate.resources — top-level spec.resources is pruned at admission.

  dependencies:
    # SASL OAUTHBEARER to brokers (CRD shape: oauthbearer + oauthSettings).
    kafka:
      bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
      authentication:
        type: oauthbearer
        oauthbearer:
          secretRef: oauth-connect
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          scope: 11547.DAH(Dev)
          subClaimName: sub
          groupsClaimName: dahDev_groups
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      tls:
        enabled: true
    # Outbound HTTPS+OAuth to Schema Registry (oauth.{secretRef, configuration}).
    schemaRegistry:
      url: https://schemaregistry.dah-flink-dev.svc.cluster.local:8081
      tls:
        enabled: true
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-connect
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    # OAuth client_credentials grant → MDS bearer token.
    mds:
      endpoint: https://kafka.dah-flink-dev.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token-keypair
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-connect
          configuration:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
    kafkaRestClassRef:
      name: default
      namespace: dah-flink-dev
    # Monitoring interceptor auth follows the kafka-dependency pattern.
    interceptor:
      enabled: true
      consumer:
        bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
        authentication:
          type: oauthbearer
          oauthbearer:
            secretRef: oauth-connect
          oauthSettings:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
      producer:
        bootstrapEndpoint: kafka.dah-flink-dev.svc.cluster.local:9092
        authentication:
          type: oauthbearer
          oauthbearer:
            secretRef: oauth-connect
          oauthSettings:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            scope: 11547.DAH(Dev)
            subClaimName: sub
            groupsClaimName: dahDev_groups
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token

  # OAuth on Connect REST API. Flat fields under authentication.* are rejected with "oauthForRest: missing authentication.oauth struct".
  authentication:
    type: oauth
    oauth:
      secretRef: oauth-connect
      configuration:
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        audience: "Confluent,account,api://default"
        subClaimName: sub
        groupsClaimName: dahDev_groups
        tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
        scope: 11547.DAH(Dev)

  authorization:
    type: rbac
    superUsers:
      - User:admin

  tls:
    secretRef: connect-tls
  license:
    secretRef: cfk-license

  # FCB trust bundle for outbound HTTPS (Okta/SR/MDS + downstream connectors).
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /mnt/sslcerts/fcb-trust-bundle
        readOnly: true

  # FCB Gatekeeper [pod-disruption-budget] rejects CFK's auto-generated PDB at maxUnavailable=0; setting 1 makes it drainable.
  pdb:
    enabled: true
    maxUnavailable: 1

  configOverrides:
    # JVM default truststore -> fcb-trust-bundle (see kafka.yaml).
    jvm:
      - "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      - group.id=connect-cluster
      - config.storage.topic=connect-cluster-configs
      - offset.storage.topic=connect-cluster-offsets
      - status.storage.topic=connect-cluster-status
      - config.storage.replication.factor=3
      - offset.storage.replication.factor=3
      - status.storage.replication.factor=3
      - offset.flush.interval.ms=10000
      - connector.client.config.override.policy=All
      - plugin.path=/usr/share/java/connect_plugins
      - key.converter=io.confluent.connect.avro.AvroConverter
      - value.converter=io.confluent.connect.avro.AvroConverter
      - internal.key.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.value.converter=org.apache.kafka.connect.json.JsonConverter
      - internal.key.converter.schemas.enable=false
      - internal.value.converter.schemas.enable=false
      - rest.extension.classes=io.confluent.connect.security.ConnectSecurityExtension,io.confluent.connect.secretregistry.ConnectSecretRegistryExtension
      - config.providers=secret
      - config.providers.secret.class=io.confluent.connect.secretregistry.rbac.config.provider.InternalSecretConfigProvider
      - config.providers.secret.param.kafkastore.topic=_confluent-secrets
      - config.providers.secret.param.kafkastore.topic.replication.factor=3
      - confluent.monitoring.interceptor.topic=_confluent-monitoring
      - producer.interceptor.classes=io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor
      - consumer.interceptor.classes=io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor

  podTemplate:
    serviceAccountName: flink-operator
    # Sized for when replicas comes off 0 — fits 2 replicas in the raised quota with margin (runbook F1).
    resources:
      requests:
        cpu: "250m"
        memory: 768Mi
      limits:
        cpu: "500m"
        memory: 1.5Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # Disable operator-injected fsGroup/runAsUser=1001 so OpenShift restricted-v2 SCC picks the namespace UID range (see kafka.yaml).
    podSecurityContext: {}
    # Repeated here because FCB Gatekeeper [required-workload-labels] inspects the Pod, not just the StatefulSet.
    labels:
      app.kubernetes.io/name: connect
      app.kubernetes.io/instance: connect
      app.kubernetes.io/component: kafka-connect
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: "11547"
