---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-07-01 (last-modified)
# Description: CFK Kafka CR — Phase 2. SASL/PLAIN+TLS for the internal
#              infrastructure listener, OAuth+TLS externally, MDS/OIDC,
#              and RBAC via ConfluentRolebindings.
#              Runbook A22/A23.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-prod
  annotations:
    platform.confluent.io/force-reconcile: "2026-08-18-platform-trust-bundle"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # FCB Gatekeeper [required-workload-labels] inspects the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  # Migration capacity: 300 Gi per broker (3 x 300 Gi = 900 Gi).
  dataVolumeCapacity: 300Gi
  storageClass:
    name: kafka

  license:
    secretRef: cfk-license

  tls:
    secretRef: kafka-tls

  pdb:
    enabled: true
    maxUnavailable: 1

  # Keep the infrastructure superuser narrow. Managed components receive
  # scoped access through ConfluentRolebindings and their OAuth principals.
  authorization:
    type: rbac
    superUsers:
      - User:__ENV_OAUTH_BROKER_CLIENT_ID__   # broker/MDS superuser
      - User:admin                   # internal SASL/PLAIN infrastructure user
      - User:cfk-operator-rbac       # CFK operator mTLS for KafkaRestClass reconciliation
      - User:kafka.dah-flink-prod.svc.cluster.local  # Kafka brokers embedded kafkaRest mTLS to MDS

  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: sasl-plain-internal
      tls:
        enabled: true
        secretRef: kafka-tls
    external:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahPD_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(PD)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls
    # certonly mirrors the VM CERTONLY:9094 listener for mTLS-only clients.
    # Not externally exposed yet — tracker 2.10 custom-TCP-port exception pending.
    custom:
      - name: certonly
        port: 9094
        authentication:
          type: mtls
          mtls:
            sslClientAuthentication: required
            principalMappingRules:
              - "RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L"
              - "DEFAULT"
        tls:
          enabled: true
          secretRef: kafka-tls

  # MDS: OAuth for API, OIDC for C3 browser SSO. oauth-mds-rest = server-side; oauth-mds-sso = browser login.
  services:
    mds:
      authentication:
        type: bearer
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      provider:
        oauth:
          tls:
            enabled: true
            ignoreTrustStoreConfig: false
          configurations:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(PD)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000
        mtls:
          sslClientAuthentication: requested
          principalMappingRules:
            - "RULE:.*CN=cfk-operator-rbac\\.apps\\.pd\\.ocp\\.fcbint\\.net.*$/cfk-operator-rbac/"
            - "RULE:.*CN=([a-zA-Z0-9.-]*).*$/$1/"
            - "DEFAULT"
        sso:
          clientCredentials:
            secretRef: oauth-mds-sso
          configurations:
            issuer: https://myapps.firstcitizens.com/oauth2/default
            audience: "Confluent,account,api://default"
            authorizeBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/authorize
            tokenBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            groupsClaimName: dahPD_groups
            subClaimName: sub
            groupsClaimScope: 11547.DAH(PD)
            refreshToken: true
      # Client IDs the operator may act on-behalf-of when reconciling rolebindings (runbook A23).
      impersonation:
        admins:
          - User:__ENV_OAUTH_BROKER_CLIENT_ID__   # MDS OAuth superuser
          - User:__ENV_OAUTH_SR_CLIENT_ID__   # Schema Registry
          - User:__ENV_OAUTH_CONNECT_CLIENT_ID__   # Connect
          - User:__ENV_OAUTH_REST_CLIENT_ID__   # Kafka REST Proxy
          - User:__ENV_OAUTH_C3_CLIENT_ID__   # Control Center
          - User:cfk-operator-rbac       # CFK operator mTLS for KafkaRestClass reconciliation
          - User:kafka.dah-flink-prod.svc.cluster.local  # Kafka brokers embedded kafkaRest mTLS to MDS

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: sasl-plain-internal
        tls:
          enabled: true
          secretRef: kafka-tls
    metricsClient:
      url: https://controlcenter.dah-flink-prod.svc.cluster.local:9090
      authentication:
        type: basic
        basic:
          secretRef: c3-prom-client-basic-auth
      tls:
        enabled: true
        secretRef: controlcenter-tls
    # kafkaRest uses mTLS to authenticate to Kafka brokers + MDS (runbook A22).
    kafkaRest:
      authentication:
        type: mtls
        sslClientAuthentication: true
      tls:
        enabled: true
        secretRef: kafka-tls

  # First-class metricReporter (Psyncopate pattern, not configOverrides).
  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.dah-flink-prod.svc.cluster.local:9071
    tls:
      enabled: true
      secretRef: kafka-tls
    authentication:
      type: plain
      jaasConfig:
        secretRef: sasl-plain-internal

  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.p12
              path: bundle.p12
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.p12"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=PKCS12"
      # Kafka 4.x OAuth clients (the cluster link runs inside the broker) refuse URLs not on this list (runbook I6).
      - "-Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=https://myapps.firstcitizens.com/oauth2/default/v1/token,https://myapps.firstcitizens.com/oauth2/default/v1/keys"
    server:
      # The external application listener remains OAuth. The internal listener
      # and broker/controller infrastructure path are generated by CFK from
      # sasl-plain-internal; do not override their SASL mechanism here.
      - listener.name.external.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token-keypair/mdsPublicKey.pem" ssl.truststore.location="/var/ssl/truststore/bundle.p12" ssl.truststore.password="changeit" ssl.truststore.type="PKCS12";

      # Validates BOTH Okta JWTs (via JWKS) and MDS-issued tokens (via publicKeyPath
      # above). Without it C3 human SSO sessions are rejected — runbook A33.
      - listener.name.external.oauthbearer.sasl.server.callback.handler.class=io.confluent.kafka.server.plugins.auth.token.CompositeBearerValidatorCallbackHandler

      # TOKEN listener OAuth bearer validator truststore (for JWKS endpoint validation during startup)
      - listener.name.token.oauthbearer.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - listener.name.token.oauthbearer.ssl.truststore.password=changeit
      - listener.name.token.oauthbearer.ssl.truststore.type=PKCS12

      # MDS client truststore for OAuth/OIDC validation (using platform-managed fcb-trust-bundle)
      - confluent.metadata.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - confluent.metadata.ssl.truststore.password=changeit
      - confluent.metadata.ssl.truststore.type=PKCS12

      # MDS server-side truststore used for OIDC/JWKS validation and incoming CFK operator mTLS client-certificate validation.
      - confluent.metadata.server.ssl.truststore.location=/var/ssl/truststore/bundle.p12
      - confluent.metadata.server.ssl.truststore.password=changeit
      - confluent.metadata.server.ssl.truststore.type=PKCS12
      - confluent.metadata.server.oauthbearer.groups.claim.name=dahPD_groups

      # Broker defaults.
      - confluent.telemetry.enabled=true
      - confluent.reporters.telemetry.auto.enable=true
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.balancer.enable=true
      - confluent.balancer.data.enabled=true
      - confluent.balancer.heal.uneven.load.trigger=ANY_UNEVEN_LOAD
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1000m"
        memory: 3Gi
      limits:
        cpu: "2000m"
        memory: 6Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # OpenShift restricted-v2 SCC assigns the UID range (runbook E1).
    podSecurityContext: {}
    # Gatekeeper [required-workload-labels] inspects the Pod, not just the STS.
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      cfk-role: kafka-broker
      fcbint.net/app-id: "11547"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
