---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-04-01 (created), 2026-07-01 (last-modified)
# Description: CFK Kafka CR — Phase 2. OAUTHBEARER on all listeners
#              against FCB Okta, MDS+OIDC SSO, RBAC via ConfluentRolebindings.
#              Runbook A22/A23.
########################################################################

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: dah-flink-dr
  annotations:
    platform.confluent.io/force-reconcile: "2026-07-01-brokers-all-components-superusers-workaround"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
spec:
  replicas: 3

  image:
    application: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/cp-server:8.1.3
    init: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc/confluent-init-container:3.2.0

  # FCB Gatekeeper [required-workload-labels] inspects the StatefulSet.
  injectLabels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka
    app.kubernetes.io/component: kafka-broker
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"

  dataVolumeCapacity: 15Gi
  storageClass:
    name: kafka

  license:
    secretRef: cfk-license

  tls:
    secretRef: kafka-tls

  # JVM-wide outbound trust store — Okta certs chain through this bundle (runbook A21).
  mountedVolumes:
    volumes:
      - name: fcb-trust-bundle
        configMap:
          name: fcb-trust-bundle
          items:
            - key: bundle.jks
              path: bundle.jks
    volumeMounts:
      - name: fcb-trust-bundle
        mountPath: /var/ssl/truststore
        readOnly: true

  pdb:
    enabled: true
    maxUnavailable: 1

  # superUsers: broker's own Okta client + all four component principals (SR, Connect, KafkaRest, C3) as a WORKAROUND while :8090/kafka/v3 discovery is broken and new rolebinding push fails (runbook A27). Revert to just the broker once discovery is fixed and rolebindings propagate reliably.
  authorization:
    type: rbac
    superUsers:
      - User:0oa1owhtq2olDZWwf358   # broker (oauth-broker)
      - User:0oa1owiage2MyoHdt358   # Schema Registry
      - User:0oa1owi0yntGMBvPS358   # Connect
      - User:0oa1owi3wkxJS3b3b358   # Kafka REST Proxy
      - User:0oa1ov6h5mwmQTCKI358   # Control Center

  listeners:
    internal:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahProd_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Prod)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls
    external:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahProd_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Prod)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls

  # MDS: OAuth for API, OIDC for C3 browser SSO. oauth-mds-rest = server-side; oauth-mds-sso = browser login.
  services:
    mds:
      authentication:
        type: bearer
      tls:
        enabled: true
        secretRef: kafka-tls
      tokenKeyPair:
        secretRef: mds-token-keypair
      provider:
        oauth:
          # ignoreTrustStoreConfig routes Okta HTTPS validation through JVM defaults (runbook A22).
          tls:
            enabled: true
            secretRef: kafka-tls
            ignoreTrustStoreConfig: true
          configurations:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            groupsClaimName: dahProd_groups
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Prod)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000
        sso:
          clientCredentials:
            secretRef: oauth-mds-sso
          configurations:
            issuer: https://myapps.firstcitizens.com/oauth2/default
            audience: "Confluent,account,api://default"
            authorizeBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/authorize
            tokenBaseEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            groupsClaimName: dahProd_groups
            subClaimName: email
            groupsClaimScope: openid profile email
            refreshToken: true
      # Client IDs the operator may act on-behalf-of when reconciling rolebindings (runbook A23).
      impersonation:
        admins:
          - User:0oa1owhtq2olDZWwf358   # broker / kafka-rest embedded
          - User:0oa1owiage2MyoHdt358   # Schema Registry
          - User:0oa1owi0yntGMBvPS358   # Connect
          - User:0oa1owi3wkxJS3b3b358   # Kafka REST Proxy
          - User:0oa1ov6h5mwmQTCKI358   # Control Center

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: oauth
          jaasConfig:
            secretRef: oauth-broker
          oauthSettings:
            audience: "Confluent,account,api://default"
            expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
            groupsClaimName: dahProd_groups
            subClaimName: sub
            jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
            tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
            scope: 11547.DAH(Prod)
            loginConnectTimeoutMs: 10000
            loginReadTimeoutMs: 30000
            loginRetryBackoffMaxMs: 5000
            loginRetryBackoffMs: 60000
        tls:
          enabled: true
          secretRef: kafka-tls
    # kafkaRest auth shape uses live-CRD flat form (type=oauth + jaasConfig + oauthSettings), NOT the vendored 3.1.x nested shape (runbook A22).
    kafkaRest:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-broker
        oauthSettings:
          audience: "Confluent,account,api://default"
          expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
          groupsClaimName: dahProd_groups
          subClaimName: sub
          jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
          tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
          scope: 11547.DAH(Prod)
          loginConnectTimeoutMs: 10000
          loginReadTimeoutMs: 30000
          loginRetryBackoffMaxMs: 5000
          loginRetryBackoffMs: 60000
      tls:
        enabled: true
        secretRef: kafka-tls

  # First-class metricReporter (Psyncopate pattern, not configOverrides).
  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.dah-flink-dr.svc.cluster.local:9071
    tls:
      enabled: true
      secretRef: kafka-tls
    authentication:
      type: oauth
      jaasConfig:
        secretRef: oauth-broker
      oauthSettings:
        audience: "Confluent,account,api://default"
        expectedIssuer: https://myapps.firstcitizens.com/oauth2/default
        groupsClaimName: dahProd_groups
        subClaimName: sub
        jwksEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/keys
        tokenEndpointUri: https://myapps.firstcitizens.com/oauth2/default/v1/token
        scope: 11547.DAH(Prod)
        loginConnectTimeoutMs: 10000
        loginReadTimeoutMs: 30000
        loginRetryBackoffMaxMs: 5000
        loginRetryBackoffMs: 60000

  configOverrides:
    jvm:
      - "-Djavax.net.ssl.trustStore=/var/ssl/truststore/bundle.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
      - "-Djavax.net.ssl.trustStoreType=JKS"
    server:
      # Inter-broker OAUTHBEARER uses MDS-signed tokens (not Okta) via publicKeyPath from mds-token-keypair Secret (runbook A23).
      - listener.name.internal.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token/mdsPublicKey.pem";
      - listener.name.external.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token/mdsPublicKey.pem";

      # Broker-as-CLIENT defaults (inter-broker + license + MDS-side clients all speak OAUTHBEARER now).
      - security.protocol=SASL_SSL
      - sasl.mechanism=OAUTHBEARER
      - sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - sasl.oauthbearer.scope=11547.DAH(Prod)

      # License client (cp-server licensing to _confluent-command).
      - confluent.license.security.protocol=SASL_SSL
      - confluent.license.sasl.mechanism=OAUTHBEARER
      - confluent.license.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.license.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.license.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.license.sasl.oauthbearer.scope=11547.DAH(Prod)

      # Embedded kafkaRest at :8090.
      - confluent.kafkarest.security.protocol=SASL_SSL
      - confluent.kafkarest.sasl.mechanism=OAUTHBEARER
      - confluent.kafkarest.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.kafkarest.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.kafkarest.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.kafkarest.sasl.oauthbearer.scope=11547.DAH(Prod)

      # ConfluentMetricsReporter client (spec.metricReporter block doesn't propagate all sub-keys into this prefix; runbook A26).
      - confluent.metrics.reporter.security.protocol=SASL_SSL
      - confluent.metrics.reporter.sasl.mechanism=OAUTHBEARER
      - confluent.metrics.reporter.sasl.oauthbearer.token.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/token
      - confluent.metrics.reporter.sasl.oauthbearer.jwks.endpoint.url=https://myapps.firstcitizens.com/oauth2/default/v1/keys
      - confluent.metrics.reporter.sasl.oauthbearer.expected.issuer=https://myapps.firstcitizens.com/oauth2/default
      - confluent.metrics.reporter.sasl.oauthbearer.scope=11547.DAH(Prod)

      # Broker defaults.
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
      - num.io.threads=16
      - num.network.threads=8
      - num.partitions=1
      - num.recovery.threads.per.data.dir=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      - confluent.license.topic.replication.factor=3
      - confluent.metadata.topic.replication.factor=3
      - confluent.balancer.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.balancer.enable=false
      - ssl.principal.mapping.rules=RULE:^.*[Cc][Nn]=([^,]+).*$/$1/L,DEFAULT

  podTemplate:
    serviceAccountName: flink-operator
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    probe:
      liveness:
        initialDelaySeconds: 90
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # OpenShift restricted-v2 SCC assigns the UID range (runbook E1).
    podSecurityContext: {}
    # Gatekeeper [required-workload-labels] inspects the Pod, not just the STS.
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka
      app.kubernetes.io/component: kafka-broker
      app.kubernetes.io/part-of: confluent-platform
      cfk-role: kafka-broker
      fcbint.net/app-id: "11547"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cfk-role: kafka-broker
            topologyKey: kubernetes.io/hostname
