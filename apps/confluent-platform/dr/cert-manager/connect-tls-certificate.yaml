---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-11 (created), 2026-06-29 (last-modified)
# Description: Keyfactor Certificate for Kafka Connect's HTTPS REST
#              listener — dr.
########################################################################

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: connect-tls
  namespace: dah-flink-dr
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect-tls
    app.kubernetes.io/component: kafka-connect
    fcbint.net/app-id: "11547"
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkfkaksupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Prod
    metadata.command-issuer.keyfactor.com/Description: "Kafka Connect — HTTPS REST listener"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: "11547"
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: connect.dah-flink-dr.svc.cluster.local
  dnsNames:
    - connect.dah-flink-dr.svc
    - connect.dah-flink-dr.svc.cluster.local
    - connect-0.connect.dah-flink-dr.svc.cluster.local
    - connect-1.connect.dah-flink-dr.svc.cluster.local
  duration: 8760h0m0s
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: connect-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: connect
      app.kubernetes.io/instance: connect-tls
      app.kubernetes.io/component: kafka-connect
      fcbint.net/app-id: "11547"
