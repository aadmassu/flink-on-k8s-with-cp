---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-10 (created), 2026-06-29 (last-modified)
# Description: Ingress exposing Kafka Connect REST/UI publicly;
#              reencrypt termination — dr.
########################################################################

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connect
  namespace: dah-flink-dr
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    route.openshift.io/termination: reencrypt
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: connect.apps.pd-s.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: connect
                port:
                  number: 8083
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - connect.apps.pd-s.ocp.fcbint.net
      secretName: connect-ingress-tls
