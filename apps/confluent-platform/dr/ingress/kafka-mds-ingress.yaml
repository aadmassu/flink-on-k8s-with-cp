---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-08-07 (last-modified)
# Description: Ingress exposing the broker MDS REST endpoint (port 8090
#              on the kafka Service) publicly. Backend HTTPS via
#              kafka-tls; edge termination reencrypt. MDS API only —
#              Kafka protocol clients keep talking to bootstrap directly.
########################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-mds
  namespace: dah-flink-dr
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-mds
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    route.openshift.io/termination: reencrypt
    route.openshift.io/destination-ca-certificate-secret: reencrypt-bundle # required by reencrypt annotation
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: kafka-mds.apps.pd.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: kafka
                port:
                  number: 8090
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - kafka-mds.apps.pd.ocp.fcbint.net
      secretName: kafka-mds-ingress-tls
