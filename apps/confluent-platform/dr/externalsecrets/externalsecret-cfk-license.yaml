---
# ESO ExternalSecret — pulls the same Confluent license JWT from CyberArk
# as confluent-license (account dr-confluent-license in safe 11547_P_KEY_FP —
# DR shares the prd safe) but writes it into a Secret named `cfk-license`
# with the JWT wrapped as Java-properties `license=<JWT>` under key
# `license.txt`. The CFK operator itself (cfk-operator chart) consumes this
# wrapped form for its license override.
#
# The companion confluent-license ExternalSecret under
# apps/confluent-cmf/dr/externalsecrets/ materializes the SAME JWT in
# RAW form under `license.txt` — that variant is what the CP components
# (Kafka, Schema Registry, Connect, REST, Control Center) and CMF
# consume. One CyberArk account, two output shapes; the difference is
# just the `license=` prefix added by this template.
#
# See apps/confluent-cmf/dev/externalsecrets/README.md for the broader
# SecretStore-vs-ExternalSecret model and the SecretStore URL contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cfk-license
  namespace: dah-flink-dr
  labels:
    app.kubernetes.io/name: cfk-license
    app.kubernetes.io/instance: cfk-license
    app.kubernetes.io/component: cfk-prereq
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-p-key-fp
    kind: SecretStore
  target:
    name: cfk-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cfk-license
          app.kubernetes.io/instance: cfk-license
          app.kubernetes.io/component: cfk-prereq
          app.kubernetes.io/part-of: confluent-platform
          fcbint.net/app-id: "11547"
      data:
        license.txt: "license={{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: "dr-confluent-license"
        property: "Digital Analytics Hub"
