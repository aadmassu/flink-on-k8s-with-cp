---
apiVersion: platform.confluent.io/v1beta1
kind: KsqlDB
metadata:
  name: ksqldb
  namespace: confluent-prd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  dataVolumeCapacity: 10Gi
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent-prd.svc.cluster.local:9071
