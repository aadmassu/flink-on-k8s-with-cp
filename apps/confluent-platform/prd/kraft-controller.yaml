---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: dah-kafka-prd
spec:
  # 3 replicas for KRaft quorum; must be odd number for leader election
  replicas: 3
  # Confluent Platform license; secret must contain license.txt
  license:
    secretRef: confluent-license
  # Container images for the KRaft controller
  image:
    # Confluent Server image (same as Kafka broker)
    application: confluentinc/cp-server:8.1.1
    # Init container that configures volumes, permissions, and networking before startup
    init: confluentinc/confluent-init-container:3.1.1
  # Persistent volume size for KRaft metadata log (cluster state, topic configs)
  dataVolumeCapacity: 10Gi
  podTemplate:
    # Pod annotations for monitoring discovery
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "7778"
      # Dynatrace metrics scraping
      metrics.dynatrace.com/scrape: "true"
      metrics.dynatrace.com/port: "7778"
    # CPU and memory allocation for each KRaft controller pod
    resources:
      requests:
        cpu: "500m"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi
    # Security context for the pod; required for file ownership on persistent volumes
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    # Spread controllers across availability zones so one zone failure doesn't lose quorum
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kraftcontroller
              topologyKey: topology.kubernetes.io/zone
  # RBAC authorization via MDS; controls who can access the cluster
  authorization:
    type: rbac
    # Super users bypass RBAC; must be OAuth client IDs that brokers use for internal operations
    superUsers:
      ## TODO: Replace with FCB's Okta OAuth client ID for broker/internal S2S
      - "User:<fcb-broker-oauth-client-id>"
  # TLS encryption for all controller communication
  tls:
    ## TODO: Replace with FCB's TLS secret name (must contain tls.crt, tls.key, ca.crt)
    secretRef: tls-certs
  listeners:
    # Controller listener used for KRaft quorum protocol between controllers and brokers
    controller:
      # OAuth authentication — brokers must present a valid Okta token to join the quorum
      authentication:
        type: oauth
        # Secret containing OAuth client credentials (username/password)
        jaasConfig:
          ## TODO: Replace with FCB's OAuth JAAS config secret
          secretRef: oauth-jass
        # Okta OAuth provider settings for token validation
        oauthSettings:
          ## TODO: Replace all Okta endpoints with FCB's Okta org/authorization server
          # OAuth audience — must match the audience configured in Okta
          audience: api://confluent
          # Token issuer URL — must match the iss claim in the JWT
          expectedIssuer: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>
          # JWT claim containing user's group memberships for RBAC
          groupsClaimName: groups
          # JWT claim used as the principal identity
          subClaimName: sub
          # Endpoint to fetch Okta's public keys for token signature verification
          jwksEndpointUri: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/keys
          # Endpoint where clients request OAuth tokens
          tokenEndpointUri: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/token
          # OAuth scope requested when obtaining tokens
          scope: confluent
      # Enable TLS on the controller listener
      tls:
        enabled: true
  configOverrides:
    server:
      # Timeout for KRaft leader election; lower values speed up failover
      - controller.quorum.election.timeout.ms=5000
      # Timeout for followers fetching from leader; lower values detect failures faster
      - controller.quorum.fetch.timeout.ms=5000
      # Default replication factor for auto-created internal topics
      - default.replication.factor=3
