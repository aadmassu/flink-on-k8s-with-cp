---
# Production environment overlay — inherits base, patches URLs, and scales up replicas for HA
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit all manifests from the shared base directory
resources:
  - ../base

# All resources are deployed into the prd namespace
namespace: confluent-prd

patches:
  # Schema Registry — update endpoints to prd namespace and scale to 2 replicas for HA
  - target:
      kind: SchemaRegistry
      name: schemaregistry
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/dependencies/kafka/bootstrapEndpoint
        value: kafka.confluent-prd.svc.cluster.local:9071
      - op: replace
        path: /spec/dependencies/mds/endpoint
        value: https://kafka.confluent-prd.svc.cluster.local:8090

  # Connect — update endpoints to prd namespace
  - target:
      kind: Connect
      name: connect
    patch: |
      - op: replace
        path: /spec/dependencies/kafka/bootstrapEndpoint
        value: kafka.confluent-prd.svc.cluster.local:9071
      - op: replace
        path: /spec/dependencies/schemaRegistry/url
        value: https://schemaregistry.confluent-prd.svc.cluster.local:8081
      - op: replace
        path: /spec/dependencies/mds/endpoint
        value: https://kafka.confluent-prd.svc.cluster.local:8090

  # Control Center — update all dependency endpoints to prd namespace
  - target:
      kind: ControlCenter
      name: controlcenter
    patch: |
      - op: replace
        path: /spec/dependencies/kafka/bootstrapEndpoint
        value: kafka.confluent-prd.svc.cluster.local:9071
      - op: replace
        path: /spec/dependencies/schemaRegistry/url
        value: https://schemaregistry.confluent-prd.svc.cluster.local:8081
      - op: replace
        path: /spec/dependencies/connect/0/url
        value: https://connect.confluent-prd.svc.cluster.local:8083
      - op: replace
        path: /spec/dependencies/mds/endpoint
        value: https://kafka.confluent-prd.svc.cluster.local:8090

  # Kafka — update metrics reporter bootstrap endpoint to prd namespace
  - target:
      kind: Kafka
      name: kafka
    patch: |
      - op: replace
        path: /spec/metricReporter/bootstrapEndpoint
        value: kafka.confluent-prd.svc.cluster.local:9071
