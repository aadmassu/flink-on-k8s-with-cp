---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-08-07 (last-modified)
# Description: Ingress exposing Kafka Connect REST/UI publicly. Backend
#              serves HTTPS on 8083 (connect-tls); edge termination
#              reencrypt.
########################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connect
  namespace: dah-flink-prd
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    # route.openshift.io/termination: reencrypt
    # route.openshift.io/destination-ca-certificate-secret: reencrypt-bundle # required by reencrypt annotation
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
    route.openshift.io/termination: edge
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: connect.apps.pd.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: connect
                port:
                  number: 8083
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - connect.apps.pd.ocp.fcbint.net
      secretName: connect-ingress-tls
