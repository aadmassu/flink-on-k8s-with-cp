---
# Ingress exposing Schema Registry REST/UI publicly — prd.
# Backend serves HTTPS on 8081 with schemaregistry-tls → reencrypt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schemaregistry
  namespace: dah-flink-prd
  labels:
    app.kubernetes.io/name: schemaregistry
    app.kubernetes.io/instance: schemaregistry
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
  annotations:
    route.openshift.io/termination: reencrypt
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  ingressClassName: openshift-core-zone
  rules:
    - host: schemaregistry.apps.pd-p.ocp.fcbint.net
      http:
        paths:
          - backend:
              service:
                name: schemaregistry
                port:
                  number: 8081
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - schemaregistry.apps.pd-p.ocp.fcbint.net
      secretName: schemaregistry-ingress-tls
