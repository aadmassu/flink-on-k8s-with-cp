---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: connect-ingress-tls
  namespace: dah-flink-prod
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/instance: connect-ingress-tls
    app.kubernetes.io/component: ingress-cert
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: '11547'
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkafkasupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Prod-Corp
    metadata.command-issuer.keyfactor.com/Description: Kafka Connect REST/UI (Ingress
      edge cert)
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: '11547'
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: connect.apps.pd-p.ocp.fcbint.net
  dnsNames:
  - connect.apps.pd-p.ocp.fcbint.net
  - connect.apps.pd.ocp.fcbint.net
  duration: 8760h0m0s
  renewBefore: 1080h0m0s
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: connect-ingress-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: connect
      app.kubernetes.io/instance: connect-ingress-tls
      app.kubernetes.io/component: ingress-cert
      app.kubernetes.io/part-of: confluent-platform
      fcbint.net/app-id: '11547'
