---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls
  namespace: dah-flink-prod
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-tls
    app.kubernetes.io/component: kafka-broker
    fcbint.net/app-id: '11547'
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkafkasupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Prod-Corp
    metadata.command-issuer.keyfactor.com/Description: "Kafka brokers \u2014 internal\
      \ listeners and MDS"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: '11547'
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: kafka.dah-flink-prod.svc.cluster.local
  dnsNames:
  - kafka.dah-flink-prod.svc
  - kafka.dah-flink-prod.svc.cluster.local
  - kafka-0.kafka.dah-flink-prod.svc.cluster.local
  - kafka-1.kafka.dah-flink-prod.svc.cluster.local
  - kafka-2.kafka.dah-flink-prod.svc.cluster.local
  - kafka.apps.pd-p.ocp.fcbint.net
  - kafka-0.kafka.apps.pd.ocp.fcbint.net
  - kafka-1.kafka.apps.pd.ocp.fcbint.net
  - kafka-2.kafka.apps.pd.ocp.fcbint.net
  - kafka-0.kafka.apps.pd-p.ocp.fcbint.net
  - kafka-1.kafka.apps.pd-p.ocp.fcbint.net
  - kafka-2.kafka.apps.pd-p.ocp.fcbint.net
  duration: 8760h0m0s
  renewBefore: 1080h0m0s
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: kafka-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: kafka-tls
      app.kubernetes.io/component: kafka-broker
      fcbint.net/app-id: '11547'
