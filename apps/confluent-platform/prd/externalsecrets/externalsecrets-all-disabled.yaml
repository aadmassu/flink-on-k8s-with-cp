# ============================================================================
# Template 9-14: Prometheus/Alertmanager basic-auth Secrets
# ============================================================================
# NOTE: These 6 Secrets follow the same pattern with different keys:
#   - c3-prom-server-basic-auth (Prometheus server side)
#   - c3-prom-client-basic-auth (Prometheus client side)
#   - c3-alert-server-basic-auth (Alertmanager server side)
#   - c3-alert-client-basic-auth (Alertmanager client side)
#   - oauth-mds-rest (MDS REST API client)
#   - oauth-mds-sso (MDS SSO client)
#
# Each contains:
#   - username: base64-encoded username
#   - password: base64-encoded password
#
# Example for c3-prom-server-basic-auth:
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: c3-prom-server-basic-auth
