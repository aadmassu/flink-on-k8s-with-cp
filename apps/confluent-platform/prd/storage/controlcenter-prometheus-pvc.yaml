########################################################################
# Description: Pre-created PVC for Control Center Next Gen Prometheus.
#              CFK 3.2 creates this nested claim without inheriting the
#              ControlCenter spec.storageClass, leaving it Pending when the
#              cluster has no default StorageClass. Apply before the
#              ControlCenter CR. The dedicated kafka vSphere StorageClass is
#              Immediate, Retain, and expansion-enabled.
########################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-controlcenter-0
  namespace: dah-flink-prod
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/instance: controlcenter
    app.kubernetes.io/component: control-center
    app.kubernetes.io/part-of: confluent-platform
    fcbint.net/app-id: "11547"
    confluent-platform: "true"
    cr-name: controlcenter
    type: controlcenter
  annotations:
    platform.confluent.io/cr-name: controlcenter
    platform.confluent.io/namespace: dah-flink-prod
    platform.confluent.io/type: controlcenter
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: kafka
  resources:
    requests:
      storage: 100Gi
