apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cmf-db-credentials
  namespace: dah-flink-prd
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: cmf-db-credentials
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: <TODO-fcb-clustersecretstore>
    kind: ClusterSecretStore
  target:
    name: cmf-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: <TODO-cyberark-key-cmf-db-password-prd>
        property: <TODO-cyberark-property>
        decodingStrategy: None
