---
# ExternalSecret manifests for CMF in dah-flink-dev.
# Each ExternalSecret pulls a value from the FCB CyberArk safe (via the team's
# ClusterSecretStore) and produces a Kubernetes Secret that CMF consumes.
#
# PREREQUISITE: FCB Container Platforms must onboard our safe via SNOW form
# "Container Platforms: Onboard Namespace to CyberArk". That action creates
# the ClusterSecretStore named below. Until that ticket is closed, applying
# this file will fail (the secretStoreRef won't resolve).
#
# After onboarding:
#   1. Replace every <TODO-...> placeholder with the real values from the
#      ClusterSecretStore name and CyberArk safe key/property paths IAM gives us.
#   2. Apply this file (oc apply -f apps/flink-secrets/dev/flink-secrets.yaml).
#   3. Verify the Secrets are populated:
#        oc get secret -n dah-flink-dev cmf-db-credentials cmf-encryption-key confluent-license
#   4. Once verified, remove the inline `oc create secret generic` block from
#      .azure-pipelines/cmf.yaml and the corresponding dev-cmf-* ADO variables.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cmf-db-credentials
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: cmf-db-credentials
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: <TODO-fcb-clustersecretstore>     # set after SNOW onboarding
    kind: ClusterSecretStore
  target:
    name: cmf-db-credentials
    creationPolicy: Owner                    # ESO owns the resulting Secret
  data:
    - secretKey: password                    # key inside the K8s Secret CMF reads
      remoteRef:
        key: <TODO-cyberark-key-cmf-db-password-dev>
        property: <TODO-cyberark-property>
        decodingStrategy: None               # password is plaintext in CyberArk
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cmf-encryption-key
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: cmf-encryption-key
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: <TODO-fcb-clustersecretstore>
    kind: ClusterSecretStore
  target:
    name: cmf-encryption-key
    creationPolicy: Owner
  data:
    - secretKey: key                         # CMF chart expects this property name
      remoteRef:
        key: <TODO-cyberark-key-cmf-encryption-key-dev>
        property: <TODO-cyberark-property>
        # AES key is stored in CyberArk as a base64 string. CMF expects to
        # read the base64 string verbatim and decode it itself, so do not let
        # ESO pre-decode.
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: confluent-license
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: <TODO-fcb-clustersecretstore>
    kind: ClusterSecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
  data:
    - secretKey: license.txt                 # CMF chart expects this property name
      remoteRef:
        key: <TODO-cyberark-key-confluent-license-dev>
        property: <TODO-cyberark-property>
        # JWT, must arrive verbatim
        decodingStrategy: None
