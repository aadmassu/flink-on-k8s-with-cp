---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-flink-operator-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://packages.confluent.io/helm
    chart: flink-kubernetes-operator
    targetRevision: 1.*
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://stg-cluster.aws-us-east-2.example.com
    namespace: confluent-stg
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
