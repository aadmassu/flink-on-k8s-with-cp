---
# Flink Kubernetes Operator values - qa

# Namespaces the operator watches; limits blast radius and RBAC scope
watchNamespaces:
  - confluent-qa

# Container image for the operator; pinned for reproducible deployments
image:
  # Registry + repo path; change to Artifactory mirror for air-gapped clusters
  repository: confluentinc/cp-flink-kubernetes-operator
  # IfNotPresent avoids unnecessary pulls; use Always for mutable tags
  pullPolicy: IfNotPresent
  # Pinned version; update deliberately after testing
  tag: 1.13.0-cp2
  # Digest overrides tag; use for immutable deploys in prod
  digest: ""

# Required if pulling from private registries like Artifactory
imagePullSecrets: []

# 2 replicas with leader election for HA; one active, one standby
replicas: 2

# RollingUpdate enables zero-downtime upgrades with leader election
strategy:
  # Recreate causes downtime; only use without leader election
  type: RollingUpdate

# RBAC controls what the operator and Flink jobs can access
rbac:
  # Set false only if RBAC is managed out-of-band by the platform team
  create: true
  # Node list permission; only needed for NodePort (not used on OpenShift)
  nodesRule:
    create: false
  # Operator needs permissions to manage Flink CRs, pods, configmaps
  operatorRole:
    create: true
    name: "flink-operator"
  # Binds the operator role to the operator service account
  operatorRoleBinding:
    create: true
    name: "flink-operator-role-binding"
  # Flink job pods need permissions to access secrets, configmaps, pods
  jobRole:
    create: true
    name: "flink"
  # Binds the job role to the flink service account
  jobRoleBinding:
    create: true
    name: "flink-role-binding"

# Controls scheduling, resources, and metadata for the operator pod
operatorPod:
  # Set to preempt lower-priority workloads during resource pressure
  priorityClassName: null
  # Prometheus annotations enable metric scraping without ServiceMonitor CRs
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9999"
  # Additional labels for selection or grouping
  labels: {}
  # Inject env vars like proxy settings or feature flags
  env: []
  # Override cluster DNS policy if needed (e.g. for custom resolvers)
  dnsPolicy: ""
  # Custom DNS config for split-horizon or private DNS zones
  dnsConfig: {}
  # Load env vars from ConfigMaps or Secrets in bulk
  envFrom: []
  # Pin operator to specific nodes by label (e.g. infra nodes)
  nodeSelector: {}
  # Spread replicas across nodes so one node failure doesn't kill both
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - flink-kubernetes-operator
            topologyKey: "kubernetes.io/hostname"
  # Allow scheduling on tainted nodes (e.g. dedicated xlworker nodes)
  tolerations: []
  # Distribute pods across failure domains (zones) for resilience
  topologySpreadConstraints: []
  # Size for dev; increase for stg/prd to handle more FlinkDeployments
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Webhook sidecar validates/mutates FlinkDeployment CRs before admission
  webhook:
    # Size separately from operator; webhook traffic is lighter
    resources: {}
    container:
      # Webhook-specific env vars (e.g. TLS settings)
      env: []
  # Run setup tasks before operator starts (e.g. config generation)
  initContainers: []
  # Add sidecars like log shippers or auth proxies
  sidecarContainers: []

# SA the operator deployment runs as; needs RBAC permissions above
operatorServiceAccount:
  # Set false if platform team pre-creates service accounts
  create: true
  # Add annotations like IAM role bindings for cloud access
  annotations: {}
  # Must match rbac.operatorRole binding subject
  name: "flink-operator"

# SA used by Flink JobManager/TaskManager pods
jobServiceAccount:
  # Set false if platform team pre-creates service accounts
  create: true
  # keep prevents Helm from deleting the SA on uninstall (protects running jobs)
  annotations:
    "helm.sh/resource-policy": keep
  # Must match rbac.jobRole binding subject
  name: "flink"

# Mount custom files into the operator (e.g. additional JARs or config)
operatorVolumeMounts:
  # Not needed when using console-only logging and remote artifacts
  create: false
  # Define mountPath and name for each volume
  data: []

# Attach volumes to the operator pod (PVCs, hostPath, configMaps, etc.)
operatorVolumes:
  # Not needed: console-only logging, no local artifact storage
  create: false
  # Define volume sources (PVC, hostPath, etc.)
  data: []

# Pod security context — nullified so OpenShift SCCs control user/group IDs
podSecurityContext:
  # null lets OpenShift assign from the namespace's SCC range
  runAsUser: null
  # null lets OpenShift assign from the namespace's SCC range
  runAsGroup: null

# Container security context for the operator (empty = inherit pod-level)
operatorSecurityContext: {}

# Container security context for the webhook (empty = inherit pod-level)
webhookSecurityContext: {}

# Webhook validates/mutates CRs; requires cert-manager for TLS
webhook:
  # Creates ValidatingWebhookConfiguration and MutatingWebhookConfiguration
  create: true
  validator:
    create: true
  mutator:
    create: true
  # TLS keystore for the webhook HTTPS endpoint
  keystore:
    # true = chart auto-generates password; false = use custom secret
    useDefaultPassword: true
    # Reference a pre-existing Secret with custom keystore password
    passwordSecretRef: {}
  # Extra labels on the webhook Service for selection or policy
  serviceLabels: {}

# Flink config applied to all FlinkDeployment/FlinkSessionJob CRs as defaults
defaultConfiguration:
  # false = don't create ConfigMap (use only if managing config externally)
  create: true
  # true = merge with built-in defaults; false = replace entirely
  append: true
  # Operator and Flink runtime configuration overrides
  flink-conf.yaml: |+
    # Required for HA: only one replica reconciles at a time
    kubernetes.operator.leader-election.enabled: true
    # Lease name identifies the lock object; must be unique per namespace
    kubernetes.operator.leader-election.lease-name: flink-operator-lease

    # Prometheus reporter exposes metrics for scraping
    kubernetes.operator.metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    # Must match metrics.port and pod annotation port
    kubernetes.operator.metrics.reporter.prom.port: 9999

    # How often the operator checks for CR drift and reconciles
    kubernetes.operator.reconcile.interval: 15 s
    # How often the operator polls Flink REST API for job status
    kubernetes.operator.observer.progress-check.interval: 5 s

    # Enables FlinkStateSnapshot CRD for declarative savepoints/checkpoints
    kubernetes.operator.snapshot.resource.enabled: true
  # Log4j config for the operator JVM process itself
  log4j-operator.properties: |+
    # Uncomment to debug operator reconciliation issues
    # rootLogger.level = DEBUG
    # logger.operator.name = org.apache.flink.kubernetes.operator
    # logger.operator.level = DEBUG
  # Log4j config injected into Flink job containers (JM/TM)
  log4j-console.properties: |+
    # Uncomment to debug Flink job startup or connector issues
    # rootLogger.level = DEBUG

# Exposes metrics port on the container for Prometheus to scrape
metrics:
  port: 9999

# Override chart name in generated resource names
nameOverride: ""
# Override full release name in generated resource names
fullnameOverride: ""

# JVM flags for tuning memory, GC, or enabling debug options
jvmArgs:
  # JVM args for the webhook sidecar container
  webhook: ""
  # JVM args for the operator main container
  operator: ""
  # Points to the Log4j config file mounted from the ConfigMap
  logConfig: "-Dlog4j.configurationFile=/opt/flink/conf/log4j-operator.properties"

# Health probes ensure K8s restarts unhealthy operator pods
operatorHealth:
  # Port for liveness and startup probe endpoints
  port: 8085
  # Kills and restarts the pod if the operator stops responding
  livenessProbe:
    periodSeconds: 10
    initialDelaySeconds: 30
  # Allows slow JVM startup without being killed by liveness probe
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10

# Run a command after the operator container starts (e.g. warm cache)
postStart: {}

# TLS for the operator's own REST endpoint (separate from webhook TLS)
tls:
  # Enable if exposing operator REST API externally
  create: false
  # Secret containing the TLS cert for the operator REST endpoint
  secretName: flink-operator-cert
  # Secret containing the keystore password for the REST endpoint cert
  secretKeyRef:
    name: operator-certificate-password
    key: password
