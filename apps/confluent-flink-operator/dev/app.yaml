---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-flink-operator-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://packages.confluent.io/helm
    chart: flink-kubernetes-operator
    targetRevision: 1.*
    helm:
      valuesObject:
        watchNamespaces:
          - confluent-dev
        metrics:
          prometheus:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: confluent-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
