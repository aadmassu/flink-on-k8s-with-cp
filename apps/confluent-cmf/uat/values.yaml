---
# Confluent Manager for Apache Flink (CMF) values - uat

cmf:
  # Single-tenant CMF per env — only watch its own namespace. Pairs with
  # `namespaced: true` below so the chart emits Role/RoleBinding instead of
  # ClusterRole/ClusterRoleBinding (FCB's pipeline SA isn't cluster-scoped).
  k8s:
    watchNamespaces:
      - dah-flink-uat

  # `production: true` enables CMF's SQL guardrails (DDL requires confirmation
  # prompts). uat onward.
  sql:
    production: true

  # Enable full stack-trace logging at the CMF layer (suspected networking
  # misconfiguration to SQL Server — Flink engineer requested this to get a
  # detailed trace behind the generic `Could not get Connection for
  # extracting meta-data` Flyway failure). TEMPORARY — revert to false (or
  # remove) after the next deploy's stack trace is captured and analyzed.
  stackTraceLogging: true

  # OAuth authentication for the CMF REST API — requires valid Okta token on every request
  authentication:
    type: oauth
    config:
      ## TODO: Replace all Okta endpoints with FCB's Okta org/authorization server
      # Okta JWKS endpoint — CMF fetches public keys to verify token signatures
      oauthbearer.jwks.endpoint.url: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/keys
      # Expected token issuer — rejects tokens from other issuers
      oauthbearer.expected.issuer: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>
      # JWT claim used as the user identity
      oauthbearer.sub.claim.name: sub
      # JWT claim containing group memberships for RBAC
      oauthbearer.groups.claim.name: groups
      # Expected audience in the token — must match Okta app config
      oauthbearer.expected.audience: api://confluent

      # MDS connectivity — CMF checks RBAC permissions via Kafka's Metadata Service
      ## TODO: Update MDS URL to match the environment namespace
      confluent.metadata.bootstrap.server.urls: https://kafka.confluent.svc.cluster.local:8090
      # Use OAuth to authenticate CMF's own requests to MDS
      confluent.metadata.http.auth.credentials.provider: OAUTHBEARER
      # Okta token endpoint for CMF to obtain its own access token
      confluent.metadata.oauthbearer.token.endpoint.url: https://<fcb-okta-domain>/oauth2/<fcb-auth-server-id>/v1/token
      ## TODO: Replace with FCB's CMF OAuth client credentials
      ## CyberArk vault path (production): /confluent/<env>/cmf-oauth-credentials
      confluent.metadata.oauthbearer.login.client.id: <fcb-cmf-oauth-client-id>
      confluent.metadata.oauthbearer.login.client.secret: <fcb-cmf-oauth-client-secret>

  # External database for CMF catalog (environments, statements, credentials)
  database:
    # jdbc = external database; local = SQLite on PVC (dev only)
    type: jdbc
    jdbc:
      # SQL Server — FCB's standard database platform (provisioned by DBA team)
      engine: sqlserver
      # url + user are injected at install time via `helm --set` from the
      # uat-cmf-sql-server-* variable group entries; only the password
      # reference lives here (consumed via the cmf-db-credentials Secret
      # created by the cmf pipeline).
      url: ""        # set at install time from uat-cmf-sql-server-jdbc-url
      # FCB MSSQL custom port (NOT the SQL Server default 1433)
      port: 3085
      database: DAHFLINK
      user: ""       # set at install time from uat-cmf-sql-server-user
      # trustServerCertificate=true matches DEV (self-signed cert today).
      # Flip to false once UAT SQL Server has a CA-signed cert.
      options: "encrypt=true;trustServerCertificate=true;"
      password:
        kubernetesSecretName: cmf-db-credentials
        kubernetesSecretProperty: password

  # TLS for the CMF REST endpoint. The cmf-tls Secret is populated by the
  # cert-manager Certificate at apps/confluent-cmf/uat/cmf-tls-certificate.yaml
  # (Keyfactor-issued). Spring Boot 3.1+ reads PEM cert + key directly; if
  # the runtime ever rejects PEM, switch to a PKCS12 keystore via an
  # init-container that converts tls.crt + tls.key -> keystore.p12.
  ssl:
    enabled: true
    certificate: file:/etc/cmf/tls/tls.crt
    certificate-private-key: file:/etc/cmf/tls/tls.key

# Mount the cmf-tls Secret for Spring Boot to read, plus the FCB org-wide
# trust bundle (trust-manager-managed ConfigMap). See apps/confluent-cmf/dev/
# values.yaml for the full rationale; identical wiring here.
mountedVolumes:
  volumes:
    - name: cmf-tls
      secret:
        secretName: cmf-tls
        defaultMode: 0440
    - name: fcb-trust-bundle
      configMap:
        name: fcb-trust-bundle
  volumeMounts:
    - name: cmf-tls
      mountPath: /etc/cmf/tls
      readOnly: true
    - name: fcb-trust-bundle
      mountPath: /mnt/sslcerts/fcb-trust-bundle
      readOnly: true

# JVM default truststore → fcb-trust-bundle (see dev/values.yaml for rationale).
jvmArgs: "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS -Dlogging.level.org.springframework.jdbc=DEBUG -Dlogging.level.org.flywaydb=DEBUG -Dlogging.level.com.microsoft.sqlserver.jdbc=DEBUG -Dlogging.level.io.confluent.cmf=DEBUG -Ddebug=true"

# Application-level encryption of CMF catalog rows. CMF encrypts
# sensitive columns (credentials, secret-set values) BEFORE writing
# to the SQL Server, so even a DBA with raw table access can't read
# the cleartext. Enabled from UAT onward per FCB's data-protection
# standard — dev intentionally uses the same plumbing for parity
# but FCB has signed off on the JDBC-only encrypt=true posture for
# dev. The key lives in Secret `cmf-encryption-key`; rotating it
# would corrupt every existing encrypted row, so the corresponding
# CyberArk account MUST be locked for rotation.
encryption:
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

license:
  secretRef: confluent-license

image:
  # Pulled from FCB Artifactory mirror (cluster has no Docker Hub egress).
  repository: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc
  name: cp-cmf
  # Custom Confluent build with namespace-scoped RBAC support (the upstream
  # 2.3.0 chart hard-codes ClusterRole/ClusterRoleBinding which our SA can't
  # create). Bump only after Confluent ships namespace-scoped support upstream.
  tag: 2.3.0-fcb-preview-2

# Carry the FCB common-metadata onto every chart resource. The chart's
# cmf.labels helper natively appends `.Values.additionalLabels`, so this
# satisfies the [required-workload-labels] Gatekeeper constraint without
# any chart edits.
additionalLabels:
  fcbint.net/app-id: "11547"

# Pairs with cmf.k8s.watchNamespaces above — emit Role/RoleBinding scoped
# to dah-flink-uat instead of ClusterRole/ClusterRoleBinding.
namespaced: true

# RBAC and ServiceAccount are pre-created in dah-flink-uat by FCB's
# fcb-security ArgoCD chart (see openshift-prereqs/uat/manifests/ for our
# parallel template). The chart consumes the existing `flink-operator` SA;
# do not let Helm try to create either — the pipeline SA in upper envs
# doesn't have create permission on SA/Role/RoleBinding anyway.
rbac: false
serviceAccount:
  create: false
  name: flink-operator

# Suppress the chart's hardcoded podSecurityContext (fsGroup: 1001,
# runAsUser: 1001). On OpenShift, SCC assigns UIDs from the namespace's
# allowed range at admission — fixed UIDs trip restricted-v2 SCC validation.
podSecurity:
  enabled: false

# CMF state lives in the external SQL Server above, not on a local PVC.
# Setting create: false also avoids the [ceph-storage] Gatekeeper denial
# the chart's default PVC triggers (no storageClassName → falls back to
# "default", which FCB rejects).
persistence:
  create: false

# CPU and memory for the CMF pod
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi
