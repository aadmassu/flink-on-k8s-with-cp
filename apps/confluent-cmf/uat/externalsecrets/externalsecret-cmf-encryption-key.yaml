---
# ============================================================================
# STATUS: STUB / DRAFT — not yet applied in dah-flink-uat (as of 2026-06-11).
# ============================================================================
# Scaffolding for when the CyberArk account for the CMF encryption key is
# provisioned in safe 11547_U_LNX_FP. Until then, the cmf.yaml pipeline
# creates the K8s Secret `cmf-encryption-key` directly from the
# `uat-cmf-encryption-key` entry in the kafka-openshift-credentials-uat
# variable group. In non-dev envs the pipeline does NOT apply this manifest
# today. Cutover path: extend the dev-only ESO branch in cmf.yaml to also
# cover uat once the SecretStore reaches Ready against this account.
# ============================================================================
#
# ESO ExternalSecret — pulls the CMF encryption key from CyberArk
# (account uat-cmf-encryption-key in safe 11547_U_LNX_FP) and writes
# a Secret named `cmf-encryption-key`. CMF consumes it via:
#   encryption.key.kubernetesSecretName=cmf-encryption-key
#   encryption.key.kubernetesSecretProperty=key
#
# DO NOT ROTATE THIS KEY once CMF is running — CMF encrypts its
# catalog rows with this AES-GCM key, and rotating it makes existing
# rows unreadable. Lock rotation in CyberArk for this account.
#
# SecretStore `11547-u-lnx-fp` is the namespace-scoped store FCB
# Security provisioned in dah-flink-uat. See sibling
# externalsecret-cmf-db-password.yaml for the safe-naming note.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-encryption-key
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: cmf-encryption-key
    app.kubernetes.io/instance: cmf-encryption-key
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-u-lnx-fp
    kind: SecretStore
  target:
    name: cmf-encryption-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-encryption-key
          app.kubernetes.io/instance: cmf-encryption-key
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: "uat-cmf-encryption-key"
        property: "Digital Analytics Hub"
