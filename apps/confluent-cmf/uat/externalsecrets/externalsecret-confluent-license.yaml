---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-19 (created), 2026-06-29 (last-modified)
# Description: ExternalSecret — pulls Confluent license JWT from
#              CyberArk into Secret confluent-license (raw JWT under
#              license.txt; CMF chart consumes via license.secretRef) —
#              uat.
########################################################################

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: confluent-license
    app.kubernetes.io/instance: confluent-license
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-u-lnx-fp
    kind: SecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: confluent-license
          app.kubernetes.io/instance: confluent-license
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        license.txt: "{{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: "uat-confluent-license"
        property: "Digital Analytics Hub"
