---
# ============================================================================
# STATUS: STUB / DRAFT — not yet applied in dah-flink-uat (as of 2026-06-11).
# ============================================================================
# Scaffolding for when the CyberArk account for the Confluent license JWT is
# provisioned in safe 11547_U_LNX_FP. Until then, the cmf.yaml pipeline
# creates the K8s Secret `confluent-license` directly from the
# `uat-confluent-license` entry in the kafka-openshift-credentials-uat
# variable group. In non-dev envs the pipeline does NOT apply this manifest
# today. Cutover path: extend the dev-only ESO branch in cmf.yaml to also
# cover uat once the SecretStore reaches Ready against this account.
# ============================================================================
#
# ESO ExternalSecret — pulls the Confluent license JWT from CyberArk
# (account uat-confluent-license in safe 11547_U_LNX_FP) and writes a
# Secret named `confluent-license` that the CMF chart consumes via
# `license.secretRef: confluent-license` in values.yaml.
#
# CMF expects the raw JWT under `license.txt` — do NOT add the
# `license=<JWT>` prefix that the CFK operator uses. The cfk-license
# ExternalSecret under apps/confluent-platform/uat/externalsecrets/
# produces that wrapped form separately for the CFK operator.
#
# See apps/confluent-cmf/dev/externalsecrets/README.md for the broader
# SecretStore-vs-ExternalSecret model and the SecretStore URL contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: confluent-license
    app.kubernetes.io/instance: confluent-license
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-u-lnx-fp
    kind: SecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: confluent-license
          app.kubernetes.io/instance: confluent-license
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        license.txt: "{{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: "uat-confluent-license"
        property: "Digital Analytics Hub"
