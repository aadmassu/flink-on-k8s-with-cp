---
# ============================================================================
# STATUS: STUB / DRAFT — not yet applied in dah-flink-uat (as of 2026-06-11).
# ============================================================================
# Scaffolding for when the CyberArk account for the CMF SQL Server password
# is provisioned in safe 11547_U_LNX_FP. Until then, the cmf.yaml pipeline
# creates the K8s Secret `cmf-db-credentials` directly from the
# `uat-cmf-sql-server-user-password` entry in the
# kafka-openshift-credentials-uat variable group (see the `if dev / else
# create_labeled_secret` branch in cmf.yaml). In non-dev envs the pipeline
# does NOT apply this manifest today.
#
# Cutover to ESO: once Tushar / FCB Security confirms the CyberArk account
# exists in 11547_U_LNX_FP and the SecretStore `11547-u-lnx-fp` reports
# Ready=True against it, extend the dev-only ESO branch in cmf.yaml to also
# cover uat. This file then becomes active without further changes.
# ============================================================================
#
# ESO ExternalSecret — pulls the CMF SQL Server user password from
# CyberArk (account uat-cmf-sql-server-user-password in safe
# 11547_U_LNX_FP) and writes a Secret named `cmf-db-credentials`. CMF
# consumes it via:
#   cmf.database.jdbc.password.kubernetesSecretName=cmf-db-credentials
#   cmf.database.jdbc.password.kubernetesSecretProperty=password
#
# SecretStore `11547-u-lnx-fp` is the namespace-scoped store that FCB
# Security provisioned in dah-flink-uat (webhook to FCB CCP at
# pam-ccp.fcpd.fcbint.net targeting safe 11547_U_LNX_FP). The DEV
# equivalent uses `11547-d-key-fp` (KEY safe) — UAT diverges from that
# convention, so do NOT copy DEV's safe name when adding new env-specific
# ExternalSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-db-credentials
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: cmf-db-credentials
    app.kubernetes.io/instance: cmf-db-credentials
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-u-lnx-fp
    kind: SecretStore
  target:
    name: cmf-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-db-credentials
          app.kubernetes.io/instance: cmf-db-credentials
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "uat-cmf-sql-server-user-password"
        property: "Digital Analytics Hub"
