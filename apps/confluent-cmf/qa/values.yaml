---
# Confluent Manager for Apache Flink (CMF) values - qa
# Flink-only validation environment (no local Kafka)

cmf:
  k8s:
    watchNamespaces:
      - dah-flink-qa

  sql:
    production: false

  # Authentication disabled for qa — will switch to OAuth later

  # TEMPORARY: using local SQLite on pod ephemeral storage until the DBA team
  # provides the QA SQL Server database name + service account.
  # When the QA DB is ready, set type back to jdbc and uncomment the jdbc block.
  # NOTE: state is lost on pod restart in this mode (persistence.create: false).
  database:
    type: local
    # jdbc:
    #   engine: sqlserver
    #   url: ""
    #   port: 3085
    #   database: DAHFLINK
    #   user: ""
    #   options: "encrypt=true;trustServerCertificate=true;"
    #   password:
    #     kubernetesSecretName: cmf-db-credentials
    #     kubernetesSecretProperty: password

  # TLS for the CMF REST endpoint. The cmf-tls Secret is populated by the
  # cert-manager Certificate at apps/confluent-cmf/qa/cmf-tls-certificate.yaml
  # (Keyfactor-issued). Spring Boot 3.1+ reads PEM cert + key directly; if
  # the runtime ever rejects PEM, switch to a PKCS12 keystore via an
  # init-container that converts tls.crt + tls.key -> keystore.p12.
  ssl:
    enabled: true
    certificate: file:/etc/cmf/tls/tls.crt
    certificate-private-key: file:/etc/cmf/tls/tls.key

# Mount the cmf-tls Secret for Spring Boot to read.
mountedVolumes:
  volumes:
    - name: cmf-tls
      secret:
        secretName: cmf-tls
        defaultMode: 0440
  volumeMounts:
    - name: cmf-tls
      mountPath: /etc/cmf/tls
      readOnly: true

encryption:
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

license:
  secretRef: confluent-license

image:
  repository: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc
  name: cp-cmf
  tag: 2.3.0-fcb-preview-2

additionalLabels:
  fcbint.net/app-id: "11547"

namespaced: true

rbac: false
serviceAccount:
  create: false
  name: flink-operator

persistence:
  create: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
