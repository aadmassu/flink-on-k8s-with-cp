---
# Confluent Manager for Apache Flink (CMF) values - qa
# Flink-only validation environment (no local Kafka)

cmf:
  k8s:
    watchNamespaces:
      - dah-flink-qa

  sql:
    production: false

  # Authentication disabled for qa — will switch to OAuth later

  database:
    type: jdbc
    jdbc:
      engine: sqlserver
      url: ""
      port: 3085
      database: DAHFLINK
      user: ""
      options: "encrypt=true;trustServerCertificate=true;"
      password:
        kubernetesSecretName: cmf-db-credentials
        kubernetesSecretProperty: password

encryption:
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

license:
  secretRef: confluent-license

image:
  repository: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc
  name: cp-cmf
  tag: 2.3.0-fcb-preview-2

additionalLabels:
  fcbint.net/app-id: "11547"

namespaced: true

rbac: false
serviceAccount:
  create: false
  name: flink-operator

persistence:
  create: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
