---
# ESO ExternalSecret — pulls the Confluent license JWT from CyberArk
# (account dr-confluent-license in safe 11547_P_KEY_FP — DR shares the
# prd safe) and writes a Secret named `confluent-license` that the CMF
# chart consumes via `license.secretRef: confluent-license` in values.yaml.
#
# CMF expects the raw JWT under `license.txt` — do NOT add the
# `license=<JWT>` prefix that the CFK operator uses. The cfk-license
# ExternalSecret under apps/confluent-platform/dr/externalsecrets/
# produces that wrapped form separately for the CFK operator.
#
# See apps/confluent-cmf/dev/externalsecrets/README.md for the broader
# SecretStore-vs-ExternalSecret model and the SecretStore URL contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: dah-flink-dr
  labels:
    app.kubernetes.io/name: confluent-license
    app.kubernetes.io/instance: confluent-license
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-p-key-fp
    kind: SecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: confluent-license
          app.kubernetes.io/instance: confluent-license
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        license.txt: "{{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: "dr-confluent-license"
        property: "Digital Analytics Hub"
