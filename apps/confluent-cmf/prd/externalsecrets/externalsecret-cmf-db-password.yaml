---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-10 (created), 2026-08-04 (last-modified)
# Description: ExternalSecret — pulls the CMF SQL Server user password
#              from CyberArk into Secret cmf-db-credentials. CMF reads
#              it via cmf.database.jdbc.password.kubernetesSecretName +
#              .kubernetesSecretProperty=password.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-db-credentials
  namespace: dah-flink-prod
  labels:
    app.kubernetes.io/name: cmf-db-credentials
    app.kubernetes.io/instance: cmf-db-credentials
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-p-key-fp
    kind: SecretStore
  target:
    name: cmf-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-db-credentials
          app.kubernetes.io/instance: cmf-db-credentials
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "prd-cmf-sql-server-user-password"
        property: "Digital Analytics Hub"
