---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-06-10 (created), 2026-08-04 (last-modified)
# Description: ExternalSecret — pulls the CMF AES-GCM encryption key
#              from CyberArk into Secret cmf-encryption-key. DO NOT
#              ROTATE while CMF is running — rotation makes existing
#              encrypted catalog rows unreadable. Lock rotation in
#              CyberArk for the prd-cmf-encryption-key account.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-encryption-key
  namespace: dah-flink-prod
  labels:
    app.kubernetes.io/name: cmf-encryption-key
    app.kubernetes.io/instance: cmf-encryption-key
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-p-key-fp
    kind: SecretStore
  target:
    name: cmf-encryption-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-encryption-key
          app.kubernetes.io/instance: cmf-encryption-key
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: "prod-cmf-encryption-key"
        property: "Digital Analytics Hub"
