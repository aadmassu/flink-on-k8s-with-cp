---
# cert-manager Certificate for the CMF REST endpoint TLS — prd.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cmf-tls
  namespace: dah-flink-prd
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: cmf-tls
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkfkaksupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Prod-Corp
    metadata.command-issuer.keyfactor.com/Description: "Confluent Manager for Apache Flink — REST endpoint TLS"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: "11547"
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: cmf-service.dah-flink-prd.svc.cluster.local
  dnsNames:
    - cmf-service.dah-flink-prd.svc
    - cmf-service.dah-flink-prd.svc.cluster.local
  duration: 8760h0m0s
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: cmf-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: confluent-manager-for-apache-flink
      app.kubernetes.io/instance: cmf-tls
      app.kubernetes.io/component: cmf
      fcbint.net/app-id: "11547"
