---
# cert-manager Certificate for the CMF management UI Ingress — dev.
#
# Produces Secret `cmf-ingress-tls` (Keyfactor-signed via the `keyfactor`
# ClusterIssuer). The companion Ingress at apps/confluent-cmf/dev/cmf-ingress.yaml
# references this Secret via `spec.tls.secretName` — native K8s plumbing,
# no extra controller needed.
#
# Distinct from `cmf-tls` (which already exists in this directory): cmf-tls is
# the BACKEND cert that Spring Boot inside the CMF pod uses to serve HTTPS on
# port 8080 inside the cluster. cmf-ingress-tls is the EDGE cert the HAProxy
# router presents to browsers hitting the public hostname. Two distinct certs
# because they cover different DNS names — backend covers the in-cluster svc
# name, edge covers the public *.apps.dv-p.ocp.fcbint.net host.
#
# Host follows the Container Team OpenShift Ingress guidance (Option 1:
# Internal Bank Network - OCP). DNS is automatic for dev (wildcard maintained
# by Container Team) — no DNS Request needed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cmf-ingress-tls
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: cmf-ingress-tls
    app.kubernetes.io/component: ingress-cert
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    metadata.command-issuer.keyfactor.com/Certificate-Support-Group-Contact: dahkafkasupportnotification@firstcitizens.com
    metadata.command-issuer.keyfactor.com/Environment: Non-Prod-DEV
    metadata.command-issuer.keyfactor.com/Description: "Confluent Manager for Apache Flink — management UI (Ingress edge cert)"
    metadata.command-issuer.keyfactor.com/Organization: FCB
    metadata.command-issuer.keyfactor.com/Application-ID: "11547"
    metadata.command-issuer.keyfactor.com/Platform: OPENSHIFT
spec:
  commonName: cmf.apps.dv-p.ocp.fcbint.net
  dnsNames:
    - cmf.apps.dv-p.ocp.fcbint.net
  duration: 8760h0m0s
  renewBefore: 1080h0m0s
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    group: command-issuer.keyfactor.com
    kind: ClusterIssuer
    name: keyfactor
  secretName: cmf-ingress-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: confluent-manager-for-apache-flink
      app.kubernetes.io/instance: cmf-ingress-tls
      app.kubernetes.io/component: ingress-cert
      app.kubernetes.io/part-of: confluent-manager-for-flink
      fcbint.net/app-id: "11547"
