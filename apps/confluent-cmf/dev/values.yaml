---
# Confluent Manager for Apache Flink (CMF) values - dev
# Flink-only validation environment (no local Kafka)

cmf:
  sql:
    production: false

  # No authentication for dev validation — will switch to OAuth later
  authentication:
    type: noauth

  # Local SQLite database — will switch to SQL Server later
  database:
    type: local

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
