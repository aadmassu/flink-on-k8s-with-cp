---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-03-04 (created), 2026-06-17 (last-modified)
# Description: CMF (Confluent Manager for Apache Flink) Helm values —
#              dev. Single-tenant (watches its own namespace via
#              namespaced=true), SQL Server catalog (external), license
#              + encryption key via ESO from CyberArk. No local Kafka in
#              this env; Flink job sinks point at VM Kafka.
########################################################################

cmf:
  # Single-tenant CMF per env — only watch its own namespace. Pairs with
  # `namespaced: true` below so the chart emits Role/RoleBinding instead of
  # ClusterRole/ClusterRoleBinding (FCB's pipeline SA isn't cluster-scoped).
  k8s:
    watchNamespaces:
      - dah-flink-dev

  # `production: false` disables CMF's SQL guardrails (DDL without
  # confirmation prompts). dev only — flip to `true` for uat/prd.
  sql:
    production: false

  # Authentication disabled for dev — will switch to OAuth later
  # Valid types: BASIC, MTLS, OAUTH (omit block entirely to disable)

  # External SQL Server for the CMF catalog. url + user are injected at
  # install time via `helm --set` from the dev-cmf-sql-server-* variable
  # group entries; only the password reference lives in this file (it's
  # consumed via the cmf-db-credentials Secret created by the cmf pipeline).
  database:
    type: jdbc
    jdbc:
      engine: sqlserver
      url: ""        # set at install time from dev-cmf-sql-server-jdbc-url
      port: 3085
      database: DAHFLINK
      user: ""       # set at install time from dev-cmf-sql-server-user
      # trustServerCertificate=true because dev SQL Server uses a self-signed
      # cert today. Flip to false in uat/prd (production SQL has a CA-signed
      # cert).
      options: "encrypt=true;trustServerCertificate=true;"
      password:
        kubernetesSecretName: cmf-db-credentials
        kubernetesSecretProperty: password

  # TLS for the CMF REST endpoint. The cmf-tls Secret is populated by the
  # cert-manager Certificate at apps/confluent-cmf/dev/cmf-tls-certificate.yaml
  # (Keyfactor-issued). Spring Boot 3.1+ reads PEM cert + key directly; if
  # the runtime ever rejects PEM, switch to a PKCS12 keystore via an
  # init-container that converts tls.crt + tls.key -> keystore.p12.
  ssl:
    enabled: true
    certificate: file:/etc/cmf/tls/tls.crt
    certificate-private-key: file:/etc/cmf/tls/tls.key

# Mount the cmf-tls Secret for Spring Boot to read, plus the FCB org-wide
# trust bundle (trust-manager-managed ConfigMap from the fcb-security Helm
# chart). The bundle holds the public-root CAs PLUS FCB Root CA 1/2 — CMF
# needs it for outbound HTTPS to Okta (OAuth/JWKS when auth is enabled),
# Schema Registry (catalog/database integration), JDBC over TLS to SQL
# Server, and any other FCB-internal endpoint signed under FCB Root CA.
# The JVM-default truststore is pointed at /mnt/sslcerts/fcb-trust-bundle/
# bundle.jks via jvmArgs (see below). The cmf-tls mount stays separate
# — that one is for the inbound Spring Boot REST listener cert/key.
mountedVolumes:
  volumes:
    - name: cmf-tls
      secret:
        secretName: cmf-tls
        defaultMode: 0440
    - name: fcb-trust-bundle
      configMap:
        name: fcb-trust-bundle
  volumeMounts:
    - name: cmf-tls
      mountPath: /etc/cmf/tls
      readOnly: true
    - name: fcb-trust-bundle
      mountPath: /mnt/sslcerts/fcb-trust-bundle
      readOnly: true

# Point the JVM default truststore at the fcb-trust-bundle JKS. CMF's
# deployment template appends this string to the container args; the
# CP-CMF image's entrypoint shell-tokenizes it onto the java command line.
# Password is trust-manager's default ("changeit"); confirm with Container
# team if the FCB Bundle was rebuilt with a custom password.
jvmArgs: "-Djavax.net.ssl.trustStore=/mnt/sslcerts/fcb-trust-bundle/bundle.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS"

encryption:
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

license:
  secretRef: confluent-license

image:
  # Pulled from FCB Artifactory mirror (cluster has no Docker Hub egress).
  repository: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc
  name: cp-cmf
  # Custom Confluent build with namespace-scoped RBAC support (the upstream
  # 2.3.0 chart hard-codes ClusterRole/ClusterRoleBinding which our SA can't
  # create). Bump only after Confluent ships namespace-scoped support upstream.
  tag: 2.3.0-fcb-preview-2

# NOTE — imagePullSecrets wiring is STAGED but not yet active. Uncomment
# once the externalsecret-artifactory-pull-secret.yaml ExternalSecret has
# been applied AND its target Secret `artifactory-pull-secret` has reached
# SecretSynced=True. Until then the pod relies on the cluster-default pull
# credential, which is the existing working state.
# imagePullSecrets:
#   - name: artifactory-pull-secret

# FCB CMDB Application ID — required on every object by the cluster's
# Common Metadata admission policy.
additionalLabels:
  fcbint.net/app-id: "11547"

# Pairs with cmf.k8s.watchNamespaces above — emit Role/RoleBinding scoped
# to dah-flink-dev instead of ClusterRole/ClusterRoleBinding.
namespaced: true

# RBAC and ServiceAccount are pre-created in dah-flink-dev by FCB's
# fcb-security ArgoCD chart (see openshift-prereqs/dev/manifests/ for our
# parallel template). The chart consumes the existing `flink-operator` SA;
# do not let Helm try to create either.
rbac: false
serviceAccount:
  create: false
  name: flink-operator

# Suppress the chart's hardcoded podSecurityContext (fsGroup: 1001,
# runAsUser: 1001). On OpenShift, SCC assigns UIDs from the namespace's
# allowed range at admission — fixed UIDs trip restricted-v2 SCC validation.
podSecurity:
  enabled: false

# CMF state lives in the external SQL Server above, not on a local PVC.
persistence:
  create: false

# CMF is a Spring Boot app that caches Flink environments / catalogs and
# proxies SQL/REST to the workload pods. Bumped from 100m/512Mi req,
# 500m/1Gi lim to give steady-state headroom for the dev cluster's
# two Flink jobs + the OAuth refresh path against Okta when auth is
# enabled. Heap auto-sized from request → ~1 GiB; non-heap room up to
# the 2 GiB limit covers the FCB trust-bundle JKS, JDBC driver pool
# to the external SQL Server, and Spring's reflection / proxy caches.
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
