---
# Confluent Manager for Apache Flink (CMF) values - dev
# Flink-only validation environment (no local Kafka)

cmf:
  # Single-tenant CMF per env — only watch its own namespace. Pairs with
  # `namespaced: true` below so the chart emits Role/RoleBinding instead of
  # ClusterRole/ClusterRoleBinding (FCB's pipeline SA isn't cluster-scoped).
  k8s:
    watchNamespaces:
      - dah-flink-dev

  # `production: false` disables CMF's SQL guardrails (DDL without
  # confirmation prompts). dev only — flip to `true` for uat/prd.
  sql:
    production: false

  # Authentication disabled for dev — will switch to OAuth later
  # Valid types: BASIC, MTLS, OAUTH (omit block entirely to disable)

  # External SQL Server for the CMF catalog. url + user are injected at
  # install time via `helm --set` from the dev-cmf-sql-server-* variable
  # group entries; only the password reference lives in this file (it's
  # consumed via the cmf-db-credentials Secret created by the cmf pipeline).
  database:
    type: jdbc
    jdbc:
      engine: sqlserver
      url: ""        # set at install time from dev-cmf-sql-server-jdbc-url
      port: 3085
      database: DAHFLINK
      user: ""       # set at install time from dev-cmf-sql-server-user
      # trustServerCertificate=true because dev SQL Server uses a self-signed
      # cert today. Flip to false in uat/prd (production SQL has a CA-signed
      # cert).
      options: "encrypt=true;trustServerCertificate=true;"
      password:
        kubernetesSecretName: cmf-db-credentials
        kubernetesSecretProperty: password

  # TLS for the CMF REST endpoint. The cmf-tls Secret is populated by the
  # cert-manager Certificate at apps/confluent-cmf/dev/cmf-tls-certificate.yaml
  # (Keyfactor-issued). Spring Boot 3.1+ reads PEM cert + key directly; if
  # the runtime ever rejects PEM, switch to a PKCS12 keystore via an
  # init-container that converts tls.crt + tls.key -> keystore.p12.
  ssl:
    enabled: true
    certificate: file:/etc/cmf/tls/tls.crt
    certificate-private-key: file:/etc/cmf/tls/tls.key

# Mount the cmf-tls Secret for Spring Boot to read.
mountedVolumes:
  volumes:
    - name: cmf-tls
      secret:
        secretName: cmf-tls
        defaultMode: 0440
  volumeMounts:
    - name: cmf-tls
      mountPath: /etc/cmf/tls
      readOnly: true

encryption:
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

license:
  secretRef: confluent-license

image:
  # Pulled from FCB Artifactory mirror (cluster has no Docker Hub egress).
  repository: artifactory.fcbint.net/camdepositsharedservices-docker-dev/confluentinc
  name: cp-cmf
  # Custom Confluent build with namespace-scoped RBAC support (the upstream
  # 2.3.0 chart hard-codes ClusterRole/ClusterRoleBinding which our SA can't
  # create). Bump only after Confluent ships namespace-scoped support upstream.
  tag: 2.3.0-fcb-preview-2

# FCB CMDB Application ID — required on every object by the cluster's
# Common Metadata admission policy.
additionalLabels:
  fcbint.net/app-id: "11547"

# Pairs with cmf.k8s.watchNamespaces above — emit Role/RoleBinding scoped
# to dah-flink-dev instead of ClusterRole/ClusterRoleBinding.
namespaced: true

# RBAC and ServiceAccount are pre-created in dah-flink-dev by FCB's
# fcb-security ArgoCD chart (see openshift-prereqs/dev/manifests/ for our
# parallel template). The chart consumes the existing `flink-operator` SA;
# do not let Helm try to create either.
rbac: false
serviceAccount:
  create: false
  name: flink-operator

# Suppress the chart's hardcoded podSecurityContext (fsGroup: 1001,
# runAsUser: 1001). On OpenShift, SCC assigns UIDs from the namespace's
# allowed range at admission — fixed UIDs trip restricted-v2 SCC validation.
podSecurity:
  enabled: false

# CMF state lives in the external SQL Server above, not on a local PVC.
persistence:
  create: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
