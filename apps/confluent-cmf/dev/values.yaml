---
# Confluent Manager for Apache Flink (CMF) values - dev
# Flink-only validation environment (no local Kafka)

cmf:
  sql:
    production: false

  # Authentication disabled for dev — will switch to OAuth later
  # Valid types: BASIC, MTLS, OAUTH (omit block entirely to disable)

  # Local SQLite database — will switch to SQL Server later
  database:
    type: local

image:
  repository: artifactory.fcbint.net/camdepositsharedservices-docker-prod/confluentinc
  name: confluent-manager-for-apache-flink
  tag: 2.2.0

imagePullSecretRef: artifactory-pull-secret

additionalLabels:
  fcbint.net/app-id: "11547"

namespaced: true

rbac: false
serviceAccount:
  create: false
  name: flink

persistence:
  create: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
