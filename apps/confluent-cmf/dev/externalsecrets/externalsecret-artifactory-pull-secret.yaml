---
# ESO ExternalSecret — pulls the Artifactory service-account password
# from CyberArk (account UserName=artifactory-svc-user-password in safe
# 11547_D_KEY_FP) and templates it into a kubernetes.io/dockerconfigjson
# Secret that the CMF pod uses to pull images from FCB's Artifactory.
#
# The CMF chart references this via `imagePullSecrets[].name` in
# values.yaml (the chart sets imagePullSecrets at the pod level when
# this is defined).
#
# Two prerequisites the CyberArk Account itself doesn't carry:
#   1. The Artifactory registry hostname — hard-coded below to match the
#      `image.repository` prefix in values.yaml (artifactory.fcbint.net).
#   2. The Artifactory service-account USERNAME — CyberArk only stores
#      the password, not the username. Put the username in a separate
#      ConfigMap or as a hard-coded value below. We default to a
#      placeholder; replace with the actual service-account username
#      Tushar provides (often something like `svc-flink-cp-d` or
#      `svc-11547-d`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-pull-secret
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: artifactory-pull-secret
    app.kubernetes.io/instance: artifactory-pull-secret
    app.kubernetes.io/component: image-pull-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: artifactory-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: artifactory-pull-secret
          app.kubernetes.io/instance: artifactory-pull-secret
          app.kubernetes.io/component: image-pull-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        # Kubelet reads .dockerconfigjson for image pulls. The `auth`
        # field is base64(username:password) per the Docker spec.
        .dockerconfigjson: |
          {
            "auths": {
              "artifactory.fcbint.net": {
                "username": "TODO-artifactory-svc-username",
                "password": "{{ .password }}",
                "auth": "{{ printf "TODO-artifactory-svc-username:%s" .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: password
      remoteRef:
        key: artifactory-svc-user-password
        property: TODO-cyberark-address-for-artifactory-svc
