#
# To enable when both blockers are cleared:
#   1. Remove the leading "# " on every line between the BEGIN/END markers.
#   2. Replace TODO-artifactory-svc-username with the real username.
#   3. Apply this file.
#   4. Uncomment the imagePullSecrets block in
