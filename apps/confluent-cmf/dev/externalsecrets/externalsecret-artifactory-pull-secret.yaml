# 1. The Artifactory service-account credential lives in a DIFFERENT
#    CyberArk safe (`11547_D_UNX_FP`), not `11547_D_KEY_FP` that the
#    `11547-d-key-fp` SecretStore is hard-coded to. Either the
#    container team adds a second SecretStore pointing at the UNX safe,
#    or moves the account into 11547_D_KEY_FP. Confirm with Tushar.
#
# 2. CyberArk only stores the password — not the Artifactory username.
#    We need the literal service-account username (e.g. svc-flink-cp-d)
#    from Tushar to fill the two `TODO-artifactory-svc-username`
#    placeholders below.
#
# Meanwhile, image pulls continue to work via the cluster-default pull
# credential (existing working state), and the `imagePullSecrets` block
