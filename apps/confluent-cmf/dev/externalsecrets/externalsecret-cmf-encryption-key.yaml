---
# ESO ExternalSecret — pulls the CMF encryption key from CyberArk
# (account UserName=dev-cmf-encryption-key in safe 11547_D_KEY_FP) and
# materializes a Kubernetes Secret named `cmf-encryption-key` that the
# CMF chart consumes via:
#   encryption.key.kubernetesSecretName=cmf-encryption-key
#   encryption.key.kubernetesSecretProperty=key
# in values.yaml.
#
# IMPORTANT — DO NOT ROTATE THIS KEY once CMF is running. CMF encrypts
# its catalog rows with this AES-GCM key; rotating it makes existing
# encrypted rows unreadable. CyberArk should be configured with
# rotation disabled / locked for this account.
#
# ============================================================================
# STATUS: ON HOLD — body commented out below.
#
# Same situation as cmf-db-credentials — the account is on a
# UNIX-UNXSSH- platform the AIM web service can't currently fetch from.
# Tushar is correcting the platform mapping. Until then, the
# cmf-encryption-key Secret continues to be created the old way
# (variable-group via the cmf pipeline).
#
# To enable when the platform fix lands:
#   1. Remove the leading "# " on every line between the BEGIN/END markers.
#   2. Apply this file: oc apply -f <this-file>
#   3. Update .azure-pipelines/cmf.yaml to gate `create_labeled_secret
#      cmf-encryption-key ...` behind `if [ "$TARGET_ENV" != "dev" ]` —
#      same pattern we already use for confluent-license.
# ============================================================================

