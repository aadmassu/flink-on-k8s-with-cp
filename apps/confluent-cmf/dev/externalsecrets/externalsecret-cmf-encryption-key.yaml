---
# ESO ExternalSecret — pulls the CMF encryption key from CyberArk
# (account UserName=dev-cmf-encryption-key in safe 11547_D_KEY_FP) and
# materializes a Kubernetes Secret named `cmf-encryption-key` that the
# CMF chart consumes via:
#   encryption.key.kubernetesSecretName=cmf-encryption-key
#   encryption.key.kubernetesSecretProperty=key
# in values.yaml.
#
# IMPORTANT — DO NOT ROTATE THIS KEY once CMF is running. CMF encrypts
# its catalog rows with this AES-GCM key; rotating it makes existing
# encrypted rows unreadable. CyberArk should be configured with
# rotation disabled / locked for this account.
#
# STATUS: NOT YET READY TO APPLY.
# Same situation as cmf-db-password — Tushar reported the account is on
# a UNIX-UNXSSH- platform the AIM web service can't currently fetch
# from. Holding until he corrects the platform mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-encryption-key
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: cmf-encryption-key
    app.kubernetes.io/instance: cmf-encryption-key
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: cmf-encryption-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-encryption-key
          app.kubernetes.io/instance: cmf-encryption-key
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        # The CMF chart's `kubernetesSecretProperty: key` reads the
        # secret key literally named "key".
        key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        # UserName = dev-cmf-encryption-key
        # Address  = Digital Analytics Hub
        key: dev-cmf-encryption-key
        property: Digital Analytics Hub
