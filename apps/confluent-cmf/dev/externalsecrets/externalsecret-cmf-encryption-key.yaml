---
# ESO ExternalSecret — pulls the CMF encryption key from CyberArk
# (account dev-cmf-encryption-key in safe 11547_D_KEY_FP) and writes
# a Secret named `cmf-encryption-key`. CMF consumes it via:
#   encryption.key.kubernetesSecretName=cmf-encryption-key
#   encryption.key.kubernetesSecretProperty=key
#
# DO NOT ROTATE THIS KEY once CMF is running — CMF encrypts its
# catalog rows with this AES-GCM key, and rotating it makes existing
# rows unreadable. Lock rotation in CyberArk for this account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-encryption-key
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: cmf-encryption-key
    app.kubernetes.io/instance: cmf-encryption-key
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: cmf-encryption-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-encryption-key
          app.kubernetes.io/instance: cmf-encryption-key
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: "dev-cmf-encryption-key"
        property: "Digital Analytics Hub"
