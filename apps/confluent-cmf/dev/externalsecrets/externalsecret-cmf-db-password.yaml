---
# ESO ExternalSecret — pulls the database password from CyberArk
# (account UserName=artifactory-db-user-password in safe 11547_D_KEY_FP)
# and materializes a Kubernetes Secret named `cmf-db-credentials` that
# the CMF chart consumes via:
#   cmf.database.jdbc.password.kubernetesSecretName=cmf-db-credentials
#   cmf.database.jdbc.password.kubernetesSecretProperty=password
# in values.yaml.
#
# NOTE on the CyberArk account name: the account is literally called
# `artifactory-db-user-password` in the safe (per Tushar's screenshot)
# even though we're using it for CMF's SQL Server DB password. If that
# naming is wrong and there's a separate `cmf-db-user-password` account,
# change the `key` below before applying.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-db-credentials
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: cmf-db-credentials
    app.kubernetes.io/instance: cmf-db-credentials
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: cmf-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-db-credentials
          app.kubernetes.io/instance: cmf-db-credentials
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        # The CMF chart's `kubernetesSecretProperty: password` reads the
        # secret key literally named "password". Set it to the raw value
        # CyberArk returns.
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: artifactory-db-user-password
        property: TODO-cyberark-address-for-db-account
