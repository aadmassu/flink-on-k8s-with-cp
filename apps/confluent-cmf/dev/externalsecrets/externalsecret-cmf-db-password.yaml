---
# ESO ExternalSecret — pulls the CMF SQL Server user password from
# CyberArk (account UserName=dev-cmf-sql-server-user-password in safe
# 11547_D_KEY_FP) and materializes a Kubernetes Secret named
# `cmf-db-credentials` that the CMF chart consumes via:
#   cmf.database.jdbc.password.kubernetesSecretName=cmf-db-credentials
#   cmf.database.jdbc.password.kubernetesSecretProperty=password
# in values.yaml.
#
# STATUS: NOT YET READY TO APPLY.
# Tushar reported the CyberArk account exists but is on a UNIX-UNXSSH-
# platform that the AIM web service can't currently fetch from. He's
# fixing the platform mapping. Once corrected, apply this and update the
# cmf.yaml pipeline to swap the variable-group create_labeled_secret
# call for the same ESO pattern we use for the license today.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-db-credentials
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: cmf-db-credentials
    app.kubernetes.io/instance: cmf-db-credentials
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: cmf-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-db-credentials
          app.kubernetes.io/instance: cmf-db-credentials
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        # The CMF chart's `kubernetesSecretProperty: password` reads the
        # secret key literally named "password". Set it to the raw value
        # CyberArk returns.
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        # UserName = dev-cmf-sql-server-user-password
        # Address  = Digital Analytics Hub
        # Both confirmed against the CyberArk safe 11547_D_KEY_FP listing
        # shared by Tushar.
        key: dev-cmf-sql-server-user-password
        property: Digital Analytics Hub
