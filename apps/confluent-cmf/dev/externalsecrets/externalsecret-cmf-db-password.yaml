# ESO ExternalSecret — pulls the CMF SQL Server user password from
# CyberArk (account UserName=dev-cmf-sql-server-user-password in safe
# 11547_D_KEY_FP) and materializes a Kubernetes Secret named
# `cmf-db-credentials` that the CMF chart consumes via:
#   cmf.database.jdbc.password.kubernetesSecretName=cmf-db-credentials
#   cmf.database.jdbc.password.kubernetesSecretProperty=password
# in values.yaml.
#
# ============================================================================
# STATUS: ON HOLD — body commented out below.
#
# Tushar reported the CyberArk account exists but is on a UNIX-UNXSSH-
# platform that the AIM web service can't currently fetch from. He's
# fixing the platform mapping. The cmf-db-credentials Secret continues
# to be created the old way (variable-group via the cmf pipeline) until
# this is uncommented.
#
# To enable when the platform fix lands:
#   1. Remove the leading "# " on every line between the BEGIN/END markers.
#   2. Apply this file: oc apply -f <this-file>
#   3. Update .azure-pipelines/cmf.yaml to gate `create_labeled_secret
#      cmf-db-credentials ...` behind `if [ "$TARGET_ENV" != "dev" ]` —
#      same pattern we already use for confluent-license.
# ============================================================================

