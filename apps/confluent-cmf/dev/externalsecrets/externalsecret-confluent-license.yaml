---
# ESO ExternalSecret — pulls the Confluent license JWT from CyberArk
# (account UserName=dev-confluent-license in safe 11547_D_KEY_FP) and
# materializes a Kubernetes Secret named `confluent-license` that the
# CMF chart consumes via `license.secretRef: confluent-license` in
# values.yaml.
#
# The CMF chart expects the license value under key `license.txt`, in
# the form `license=<JWT>` (Confluent's documented format). We template
# that content from the raw JWT returned by CyberArk.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: confluent-license
    app.kubernetes.io/instance: confluent-license
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: confluent-license
          app.kubernetes.io/instance: confluent-license
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        # CFK / CMF licenses are sourced from a file with content
        # `license=<JWT>` and key `license.txt`. We assemble it from the
        # raw JWT returned by CyberArk (extracted via $.Content jsonpath
        # on the SecretStore).
        license.txt: |
          license={{ .jwt }}
  data:
    - secretKey: jwt
      remoteRef:
        # In CyberArk the safe is hard-coded to 11547_D_KEY_FP via the
        # SecretStore URL; `key` becomes UserName, `property` becomes
        # Address. The container team owns those CyberArk account
        # attributes — fill `property` with the Address value the team
        # set on this account (often the system/host identifier, e.g.
        # "fcbint.net" or an environment marker like "dev"). Confirm
        # with Tushar before applying.
        key: dev-confluent-license
        property: TODO-cyberark-address-for-license
