---
# ESO ExternalSecret — pulls the Confluent license JWT from CyberArk
# (account UserName=dev-confluent-license in safe 11547_D_KEY_FP) and
# materializes a Kubernetes Secret named `confluent-license` that the
# CMF chart consumes via `license.secretRef: confluent-license` in
# values.yaml.
#
# IMPORTANT — CMF expects the license value as the RAW JWT under key
# `license.txt`. Do NOT prepend `license=` to the value — CMF rejects
# the Java-properties shape `license=<JWT>` that CFK / Confluent
# Platform Kafka uses. (The cmf.yaml pipeline already creates two
# distinct license Secrets to handle this split: `confluent-license`
# = raw JWT for CMF, `cfk-license` = `license=<JWT>` properties shape
# for CFK Kafka. This ExternalSecret produces the CMF one.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: confluent-license
    app.kubernetes.io/instance: confluent-license
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: confluent-license
          app.kubernetes.io/instance: confluent-license
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        # Raw JWT under key `license.txt` — see header comment for why
        # CMF rejects the `license=<JWT>` properties shape.
        license.txt: "{{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        # Resolves the SecretStore URL placeholders:
        #   UserName = dev-confluent-license     (CyberArk Account)
        #   Address  = Digital Analytics Hub     (CyberArk Account attribute)
        # Both confirmed against the CyberArk safe 11547_D_KEY_FP listing
        # shared by Tushar (Platform APP_KEY-APPKEY-D-FP-NA-R-15-0-NA-0-NA).
        #
        # Address value is plain "Digital Analytics Hub" — no URL
        # encoding. Earlier we tried %20-encoding to work around a
        # presumed Go url.Parse issue with literal spaces; turned out
        # that was a red herring — Go's http client tolerates spaces in
        # the query string and CCP URL-decodes them on receipt. Quote
        # both string values for readability and so YAML parses the
        # spaces correctly.
        key: "dev-confluent-license"
        property: "Digital Analytics Hub"
