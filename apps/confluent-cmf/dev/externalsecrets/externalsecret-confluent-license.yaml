---
# ESO ExternalSecret — pulls the Confluent license JWT from CyberArk
# (account UserName=dev-confluent-license in safe 11547_D_KEY_FP) and
# materializes a Kubernetes Secret named `confluent-license` that the
# CMF chart consumes via `license.secretRef: confluent-license` in
# values.yaml.
#
# The CMF chart expects the license value under key `license.txt`, in
# the form `license=<JWT>` (Confluent's documented format). We template
# that content from the raw JWT returned by CyberArk.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: confluent-license
    app.kubernetes.io/instance: confluent-license
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-d-key-fp
    kind: SecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: confluent-license
          app.kubernetes.io/instance: confluent-license
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        # CFK / CMF licenses are sourced from a file with content
        # `license=<JWT>` and key `license.txt`. We assemble it from the
        # raw JWT returned by CyberArk (extracted via $.Content jsonpath
        # on the SecretStore).
        license.txt: |
          license={{ .jwt }}
  data:
    - secretKey: jwt
      remoteRef:
        # Resolves the SecretStore URL placeholders:
        #   UserName = dev-confluent-license     (CyberArk Account)
        #   Address  = Digital Analytics Hub     (CyberArk Account attribute)
        # Both confirmed against the CyberArk safe 11547_D_KEY_FP listing
        # shared by Tushar (Platform APP_KEY-APPKEY-D-FP-NA-R-15-0-NA-0-NA).
        #
        # IMPORTANT: `property` must be URL-encoded because the FCB-owned
        # SecretStore (`11547-d-key-fp`) renders its webhook URL with Go
        # text/template literal substitution — no auto-encoding. A raw
        # space here ends up as a literal space in the request URL, which
        # Go's url.Parse rejects (`invalid character ' ' in URL`) and ESO
        # surfaces as the opaque condition `SecretSyncedError: could not
        # get secret data from provider`. Pre-encode every Address whose
        # value contains spaces — the DAH safe uses "Digital Analytics
        # Hub" on every account, so all four ExternalSecrets in this
        # folder follow the same convention.
        key: dev-confluent-license
        property: Digital%20Analytics%20Hub
