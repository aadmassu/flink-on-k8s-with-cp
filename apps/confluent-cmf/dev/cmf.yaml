      authentication:
        type: noauth
      database:
        jdbc:
          database: cmf
          engine: postgresql
          options: ""
          password:
            kubernetesSecretName: ""
            kubernetesSecretProperty: ""
          port: 5432
          url: ""
          user: cmf
        type: local
      k8s:
        metadataSync: true
      sql:
        production: false
      stackTraceLogging: false
