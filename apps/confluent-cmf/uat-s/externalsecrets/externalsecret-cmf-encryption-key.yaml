---
########################################################################
# Author:      Ayu Admassu
# Date:        2026-05-19 (created), 2026-06-29 (last-modified)
# Description: ExternalSecret — pulls CMF AES-GCM encryption key from
#              CyberArk into Secret cmf-encryption-key. DO NOT ROTATE
#              while CMF is running — uat.
########################################################################

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmf-encryption-key
  namespace: dah-flink-uat
  labels:
    app.kubernetes.io/name: cmf-encryption-key
    app.kubernetes.io/instance: cmf-encryption-key
    app.kubernetes.io/component: cmf-secret
    app.kubernetes.io/part-of: confluent-manager-for-flink
    fcbint.net/app-id: "11547"
  annotations:
    fcbint.net/contact: dahkafkasupportnotification@firstcitizens.com
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 11547-u-key-fp
    kind: SecretStore
  target:
    name: cmf-encryption-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: cmf-encryption-key
          app.kubernetes.io/instance: cmf-encryption-key
          app.kubernetes.io/component: cmf-secret
          app.kubernetes.io/part-of: confluent-manager-for-flink
          fcbint.net/app-id: "11547"
      data:
        key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        key: "uat-cmf-encryption-key"
        property: "Digital Analytics Hub"
        decodingStrategy: Base64
