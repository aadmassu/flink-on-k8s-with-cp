# Pipeline:  connectivity-test
# Purpose:   Push busybox to Artifactory, deploy in namespace, and test SQL Server connectivity
# Author:    Ayu Admassu
# Created:   2026-04-17
#
# Variable Group: kafka-openshift-credentials-<env>
#   artifactory-svc-user            — Artifactory service account username
#   artifactory-svc-user-password   — Artifactory service account password (secret)
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-api               — OpenShift API server URL
#   openshift-namespace         — target namespace
#   <env>-cmf-sql-server-jdbc-url   — SQL Server hostname
#   <env>-kafka-broker-hosts        — comma-separated Kafka broker hostnames
#   <env>-schema-registry-hosts     — comma-separated Schema Registry hostnames
#   <env>-kafka-rest-proxy-hosts    — comma-separated Kafka REST Proxy hostnames
#   <env>-net-app-s3-url            — NetApp S3 endpoint URL
#   kafka-oauthbearer-token-endpoint-url — Okta OAuth token endpoint (full URL).
#                                          Same value across all envs today;
#                                          per-env so a future tenant migration
#                                          rolls forward env-by-env.

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat-p, uat-s, prd, dr]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat-p') }}:
    - group: kafka-openshift-credentials-uat-p
  - ${{ if eq(parameters.environment, 'uat-s') }}:
    - group: kafka-openshift-credentials-uat-s
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: ConnectivityTest
    displayName: "Connectivity Test (${{ parameters.environment }})"
    jobs:
      - job: ConnectivityTest
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                oc whoami
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "RBAC: flink-operator SA can-i checks"
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                SA="system:serviceaccount:$OC_NS:flink-operator"
                echo "=== Impersonating $SA ==="

                run_check() {
                  local label=$1
                  shift
                  echo ""
                  echo "--- $label ---"
                  echo "+ oc auth can-i $* --as=$SA -n $OC_NS"
                  oc auth can-i "$@" --as="$SA" -n "$OC_NS" || true
                }

                # Baseline: can the SA reach the API server at all?
                run_check "get /version (non-resource URL)" get /version

                # The call that fails for the QA CMF pod at FkoVersionValidator.
                run_check "list deployments.apps" list deployments.apps

                # Other verbs CMF exercises during startup / reconcile.
                run_check "get pods"            get pods
                run_check "list configmaps"     list configmaps
                run_check "list flinkdeployments.flink.apache.org" \
                          list flinkdeployments.flink.apache.org
            env:
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "Pull, tag, and push busybox"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                REGISTRY="artifactory.fcbint.net"
                REPO="camdepositsharedservices-docker-dev"
                IMAGE_TAG="1.36"
                TARGET_IMAGE="$REGISTRY/$REPO/busybox:$IMAGE_TAG"

                CONTAINER_CLI="docker"
                if command -v podman &>/dev/null; then
                  CONTAINER_CLI="podman"
                fi
                echo "Using $CONTAINER_CLI"

                echo "=== Logging in to Artifactory ==="
                echo "$ART_PWD" | $CONTAINER_CLI login "$REGISTRY" --username "$ART_USER" --password-stdin

                echo ""
                echo "=== Checking if busybox exists in Artifactory ==="
                if $CONTAINER_CLI pull "$TARGET_IMAGE" 2>/dev/null; then
                  echo "Image already exists in Artifactory, skipping push."
                else
                  echo "Image not found in Artifactory, pulling from Docker Hub..."
                  $CONTAINER_CLI pull "busybox:$IMAGE_TAG"

                  echo ""
                  echo "=== Tagging as $TARGET_IMAGE ==="
                  $CONTAINER_CLI tag "busybox:$IMAGE_TAG" "$TARGET_IMAGE"

                  echo ""
                  echo "=== Pushing $TARGET_IMAGE ==="
                  $CONTAINER_CLI push "$TARGET_IMAGE"

                  echo ""
                  echo "Image pushed: $TARGET_IMAGE"
                fi
            env:
              ART_USER: $(artifactory-svc-user)
              ART_PWD: $(artifactory-svc-user-password)

          - task: Bash@3
            displayName: "Run busybox in namespace"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                REGISTRY="artifactory.fcbint.net"
                REPO="camdepositsharedservices-docker-dev"
                IMAGE_TAG="1.36"

                echo "=== Checking if busybox pod is already running ==="
                if oc get pod busybox -n "$OC_NS" --no-headers 2>/dev/null | grep -q "Running"; then
                  echo "busybox pod is already running, skipping deploy."
                  oc get pod busybox -n "$OC_NS" -o wide
                  exit 0
                fi

                echo ""
                echo "=== Cleaning up any existing non-Running busybox pod ==="
                oc delete pod busybox -n "$OC_NS" --ignore-not-found --wait=true

                echo ""
                echo "=== Deploying busybox pod in $OC_NS ==="
                cat <<EOF | oc apply -f -
                apiVersion: v1
                kind: Pod
                metadata:
                  name: busybox
                  namespace: $OC_NS
                  labels:
                    app.kubernetes.io/name: busybox
                    app.kubernetes.io/instance: busybox
                    app.kubernetes.io/component: network-test
                    fcbint.net/app-id: "11547"
                spec:
                  restartPolicy: Never
                  containers:
                    - name: busybox
                      image: $REGISTRY/$REPO/busybox:$IMAGE_TAG
                      command: ["sleep", "3600"]
                      resources:
                        requests:
                          cpu: "10m"
                          memory: "16Mi"
                        limits:
                          cpu: "100m"
                          memory: "64Mi"
                      readinessProbe:
                        exec:
                          command: ["true"]
                        periodSeconds: 10
                      livenessProbe:
                        exec:
                          command: ["true"]
                        periodSeconds: 30
                EOF

                echo ""
                echo "=== Waiting for pod to be ready ==="
                oc wait --for=condition=Ready pod/busybox -n "$OC_NS" --timeout=120s

                echo ""
                echo "=== Pod status ==="
                oc get pod busybox -n "$OC_NS" -o wide
            env:
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "DNS Resolution Test"
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                # busybox nslookup walks every entry in resolv.conf's search
                # path. If ANY single attempt returns NXDOMAIN it exits 1,
                # even when another search-domain variant returned a valid
                # answer. So we ignore the exit code and check for an
                # "Address:" line in the output instead — exactly one of
                # those means the host was resolved.
                test_dns() {
                  local host=$1
                  local label=$2
                  echo ""
                  echo "--- $label: $host ---"
                  local out
                  out=$(oc exec busybox -n "$OC_NS" -- nslookup "$host" 2>&1)
                  echo "$out"
                  # The first "Address:" line is the DNS server itself
                  # (e.g. 10.245.0.10:53). A second one means a real
                  # resolution happened. Count and act accordingly.
                  if [ "$(echo "$out" | grep -c '^Address')" -ge 2 ]; then
                    echo "OK: DNS resolved $host"
                  else
                    echo "FAIL: DNS lookup failed for $host"
                  fi
                }

                # Some variable-group entries carry a host:port string
                # (Confluent bootstrap.servers format — e.g.
                # `d11547varc-pgm8.fcpd.fcbint.net:9094`). nslookup chokes
                # on that. Strip the port for DNS / TCP probes — the test
                # passes the port explicitly below.
                strip_port() { echo "${1%%:*}"; }

                echo "=== SQL Server ==="
                test_dns "$DB_HOST" "SQL Server"

                echo ""
                echo "=== Kafka Brokers ==="
                IFS=',' read -ra BROKERS <<< "$KAFKA_BROKERS"
                for broker in "${BROKERS[@]}"; do
                  test_dns "$(strip_port "$broker")" "Kafka broker"
                done

                echo ""
                echo "=== Schema Registry ==="
                IFS=',' read -ra SR_HOSTS <<< "$SCHEMA_REGISTRY_HOSTS"
                for sr in "${SR_HOSTS[@]}"; do
                  test_dns "$sr" "Schema Registry"
                done

                echo ""
                echo "=== Kafka REST Proxy ==="
                IFS=',' read -ra REST_HOSTS <<< "$REST_PROXY_HOSTS"
                for rp in "${REST_HOSTS[@]}"; do
                  test_dns "$rp" "Kafka REST Proxy"
                done

                echo ""
                echo "=== NetApp S3 ==="
                S3_HOST=$(echo "$S3_URL" | sed -E 's|^https?://||; s|/.*$||')
                test_dns "$S3_HOST" "NetApp S3"

                # Okta tenant — host extracted from the OAuth token endpoint
                # URL the brokers / SR / Connect / REST / C3 / Flink jobs all
                # post to. Variable lives in kafka-openshift-credentials-<env>
                # as `kafka-oauthbearer-token-endpoint-url` (same value across
                # envs today, but per-env so a future tenant migration can be
                # rolled forward env-by-env without code change).
                echo ""
                echo "=== Okta (OAuth token endpoint host) ==="
                OKTA_HOST=$(echo "$OAUTH_TOKEN_URL" | sed -E 's|^https?://||; s|/.*$||')
                test_dns "$OKTA_HOST" "Okta tenant"

                echo ""
                echo "=== DNS resolution test complete ==="
            env:
              OC_NS: $(openshift-namespace)
              DB_HOST: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
              KAFKA_BROKERS: $(${{ parameters.environment }}-kafka-broker-hosts)
              SCHEMA_REGISTRY_HOSTS: $(${{ parameters.environment }}-schema-registry-hosts)
              REST_PROXY_HOSTS: $(${{ parameters.environment }}-kafka-rest-proxy-hosts)
              S3_URL: $(${{ parameters.environment }}-net-app-s3-url)
              OAUTH_TOKEN_URL: $(kafka-oauthbearer-token-endpoint-url)

          - task: Bash@3
            displayName: "Connectivity Test"
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                test_connection() {
                  local host=$1
                  local port=$2
                  local label=$3
                  echo ""
                  echo "--- $label: $host:$port ---"
                  if oc exec busybox -n "$OC_NS" -- nc -zv -w 5 "$host" "$port" 2>&1; then
                    echo "OK: $label reachable at $host:$port"
                  else
                    echo "FAIL: $label unreachable at $host:$port"
                  fi
                }

                # See DNS step for context — some variable-group entries
                # carry a host:port suffix (Confluent bootstrap.servers
                # format). Strip it; the test passes the actual port we
                # want to probe explicitly below.
                strip_port() { echo "${1%%:*}"; }

                echo "=== SQL Server ==="
                test_connection "$DB_HOST" 3085 "SQL Server"

                echo ""
                echo "=== Kafka Brokers ==="
                IFS=',' read -ra BROKERS <<< "$KAFKA_BROKERS"
                for broker in "${BROKERS[@]}"; do
                  broker_host=$(strip_port "$broker")
                  test_connection "$broker_host" 9092 "Kafka broker (plaintext)"
                  test_connection "$broker_host" 9094 "Kafka broker (TLS)"
                done

                echo ""
                echo "=== Schema Registry ==="
                IFS=',' read -ra SR_HOSTS <<< "$SCHEMA_REGISTRY_HOSTS"
                for sr in "${SR_HOSTS[@]}"; do
                  test_connection "$sr" 8081 "Schema Registry"
                done

                echo ""
                echo "=== Kafka REST Proxy ==="
                IFS=',' read -ra REST_HOSTS <<< "$REST_PROXY_HOSTS"
                for rp in "${REST_HOSTS[@]}"; do
                  test_connection "$rp" 8082 "Kafka REST Proxy"
                done

                echo ""
                echo "=== NetApp S3 ==="
                S3_HOST=$(echo "$S3_URL" | sed -E 's|^https?://||; s|/.*$||')
                test_connection "$S3_HOST" 443 "NetApp S3 (HTTPS)"

                # Okta token endpoint — CFK brokers, SR, Connect, REST, C3 and
                # Flink jobs ALL post here for OAuth tokens. Today's
                # aep-rate-limit-job failure was a `Connection timed out`
                # against this exact host on 443, so the test serves as a fast
                # pre-check before any rollout. Host extracted from the full
                # URL variable (`kafka-oauthbearer-token-endpoint-url` in
                # kafka-openshift-credentials-<env>); we only need host:443
                # here, but parameterizing on the same variable the apps use
                # means there's only one place to update if the tenant ever
                # moves. An end-to-end token fetch test (HTTPS handshake +
                # JWKS GET) belongs in a separate verify-* pipeline once the
                # trust-store work lands — connectivity-test stays scope-
                # bounded to L4.
                echo ""
                echo "=== Okta (OAuth token endpoint host) ==="
                OKTA_HOST=$(echo "$OAUTH_TOKEN_URL" | sed -E 's|^https?://||; s|/.*$||')
                test_connection "$OKTA_HOST" 443 "Okta tenant (HTTPS)"

                echo ""
                echo "=== Connectivity test complete ==="
            env:
              OC_NS: $(openshift-namespace)
              DB_HOST: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
              KAFKA_BROKERS: $(${{ parameters.environment }}-kafka-broker-hosts)
              SCHEMA_REGISTRY_HOSTS: $(${{ parameters.environment }}-schema-registry-hosts)
              REST_PROXY_HOSTS: $(${{ parameters.environment }}-kafka-rest-proxy-hosts)
              S3_URL: $(${{ parameters.environment }}-net-app-s3-url)
              OAUTH_TOKEN_URL: $(kafka-oauthbearer-token-endpoint-url)
