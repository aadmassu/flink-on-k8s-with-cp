# Pipeline:  connectivity-test
# Purpose:   Push busybox to Artifactory, deploy in namespace, and test SQL Server connectivity
# Author:    Ayele Admassu
# Created:   2026-04-17
#
# Variable Group: <env>-openshift-credentials
#   artifactory-svc-user            — Artifactory service account username
#   artifactory-svc-user-password   — Artifactory service account password (secret)
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-dev-api               — OpenShift API server URL
#   openshift-dev-namespace         — target namespace
#   <env>-cmf-sql-server-jdbc-url   — SQL Server hostname
#   <env>-kafka-broker-hosts        — comma-separated Kafka broker hostnames
#   <env>-schema-registry-hosts     — comma-separated Schema Registry hostnames
#   <env>-kafka-rest-proxy-hosts    — comma-separated Kafka REST Proxy hostnames
#   <env>-net-app-s3-url            — NetApp S3 endpoint URL

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
    # aep-rate-limit-job-dev holds kafka-sasl-jaas-config (OAuth clientId/
    # clientSecret embedded in the JAAS string) used by the Kafka REST Proxy
    # authz test step below. First run needs a one-time "authorize pipeline"
    # approval on this group in ADO.
    - group: aep-rate-limit-job-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'stg') }}:
    - group: stg-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: ConnectivityTest
    displayName: "Connectivity Test (${{ parameters.environment }})"
    jobs:
      - job: ConnectivityTest
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                oc whoami
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-dev-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-dev-namespace)

          - task: Bash@3
            displayName: "Pull, tag, and push busybox"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                REGISTRY="artifactory.fcbint.net"
                REPO="camdepositsharedservices-docker-dev"
                IMAGE_TAG="1.36"
                TARGET_IMAGE="$REGISTRY/$REPO/busybox:$IMAGE_TAG"

                CONTAINER_CLI="docker"
                if command -v podman &>/dev/null; then
                  CONTAINER_CLI="podman"
                fi
                echo "Using $CONTAINER_CLI"

                echo "=== Logging in to Artifactory ==="
                echo "$ART_PWD" | $CONTAINER_CLI login "$REGISTRY" --username "$ART_USER" --password-stdin

                echo ""
                echo "=== Checking if busybox exists in Artifactory ==="
                if $CONTAINER_CLI pull "$TARGET_IMAGE" 2>/dev/null; then
                  echo "Image already exists in Artifactory, skipping push."
                else
                  echo "Image not found in Artifactory, pulling from Docker Hub..."
                  $CONTAINER_CLI pull "busybox:$IMAGE_TAG"

                  echo ""
                  echo "=== Tagging as $TARGET_IMAGE ==="
                  $CONTAINER_CLI tag "busybox:$IMAGE_TAG" "$TARGET_IMAGE"

                  echo ""
                  echo "=== Pushing $TARGET_IMAGE ==="
                  $CONTAINER_CLI push "$TARGET_IMAGE"

                  echo ""
                  echo "Image pushed: $TARGET_IMAGE"
                fi
            env:
              ART_USER: $(artifactory-svc-user)
              ART_PWD: $(artifactory-svc-user-password)

          - task: Bash@3
            displayName: "Run busybox in namespace"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                REGISTRY="artifactory.fcbint.net"
                REPO="camdepositsharedservices-docker-dev"
                IMAGE_TAG="1.36"

                echo "=== Checking if busybox pod is already running ==="
                if oc get pod busybox -n "$OC_NS" --no-headers 2>/dev/null | grep -q "Running"; then
                  echo "busybox pod is already running, skipping deploy."
                  oc get pod busybox -n "$OC_NS" -o wide
                  exit 0
                fi

                echo ""
                echo "=== Cleaning up any existing non-Running busybox pod ==="
                oc delete pod busybox -n "$OC_NS" --ignore-not-found --wait=true

                echo ""
                echo "=== Deploying busybox pod in $OC_NS ==="
                cat <<EOF | oc apply -f -
                apiVersion: v1
                kind: Pod
                metadata:
                  name: busybox
                  namespace: $OC_NS
                  labels:
                    app.kubernetes.io/name: busybox
                    app.kubernetes.io/instance: busybox
                    app.kubernetes.io/component: network-test
                    fcbint.net/app-id: "11547"
                spec:
                  restartPolicy: Never
                  containers:
                    - name: busybox
                      image: $REGISTRY/$REPO/busybox:$IMAGE_TAG
                      command: ["sleep", "3600"]
                      resources:
                        requests:
                          cpu: "10m"
                          memory: "16Mi"
                        limits:
                          cpu: "100m"
                          memory: "64Mi"
                      readinessProbe:
                        exec:
                          command: ["true"]
                        periodSeconds: 10
                      livenessProbe:
                        exec:
                          command: ["true"]
                        periodSeconds: 30
                EOF

                echo ""
                echo "=== Waiting for pod to be ready ==="
                oc wait --for=condition=Ready pod/busybox -n "$OC_NS" --timeout=120s

                echo ""
                echo "=== Pod status ==="
                oc get pod busybox -n "$OC_NS" -o wide
            env:
              OC_NS: $(openshift-dev-namespace)

          - task: Bash@3
            displayName: "DNS Resolution Test"
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                test_dns() {
                  local host=$1
                  local label=$2
                  echo ""
                  echo "--- $label: $host ---"
                  oc exec busybox -n "$OC_NS" -- nslookup "$host" 2>&1 || echo "FAIL: DNS lookup failed for $host"
                }

                echo "=== SQL Server ==="
                test_dns "$DB_HOST" "SQL Server"

                echo ""
                echo "=== Kafka Brokers ==="
                IFS=',' read -ra BROKERS <<< "$KAFKA_BROKERS"
                for broker in "${BROKERS[@]}"; do
                  test_dns "$broker" "Kafka broker"
                done

                echo ""
                echo "=== Schema Registry ==="
                IFS=',' read -ra SR_HOSTS <<< "$SCHEMA_REGISTRY_HOSTS"
                for sr in "${SR_HOSTS[@]}"; do
                  test_dns "$sr" "Schema Registry"
                done

                echo ""
                echo "=== Kafka REST Proxy ==="
                IFS=',' read -ra REST_HOSTS <<< "$REST_PROXY_HOSTS"
                for rp in "${REST_HOSTS[@]}"; do
                  test_dns "$rp" "Kafka REST Proxy"
                done

                echo ""
                echo "=== NetApp S3 ==="
                S3_HOST=$(echo "$S3_URL" | sed -E 's|^https?://||; s|/.*$||')
                test_dns "$S3_HOST" "NetApp S3"

                echo ""
                echo "=== DNS resolution test complete ==="
            env:
              OC_NS: $(openshift-dev-namespace)
              DB_HOST: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
              KAFKA_BROKERS: $(${{ parameters.environment }}-kafka-broker-hosts)
              SCHEMA_REGISTRY_HOSTS: $(${{ parameters.environment }}-schema-registry-hosts)
              REST_PROXY_HOSTS: $(${{ parameters.environment }}-kafka-rest-proxy-hosts)
              S3_URL: $(${{ parameters.environment }}-net-app-s3-url)

          - task: Bash@3
            displayName: "Connectivity Test"
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                test_connection() {
                  local host=$1
                  local port=$2
                  local label=$3
                  echo ""
                  echo "--- $label: $host:$port ---"
                  if oc exec busybox -n "$OC_NS" -- nc -zv -w 5 "$host" "$port" 2>&1; then
                    echo "OK: $label reachable at $host:$port"
                  else
                    echo "FAIL: $label unreachable at $host:$port"
                  fi
                }

                echo "=== SQL Server ==="
                test_connection "$DB_HOST" 3085 "SQL Server"

                echo ""
                echo "=== Kafka Brokers ==="
                IFS=',' read -ra BROKERS <<< "$KAFKA_BROKERS"
                for broker in "${BROKERS[@]}"; do
                  test_connection "$broker" 9092 "Kafka broker (plaintext)"
                  test_connection "$broker" 9094 "Kafka broker (TLS)"
                done

                echo ""
                echo "=== Schema Registry ==="
                IFS=',' read -ra SR_HOSTS <<< "$SCHEMA_REGISTRY_HOSTS"
                for sr in "${SR_HOSTS[@]}"; do
                  test_connection "$sr" 8081 "Schema Registry"
                done

                echo ""
                echo "=== Kafka REST Proxy ==="
                IFS=',' read -ra REST_HOSTS <<< "$REST_PROXY_HOSTS"
                for rp in "${REST_HOSTS[@]}"; do
                  test_connection "$rp" 8082 "Kafka REST Proxy"
                done

                echo ""
                echo "=== NetApp S3 ==="
                S3_HOST=$(echo "$S3_URL" | sed -E 's|^https?://||; s|/.*$||')
                test_connection "$S3_HOST" 443 "NetApp S3 (HTTPS)"

                echo ""
                echo "=== Connectivity test complete ==="
            env:
              OC_NS: $(openshift-dev-namespace)
              DB_HOST: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
              KAFKA_BROKERS: $(${{ parameters.environment }}-kafka-broker-hosts)
              SCHEMA_REGISTRY_HOSTS: $(${{ parameters.environment }}-schema-registry-hosts)
              REST_PROXY_HOSTS: $(${{ parameters.environment }}-kafka-rest-proxy-hosts)
              S3_URL: $(${{ parameters.environment }}-net-app-s3-url)

          # Kafka authz probe via REST Proxy (dev only). Debugging the
          # aep-rate-limit-job TopicAuthorizationException: the job's OAuth
          # token authenticates (sub=clientId, scp=[11547.DAH(Dev)] verified)
          # but the broker denies topic metadata. This step reproduces the
          # exact authz tuple outside Flink: it fetches a token on the AGENT
          # (curl) using the same clientId/clientSecret/scope the job uses
          # (parsed from kafka-sasl-jaas-config), then calls the REST Proxy
          # v3 API from the busybox pod (in-namespace network position).
          # Output answers three questions the platform team needs:
          #   1. CLUSTER ID we actually connect to (compare with what they check)
          #   2. which topics this principal can see (partial list = binding gap)
          #   3. describe on the target topic (403 = denial reproduced,
          #      404 = topic name mismatch)
          - ${{ if eq(parameters.environment, 'dev') }}:
            - task: Bash@3
              displayName: "Kafka REST Proxy authz test (dev)"
              inputs:
                targetType: inline
                script: |
                  set -uo pipefail

                  TOPIC="cdc-dihdah-d-accountsnapshot.DAH.CoreBankingReporting.AccountSnapshot"
                  SCOPE="11547.DAH(Dev)"

                  # clientId/clientSecret are embedded in the JAAS string
                  CLIENT_ID=$(echo "$JAAS" | sed -E 's/.*clientId="([^"]+)".*/\1/')
                  CLIENT_SECRET=$(echo "$JAAS" | sed -E 's/.*clientSecret="([^"]+)".*/\1/')

                  echo "=== Fetching OAuth token (clientId=$CLIENT_ID scope=$SCOPE) ==="
                  TOKEN=$(curl -s -k -u "$CLIENT_ID:$CLIENT_SECRET" \
                    -d "grant_type=client_credentials" \
                    --data-urlencode "scope=$SCOPE" \
                    https://myapps.firstcitizens.com/oauth2/default/v1/token \
                    | sed -E 's/.*"access_token":"([^"]+)".*/\1/')
                  if [ -z "${TOKEN:-}" ] || [ "${#TOKEN}" -lt 100 ]; then
                    echo "FAIL: could not obtain OAuth token"; exit 1
                  fi
                  echo "Token obtained (${#TOKEN} chars). Decoded claims:"
                  P=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+')
                  case $(( ${#P} % 4 )) in 2) P="$P==";; 3) P="$P=";; esac
                  echo "$P" | base64 -d 2>/dev/null || true; echo

                  IFS=',' read -ra REST_HOSTS <<< "$REST_PROXY_HOSTS"
                  RP="${REST_HOSTS[0]}"

                  # Detect which scheme the proxy speaks (one-time), then reuse it
                  echo ""
                  echo "=== Detecting REST Proxy scheme on $RP:8082 ==="
                  SCHEME=""
                  if oc exec busybox -n "$OC_NS" -- wget -qO- \
                       --header "Authorization: Bearer $TOKEN" \
                       "http://$RP:8082/v3/clusters" >/tmp/clusters.json 2>/dev/null; then
                    SCHEME="http"
                  elif oc exec busybox -n "$OC_NS" -- wget -qO- --no-check-certificate \
                       --header "Authorization: Bearer $TOKEN" \
                       "https://$RP:8082/v3/clusters" >/tmp/clusters.json 2>/dev/null; then
                    SCHEME="https"
                  fi
                  if [ -z "$SCHEME" ]; then
                    echo "FAIL: REST Proxy answered on neither http nor https. Verbose attempts:"
                    oc exec busybox -n "$OC_NS" -- wget -O- \
                      --header "Authorization: Bearer $TOKEN" \
                      "http://$RP:8082/v3/clusters" 2>&1 || true
                    oc exec busybox -n "$OC_NS" -- wget -O- --no-check-certificate \
                      --header "Authorization: Bearer $TOKEN" \
                      "https://$RP:8082/v3/clusters" 2>&1 || true
                    exit 1
                  fi
                  echo "REST Proxy scheme: $SCHEME"

                  rp_get() {
                    oc exec busybox -n "$OC_NS" -- wget -qO- --no-check-certificate \
                      --header "Authorization: Bearer $TOKEN" \
                      "$SCHEME://$RP:8082$1" 2>&1
                  }

                  echo ""
                  echo "=== 1. Cluster ID ==="
                  cat /tmp/clusters.json; echo
                  CLUSTER_ID=$(sed -E 's/.*"cluster_id":"([^"]+)".*/\1/' /tmp/clusters.json)
                  echo ""
                  echo ">>> CLUSTER_ID: $CLUSTER_ID"

                  echo ""
                  echo "=== 2. Topics visible to this principal ==="
                  rp_get "/v3/clusters/$CLUSTER_ID/topics" \
                    | tr ',' '\n' | grep -o '"topic_name":"[^"]*"' \
                    || { echo "(no topics returned -- raw response below)"; rp_get "/v3/clusters/$CLUSTER_ID/topics" || true; }

                  echo ""
                  echo "=== 3. Describe target topic: $TOPIC ==="
                  rp_get "/v3/clusters/$CLUSTER_ID/topics/$TOPIC" \
                    || echo "FAIL (403 = authz denial reproduced; 404 = topic name not found on this cluster)"

                  echo ""
                  echo "=== Kafka REST Proxy authz test complete ==="
              env:
                OC_NS: $(openshift-dev-namespace)
                REST_PROXY_HOSTS: $(${{ parameters.environment }}-kafka-rest-proxy-hosts)
                JAAS: $(kafka-sasl-jaas-config)
