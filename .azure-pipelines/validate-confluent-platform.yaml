trigger: none

parameters:
  - name: adHocCommand
    displayName: "Ad hoc command to execute (leave blank to skip)"
    type: string
    default: ""
    # Example: oc apply --dry-run=server -f apps/confluent-platform/dev/kafkarestclass.yaml

pool:
  name: DevOpsLinux

steps:
  - checkout: self

  - ${{ if ne(parameters.adHocCommand, '') }}:
    - task: Bash@3
      displayName: "Execute ad hoc command"
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          echo "=== Executing ad hoc command ==="
          echo "Command: $AD_HOC_CMD"
          echo ""
          eval "$AD_HOC_CMD"
      env:
        AD_HOC_CMD: ${{ parameters.adHocCommand }}

  - task: Bash@3
    displayName: "Verify validation prerequisites"
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        command -v python3
        python3 --version
        command -v bash
        command -v sha256sum

        python3 - <<'PY'
        try:
            import yaml
            print(f"PyYAML available: {yaml.__version__}")
        except ImportError:
            raise SystemExit(
                "FATAL: PyYAML is unavailable on this build agent"
            )
        PY

  - task: Bash@3
    displayName: "Run CFK regression tests"
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        chmod +x .azure-pipelines/test-pipeline-corrections.sh
        chmod +x .azure-pipelines/scripts/*.py

        ./.azure-pipelines/test-pipeline-corrections.sh
