trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat-p, uat-s, prd, dr]

  - name: executeAdHocScript
    displayName: "Execute ad-hoc-oc-scripts.sh"
    type: boolean
    default: false
    # When checked: runs .azure-pipelines/scripts/ad-hoc-oc-scripts.sh against the target environment
    # Audits all managed-component OAuth identities and RBAC bindings
    # Edit the script locally to modify audit logic, commit, and re-run the pipeline
    # Useful for debugging OAuth/RBAC issues without local oc access (e.g., Zscaler-blocked laptops)

  - name: executeAdHocCommand
    displayName: "Execute ad hoc command"
    type: boolean
    default: false
    # When checked: runs the command below against the target environment
    # Useful for one-off debugging queries

  - name: adHocCommand
    displayName: "Ad hoc command (optional — only used if checkbox above is checked)"
    type: string
    default: "oc status"
    # Examples:
    #   oc apply --dry-run=server -f apps/confluent-platform/dev/kafkarestclass.yaml
    #   oc get kafka -n dah-flink-dev
    #   oc get pod -n dah-flink-dev
    #   kubectl get namespaces

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat-p') }}:
    - group: kafka-openshift-credentials-uat-p
  - ${{ if eq(parameters.environment, 'uat-s') }}:
    - group: kafka-openshift-credentials-uat-s
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: ValidateCFK
    displayName: "Validate Confluent Platform (${{ parameters.environment }})"
    pool:
      name: DevOpsLinux
    jobs:
      - job: ValidateCFK
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift (${{ parameters.environment }})"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API for environment: $TARGET_ENV..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              TARGET_ENV: ${{ parameters.environment }}
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "Validate Dynatrace metrics wiring (${{ parameters.environment }})"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                chmod +x .azure-pipelines/scripts/validate-dynatrace-metrics.sh
                STRICT=1 .azure-pipelines/scripts/validate-dynatrace-metrics.sh
            env:
              TARGET_ENV: ${{ parameters.environment }}
              OC_NS: $(openshift-namespace)

          - ${{ if and(eq(parameters.executeAdHocCommand, true), ne(parameters.adHocCommand, '')) }}:
            - task: Bash@3
              displayName: "Execute ad hoc command (${{ parameters.environment }})"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail
                  echo "=== Executing ad hoc command for environment: $TARGET_ENV ==="
                  echo "=== OpenShift: $OC_API | Namespace: $OC_NS ==="
                  echo ""
                  echo "=== Command output ==="
                  eval "$AD_HOC_CMD"
                  echo ""
                  echo "=== Command execution completed ==="
              env:
                TARGET_ENV: ${{ parameters.environment }}
                AD_HOC_CMD: ${{ parameters.adHocCommand }}
                OC_API: $(openshift-api)
                OC_NS: $(openshift-namespace)

          - ${{ if eq(parameters.executeAdHocScript, true) }}:
            - task: Bash@3
              displayName: "Execute ad-hoc-oc-scripts.sh (${{ parameters.environment }})"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail
                  echo "=== Executing ad-hoc-oc-scripts.sh for environment: $TARGET_ENV ==="
                  echo "=== OpenShift: $OC_API | Namespace: $OC_NS ==="
                  echo ""
                  chmod +x .azure-pipelines/scripts/ad-hoc-oc-scripts.sh
                  .azure-pipelines/scripts/ad-hoc-oc-scripts.sh logs
              env:
                TARGET_ENV: ${{ parameters.environment }}
                OC_API: $(openshift-api)
                OC_NS: $(openshift-namespace)

