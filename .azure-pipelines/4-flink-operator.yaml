# 4. Flink Operator — Confluent Flink Kubernetes Operator
#
# Required pipeline variables:
#   OPENSHIFT_SERVER  — OpenShift API URL
#   OPENSHIFT_TOKEN   — oc login token (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]

variables:
  ENV: ${{ parameters.environment }}
  NS: "dah-kafka-${{ parameters.environment }}"

stages:
  - stage: FlinkOperator
    displayName: "Flink Operator (${{ parameters.environment }})"
    jobs:
      - job: FlinkOperator
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: HelmInstaller@1
            displayName: "Install Helm"
            inputs:
              helmVersionToInstall: "3.14.0"

          - task: Bash@3
            displayName: "Install oc CLI"
            inputs:
              targetType: inline
              script: |
                curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                  | tar xz -C /usr/local/bin oc kubectl

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                oc login "$(OPENSHIFT_SERVER)" --token="$(OPENSHIFT_TOKEN)" --insecure-skip-tls-verify

          - task: Bash@3
            displayName: "Add Helm repo"
            inputs:
              targetType: inline
              script: |
                helm repo add confluent https://packages.confluent.io/helm 2>/dev/null || true
                helm repo update confluent

          - task: Bash@3
            displayName: "Install Flink Operator"
            inputs:
              targetType: inline
              script: |
                helm upgrade --install confluent-flink-operator confluent/flink-kubernetes-operator \
                  --namespace $(NS) \
                  --version 1.130.2 \
                  -f apps/confluent-flink-operator/$(ENV)/values.yaml \
                  -f apps/confluent-flink-operator/openshift-overlay.yaml \
                  --wait --timeout 3m

          - task: Bash@3
            displayName: "Verify"
            inputs:
              targetType: inline
              script: |
                helm status confluent-flink-operator -n $(NS)
                echo ""
                oc get pods -n $(NS) -l app.kubernetes.io/name=flink-kubernetes-operator
