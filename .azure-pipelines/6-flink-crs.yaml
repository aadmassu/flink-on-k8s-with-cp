# 6. Flink CRs — CMFRestClass, FlinkEnvironment, PVC, session cluster
#
# Required pipeline variables (via Openshift-ROSA-VAR-Groups):
#   OPENSHIFT_SERVER  — OpenShift API URL
#   OPENSHIFT_TOKEN   — oc login token (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]

variables:
  - group: Openshift-ROSA-VAR-Groups
  - name: ENV
    value: ${{ parameters.environment }}
  - name: NS
    value: "dah-kafka-${{ parameters.environment }}"

stages:
  - stage: FlinkCRs
    displayName: "Flink CRs (${{ parameters.environment }})"
    jobs:
      - job: FlinkCRs
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - task: Bash@3
            displayName: "Install oc CLI"
            inputs:
              targetType: inline
              script: |
                curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                  | tar xz -C /usr/local/bin oc kubectl

          - task: Bash@3
            displayName: "Login + Apply Flink CRs"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                oc login "$(OPENSHIFT_SERVER)" --token="$(OPENSHIFT_TOKEN)" --insecure-skip-tls-verify
                oc whoami

                oc apply -f apps/confluent-flink/$(ENV)/
                echo "Flink CRs applied."

                echo "Waiting for FlinkDeployment..."
                RETRIES=0
                until oc get flinkdeployment flink-session -n $(NS) &>/dev/null; do
                  RETRIES=$((RETRIES + 1))
                  if [ "$RETRIES" -ge 30 ]; then echo "ERROR: FlinkDeployment not found."; exit 1; fi
                  sleep 5
                done
                oc wait --for=jsonpath='{.status.jobManagerDeploymentStatus}'=READY \
                  flinkdeployment/flink-session -n $(NS) --timeout=300s
                echo "Flink session cluster is READY."

                echo ""
                echo "=== Flink CRs ==="
                oc get flinkdeployment,flinkenvironment,cmfrestclass,pvc -n $(NS)
                echo ""
                echo "=== Flink Pods ==="
                oc get pods -n $(NS) -l app=flink-session
