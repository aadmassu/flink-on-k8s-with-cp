# Scenario 1: Full deployment - Install ArgoCD + all operators
# Use this pipeline when deploying to a cluster that does NOT have ArgoCD installed.
#
# This pipeline:
#   1. Installs ArgoCD via Helm
#   2. Deploys cert-manager (via ArgoCD Application)
#   3. Deploys Confluent Operator and Flink Operator (via ArgoCD Applications)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values:
      - dev
      - qa
      - stg
      - prd

  - name: kubernetesServiceConnection
    displayName: "Kubernetes Service Connection"
    type: string
    default: "<your-service-connection>"

  - name: argocdNamespace
    displayName: "ArgoCD Namespace"
    type: string
    default: argocd

variables:
  ENV: ${{ parameters.environment }}
  ARGOCD_NS: ${{ parameters.argocdNamespace }}

stages:
  - stage: Deploy
    displayName: "Deploy ArgoCD + Operators (${{ parameters.environment }})"
    jobs:
      - job: FullDeploy
        displayName: "Full Deployment"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: HelmInstaller@1
            displayName: "Install Helm"
            inputs:
              helmVersionToInstall: "3.14.0"

          - task: KubernetesManifest@1
            displayName: "Set Kubernetes context"
            inputs:
              action: "reject"
              kubernetesServiceConnection: ${{ parameters.kubernetesServiceConnection }}

          - task: Bash@3
            displayName: "Verify cluster connectivity"
            inputs:
              targetType: inline
              script: |
                kubectl cluster-info
                kubectl get nodes

          - task: Bash@3
            displayName: "Add Helm repositories"
            inputs:
              targetType: inline
              script: |
                helm repo add argo-cd https://argoproj.github.io/argo-helm 2>/dev/null || true
                helm repo add confluent https://packages.confluent.io/helm 2>/dev/null || true
                helm repo add jetstack https://charts.jetstack.io 2>/dev/null || true
                helm repo update

          - task: HelmDeploy@1
            displayName: "Install ArgoCD"
            inputs:
              connectionType: "Kubernetes Service Connection"
              kubernetesServiceConnection: ${{ parameters.kubernetesServiceConnection }}
              namespace: $(ARGOCD_NS)
              command: "upgrade"
              chartType: "Name"
              chartName: "argo-cd/argo-cd"
              releaseName: "argocd"
              arguments: "--install --create-namespace -f apps/argocd/$(ENV)/values.yaml --wait --timeout 5m"

          - task: Bash@3
            displayName: "Wait for ArgoCD pods"
            inputs:
              targetType: inline
              script: |
                kubectl wait --for=condition=Ready pod \
                  -l app.kubernetes.io/part-of=argocd \
                  -n $(ARGOCD_NS) --timeout=300s

          - task: Bash@3
            displayName: "Deploy cert-manager"
            inputs:
              targetType: inline
              script: |
                kubectl apply -f apps/cert-manager/$(ENV)/app.yaml

                echo "Waiting for cert-manager to become healthy..."
                kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
                  application/cert-manager-$(ENV) \
                  -n $(ARGOCD_NS) --timeout=180s

                echo "Verifying cert-manager pods..."
                kubectl get pods -n cert-manager

          - task: Bash@3
            displayName: "Deploy Confluent Operator"
            inputs:
              targetType: inline
              script: |
                kubectl apply -f apps/confluent-operator/$(ENV)/app.yaml

                echo "Waiting for Confluent Operator to become healthy..."
                kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
                  application/confluent-operator-$(ENV) \
                  -n $(ARGOCD_NS) --timeout=180s

          - task: Bash@3
            displayName: "Deploy Flink Operator"
            inputs:
              targetType: inline
              script: |
                kubectl apply -f apps/confluent-flink-operator/$(ENV)/app.yaml

                echo "Waiting for Flink Operator to become healthy..."
                kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
                  application/confluent-flink-operator-$(ENV) \
                  -n $(ARGOCD_NS) --timeout=180s

          - task: Bash@3
            displayName: "Verify deployment"
            inputs:
              targetType: inline
              script: |
                echo "=== ArgoCD Applications ==="
                kubectl get applications -n $(ARGOCD_NS) \
                  -o custom-columns=NAME:.metadata.name,HEALTH:.status.health.status,SYNC:.status.sync.status

                echo ""
                echo "=== Operator Pods ==="
                kubectl get pods -n confluent-$(ENV)
                kubectl get pods -n cert-manager
