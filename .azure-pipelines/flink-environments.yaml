# Pipeline:  flink-environments
# Purpose:   Create Flink environments and Kafka catalogs via CMF REST API
# Author:    Ayele Admassu
# Created:   2026-04-20
#
# Variable Group: <env>-openshift-credentials
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-dev-api               — OpenShift API server URL
#   openshift-dev-namespace         — target namespace

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: uat-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: FlinkEnvironments
    displayName: "Flink Environments & Catalogs (${{ parameters.environment }})"
    jobs:
      - job: FlinkEnvironments
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify
                oc whoami
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-dev-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-dev-namespace)

          - task: Bash@3
            displayName: "Apply Flink environment and catalog"
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                ENV_NAME="${{ parameters.environment }}"
                ENV_FILE="apps/confluent-flink/$ENV_NAME/environment.json"
                CATALOG_FILE="apps/confluent-flink/$ENV_NAME/kafka-catalog.json"
                DB_FILE="apps/confluent-flink/$ENV_NAME/kafka-database.json"

                if [ ! -f "$ENV_FILE" ]; then
                  echo "ERROR: $ENV_FILE not found"
                  exit 1
                fi

                API_SERVER=$(oc whoami --show-server)
                OC_TOKEN=$(oc whoami -t)
                PROXY_BASE="$API_SERVER/api/v1/namespaces/$OC_NS/services/cmf-service:80/proxy"

                # Extract top-level "name" (environment) or "metadata.name" (catalog/database)
                json_name() {
                  python3 -c "import json,sys; d=json.load(open('$1')); print(d.get('name') or d.get('metadata',{}).get('name',''))"
                }

                call_cmf() {
                  local method=$1
                  local path=$2
                  local file=${3:-}
                  if [ -n "$file" ]; then
                    curl -sS -k -X "$method" \
                      -H "Authorization: Bearer $OC_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data-binary "@$file" \
                      "$PROXY_BASE$path"
                  else
                    curl -sS -k -X "$method" \
                      -H "Authorization: Bearer $OC_TOKEN" \
                      "$PROXY_BASE$path"
                  fi
                }

                # POST if not exists, skip if exists (409 safe)
                create_if_missing() {
                  local collection_path=$1
                  local item_path=$2
                  local file=$3
                  local label=$4
                  local name=$5

                  echo ""
                  echo "=== $label: $name ==="
                  http_code=$(curl -sS -k -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $OC_TOKEN" \
                    "$PROXY_BASE$item_path")
                  if [ "$http_code" = "200" ]; then
                    echo "$label '$name' already exists, skipping."
                    return 0
                  fi
                  echo "Creating $label '$name' with POST to $collection_path..."
                  call_cmf POST "$collection_path" "$file"
                  echo ""
                }

                echo "=== Waiting for CMF pod to be Ready ==="
                oc wait --for=condition=Ready pod \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -n "$OC_NS" --timeout=180s

                echo ""
                echo "=== CMF pod status ==="
                oc get pods -n "$OC_NS" -l app.kubernetes.io/name=confluent-manager-for-apache-flink
                oc get endpoints cmf-service -n "$OC_NS"

                echo ""
                echo "=== Verifying CMF is reachable ==="
                call_cmf GET "/cmf/api/v1/environments" | head -50 || {
                  echo "ERROR: CMF not reachable via proxy"
                  exit 1
                }

                # 1) Environment (POST = create-or-update per spec)
                ENV_FILE_NAME=$(json_name "$ENV_FILE")
                echo ""
                echo "=== Environment: $ENV_FILE_NAME (upsert) ==="
                call_cmf POST "/cmf/api/v1/environments" "$ENV_FILE"
                echo ""

                # 2) Kafka Catalog (top-level)
                if [ -f "$CATALOG_FILE" ]; then
                  CAT_NAME=$(json_name "$CATALOG_FILE")
                  create_if_missing \
                    "/cmf/api/v1/catalogs/kafka" \
                    "/cmf/api/v1/catalogs/kafka/$CAT_NAME" \
                    "$CATALOG_FILE" \
                    "Kafka Catalog" "$CAT_NAME"
                fi

                # 3) Kafka Database (nested under catalog)
                if [ -f "$DB_FILE" ] && [ -n "${CAT_NAME:-}" ]; then
                  DB_NAME=$(json_name "$DB_FILE")
                  create_if_missing \
                    "/cmf/api/v1/catalogs/kafka/$CAT_NAME/databases" \
                    "/cmf/api/v1/catalogs/kafka/$CAT_NAME/databases/$DB_NAME" \
                    "$DB_FILE" \
                    "Kafka Database" "$DB_NAME"
                fi

                echo ""
                echo "=== Current environments ==="
                call_cmf GET "/cmf/api/v1/environments" | head -100
                echo ""
                echo "=== Current Kafka catalogs ==="
                call_cmf GET "/cmf/api/v1/catalogs/kafka" | head -100
                if [ -n "${CAT_NAME:-}" ]; then
                  echo ""
                  echo "=== Current databases in $CAT_NAME ==="
                  call_cmf GET "/cmf/api/v1/catalogs/kafka/$CAT_NAME/databases" | head -100
                fi
                echo ""
                echo "=== Done ==="
            env:
              OC_NS: $(openshift-dev-namespace)
