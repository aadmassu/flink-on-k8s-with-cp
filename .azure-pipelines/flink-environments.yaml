# Pipeline:  flink-environments
# Purpose:   Create Flink environments and Kafka catalogs via CMF REST API
# Author:    Ayu Admassu
# Created:   2026-04-20
#
# Variable Group: kafka-openshift-credentials-<env>
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-api               — OpenShift API server URL
#   openshift-namespace         — target namespace
#
# Source files (per env, JSON — POSTed verbatim, no transformation):
#   apps/confluent-flink/<env>/environment.json
#   apps/confluent-flink/<env>/kafka-catalog.json
#   apps/confluent-flink/<env>/kafka-database.json

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat-p, uat-s, prd, dr]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat-p') }}:
    - group: kafka-openshift-credentials-uat-p
  - ${{ if eq(parameters.environment, 'uat-s') }}:
    - group: kafka-openshift-credentials-uat-s
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: FlinkEnvironments
    displayName: "Flink Environments & Catalogs (${{ parameters.environment }})"
    jobs:
      - job: FlinkEnvironments
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify
                oc whoami
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "Apply Flink environment and catalog"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                ENV_NAME="${{ parameters.environment }}"
                ENV_FILE="apps/confluent-flink/$ENV_NAME/environment.json"
                CATALOG_FILE="apps/confluent-flink/$ENV_NAME/kafka-catalog.json"
                DB_FILE="apps/confluent-flink/$ENV_NAME/kafka-database.json"

                for f in "$ENV_FILE" "$CATALOG_FILE" "$DB_FILE"; do
                  if [ ! -f "$f" ]; then
                    echo "ERROR: $f not found"
                    exit 1
                  fi
                done

                # Pre-flight: refuse to post if any REPLACE_WITH_ marker is
                # still present. qa / uat / prd JSON files ship with marker
                # placeholders for the env-specific Kafka brokers and SR URL;
                # this catches unfilled values before they reach CMF.
                if grep -nE 'REPLACE_WITH_' "$ENV_FILE" "$CATALOG_FILE" "$DB_FILE"; then
                  echo ""
                  echo "ERROR: REPLACE_WITH_ placeholder(s) above are unresolved."
                  echo "Update apps/confluent-flink/$ENV_NAME/*.json with the"
                  echo "env-specific Kafka broker hosts and Schema Registry URL"
                  echo "before running this pipeline."
                  exit 1
                fi

                # Names are knowable from the env parameter — no JSON parsing
                # needed. Catalog name is a constant across envs.
                FLINK_ENV="dah-flink-$ENV_NAME"
                CAT_NAME="fcb-catalog"
                DB_NAME="dah-kafka-$ENV_NAME"

                API_SERVER=$(oc whoami --show-server)
                OC_TOKEN=$(oc whoami -t)
                PROXY_BASE="$API_SERVER/api/v1/namespaces/$OC_NS/services/https:cmf-service:443/proxy"

                # Portable equivalent of `curl --fail-with-body` (that flag is curl
                # 7.76+ / Apr-2021 — older than the DevOpsLinux agent's curl). Writes
                # response body to a temp file, captures the HTTP status code via -w,
                # prints the body so CMF's error message is visible, and returns
                # non-zero on any 4xx/5xx so `set -e` aborts the script. If we ever
                # bump to a newer agent image, the one-liner with --fail-with-body
                # remains the simpler form.
                cmf_post() {
                  local path=$1
                  local file=$2
                  local body http
                  body=$(mktemp)
                  http=$(curl -sS -k -X POST \
                    -H "Authorization: Bearer $OC_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data-binary "@$file" \
                    -o "$body" -w "%{http_code}" \
                    "$PROXY_BASE$path")
                  cat "$body"; echo
                  rm -f "$body"
                  if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
                    echo "ERROR: POST $path failed with HTTP $http"
                    return 1
                  fi
                }

                cmf_get() {
                  local path=$1
                  curl -sS -k \
                    -H "Authorization: Bearer $OC_TOKEN" \
                    "$PROXY_BASE$path"
                }

                cmf_status() {
                  local path=$1
                  curl -sS -k -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $OC_TOKEN" \
                    "$PROXY_BASE$path"
                }

                # POST if not exists, skip if exists.
                create_if_missing() {
                  local collection_path=$1
                  local item_path=$2
                  local file=$3
                  local label=$4
                  local name=$5

                  echo ""
                  echo "=== $label: $name ==="
                  local code
                  code=$(cmf_status "$item_path")
                  if [ "$code" = "200" ]; then
                    echo "$label '$name' already exists, skipping."
                    return 0
                  fi
                  echo "Creating $label '$name' with POST to $collection_path..."
                  cmf_post "$collection_path" "$file"
                  echo ""
                }

                echo "=== Waiting for CMF pod to be Ready ==="
                oc wait --for=condition=Ready pod \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -n "$OC_NS" --timeout=180s

                echo ""
                echo "=== CMF pod status ==="
                oc get pods -n "$OC_NS" -l app.kubernetes.io/name=confluent-manager-for-apache-flink
                oc get endpoints cmf-service -n "$OC_NS"

                echo ""
                echo "=== Verifying CMF is reachable ==="
                cmf_get "/cmf/api/v1/environments" | head -50 || {
                  echo "ERROR: CMF not reachable via proxy"
                  exit 1
                }

                # 1) Environment (POST = create-or-update per spec)
                echo ""
                echo "=== Environment: $FLINK_ENV (upsert) ==="
                cmf_post "/cmf/api/v1/environments" "$ENV_FILE"
                echo ""

                # 2) Kafka Catalog
                create_if_missing \
                  "/cmf/api/v1/catalogs/kafka" \
                  "/cmf/api/v1/catalogs/kafka/$CAT_NAME" \
                  "$CATALOG_FILE" \
                  "Kafka Catalog" "$CAT_NAME"

                # 3) Kafka Database (nested under catalog)
                create_if_missing \
                  "/cmf/api/v1/catalogs/kafka/$CAT_NAME/databases" \
                  "/cmf/api/v1/catalogs/kafka/$CAT_NAME/databases/$DB_NAME" \
                  "$DB_FILE" \
                  "Kafka Database" "$DB_NAME"

                echo ""
                echo "=== Current environments ==="
                cmf_get "/cmf/api/v1/environments" | head -100
                echo ""
                echo "=== Current Kafka catalogs ==="
                cmf_get "/cmf/api/v1/catalogs/kafka" | head -100
                echo ""
                echo "=== Current databases in $CAT_NAME ==="
                cmf_get "/cmf/api/v1/catalogs/kafka/$CAT_NAME/databases" | head -100
                echo ""
                echo "=== Done ==="
            env:
              OC_NS: $(openshift-namespace)
