# Pipeline:  flink-environments
# Purpose:   Create Flink environments and Kafka catalogs via CMF REST API
# Author:    Ayele Admassu
# Created:   2026-04-20
#
# Variable Group: <env>-openshift-credentials
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-dev-api               — OpenShift API server URL
#   openshift-dev-namespace         — target namespace

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'stg') }}:
    - group: stg-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: FlinkEnvironments
    displayName: "Flink Environments & Catalogs (${{ parameters.environment }})"
    jobs:
      - job: FlinkEnvironments
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify
                oc whoami
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-dev-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-dev-namespace)

          - task: Bash@3
            displayName: "Apply Flink environment and catalog"
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                ENV_NAME="${{ parameters.environment }}"
                ENV_FILE="apps/confluent-flink/$ENV_NAME/environment.json"
                DB_FILE="apps/confluent-flink/$ENV_NAME/kafka-database.json"

                if [ ! -f "$ENV_FILE" ]; then
                  echo "ERROR: $ENV_FILE not found"
                  exit 1
                fi

                # Use OpenShift API proxy to reach CMF's internal service.
                # No port-forward, no ingress — authenticates via the current oc token.
                API_SERVER=$(oc whoami --show-server)
                OC_TOKEN=$(oc whoami -t)
                PROXY_BASE="$API_SERVER/api/v1/namespaces/$OC_NS/services/cmf-service:80/proxy"

                # Extract "name" field from a JSON file using grep/sed
                json_name() {
                  grep -o '"name"[[:space:]]*:[[:space:]]*"[^"]*"' "$1" | head -1 | sed -E 's/.*"name"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/'
                }

                call_cmf() {
                  local method=$1
                  local path=$2
                  local file=${3:-}

                  if [ -n "$file" ]; then
                    curl -sS -k -X "$method" \
                      -H "Authorization: Bearer $OC_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data-binary "@$file" \
                      "$PROXY_BASE$path"
                  else
                    curl -sS -k -X "$method" \
                      -H "Authorization: Bearer $OC_TOKEN" \
                      "$PROXY_BASE$path"
                  fi
                }

                apply_resource() {
                  local path=$1
                  local file=$2
                  local name=$3
                  local label=$4

                  echo ""
                  echo "=== $label: $name ==="

                  http_code=$(curl -sS -k -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $OC_TOKEN" \
                    "$PROXY_BASE$path/$name")

                  if [ "$http_code" = "200" ]; then
                    echo "$label '$name' already exists, skipping create."
                    return 0
                  fi

                  echo "Creating $label '$name' with POST..."
                  call_cmf POST "$path" "$file"
                  echo ""
                }

                echo ""
                echo "=== Verifying CMF is reachable via OpenShift API proxy ==="
                echo "API server: $API_SERVER"
                call_cmf GET "/cmf/api/v1/environments" | head -50 || {
                  echo "ERROR: CMF not reachable via proxy"
                  exit 1
                }

                echo ""
                echo "=== Discovering CMF API paths (OpenAPI) ==="
                for openapi_path in "/v3/api-docs" "/swagger.json" "/openapi.json" "/cmf/api/v1/openapi.json"; do
                  code=$(curl -sS -k -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $OC_TOKEN" \
                    "$PROXY_BASE$openapi_path")
                  if [ "$code" = "200" ]; then
                    echo "Found OpenAPI at: $openapi_path"
                    call_cmf GET "$openapi_path" | grep -oE '"/cmf/api/v[0-9]+/[^"]*"' | sort -u | head -30
                    break
                  fi
                done

                ENV_FILE_NAME=$(json_name "$ENV_FILE")
                echo ""
                echo "Environment name parsed: '$ENV_FILE_NAME'"
                apply_resource "/cmf/api/v1/environments" "$ENV_FILE" "$ENV_FILE_NAME" "Environment"

                if [ -f "$DB_FILE" ]; then
                  DB_FILE_NAME=$(json_name "$DB_FILE")
                  echo ""
                  echo "Database name parsed: '$DB_FILE_NAME'"

                  # Try a few known CMF API paths for Kafka catalog/database registration
                  for candidate_path in \
                      "/cmf/api/v1/kafka-catalogs" \
                      "/cmf/api/v1/databases" \
                      "/cmf/api/v1/environments/$ENV_FILE_NAME/kafka-catalogs" \
                      "/cmf/api/v1/environments/$ENV_FILE_NAME/databases"; do
                    echo ""
                    echo "--- Trying path: $candidate_path ---"
                    code=$(curl -sS -k -o /dev/null -w "%{http_code}" \
                      -H "Authorization: Bearer $OC_TOKEN" \
                      "$PROXY_BASE$candidate_path")
                    echo "GET $candidate_path => HTTP $code"
                    if [ "$code" = "200" ]; then
                      echo "Found working endpoint: $candidate_path"
                      apply_resource "$candidate_path" "$DB_FILE" "$DB_FILE_NAME" "Kafka Database"
                      break
                    fi
                  done
                fi

                echo ""
                echo "=== Current environments ==="
                call_cmf GET "/cmf/api/v1/environments" | head -50

                echo ""
                echo "=== Done ==="
            env:
              OC_NS: $(openshift-dev-namespace)
