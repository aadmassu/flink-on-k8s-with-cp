# Pipeline:  confluent-platform
# Purpose:   Install or uninstall the CFK-managed Confluent Platform cluster
#            (KRaft controllers, brokers, Schema Registry, Connect, REST
#            Proxy, Control Center) in dah-flink-<env>. Applies the YAMLs
#            under apps/confluent-platform/<env>/ in CFK dependency order.
# Author:    Ayele Admassu
# Created:   2026-05-12
#
# Variable Group: kafka-openshift-credentials-<env>
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-api               — OpenShift API server URL
#   openshift-namespace         — target namespace (dah-flink-<env>)
#
# Prerequisite Secrets in the target namespace (created out-of-band; today
# pipeline-managed by a separate process, eventually CyberArk via ESO):
#   confluent-license, sasl-plain-internal, mds-token-keypair,
#   oauth-broker, oauth-schemaregistry, oauth-connect, oauth-kafkarest,
#   oauth-controlcenter, oauth-mds-rest, c3-prometheus-basic-auth,
#   c3-alertmanager-basic-auth.
# Pre-flight aborts if any are missing — see apps/confluent-platform/<env>/prereqs/README.md.
#
# The six *-tls Secrets (kafka-tls, kraftcontroller-tls, schemaregistry-tls,
# connect-tls, kafkarest-tls, controlcenter-tls) are *not* prerequisites;
# this pipeline creates the cert-manager Certificate CRs and waits for the
# Keyfactor-issued Secrets to land before applying the component CRs.

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd, dr]
  - name: action
    displayName: "Action"
    type: string
    default: install
    # wipe-pvcs: hard-delete the orphaned CFK PVCs (data0-kafka-*,
    # data0-kraftcontroller-*, data0-controlcenter-*). Intended for the
    # re-install flow after `uninstall` when the CRs are gone but PVCs
    # linger. Without a clean wipe, CFK re-creates the StatefulSet
    # without storageClassName on the vct (it expects to re-bind the
    # existing PVCs by name), which FCB Gatekeeper's [ceph-storage]
    # policy rejects ("storage class name <dummy>"). Run AFTER uninstall
    # and BEFORE install.
    #
    # clear-stuck-prereq-finalizers: recover from a stuck prereq Secret
    # left in Terminating state after an uninstall. Cascade-delete via
    # ownerReferences plus a CFK-stamped finalizer
    # (`secret.finalizers.platform.confluent.io/<cr>-<cr>`) can leave a
    # Secret with a deletionTimestamp set but not actually finalize.
    # The next install attempt's reconcile then fails with
    # "Secret X is invalid: metadata.finalizers: Forbidden: no new
    # finalizers can be added if the object is being deleted". This
    # action finds every Secret in the namespace that carries a
    # deletionTimestamp and patches its finalizers to []. The Secret
    # then completes deletion; the next `create-prereqs` re-creates it
    # fresh. See runbook/LESSONS_LEARNED.md A13.
    values: [create-prereqs, install, uninstall, wipe-pvcs, clear-stuck-prereq-finalizers]
  - name: forceFinalizerRemoval
    displayName: "Uninstall: force-clear finalizers on timeout"
    type: boolean
    default: false
    # Opt-in safety valve for the uninstall action. When `true`, after the
    # standard `oc delete --wait=true --timeout=5m` loop, any CR that's
    # still stuck with a deletionTimestamp gets its `metadata.finalizers`
    # patched to []  — but only when the underlying StatefulSet and Pods
    # are already gone (the typical Connect-stuck-on-broker-graceful-flush
    # scenario; runbook/LESSONS_LEARNED.md E3). Leave `false` for normal
    # operation so a genuine operator bug fails the pipeline loudly.

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: kafka-openshift-credentials-uat
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: ConfluentPlatform
    displayName: "Confluent Platform ${{ parameters.action }} (${{ parameters.environment }})"
    jobs:
      - job: ConfluentPlatform
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - ${{ if eq(parameters.action, 'create-prereqs') }}:
            - task: Bash@3
              displayName: "Create prerequisite Opaque Secrets and describe"
              inputs:
                targetType: inline
                script: |
                  set -uo pipefail

                  # Refuse to proceed if any required variable is empty.
                  # Listing them up front gives a clear miss-list before we try
                  # to create any Secret with empty values.
                  required_vars=(
                    CONFLUENT_LICENSE MDS_PEM
                    SASL_ADMIN SASL_CLIENT SASL_SR SASL_CONNECT SASL_REST SASL_C3
                    OAUTH_BROKER_ID OAUTH_BROKER_SECRET
                    OAUTH_SR_ID OAUTH_SR_SECRET
                    OAUTH_CONNECT_ID OAUTH_CONNECT_SECRET
                    OAUTH_REST_ID OAUTH_REST_SECRET
                    OAUTH_C3_ID OAUTH_C3_SECRET
                    OAUTH_MDS_REST_ID OAUTH_MDS_REST_SECRET
                    C3_PROM_USER C3_PROM_PWD
                    C3_ALERT_USER C3_ALERT_PWD
                  )
                  missing=0
                  for v in "${required_vars[@]}"; do
                    if [ -z "${!v:-}" ]; then
                      echo "MISS  $v"
                      missing=$((missing+1))
                    fi
                  done
                  if [ "$missing" -gt 0 ]; then
                    echo ""
                    echo "ERROR: $missing required variable(s) above are empty. Populate them"
                    echo "in variable group $TARGET_ENV-openshift-credentials before re-running."
                    echo "Variable naming mapping: apps/confluent-platform/$TARGET_ENV/prereqs/README.md"
                    exit 1
                  fi

                  # FCB Common Metadata standard requires these labels on every object.
                  label_secret() {
                    local name=$1
                    oc label --local --overwrite -f - --dry-run=client -o yaml \
                      app.kubernetes.io/name=confluent-platform \
                      app.kubernetes.io/instance="$name" \
                      app.kubernetes.io/component=cfk-prereq \
                      app.kubernetes.io/part-of=confluent-platform \
                      fcbint.net/app-id=11547
                  }

                  # ESO-safety: snapshot the set of Secret names owned by an
                  # External Secrets Operator ExternalSecret CR in this
                  # namespace. As of 2026-06-09 this is { confluent-license,
                  # cmf-encryption-key, cmf-db-credentials } at FCB, but we
                  # read it from the live cluster so future ExternalSecrets
                  # (e.g. the artifactory-user-password one) are picked up
                  # automatically without code changes.
                  #
                  # If create-prereqs ran `oc create secret generic` on an
                  # ESO-managed name, the apply would overwrite ESO's Secret
                  # content; ESO would then re-sync from CyberArk on its next
                  # reconcile interval, flapping the value back. To avoid
                  # the flap (and the operator confusion it causes), we skip
                  # the create entirely for ESO-owned names.
                  echo ""
                  echo "=== Snapshotting ESO-managed Secret names in $OC_NS ==="
                  ESO_OWNED_NAMES=$(oc -n "$OC_NS" get externalsecrets.external-secrets.io \
                    -o jsonpath='{range .items[*]}{.spec.target.name}{"\n"}{end}' \
                    2>/dev/null)
                  if [ -z "$ESO_OWNED_NAMES" ]; then
                    echo "  (no ExternalSecrets in namespace, or external-secrets CRD missing)"
                  else
                    echo "$ESO_OWNED_NAMES" | sed 's/^/  - /'
                  fi

                  # Returns 0 (true) if $1 is an ESO-managed Secret name in
                  # this namespace, non-zero otherwise. Uses `grep -qxF` for
                  # exact full-line, fixed-string matching — no regex
                  # surprises if a Secret name ever contains a metacharacter.
                  is_eso_managed() {
                    local name=$1
                    [ -n "$ESO_OWNED_NAMES" ] && \
                      grep -qxF "$name" <<< "$ESO_OWNED_NAMES"
                  }

                  apply_secret_from_literals() {
                    local name=$1; shift
                    echo ""
                    echo "=== $name ==="
                    if is_eso_managed "$name"; then
                      echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                      echo "  External Secrets Operator will reconcile its value from CyberArk."
                      echo "  If you need to refresh, edit the corresponding ExternalSecret CR."
                      return 0
                    fi
                    oc create secret generic "$name" \
                      -n "$OC_NS" --dry-run=client -o yaml "$@" \
                      | label_secret "$name" \
                      | oc apply -f -
                  }

                  apply_secret_from_file() {
                    local name=$1
                    local key=$2
                    local file=$3
                    echo ""
                    echo "=== $name ==="
                    if is_eso_managed "$name"; then
                      echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                      return 0
                    fi
                    oc create secret generic "$name" \
                      -n "$OC_NS" --dry-run=client -o yaml \
                      --from-file="$key=$file" \
                      | label_secret "$name" \
                      | oc apply -f -
                  }

                  # OAuth-style Secret: stores credentials under MULTIPLE key
                  # names, since CFK 3.1.x's runtime classifies the same Secret
                  # under different "auth type" labels depending on consumer:
                  #
                  #   clientId / clientSecret  →  simple key/value used by
                  #                              top-level authentication.oauth
                  #
                  #   bearer.txt               →  dependencies.mds.authentication
                  #                              (operator label "bearer").
                  #                              Format: Java properties
                  #                              username=<id>\npassword=<sec>
                  #
                  #   oauth.txt                →  top-level inbound REST auth
                  #                              (operator label "basic", since
                  #                              JETTY_AUTH wraps OAuth). Format:
                  #                              clientId=<id>\nclientSecret=<sec>
                  #                              (per regex error reported by
                  #                              operator: clientId=.+[\r\n]*$).
                  #
                  # Different file names + different inner formats — same
                  # credential material. CFK is inconsistent about how it
                  # consumes credentials across these paths; we satisfy all of
                  # them in one Secret to avoid more iterations.
                  apply_oauth_secret() {
                    local name=$1
                    local client_id=$2
                    local client_secret=$3
                    echo ""
                    echo "=== $name ==="
                    if is_eso_managed "$name"; then
                      echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                      return 0
                    fi
                    local bearer_tmp oauth_tmp
                    bearer_tmp=$(mktemp)
                    oauth_tmp=$(mktemp)
                    printf 'username=%s\npassword=%s\n' \
                      "$client_id" "$client_secret" > "$bearer_tmp"
                    printf 'clientId=%s\nclientSecret=%s\n' \
                      "$client_id" "$client_secret" > "$oauth_tmp"
                    oc create secret generic "$name" \
                      -n "$OC_NS" --dry-run=client -o yaml \
                      --from-literal=clientId="$client_id" \
                      --from-literal=clientSecret="$client_secret" \
                      --from-file=bearer.txt="$bearer_tmp" \
                      --from-file=oauth.txt="$oauth_tmp" \
                      | label_secret "$name" \
                      | oc apply -f -
                    rm -f "$bearer_tmp" "$oauth_tmp"
                  }

                  echo "=== Creating prerequisite Secrets in $OC_NS ==="

                  # Confluent license — TWO Secrets, different content formats:
                  #   - confluent-license      : raw JWT, key license.txt
                  #     (shared with CMF Helm release; CMF expects raw JWT)
                  #   - cfk-license            : Java-properties form
                  #     (CFK 3.1.1 KRaftController/Kafka error explicitly:
                  #      "must contain value in format license=<license_value>")
                  apply_secret_from_literals confluent-license \
                    --from-literal=license.txt="$CONFLUENT_LICENSE"
                  # CFK 3.1.x looks for key `license.txt` (or `cp-license.txt`)
                  # whose VALUE has Java-properties shape `license=<jwt>`.
                  apply_secret_from_literals cfk-license \
                    --from-literal=license.txt="license=$CONFLUENT_LICENSE"

                  # MDS RSA token keypair. The variable holds the PEM
                  # base64-encoded as a SINGLE LINE — pasting multiline PEM
                  # into the ADO UI can silently strip newlines, which then
                  # breaks Java's PEM parser at runtime (it requires the
                  # BEGIN/END markers on their own lines). Decoding here is
                  # bulletproof regardless of how the UI rendered the input.
                  #
                  # CFK requires the Secret to contain BOTH PEM files:
                  #   mdsTokenKeyPair.pem — the private key, signs tokens
                  #   mdsPublicKey.pem    — the public key, used by SR /
                  #                         Connect / REST / C3 to validate
                  # We derive the public key from the private with openssl.
                  if is_eso_managed mds-token-keypair; then
                    echo ""
                    echo "=== mds-token-keypair ==="
                    echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                  else
                  MDS_PRIV=$(mktemp)
                  printf '%s' "$MDS_PEM" | base64 -d > "$MDS_PRIV" 2>/dev/null || {
                    echo "ERROR: $TARGET_ENV-mds-token-keypair-pem is not valid base64."
                    echo "Re-encode the VM /var/ssl/private/tokenKeypair.pem with:"
                    echo "  sudo base64 -w0 /var/ssl/private/tokenKeypair.pem"
                    echo "and paste the single-line output into the variable."
                    rm -f "$MDS_PRIV"
                    exit 1
                  }
                  if ! head -1 "$MDS_PRIV" | grep -q "^-----BEGIN"; then
                    echo "ERROR: decoded MDS keypair does not start with a PEM"
                    echo "BEGIN marker. Check the base64 source."
                    rm -f "$MDS_PRIV"
                    exit 1
                  fi
                  MDS_PUB=$(mktemp)
                  openssl rsa -in "$MDS_PRIV" -pubout -out "$MDS_PUB" 2>/dev/null || {
                    echo "ERROR: openssl could not derive a public key from the"
                    echo "decoded MDS private key. The input is not a valid RSA"
                    echo "private key — re-encode and try again."
                    rm -f "$MDS_PRIV" "$MDS_PUB"
                    exit 1
                  }
                  echo ""
                  echo "=== mds-token-keypair ==="
                  oc create secret generic mds-token-keypair \
                    -n "$OC_NS" --dry-run=client -o yaml \
                    --from-file=mdsTokenKeyPair.pem="$MDS_PRIV" \
                    --from-file=mdsPublicKey.pem="$MDS_PUB" \
                    | label_secret mds-token-keypair \
                    | oc apply -f -
                  rm -f "$MDS_PRIV" "$MDS_PUB"
                  fi

                  # SASL PLAIN — CFK expects TWO files in the same Secret:
                  #
                  #   1. The users database. Accepted key names (in order of
                  #      preference):
                  #        kafka-server-listener-internal-plain-users.json
                  #        kafka-server-plain-users.json
                  #        plain-users.json
                  #      Content: JSON map of user → password.
                  #
                  #   2. The inter-broker / inter-controller credential.
                  #      Accepted key names:
                  #        kafka-server-listener-replication-plain-interbroker.txt
                  #        kafka-server-plain-interbroker.txt
                  #        plain-interbroker.txt
                  #      Content: single line "username:password" identifying
                  #      which user from the users database authenticates the
                  #      inter-broker / quorum-replication traffic. By VM
                  #      convention this is `admin`.
                  #
                  # Both files are written into one apply_secret_from_files
                  # call so they land as the two data keys of the same Secret.
                  if is_eso_managed sasl-plain-internal; then
                    echo ""
                    echo "=== sasl-plain-internal ==="
                    echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                  else
                  SASL_JSON_TMP=$(mktemp)
                  SASL_IB_TMP=$(mktemp)
                  printf '{\n  "admin": "%s",\n  "client": "%s",\n  "schema_registry": "%s",\n  "kafka_connect": "%s",\n  "kafka_rest": "%s",\n  "control_center": "%s"\n}\n' \
                    "$SASL_ADMIN" "$SASL_CLIENT" "$SASL_SR" "$SASL_CONNECT" "$SASL_REST" "$SASL_C3" \
                    > "$SASL_JSON_TMP"
                  # CFK rejected "admin:admin-secret" with "username and password
                  # not formatted correctly". The accepted format is Java
                  # properties: two lines, username= and password=. The user
                  # named here must also be present in the users.json above.
                  printf 'username=admin\npassword=%s\n' "$SASL_ADMIN" > "$SASL_IB_TMP"
                  echo ""
                  echo "=== sasl-plain-internal ==="
                  oc create secret generic sasl-plain-internal \
                    -n "$OC_NS" --dry-run=client -o yaml \
                    --from-file=kafka-server-listener-internal-plain-users.json="$SASL_JSON_TMP" \
                    --from-file=plain-interbroker.txt="$SASL_IB_TMP" \
                    | label_secret sasl-plain-internal \
                    | oc apply -f -
                  rm -f "$SASL_JSON_TMP" "$SASL_IB_TMP"
                  fi

                  # OAuth client credentials — one Secret per component, each
                  # with clientId/clientSecret AND bearer.txt (see helper above).
                  apply_oauth_secret oauth-broker         "$OAUTH_BROKER_ID"    "$OAUTH_BROKER_SECRET"
                  apply_oauth_secret oauth-schemaregistry "$OAUTH_SR_ID"        "$OAUTH_SR_SECRET"
                  apply_oauth_secret oauth-connect        "$OAUTH_CONNECT_ID"   "$OAUTH_CONNECT_SECRET"
                  apply_oauth_secret oauth-kafkarest      "$OAUTH_REST_ID"      "$OAUTH_REST_SECRET"
                  apply_oauth_secret oauth-controlcenter  "$OAUTH_C3_ID"        "$OAUTH_C3_SECRET"
                  apply_oauth_secret oauth-mds-rest       "$OAUTH_MDS_REST_ID"  "$OAUTH_MDS_REST_SECRET"

                  # C3 Prometheus / AlertManager basic auth.
                  apply_secret_from_literals c3-prometheus-basic-auth \
                    --from-literal=username="$C3_PROM_USER" \
                    --from-literal=password="$C3_PROM_PWD"
                  apply_secret_from_literals c3-alertmanager-basic-auth \
                    --from-literal=username="$C3_ALERT_USER" \
                    --from-literal=password="$C3_ALERT_PWD"

                  echo ""
                  echo "=== oc describe for every prereq Secret ==="
                  # describe prints key names + sizes but NOT values — safe for
                  # the pipeline log. To inspect a value, fetch the Secret
                  # outside the pipeline with `oc get secret <name> -o jsonpath`.
                  for s in \
                      confluent-license cfk-license \
                      mds-token-keypair \
                      sasl-plain-internal \
                      oauth-broker oauth-schemaregistry oauth-connect \
                      oauth-kafkarest oauth-controlcenter oauth-mds-rest \
                      c3-prometheus-basic-auth c3-alertmanager-basic-auth; do
                    echo ""
                    echo "--- $s ---"
                    oc describe secret "$s" -n "$OC_NS"
                  done

                  echo ""
                  echo "=== Summary ==="
                  oc -n "$OC_NS" get secret \
                      confluent-license cfk-license \
                      mds-token-keypair \
                      sasl-plain-internal \
                      oauth-broker oauth-schemaregistry oauth-connect \
                      oauth-kafkarest oauth-controlcenter oauth-mds-rest \
                      c3-prometheus-basic-auth c3-alertmanager-basic-auth
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}
                CONFLUENT_LICENSE: $(${{ parameters.environment }}-confluent-license)
                MDS_PEM: $(${{ parameters.environment }}-mds-token-keypair-pem)
                SASL_ADMIN: $(${{ parameters.environment }}-sasl-plain-admin-pwd)
                SASL_CLIENT: $(${{ parameters.environment }}-sasl-plain-client-pwd)
                SASL_SR: $(${{ parameters.environment }}-sasl-plain-schema-registry-pwd)
                SASL_CONNECT: $(${{ parameters.environment }}-sasl-plain-kafka-connect-pwd)
                SASL_REST: $(${{ parameters.environment }}-sasl-plain-kafka-rest-pwd)
                SASL_C3: $(${{ parameters.environment }}-sasl-plain-control-center-pwd)
                OAUTH_BROKER_ID: $(${{ parameters.environment }}-oauth-broker-client-id)
                OAUTH_BROKER_SECRET: $(${{ parameters.environment }}-oauth-broker-client-secret)
                OAUTH_SR_ID: $(${{ parameters.environment }}-oauth-schemaregistry-client-id)
                OAUTH_SR_SECRET: $(${{ parameters.environment }}-oauth-schemaregistry-client-secret)
                OAUTH_CONNECT_ID: $(${{ parameters.environment }}-oauth-connect-client-id)
                OAUTH_CONNECT_SECRET: $(${{ parameters.environment }}-oauth-connect-client-secret)
                OAUTH_REST_ID: $(${{ parameters.environment }}-oauth-kafkarest-client-id)
                OAUTH_REST_SECRET: $(${{ parameters.environment }}-oauth-kafkarest-client-secret)
                OAUTH_C3_ID: $(${{ parameters.environment }}-oauth-controlcenter-client-id)
                OAUTH_C3_SECRET: $(${{ parameters.environment }}-oauth-controlcenter-client-secret)
                OAUTH_MDS_REST_ID: $(${{ parameters.environment }}-oauth-mds-rest-client-id)
                OAUTH_MDS_REST_SECRET: $(${{ parameters.environment }}-oauth-mds-rest-client-secret)
                C3_PROM_USER: $(${{ parameters.environment }}-c3-prometheus-username)
                C3_PROM_PWD: $(${{ parameters.environment }}-c3-prometheus-password)
                C3_ALERT_USER: $(${{ parameters.environment }}-c3-alertmanager-username)
                C3_ALERT_PWD: $(${{ parameters.environment }}-c3-alertmanager-password)

          - ${{ if eq(parameters.action, 'install') }}:
            - task: Bash@3
              displayName: "Diagnostics: dump Secret + CR state before install"
              inputs:
                targetType: inline
                script: |
                  # Diagnostics intentionally never fail the install — they
                  # just log state. set +e so a missing CR or secret prints
                  # an error line but doesn't abort the pipeline.
                  set +e

                  # FIRST PASS — ESO-managed Secrets inventory. Lists every
                  # ExternalSecret CR's target Secret name so the rest of
                  # the diagnostic output makes clear which Secrets the
                  # pipeline owns vs which ESO owns. At FCB the ESO-managed
                  # set is (as of 2026-06-09): confluent-license,
                  # cmf-encryption-key, cmf-db-credentials — but this scans
                  # the live cluster rather than hardcoding, so the list
                  # stays accurate as more ExternalSecrets are added.
                  echo "=== ESO-managed Secrets in $OC_NS (do not manually create or finalizer-clear) ==="
                  ESO_LIST=$(oc -n "$OC_NS" get externalsecrets.external-secrets.io \
                    -o jsonpath='{range .items[*]}{.spec.target.name}{"\t(from ExternalSecret "}{.metadata.name}{", store "}{.spec.secretStoreRef.name}{")\n"}{end}' \
                    2>/dev/null)
                  if [ -z "$ESO_LIST" ]; then
                    echo "  (no ExternalSecrets in namespace, or external-secrets CRD missing)"
                  else
                    echo "$ESO_LIST" | awk -F '\t' 'NF>=2 {printf "  %-40s %s\n", $1, $2}'
                  fi
                  echo ""

                  # SECOND PASS: any Secret stuck in Terminating state will
                  # block the next install reconcile with a "no new
                  # finalizers can be added if the object is being deleted"
                  # error from the API server. Surface it at the TOP of
                  # the diagnostic output so it's the first thing seen,
                  # rather than buried 1300+ lines down in a CR condition
                  # message. See runbook/LESSONS_LEARNED.md A13 and
                  # action=clear-stuck-prereq-finalizers for the recovery.
                  echo "=== Pre-flight: Secrets stuck in Terminating? ==="
                  STUCK_SECRETS=$(oc -n "$OC_NS" get secrets \
                    -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.metadata.name}{"\t"}{.metadata.deletionTimestamp}{"\t"}{.metadata.finalizers}{"\n"}{end}' \
                    2>/dev/null)
                  if [ -z "$STUCK_SECRETS" ]; then
                    echo "OK — no Secrets in $OC_NS carry a deletionTimestamp."
                  else
                    echo "WARNING — the following Secrets are stuck in Terminating:"
                    printf "%-40s %-25s %s\n" "NAME" "deletionTimestamp" "finalizers"
                    echo "$STUCK_SECRETS" | awk -F '\t' 'NF>=3 {printf "%-40s %-25s %s\n", $1, $2, $3}'
                    echo ""
                    echo "The next install reconcile will fail trying to add new finalizers to these."
                    echo "Recovery: re-run this pipeline with action=clear-stuck-prereq-finalizers,"
                    echo "then action=create-prereqs to re-provision, then action=install."
                  fi
                  echo ""

                  echo "=== Secret: sasl-plain-internal — keys ==="
                  echo "(expected: kafka-server-listener-internal-plain-users.json)"
                  oc -n "$OC_NS" get secret sasl-plain-internal \
                    -o jsonpath='{.data}' 2>/dev/null \
                    | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d.keys()))" \
                    2>&1 || echo "(secret missing or not parseable)"

                  echo ""
                  echo "=== Secret: mds-token-keypair — keys ==="
                  echo "(expected: ['mdsPublicKey.pem', 'mdsTokenKeyPair.pem'])"
                  oc -n "$OC_NS" get secret mds-token-keypair \
                    -o jsonpath='{.data}' 2>/dev/null \
                    | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d.keys()))" \
                    2>&1 || echo "(secret missing or not parseable)"

                  for cr_kind in connect kafkarestproxy schemaregistry controlcenter; do
                    cr_name=$cr_kind
                    [ "$cr_kind" = "kafkarestproxy" ] && cr_name=kafkarest
                    [ "$cr_kind" = "controlcenter" ] && cr_name=controlcenter
                    [ "$cr_kind" = "schemaregistry" ] && cr_name=schemaregistry

                    echo ""
                    echo "=== CR: $cr_kind/$cr_name — spec.authentication ==="
                    echo "(expected: nested authentication.oauth.{secretRef, configuration})"
                    oc -n "$OC_NS" get "$cr_kind" "$cr_name" \
                      -o jsonpath='{.spec.authentication}' 2>/dev/null \
                      | python3 -m json.tool 2>&1 \
                      || echo "(CR not found yet — expected on first install)"
                  done

                  echo ""
                  echo "=== Recent Warning events (last 30) ==="
                  # The KIND/.involvedObject.name slash syntax above doesn't
                  # actually work — custom-columns can't concatenate two
                  # jsonpath expressions in one column, so the column comes
                  # out as "<none>" for every row and we can't tell which
                  # resource each warning is on. Split into two columns.
                  oc -n "$OC_NS" get events --sort-by=.lastTimestamp \
                    --field-selector type=Warning \
                    -o custom-columns=TIME:.lastTimestamp,REASON:.reason,KIND:.involvedObject.kind,NAME:.involvedObject.name,MSG:.message \
                    2>/dev/null | tail -30 \
                    || echo "(no Warning events or oc error)"

                  echo ""
                  echo "=== CFK CR status conditions ==="
                  for kind in kafka kraftcontroller schemaregistry connect kafkarestproxy controlcenter kafkarestclass; do
                    echo ""
                    echo "--- $kind ---"
                    oc -n "$OC_NS" get "$kind" -o custom-columns=NAME:.metadata.name,READY:.status.replicas.ready,REPLICAS:.status.replicas.total,PHASE:.status.phase,MSG:.status.kafka.state 2>/dev/null \
                      || echo "(no $kind in namespace)"
                    oc -n "$OC_NS" get "$kind" -o jsonpath='{range .items[*]}{.metadata.name}{":\n"}{range .status.conditions[*]}  - type={.type} status={.status} reason={.reason} message={.message}{"\n"}{end}{end}' 2>/dev/null
                  done

                  echo ""
                  echo "=== Pods (all in namespace) ==="
                  oc -n "$OC_NS" get pods -o wide 2>/dev/null || true

                  echo ""
                  echo "=== PVCs ==="
                  oc -n "$OC_NS" get pvc -o wide 2>/dev/null || true

                  echo ""
                  echo "=== StatefulSets in namespace ==="
                  oc -n "$OC_NS" get sts -o wide 2>/dev/null || echo "(no StatefulSets)"

                  # Dump the FULL StatefulSet yaml — no sed, no head, nothing
                  # trimmed. We need to see the entire manifest CFK is
                  # producing so we can review the vct AND every other
                  # field together (storage class, annotations, owner refs,
                  # spec.template, the whole shape). For kraftcontroller
                  # and controlcenter the sts likely won't exist (rejected
                  # at admission), which the dump will surface explicitly.
                  echo ""
                  echo "=== Full StatefulSet yaml (kafka, kraftcontroller, controlcenter, schemaregistry, connect, kafkarest) ==="
                  for sts in kafka kraftcontroller controlcenter schemaregistry connect kafkarest; do
                    echo ""
                    echo "############### sts/$sts ###############"
                    if oc -n "$OC_NS" get sts "$sts" >/dev/null 2>&1; then
                      oc -n "$OC_NS" get sts "$sts" -o yaml
                    else
                      echo "(sts/$sts not found — likely rejected at admission or not yet created)"
                    fi
                  done

                  # Dump the FULL CR yaml for every CFK component — no sed,
                  # no head, nothing trimmed. The live yaml from the API
                  # server shows what survived admission (compare against
                  # the source files in apps/confluent-platform/dev/ to
                  # spot anything CRD pruning may have dropped).
                  echo ""
                  echo "=== Full CR yaml (kafka, kraftcontroller, controlcenter, schemaregistry, connect, kafkarest, kafkarestclass) ==="
                  for kind_name in \
                      "kafka kafka" \
                      "kraftcontroller kraftcontroller" \
                      "controlcenter controlcenter" \
                      "schemaregistry schemaregistry" \
                      "connect connect" \
                      "kafkarestproxy kafkarest" \
                      "kafkarestclass default"; do
                    kind=${kind_name% *}; name=${kind_name#* }
                    echo ""
                    echo "############### $kind/$name ###############"
                    if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                      oc -n "$OC_NS" get "$kind" "$name" -o yaml
                    else
                      echo "($kind/$name not found in namespace)"
                    fi
                  done

                  # Focused conditions table — flattens each CR's
                  # status.conditions into a one-line-per-condition view so
                  # the cluster-ready / resources-ready / statefulset-available
                  # truth is scannable without grepping the full yaml. Same
                  # data as in the full-CR dump above, just easier to read.
                  echo ""
                  echo "=== CR status.conditions (focus: cluster-ready) ==="
                  for kind_name in \
                      "kraftcontroller kraftcontroller" \
                      "kafka kafka" \
                      "schemaregistry schemaregistry" \
                      "connect connect" \
                      "kafkarestproxy kafkarest" \
                      "controlcenter controlcenter"; do
                    kind=${kind_name% *}; name=${kind_name#* }
                    echo ""
                    echo "--- $kind/$name ---"
                    if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                      printf "%-12s %-50s %-10s %-25s %s\n" "NAME" "TYPE" "STATUS" "REASON" "MESSAGE"
                      oc -n "$OC_NS" get "$kind" "$name" -o jsonpath='{range .status.conditions[*]}{.type}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.message}{"\n"}{end}' 2>&1 \
                        | awk -v name="$name" -F '\t' 'NF>=3 {printf "%-12s %-50s %-10s %-25s %s\n", name, $1, $2, $3, $4}' \
                        || echo "(no conditions array)"
                    else
                      echo "($kind/$name not found)"
                    fi
                  done

                  # `oc explain` returns the CRD SCHEMA as the API server
                  # sees it on THIS cluster — independent of any applied
                  # CR. Use it as ground truth for whether a field exists
                  # in the installed CRD (different from our vendored
                  # chart CRDs, which may be at a different patch level).
                  # The user (Rick) explicitly asked for this — it answers
                  # "did the API server prune my field, or did CFK ignore
                  # it after preserving it?" directly, without inference.
                  echo ""
                  echo "=== oc explain — CRD schema as the cluster sees it ==="
                  for query in \
                      "kraftcontroller" \
                      "kraftcontroller.spec" \
                      "kraftcontroller.spec.volumeClaimTemplates" \
                      "kraftcontroller.spec.storageClass" \
                      "kraftcontroller.spec.podTemplate" \
                      "kafka" \
                      "kafka.spec" \
                      "kafka.spec.volumeClaimTemplates" \
                      "kafka.spec.storageClass" \
                      "controlcenter" \
                      "controlcenter.spec" \
                      "controlcenter.spec.volumeClaimTemplates" \
                      "controlcenter.spec.storageClass"; do
                    echo ""
                    echo "############### oc explain $query ###############"
                    oc explain "$query" 2>&1 || true
                  done

                  echo ""
                  echo "=== CFK operator pod logs (last 200 lines, filtered) ==="
                  # The operator runs in its own namespace. Different installs
                  # label the pod differently — search by image name as the
                  # most reliable fingerprint (any container image containing
                  # `confluent-operator`).
                  # Match `confluent-operator` substring anywhere in the image
                  # — FCB retags through Artifactory so the image will be
                  # artifactory.fcbint.net/.../confluent-operator:<tag>, not
                  # confluentinc/confluent-operator. The full-substring match
                  # catches both.
                  OP_LINE=$(oc get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}|{.metadata.name}|{.spec.containers[*].image}{"\n"}{end}' 2>/dev/null \
                    | grep -E '\|[^|]*confluent-operator' \
                    | head -1)
                  OPNS=$(echo "$OP_LINE" | cut -d'|' -f1)
                  OPPOD=$(echo "$OP_LINE" | cut -d'|' -f2)
                  if [ -n "$OPNS" ] && [ -n "$OPPOD" ]; then
                    echo "Operator: $OPNS/$OPPOD"
                    echo ""
                    echo "--- Last 200 lines, filtered for our components / errors ---"
                    oc -n "$OPNS" logs "$OPPOD" --tail=200 2>&1 \
                      | grep -iE 'error|warn|oauth|interbroker|schemaregistry|kraftcontroller|connect|kafkarest|controlcenter|kafka ' \
                      | tail -60 \
                      || echo "(no matching log lines)"
                  else
                    echo "(could not locate confluent-operator pod — searched by image fingerprint)"
                    echo "Listing all pods across all namespaces to help locate it:"
                    oc get pods -A 2>/dev/null | grep -iE 'operator|confluent' | head -20
                  fi

                  echo ""
                  echo "=== End of diagnostics ==="
                  # Always succeed so install proceeds to its own pre-flight.
                  exit 0
              env:
                OC_NS: $(openshift-namespace)

            - task: Bash@3
              displayName: "Pre-flight: verify env folder + prerequisite Secrets"
              inputs:
                targetType: inline
                script: |
                  set -uo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  echo "=== Git commit ==="
                  git rev-parse HEAD

                  echo ""
                  echo "=== Verifying env folder $ENV_DIR ==="
                  REQUIRED_FILES=(
                    kafkarestclass.yaml
                    kraftcontroller.yaml
                    kafka.yaml
                    schemaregistry.yaml
                    connect.yaml
                    kafkarest.yaml
                    controlcenter.yaml
                    cert-manager/kafka-tls-certificate.yaml
                    cert-manager/kraftcontroller-tls-certificate.yaml
                    cert-manager/schemaregistry-tls-certificate.yaml
                    cert-manager/connect-tls-certificate.yaml
                    cert-manager/kafkarest-tls-certificate.yaml
                    cert-manager/controlcenter-tls-certificate.yaml
                  )
                  missing_files=0
                  for f in "${REQUIRED_FILES[@]}"; do
                    if [ -f "$ENV_DIR/$f" ]; then
                      echo "OK    $f"
                    else
                      echo "MISS  $f"
                      missing_files=$((missing_files+1))
                    fi
                  done
                  if [ "$missing_files" -gt 0 ]; then
                    echo ""
                    echo "ERROR: $missing_files file(s) missing in $ENV_DIR — this env is not"
                    echo "populated yet. Add the CRs (see apps/confluent-platform/dev/ as a"
                    echo "template) before running this pipeline against $TARGET_ENV."
                    exit 1
                  fi

                  echo ""
                  echo "=== Refusing to apply if any REPLACE_WITH_ marker remains ==="
                  if grep -nrE 'REPLACE_WITH_' "$ENV_DIR" --include='*.yaml' 2>/dev/null; then
                    echo "ERROR: unresolved placeholder(s) above. Fix before running."
                    exit 1
                  fi
                  echo "(no unresolved placeholders)"

                  echo ""
                  echo "=== Verifying prerequisite Secrets in $OC_NS ==="
                  REQUIRED_SECRETS=(
                    confluent-license
                    cfk-license
                    sasl-plain-internal
                    mds-token-keypair
                    oauth-broker
                    oauth-schemaregistry
                    oauth-connect
                    oauth-kafkarest
                    oauth-controlcenter
                    oauth-mds-rest
                    c3-prometheus-basic-auth
                    c3-alertmanager-basic-auth
                  )
                  missing_secrets=0
                  for s in "${REQUIRED_SECRETS[@]}"; do
                    if oc get secret "$s" -n "$OC_NS" >/dev/null 2>&1; then
                      echo "OK    $s"
                    else
                      echo "MISS  $s"
                      missing_secrets=$((missing_secrets+1))
                    fi
                  done
                  if [ "$missing_secrets" -gt 0 ]; then
                    echo ""
                    echo "ERROR: $missing_secrets required Secret(s) missing in $OC_NS."
                    echo "See $ENV_DIR/prereqs/README.md for the full list and creation pattern,"
                    echo "then run this pipeline with action=create-prereqs to (re)populate."
                    exit 1
                  fi
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Apply cert-manager Certificates and wait for TLS Secrets"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  echo "=== Applying Certificate CRs ==="
                  for cert in "$ENV_DIR"/cert-manager/*-tls-certificate.yaml; do
                    echo ""
                    echo "+ oc apply -f $cert"
                    oc apply -f "$cert"
                  done

                  echo ""
                  echo "=== Waiting for Keyfactor to issue all 6 *-tls Secrets ==="
                  # Each cert may take a couple of minutes (approver-policy +
                  # Keyfactor RTT). Cap at 10 minutes total per secret.
                  TLS_SECRETS=(
                    kafka-tls
                    kraftcontroller-tls
                    schemaregistry-tls
                    connect-tls
                    kafkarest-tls
                    controlcenter-tls
                  )
                  for s in "${TLS_SECRETS[@]}"; do
                    echo ""
                    echo "Waiting for secret/$s..."
                    for i in $(seq 1 60); do
                      if oc get secret "$s" -n "$OC_NS" >/dev/null 2>&1; then
                        echo "  ready after $((i*10))s"
                        break
                      fi
                      if [ "$i" -eq 60 ]; then
                        echo ""
                        echo "ERROR: secret/$s not materialized after 10 min."
                        echo "Investigate the Certificate / CertificateRequest:"
                        oc describe certificate "$s" -n "$OC_NS" 2>&1 | tail -30 || true
                        oc get certificaterequest -n "$OC_NS" 2>&1 | tail -10 || true
                        exit 1
                      fi
                      sleep 10
                    done
                  done
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Apply Confluent Platform CRs"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  echo "=== Apply order (CFK dependency order) ==="
                  # CFK reconciles in dependency order, but applying in the
                  # right sequence makes failures easier to attribute to the
                  # right component.
                  APPLY_ORDER=(
                    kafkarestclass.yaml
                    kraftcontroller.yaml
                    kafka.yaml
                    schemaregistry.yaml
                    connect.yaml
                    kafkarest.yaml
                    controlcenter.yaml
                  )
                  for f in "${APPLY_ORDER[@]}"; do
                    echo ""
                    echo "+ oc apply -f $ENV_DIR/$f"
                    oc apply -f "$ENV_DIR/$f"
                  done

                  echo ""
                  echo "=== Cluster status (immediate post-apply) ==="
                  oc get kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass \
                    -n "$OC_NS" 2>&1 || true

                  echo ""
                  echo "=== Pods ==="
                  oc get pods -n "$OC_NS" -l app.kubernetes.io/part-of=confluent-platform 2>&1 || true

                  echo ""
                  echo "NOTE: the CFK operator takes 10-15 minutes to reconcile a full"
                  echo "cluster on first install. The pipeline is not waiting beyond apply."
                  echo "Monitor convergence with:"
                  echo "  oc -n $OC_NS get kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter"
                  echo "  oc -n $OC_NS get pods -l app.kubernetes.io/part-of=confluent-platform"
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}

          - ${{ if eq(parameters.action, 'uninstall') }}:
            - task: Bash@3
              displayName: "Uninstall Confluent Platform CRs"
              inputs:
                targetType: inline
                script: |
                  set -uo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  # CFK's cfk-resources webhook refuses to delete CRs whose
                  # backing PVs use reclaimPolicy=Delete (the Ceph RBD CSI
                  # default for dynamic provisioning). It's a data-loss
                  # guardrail. To opt in to PV deletion alongside the CR,
                  # label the CR with allow-pv-deletion=true before delete.
                  # Applies to the components with PVCs: Kafka,
                  # KRaftController, ControlCenter (and historically
                  # ZooKeeper / ksqlDB, neither used here).
                  echo "=== Labeling stateful CRs for allow-pv-deletion ==="
                  PV_LABEL="confluent-operator.webhooks.platform.confluent.io/allow-pv-deletion=true"
                  for kind_name in \
                      "kafka kafka" \
                      "kraftcontroller kraftcontroller" \
                      "controlcenter controlcenter"; do
                    kind=${kind_name% *}; name=${kind_name#* }
                    if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                      echo "+ oc -n $OC_NS label $kind $name $PV_LABEL --overwrite"
                      oc -n "$OC_NS" label "$kind" "$name" "$PV_LABEL" --overwrite
                    fi
                  done

                  echo ""
                  echo "=== Deleting Confluent Platform CRs (reverse dependency order) ==="
                  # Reverse order so dependents shut down before their backends.
                  # NOTE: no `|| true` on the deletes — we want the pipeline
                  # to fail loudly if a CR can't be removed (we hit a case
                  # where the cfk-resources webhook silently rejected
                  # ctrlcenter+kraftcontroller deletion and the pipeline
                  # reported "success", leaving the operator to immediately
                  # recreate any PVCs the next wipe-pvcs action tried to
                  # delete).
                  DELETE_ORDER=(
                    controlcenter.yaml
                    kafkarest.yaml
                    connect.yaml
                    schemaregistry.yaml
                    kafka.yaml
                    kraftcontroller.yaml
                    kafkarestclass.yaml
                  )
                  FAIL=0
                  for f in "${DELETE_ORDER[@]}"; do
                    if [ -f "$ENV_DIR/$f" ]; then
                      echo ""
                      echo "+ oc delete -f $ENV_DIR/$f --ignore-not-found --wait=true --timeout=5m"
                      if ! oc delete -f "$ENV_DIR/$f" --ignore-not-found --wait=true --timeout=5m; then
                        echo "FAIL: deletion of $f did not complete cleanly"
                        FAIL=1
                      fi
                    fi
                  done

                  # Optional fallback: if any CR is still stuck with a
                  # deletionTimestamp AND the operator-managed StatefulSet
                  # + Pods are already gone, drop its finalizers so the API
                  # server GCs it. Triggered by the `forceFinalizerRemoval`
                  # pipeline parameter. See runbook/LESSONS_LEARNED.md E3
                  # for the canonical case (Connect's graceful-flush call
                  # hangs when the broker cluster never came up).
                  # ADO interpolates a `type: boolean` parameter to "True"
                  # at compile time. Accept the lowercase form too in case
                  # the variable is ever re-wired from $(var) at runtime.
                  if [ "$FAIL" -ne 0 ] && { [ "$FORCE_FINALIZER_REMOVAL" = "True" ] || [ "$FORCE_FINALIZER_REMOVAL" = "true" ]; }; then
                    echo ""
                    echo "=== forceFinalizerRemoval=true — checking for CRs stuck in Terminating ==="
                    STUCK=$(oc -n "$OC_NS" get \
                      kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass \
                      -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.kind}{"/"}{.metadata.name}{"\n"}{end}' \
                      2>/dev/null)

                    if [ -z "$STUCK" ]; then
                      echo "No CRs with deletionTimestamp set — FAIL was set for another reason; not clearing it."
                    else
                      echo "Stuck CRs found:"
                      echo "$STUCK" | sed 's/^/  /'
                      CLEARED=0
                      while IFS=/ read -r kind name; do
                        [ -z "$kind" ] && continue
                        # Safety gate: only patch finalizers when there is
                        # no live StatefulSet / Pod for this instance. If
                        # there is, the operator is mid-cleanup and we
                        # could orphan storage / leak PVs by short-circuiting
                        # it. Better to fail loudly and let a human look.
                        SS_LEFT=$(oc -n "$OC_NS" get sts \
                          -l "app.kubernetes.io/instance=$name" \
                          --no-headers --ignore-not-found 2>/dev/null | wc -l | tr -d ' ')
                        POD_LEFT=$(oc -n "$OC_NS" get pod \
                          -l "app.kubernetes.io/instance=$name" \
                          --no-headers --ignore-not-found 2>/dev/null | wc -l | tr -d ' ')
                        if [ "${SS_LEFT:-0}" -gt 0 ] || [ "${POD_LEFT:-0}" -gt 0 ]; then
                          echo "  SKIP $kind/$name — StatefulSet=$SS_LEFT Pod=$POD_LEFT still present; not safe to short-circuit"
                          continue
                        fi
                        echo "+ oc -n $OC_NS patch $kind $name --type=merge -p '{\"metadata\":{\"finalizers\":[]}}'"
                        if oc -n "$OC_NS" patch "$kind" "$name" \
                            --type=merge -p '{"metadata":{"finalizers":[]}}'; then
                          CLEARED=$((CLEARED+1))
                        fi
                      done <<< "$STUCK"

                      # Re-check after the patch sweep.
                      STILL_STUCK=$(oc -n "$OC_NS" get \
                        kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass \
                        -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.kind}{"/"}{.metadata.name}{"\n"}{end}' \
                        2>/dev/null | grep -c . || true)

                      if [ "${STILL_STUCK:-0}" -eq 0 ]; then
                        echo "All stuck CRs cleared after finalizer patch ($CLEARED total). Clearing FAIL."
                        FAIL=0
                      else
                        echo "WARNING: $STILL_STUCK CR(s) still stuck after finalizer patch — investigate manually."
                      fi
                    fi
                  fi

                  echo ""
                  echo "=== Deleting cert-manager Certificates (cascades to *-tls Secrets) ==="
                  # Certificates can be force-deleted — no webhook, no risk
                  # of data loss. Keep `|| true` here so a missing file or
                  # already-deleted resource doesn't fail the step.
                  for cert in "$ENV_DIR"/cert-manager/*-tls-certificate.yaml; do
                    if [ -f "$cert" ]; then
                      echo "+ oc delete -f $cert --ignore-not-found"
                      oc delete -f "$cert" --ignore-not-found || true
                    fi
                  done

                  echo ""
                  echo "=== Remaining Confluent Platform objects ==="
                  oc get kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass \
                    -n "$OC_NS" 2>&1 || true
                  oc get pods -n "$OC_NS" -l app.kubernetes.io/part-of=confluent-platform 2>&1 || true

                  echo ""
                  echo "NOTE: prerequisite Secrets (confluent-license, oauth-*, mds-token-keypair,"
                  echo "sasl-plain-internal, c3-*-basic-auth) are intentionally preserved. PVCs"
                  echo "from the Kafka, KRaftController, and ControlCenter StatefulSets persist"
                  echo "after CR deletion. To delete them too, run the pipeline again with"
                  echo "action=wipe-pvcs (separate explicit action so this destruction is"
                  echo "always opt-in)."

                  if [ "$FAIL" -ne 0 ]; then
                    echo ""
                    echo "ERROR: one or more CR deletions failed. See log above. The most"
                    echo "common cause is the cfk-resources webhook rejecting deletion of"
                    echo "a CR whose PVs use reclaimPolicy=Delete — we label the CRs with"
                    echo "allow-pv-deletion=true before deleting, but the label step only"
                    echo "runs for CRs that exist at the time. If a stale finalizer is"
                    echo "the cause, investigate with: oc -n $OC_NS get <kind>/<name> -o yaml"
                    echo ""
                    echo "For the well-known Connect-stuck-on-broker-graceful-flush case"
                    echo "(see runbook/LESSONS_LEARNED.md E3), re-run this pipeline with"
                    echo "the forceFinalizerRemoval=true parameter set."
                    exit 1
                  fi
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}
                FORCE_FINALIZER_REMOVAL: ${{ parameters.forceFinalizerRemoval }}

          - ${{ if eq(parameters.action, 'wipe-pvcs') }}:
            - task: Bash@3
              displayName: "Wipe orphaned CFK PVCs"
              inputs:
                targetType: inline
                script: |
                  set -uo pipefail

                  # Why this exists:
                  # After `uninstall` the CRs and StatefulSets are gone, but
                  # their PVCs (data0-kafka-*, data0-kraftcontroller-*,
                  # data0-controlcenter-*) remain on Ceph RBD because CFK's
                  # default volumeClaimRetentionPolicy is Retain. On the
                  # NEXT install, CFK detects matching PVC names and
                  # generates the StatefulSet's volumeClaimTemplate WITHOUT
                  # storageClassName (assuming PVC reuse). FCB Gatekeeper's
                  # [ceph-storage] policy then rejects the StatefulSet with
                  # "storage class name <dummy>". Wiping the PVCs forces a
                  # fresh PVC creation path, on which CFK does include
                  # storageClassName from spec.storageClass.name.

                  echo "=== Checking for orphaned CFK PVCs in $OC_NS ==="
                  # All CFK-managed PVCs follow the pattern data<N>-<sts>-<ordinal>.
                  # We target the three stateful workloads we know exist.
                  PVC_PATTERNS=(
                    'data[0-9]*-kafka-[0-9]*'
                    'data[0-9]*-kraftcontroller-[0-9]*'
                    'data[0-9]*-controlcenter-[0-9]*'
                  )
                  MATCHED=$(
                    oc -n "$OC_NS" get pvc -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                      | grep -E "^($(IFS='|'; echo "${PVC_PATTERNS[*]}"))$" \
                      || true
                  )

                  if [ -z "$MATCHED" ]; then
                    echo "No matching PVCs found — nothing to delete."
                    exit 0
                  fi

                  echo "PVCs to delete:"
                  echo "$MATCHED" | sed 's/^/  - /'

                  # Refuse to wipe if any of the stateful StatefulSets is still
                  # around — those should have been removed by `uninstall` first.
                  # Wiping a PVC that an active StatefulSet still references
                  # would leave the cluster in a half-deleted state.
                  REMAINING_STS=$(oc -n "$OC_NS" get sts -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                    | grep -E '^(kafka|kraftcontroller|controlcenter)$' \
                    || true)
                  if [ -n "$REMAINING_STS" ]; then
                    echo ""
                    echo "ERROR: refusing to wipe PVCs — these StatefulSets still exist:"
                    echo "$REMAINING_STS" | sed 's/^/  - /'
                    echo "Run the pipeline with action=uninstall first, then re-run wipe-pvcs."
                    exit 1
                  fi

                  # Also refuse if the CFK CRs themselves still exist — even
                  # when the StatefulSet is in ApplyFailed state and never
                  # materialized, the operator continues reconciling and will
                  # immediately recreate any PVC we delete. (We hit this:
                  # PVCs deleted cleanly, then `oc get pvc` showed them back
                  # at age 0s.) The CRs must be removed via `uninstall`
                  # before this action does anything useful.
                  REMAINING_CRS=$(oc -n "$OC_NS" get kafka,kraftcontroller,controlcenter \
                    -o jsonpath='{range .items[*]}{.kind}/{.metadata.name}{"\n"}{end}' 2>/dev/null \
                    || true)
                  if [ -n "$REMAINING_CRS" ]; then
                    echo ""
                    echo "ERROR: refusing to wipe PVCs — these CFK CRs still exist:"
                    echo "$REMAINING_CRS" | sed 's/^/  - /'
                    echo "While these CRs exist, the operator will recreate any PVC"
                    echo "we delete within seconds. Run action=uninstall first, then"
                    echo "re-run wipe-pvcs."
                    exit 1
                  fi

                  echo ""
                  echo "=== Deleting PVCs ==="
                  for pvc in $MATCHED; do
                    echo "+ oc delete pvc/$pvc -n $OC_NS --wait=true --timeout=2m"
                    oc -n "$OC_NS" delete pvc "$pvc" --wait=true --timeout=2m || true
                  done

                  echo ""
                  echo "=== Remaining PVCs in $OC_NS ==="
                  oc -n "$OC_NS" get pvc 2>&1 || true
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}

          - ${{ if eq(parameters.action, 'clear-stuck-prereq-finalizers') }}:
            - task: Bash@3
              displayName: "Clear CFK finalizers on Secrets stuck in Terminating (ESO-safe)"
              inputs:
                targetType: inline
                script: |
                  set -uo pipefail

                  # Why this exists:
                  # After an uninstall, a prereq Secret can be left in
                  # Terminating state — deletionTimestamp is set (because
                  # K8s gc'd it via an ownerReferences cascade when its
                  # owning CR was deleted), but a CFK-stamped finalizer
                  # (`secret.finalizers.platform.confluent.io/<cr>-<cr>`)
                  # is still on it, blocking the actual deletion. The next
                  # install reconcile then fails with:
                  #   Secret "<name>" is invalid: metadata.finalizers:
                  #   Forbidden: no new finalizers can be added if the
                  #   object is being deleted, found new finalizers
                  #   []string{"secret.finalizers.platform.confluent.io/<cr>-<cr>"}
                  # See runbook/LESSONS_LEARNED.md A13.
                  #
                  # ESO-SAFETY: at FCB, three CMF-side Secrets are managed
                  # by ESO from CyberArk — confluent-license, cmf-encryption-key,
                  # cmf-db-credentials. ESO places its own finalizer
                  # (external-secrets.io/finalizer) on the Secrets it owns.
                  # This action MUST NOT remove ESO's finalizer, only the
                  # CFK-stamped ones. We do this by reading the current
                  # finalizers array, filtering OUT only items matching
                  # `secret.finalizers.platform.confluent.io/*`, and writing
                  # the surviving array back. If the surviving array is
                  # empty (only CFK finalizers were present), the Secret
                  # finalizes; if non-CFK finalizers remain (ESO etc.),
                  # the Secret stays Terminating until whoever owns those
                  # finalizers removes them — which is the correct
                  # behavior, since damaging external-secrets bookkeeping
                  # would break ESO's recreate-from-CyberArk logic.

                  echo "=== ESO-managed Secrets in $OC_NS (preserved by this action) ==="
                  oc -n "$OC_NS" get externalsecrets.external-secrets.io \
                    -o jsonpath='{range .items[*]}{.spec.target.name}{"\t(from ExternalSecret "}{.metadata.name}{")\n"}{end}' \
                    2>/dev/null \
                    | awk -F '\t' 'NF>=2 {printf "  %-40s %s\n", $1, $2}' \
                    || echo "  (no ExternalSecrets found in namespace, or CRD missing)"
                  echo ""

                  echo "=== Scanning $OC_NS for Secrets stuck in Terminating ==="
                  STUCK=$(oc -n "$OC_NS" get secrets \
                    -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.metadata.name}{"\n"}{end}' \
                    2>/dev/null)

                  if [ -z "$STUCK" ]; then
                    echo "No Secrets in $OC_NS have a deletionTimestamp set — nothing to clear."
                    echo "(If you came here expecting stuck Secrets, double-check the namespace via the openshift-namespace variable group entry.)"
                    exit 0
                  fi

                  echo ""
                  echo "Found stuck Secrets (current finalizers shown):"
                  while IFS= read -r sec; do
                    [ -z "$sec" ] && continue
                    DT=$(oc -n "$OC_NS" get secret "$sec" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null)
                    FZ=$(oc -n "$OC_NS" get secret "$sec" -o jsonpath='{.metadata.finalizers}' 2>/dev/null)
                    echo "  $sec  (deletionTimestamp=$DT)"
                    echo "    finalizers: $FZ"
                  done <<< "$STUCK"

                  echo ""
                  echo "=== Selectively removing only secret.finalizers.platform.confluent.io/* finalizers ==="
                  CLEARED=0
                  SKIPPED=0
                  FAILED=0
                  while IFS= read -r sec; do
                    [ -z "$sec" ] && continue

                    # Read current finalizers as JSON. python3 is used because
                    # FCB's pipeline image ships it (same as create-prereqs
                    # already relies on) and jq is not guaranteed.
                    CURRENT_JSON=$(oc -n "$OC_NS" get secret "$sec" \
                      -o jsonpath='{.metadata.finalizers}' 2>/dev/null)

                    if [ -z "$CURRENT_JSON" ] || [ "$CURRENT_JSON" = "<no value>" ]; then
                      echo ""
                      echo "  $sec — no finalizers field present; API server will GC on next tick"
                      SKIPPED=$((SKIPPED+1))
                      continue
                    fi

                    # Filter out CFK-stamped finalizers; preserve everything else.
                    # The python is a single line so YAML's preserved indentation
                    # inside `script: |` doesn't make python choke with
                    # IndentationError. JSON is piped via stdin instead of
                    # interpolated into the source string — safer against shell
                    # quoting if a finalizer ever contains a special character.
                    FILTERED_JSON=$(printf '%s' "$CURRENT_JSON" | python3 -c 'import json,sys; cur=json.load(sys.stdin); pfx="secret.finalizers.platform.confluent.io/"; print(json.dumps({"keep":[f for f in cur if not f.startswith(pfx)], "drop":[f for f in cur if f.startswith(pfx)]}))')

                    KEEP=$(printf '%s' "$FILTERED_JSON" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["keep"]))')
                    DROP=$(printf '%s' "$FILTERED_JSON" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["drop"]))')

                    echo ""
                    echo "  $sec"
                    echo "    dropping CFK finalizers: $DROP"
                    echo "    preserving foreign finalizers (ESO / other): $KEEP"

                    if [ "$DROP" = "[]" ]; then
                      echo "    no CFK finalizers to remove — skipping. If this Secret is still stuck"
                      echo "    Terminating, an ESO/other controller's finalizer is blocking it; ask"
                      echo "    that controller's owner to investigate."
                      SKIPPED=$((SKIPPED+1))
                      continue
                    fi

                    # Patch the finalizers array to the filtered list.
                    if [ "$KEEP" = "[]" ]; then
                      # Empty array — use merge patch with null to fully clear.
                      echo "    + oc patch secret $sec --type=merge -p '{\"metadata\":{\"finalizers\":null}}'"
                      if oc -n "$OC_NS" patch secret "$sec" --type=merge \
                          -p '{"metadata":{"finalizers":null}}' 2>&1; then
                        CLEARED=$((CLEARED+1))
                      else
                        echo "    FAIL: could not patch $sec"
                        FAILED=$((FAILED+1))
                      fi
                    else
                      # Non-empty filtered array — replace with the KEEP list.
                      echo "    + oc patch secret $sec --type=merge -p '{\"metadata\":{\"finalizers\":$KEEP}}'"
                      if oc -n "$OC_NS" patch secret "$sec" --type=merge \
                          -p "{\"metadata\":{\"finalizers\":$KEEP}}" 2>&1; then
                        CLEARED=$((CLEARED+1))
                      else
                        echo "    FAIL: could not patch $sec"
                        FAILED=$((FAILED+1))
                      fi
                    fi
                  done <<< "$STUCK"

                  sleep 2

                  echo ""
                  echo "=== Verification: any Secrets still stuck? ==="
                  STILL=$(oc -n "$OC_NS" get secrets \
                    -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.metadata.name}{"\t"}{.metadata.finalizers}{"\n"}{end}' \
                    2>/dev/null)
                  if [ -z "$STILL" ]; then
                    echo "Clean — no Secrets carry a deletionTimestamp anymore."
                  else
                    echo "Some Secrets still report deletionTimestamp (likely held by non-CFK finalizers):"
                    echo "$STILL" | awk -F '\t' '{printf "  %-40s %s\n", $1, $2}'
                  fi

                  echo ""
                  echo "=== Summary ==="
                  echo "  CFK finalizers cleared on: $CLEARED Secret(s)"
                  echo "  Skipped (no CFK fz to remove): $SKIPPED Secret(s)"
                  echo "  Failed: $FAILED Secret(s)"
                  echo ""
                  echo "Next steps:"
                  echo "  1. For Secrets cleared above: re-run action=create-prereqs to re-provision"
                  echo "     (skipping any ESO-managed names — those will be re-synced from CyberArk by ESO)."
                  echo "  2. Then action=install to bring the CFK stack back."
                  echo ""
                  echo "If anything is still stuck Terminating after this run, it's held by a non-CFK"
                  echo "finalizer (most likely ESO's external-secrets.io/finalizer). DO NOT manually"
                  echo "remove ESO finalizers — that would corrupt ESO's reconciliation state. Instead,"
                  echo "delete the ExternalSecret CR that targets the stuck Secret, let ESO clean up,"
                  echo "and re-apply the ExternalSecret to recreate the Secret from CyberArk."

                  if [ "$FAILED" -ne 0 ]; then
                    exit 1
                  fi
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}
