# Pipeline: confluent-platform — install/uninstall CFK Confluent Platform
# in dah-flink-<env>. Author: Ayu Admassu. Created 2026-05-12. Updated 2026-08-12.
# Variable group: kafka-openshift-credentials-<env>. Prereq Secrets +
# Certificate CRs documented in apps/confluent-platform/<env>/prereqs/README.md.
#
# VALIDATION GATES
# ================
# 1. STATIC CHECKS (no cluster required):
#    - YAML duplicate-key detection (run before any mutations)
#    - Manual code review of script logic
#    - Manifest schema validation (via oc apply --dry-run=server on cluster)
#    - Placeholder verification: no REPLACE_WITH_* values left unresolved
#    - OAuth scope isolation: each env's manifests use only that env's OAuth principals
#
# 2. COMPILE-TIME CHECKS (Azure DevOps):
#    - Pipeline YAML syntax (validated when queued)
#    - Template expansion (validated when queued)
#    - Variable group references (validated when queued)
#    - Expression evaluation (validated when queued)
#
# 3. LIVE CLUSTER CHECKS:
#    - Certificate Ready=True condition (via cert-manager status)
#    - oc apply --dry-run=server pre-flight (validated before mutations)
#    - ExternalSecret synchronization (oc get externalsecret ... -o jsonpath)
#    - Kafka cluster-ready condition (oc get kafka ... cluster-ready)
#    - MDS connectivity and oauth-mds-sso validation
#    - Component readiness gates
#    - Listener port and auth type validation

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat-p, uat-s, prd, dr]
  - name: action
    displayName: "Action"
    type: string
    default: install-or-update
    # install-or-update: idempotent `oc apply` of CFK CR manifests, scoped by component checkboxes below.
    # uninstall: delete every CFK CR in reverse dep order; check wipePVCs to also clear orphaned PVCs (standard wipe-rebuild path). Stuck-finalizer patch is always-on (gate inside the loop refuses to short-circuit an in-progress cleanup).
    # create-prereqs: provision the namespace-scoped prereq Secrets. Run at namespace bootstrap or after clear-stuck-prereq-finalizers.
    # clear-stuck-prereq-finalizers: clear finalizers on prereq Secrets stuck Terminating after an uninstall (runbook A13).
    # Read-only diagnostics live in .azure-pipelines/diagnostics.yaml — run that pipeline directly.
    values: [create-prereqs, install-or-update, uninstall, clear-stuck-prereq-finalizers]

  - name: wipePVCs
    displayName: "Uninstall: also wipe orphaned CFK PVCs"
    type: boolean
    default: false
    # Only honored when action=uninstall. Deletes CFK data PVCs after all CRs are gone and verifies that none of the targeted PVCs remain. Required for a clean re-install (FCB Gatekeeper [ceph-storage] rejects CFK's vct-without-storageClassName when PVCs are reused).

  # install-or-update component selection. "All" checked = apply everything in dep order; "All" unchecked = apply only checked components (at least one required). Cluster-upgrade order: KRaft Controller -> Kafka Broker -> SR / Connect / REST / C3. Phased waits (kraftcontroller-ready before Kafka, kafka-ready before Phase 2) fire in either mode. Ignored when action != install-or-update.

  - name: applyAll
    displayName: "All"
    type: boolean
    default: true

  - name: applyKRaftController
    displayName: "KRaft Controller"
    type: boolean
    default: false

  - name: applyKafka
    displayName: "Kafka Broker"
    type: boolean
    default: false
    # Also applies kafkarestclass.yaml (config-only, no pods).

  - name: applySchemaRegistry
    displayName: "Schema Registry"
    type: boolean
    default: false

  - name: applyConnect
    displayName: "Kafka Connect"
    type: boolean
    default: false

  - name: applyKafkaRestProxy
    displayName: "Kafka REST Proxy"
    type: boolean
    default: false

  - name: applyControlCenter
    displayName: "Control Center"
    type: boolean
    default: false

  - name: bypassEsoForSecrets
    displayName: "create-prereqs only: ESO bypass (leave as 'none' for normal deploys)"
    type: string
    default: "none"
    # Emergency workaround when a SecretStore is broken (e.g. CyberArk 403 SecretSyncedError). For each name in the comma-separated list, create-prereqs deletes the ExternalSecret CR + underlying Secret BEFORE the ESO ownership snapshot, so the Secret is (re)provisioned from the corresponding variable-group value on this same run. Default "none" (also treated: empty string) means no bypass. Common values while a CyberArk safe is being fixed: "cfk-license" or "cfk-license,confluent-license". Only honored when action=create-prereqs; ignored on every other action.

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat-p') }}:
    - group: kafka-openshift-credentials-uat-p
  - ${{ if eq(parameters.environment, 'uat-s') }}:
    - group: kafka-openshift-credentials-uat-s
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr
  # Control Center truststore password (env-specific: {env}-c3-truststore-bundle-password)
  - ${{ if eq(parameters.environment, 'dev') }}:
    - name: c3TruststorePassword
      value: $(dev-c3-truststore-bundle-password)
  - ${{ if eq(parameters.environment, 'qa') }}:
    - name: c3TruststorePassword
      value: $(qa-c3-truststore-bundle-password)
  - ${{ if eq(parameters.environment, 'uat-p') }}:
    - name: c3TruststorePassword
      value: $(uat-p-c3-truststore-bundle-password)
  - ${{ if eq(parameters.environment, 'uat-s') }}:
    - name: c3TruststorePassword
      value: $(uat-s-c3-truststore-bundle-password)
  - ${{ if eq(parameters.environment, 'prd') }}:
    - name: c3TruststorePassword
      value: $(prd-c3-truststore-bundle-password)
  - ${{ if eq(parameters.environment, 'dr') }}:
    - name: c3TruststorePassword
      value: $(dr-c3-truststore-bundle-password)

stages:
  - stage: ManageCFK
    displayName: "Confluent Platform ${{ parameters.action }} (${{ parameters.environment }})"
    jobs:
      - job: ManageCFK
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "Validate YAML: check for duplicate keys"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                echo "=== YAML Duplicate-Key Validation ==="
                echo "Checking all manifests in apps/confluent-platform/$TARGET_ENV for duplicate keys..."
                echo ""

                # Create validation script to check for duplicate keys in YAML files
                cat > /tmp/check_yaml_duplicates.py << 'PYTHON_EOF'
                #!/usr/bin/env python3
                import sys
                import yaml
                import pathlib
                from collections import defaultdict

                class DuplicateKeyDetector(yaml.SafeLoader):
                    """Detect duplicate keys in YAML mappings."""
                    pass

                def constructor_with_dup_check(self, node):
                    if isinstance(node, yaml.MappingNode):
                        keys_seen = defaultdict(list)
                        for key_node, value_node in node.value:
                            # Extract key value
                            key = self.construct_object(key_node)
                            keys_seen[key].append(key_node)

                        # Check for duplicates
                        for key, nodes in keys_seen.items():
                            if len(nodes) > 1:
                                first_node = nodes[0]
                                dup_node = nodes[1]
                                raise yaml.error.YAMLError(
                                    f"Duplicate key '{key}' at line {dup_node.start_mark.line+1}, "
                                    f"column {dup_node.start_mark.column+1}; "
                                    f"first occurrence at line {first_node.start_mark.line+1}"
                                )
                    return self.construct_mapping(node)

                DuplicateKeyDetector.add_constructor(
                    yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
                    constructor_with_dup_check
                )

                errors = []
                checked = 0
                for yaml_file in sorted(pathlib.Path(sys.argv[1]).rglob('*.yaml')):
                    try:
                        with open(yaml_file) as f:
                            # Exhaust every document so valid multi-document
                            # manifests (for example rolebindings.yaml) are
                            # checked rather than rejected at the second `---`.
                            list(yaml.load_all(f, Loader=DuplicateKeyDetector))
                        checked += 1
                    except yaml.YAMLError as e:
                        errors.append((str(yaml_file), str(e)))

                if errors:
                    print(f"ERRORS: {len(errors)} file(s) have duplicate keys")
                    for fpath, err in errors:
                        print(f"\n  {fpath}")
                        print(f"    {err}")
                    sys.exit(1)
                else:
                    print(f"OK: checked {checked} YAML files, no duplicate keys found")
                    sys.exit(0)
                PYTHON_EOF

                chmod +x /tmp/check_yaml_duplicates.py
                python3 /tmp/check_yaml_duplicates.py "apps/confluent-platform/$TARGET_ENV" || {
                  echo ""
                  echo "FATAL: YAML validation failed. Fix duplicate keys above before retrying."
                  exit 1
                }
            env:
              TARGET_ENV: ${{ parameters.environment }}

          - task: Bash@3
            displayName: "Compute canonical namespace (all actions)"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                # PRD and DR both map to dah-flink-prod namespace. DEV/QA/UAT map 1:1.
                case "$TARGET_ENV" in
                  dev) FINAL_NS="dah-flink-dev" ;;
                  qa) FINAL_NS="dah-flink-qa" ;;
                  uat-p|uat-s) FINAL_NS="dah-flink-uat" ;;
                  prd|dr) FINAL_NS="dah-flink-prod" ;;
                  *) echo "ERROR: Unknown environment $TARGET_ENV"; exit 1 ;;
                esac

                echo "TARGET_ENV=$TARGET_ENV → Kubernetes namespace=$FINAL_NS"
                echo "##vso[task.setvariable variable=RESOLVED_NS]$FINAL_NS"
            env:
              TARGET_ENV: ${{ parameters.environment }}

          - ${{ if eq(parameters.action, 'create-prereqs') }}:
            - task: Bash@3
              displayName: "Validate canonical namespace before create-prereqs"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  OC_NS_VAR="$(openshift-namespace)"
                  RESOLVED_NS_VAR="$(RESOLVED_NS)"

                  echo "=== Validating canonical namespace ==="
                  echo "openshift-namespace variable: $OC_NS_VAR"
                  echo "RESOLVED_NS (canonical):      $RESOLVED_NS_VAR"

                  if [ "$OC_NS_VAR" != "$RESOLVED_NS_VAR" ]; then
                    echo ""
                    echo "FATAL: Namespace mismatch!"
                    echo "  Variable group (openshift-namespace): $OC_NS_VAR"
                    echo "  Canonical (RESOLVED_NS):              $RESOLVED_NS_VAR"
                    echo ""
                    echo "Fix the openshift-namespace value in the variable group for $TARGET_ENV"
                    exit 1
                  fi

                  echo ""
                  echo "✓ Namespace validation passed: using $RESOLVED_NS_VAR"
              env:
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Create prerequisite Opaque Secrets and describe"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  # STEP 1: Discover ExternalSecret-owned Secrets and preserve CR/target names.
                  echo "=== Discovering ExternalSecret-managed Secrets ==="
                  declare -A ESO_CR_TO_TARGET  # Map: ExternalSecret CR name → target Secret name
                  ESO_COUNT=0
                  while IFS=$'\t' read -r cr_name target_name; do
                    [ -z "$cr_name" ] && continue
                    ESO_CR_TO_TARGET["$cr_name"]="$target_name"
                    ESO_COUNT=$((ESO_COUNT + 1))
                  done < <(oc -n "$OC_NS" get externalsecrets.external-secrets.io \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.target.name}{"\n"}{end}' 2>/dev/null || echo "")

                  # Extract just the target names for the quick lookup
                  ESO_OWNED=$(printf '%s\n' "${ESO_CR_TO_TARGET[@]}" | sort -u || echo "")

                  is_eso_managed() {
                    local name=$1
                    [ -n "$ESO_OWNED" ] && grep -qxF "$name" <<< "$ESO_OWNED" || return 1
                  }

                  # STEP 2: Verify ESO-managed Secrets using CR names and target Secret names.
                  echo ""
                  echo "=== Verifying ESO-managed Secrets ==="
                  eso_failed=0
                  if (( ESO_COUNT > 0 )); then
                    for es_cr_name in "${!ESO_CR_TO_TARGET[@]}"; do
                      es_target_name="${ESO_CR_TO_TARGET[$es_cr_name]}"
                      synced=$(oc -n "$OC_NS" get externalsecret "$es_cr_name" \
                        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")

                      if [ "$synced" != "True" ]; then
                        echo "ERROR: ExternalSecret CR $es_cr_name (targets Secret $es_target_name) not Ready=True"
                        eso_failed=$((eso_failed+1))
                      else
                        echo "OK: $es_cr_name → $es_target_name (Ready)"
                      fi
                    done
                  else
                    echo "  (no ExternalSecrets discovered in namespace)"
                  fi

                  if [ "$eso_failed" -gt 0 ]; then
                    echo "ERROR: $eso_failed ExternalSecret(s) not synchronized"
                    exit 1
                  fi

                  # STEP 3: Determine which Secrets are pipeline-owned (NOT ESO-managed)
                  echo ""
                  echo "=== Determining pipeline-owned Secrets ==="
                  PIPELINE_OWNED_SECRETS=(
                    "cfk-license"
                    "sasl-plain-internal"
                    "mds-token-keypair"
                    "oauth-broker"
                    "oauth-schemaregistry"
                    "oauth-connect"
                    "oauth-kafkarest"
                    "oauth-controlcenter"
                    "oauth-mds-rest"
                    "oauth-mds-sso"
                    "c3-prom-server-basic-auth"
                    "c3-prom-client-basic-auth"
                    "c3-alert-server-basic-auth"
                    "c3-alert-client-basic-auth"
                  )

                  REQUIRED_VARS_FOR_PIPELINE=()
                  for secret in "${PIPELINE_OWNED_SECRETS[@]}"; do
                    if is_eso_managed "$secret"; then
                      echo "SKIP (ESO-managed): $secret"
                    else
                      echo "REQUIRE (pipeline): $secret"
                      case "$secret" in
                        cfk-license) REQUIRED_VARS_FOR_PIPELINE+=("CONFLUENT_LICENSE") ;;
                        sasl-plain-internal) REQUIRED_VARS_FOR_PIPELINE+=("SASL_ADMIN") ;;
                        mds-token-keypair) REQUIRED_VARS_FOR_PIPELINE+=("MDS_PEM") ;;
                        oauth-broker) REQUIRED_VARS_FOR_PIPELINE+=("OAUTH_BROKER_ID" "OAUTH_BROKER_SECRET") ;;
                        oauth-schemaregistry) REQUIRED_VARS_FOR_PIPELINE+=("OAUTH_SR_ID" "OAUTH_SR_SECRET") ;;
                        oauth-connect) REQUIRED_VARS_FOR_PIPELINE+=("OAUTH_CONNECT_ID" "OAUTH_CONNECT_SECRET") ;;
                        oauth-kafkarest) REQUIRED_VARS_FOR_PIPELINE+=("OAUTH_REST_ID" "OAUTH_REST_SECRET") ;;
                        oauth-controlcenter) REQUIRED_VARS_FOR_PIPELINE+=("OAUTH_C3_ID" "OAUTH_C3_SECRET") ;;
                        oauth-mds-rest) REQUIRED_VARS_FOR_PIPELINE+=("OAUTH_MDS_REST_ID" "OAUTH_MDS_REST_SECRET") ;;
                        oauth-mds-sso) REQUIRED_VARS_FOR_PIPELINE+=("OAUTH_MDS_SSO_ID" "OAUTH_MDS_SSO_SECRET") ;;
                        c3-prom-server-basic-auth) REQUIRED_VARS_FOR_PIPELINE+=("C3_PROM_USER" "C3_PROM_PWD") ;;
                        c3-prom-client-basic-auth) REQUIRED_VARS_FOR_PIPELINE+=("C3_PROM_USER" "C3_PROM_PWD") ;;
                        c3-alert-server-basic-auth) REQUIRED_VARS_FOR_PIPELINE+=("C3_ALERT_USER" "C3_ALERT_PWD") ;;
                        c3-alert-client-basic-auth) REQUIRED_VARS_FOR_PIPELINE+=("C3_ALERT_USER" "C3_ALERT_PWD") ;;
                      esac
                    fi
                  done

                  # STEP 4: Validate only pipeline-owned variables with strict checks
                  echo ""
                  echo "=== Validating pipeline-owned Secret variables ==="
                  required_vars=("${REQUIRED_VARS_FOR_PIPELINE[@]}")
                  missing=0
                  for v in "${required_vars[@]}"; do
                    val="${!v:-}"

                    # Strict validation: no empty, no whitespace, no $(..), no REPLACE_WITH_*
                    if [ -z "$val" ]; then
                      echo "MISS  $v (empty)"
                      missing=$((missing+1))
                    elif [ "$val" != "${val//[[:space:]]/}" ]; then
                      echo "INVALID $v (whitespace)"
                      missing=$((missing+1))
                    elif [[ "$val" =~ ^\$\( ]]; then
                      echo "INVALID $v (unresolved macro: $val)"
                      missing=$((missing+1))
                    elif [[ "$val" =~ ^REPLACE_WITH_ ]]; then
                      echo "INVALID $v (placeholder: $val)"
                      missing=$((missing+1))
                    else
                      echo "OK    $v"
                    fi
                  done

                  if [ "$missing" -gt 0 ]; then
                    echo ""
                    echo "ERROR: $missing validation(s) failed"
                    exit 1
                  fi

                  # STEP 5: Apply ESO bypass if configured (emergency workaround for broken SecretStore).
                  if [ -n "${BYPASS_ES_FOR:-}" ] && [ "${BYPASS_ES_FOR,,}" != "none" ]; then
                    echo ""
                    echo "=== ESO bypass: forcing variable-group provisioning for [$BYPASS_ES_FOR] ==="
                    IFS=',' read -ra BYPASS_LIST <<< "$BYPASS_ES_FOR"
                    for name in "${BYPASS_LIST[@]}"; do
                      name=$(echo "$name" | tr -d ' ')
                      [ -z "$name" ] && continue
                      echo "--- $name ---"
                      oc -n "$OC_NS" delete externalsecret "$name" --ignore-not-found
                      oc -n "$OC_NS" delete secret "$name" --ignore-not-found
                    done
                  fi

                  # FCB Common Metadata standard requires these labels on every object.
                  label_secret() {
                    local name=$1
                    oc label --local --overwrite -f - --dry-run=client -o yaml \
                      app.kubernetes.io/name=confluent-platform \
                      app.kubernetes.io/instance="$name" \
                      app.kubernetes.io/component=cfk-prereq \
                      app.kubernetes.io/part-of=confluent-platform \
                      fcbint.net/app-id=11547
                  }

                  apply_secret_from_literals() {
                    local name=$1; shift
                    echo ""
                    echo "=== $name ==="
                    if is_eso_managed "$name"; then
                      echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                      echo "  External Secrets Operator will reconcile its value from CyberArk."
                      echo "  If you need to refresh, edit the corresponding ExternalSecret CR."
                      return 0
                    fi
                    oc create secret generic "$name" \
                      -n "$OC_NS" --dry-run=client -o yaml "$@" \
                      | label_secret "$name" \
                      | oc apply -f -
                  }

                  apply_secret_from_file() {
                    local name=$1
                    local key=$2
                    local file=$3
                    echo ""
                    echo "=== $name ==="
                    if is_eso_managed "$name"; then
                      echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                      return 0
                    fi
                    oc create secret generic "$name" \
                      -n "$OC_NS" --dry-run=client -o yaml \
                      --from-file="$key=$file" \
                      | label_secret "$name" \
                      | oc apply -f -
                  }

                  # OAuth Secret with the same credential material under FOUR keys CFK consumes from different paths: clientId/clientSecret literals (auth.oauth), bearer.txt as `username=...\npassword=...` (deps.mds.auth), oauth.txt as `clientId=...\nclientSecret=...` (REST auth under JETTY_AUTH), and oidcClientSecret.txt as `clientId=...\nclientSecret=...` (spec.services.mds.provider.sso.clientCredentials — CFK 3.2 expects this exact key on OIDC-SSO Secrets, matches the Psyncopate `oauth-jass-oidc` shape). oidcClientSecret.txt on the non-SSO Secrets is unused/inert.
                  apply_oauth_secret() {
                    local name=$1
                    local client_id=$2
                    local client_secret=$3
                    echo ""
                    echo "=== $name ==="
                    if is_eso_managed "$name"; then
                      echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                      return 0
                    fi
                    local bearer_tmp oauth_tmp
                    bearer_tmp=$(mktemp)
                    oauth_tmp=$(mktemp)
                    printf 'username=%s\npassword=%s\n' \
                      "$client_id" "$client_secret" > "$bearer_tmp"
                    printf 'clientId=%s\nclientSecret=%s\n' \
                      "$client_id" "$client_secret" > "$oauth_tmp"
                    oc create secret generic "$name" \
                      -n "$OC_NS" --dry-run=client -o yaml \
                      --from-literal=clientId="$client_id" \
                      --from-literal=clientSecret="$client_secret" \
                      --from-file=bearer.txt="$bearer_tmp" \
                      --from-file=oauth.txt="$oauth_tmp" \
                      --from-file=oidcClientSecret.txt="$oauth_tmp" \
                      | label_secret "$name" \
                      | oc apply -f -
                    rm -f "$bearer_tmp" "$oauth_tmp"
                  }

                  echo "=== Creating prerequisite Secrets in $OC_NS ==="

                  # Two license Secrets, different formats: confluent-license=raw JWT (CMF), cfk-license=Java-properties `license=<jwt>` (CFK).
                  apply_secret_from_literals confluent-license \
                    --from-literal=license.txt="$CONFLUENT_LICENSE"
                  apply_secret_from_literals cfk-license \
                    --from-literal=license.txt="license=$CONFLUENT_LICENSE"

                  # MDS RSA token keypair. Variable is single-line base64 (ADO UI strips multiline PEM newlines); decode + derive the public key here so Java's PEM parser sees proper BEGIN/END lines. CFK wants both mdsTokenKeyPair.pem (private, signs) and mdsPublicKey.pem (public, validators use).
                  if is_eso_managed mds-token-keypair; then
                    echo ""
                    echo "=== mds-token-keypair ==="
                    echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                  else
                  MDS_PRIV=$(mktemp)
                  printf '%s' "$MDS_PEM" | base64 -d > "$MDS_PRIV" 2>/dev/null || {
                    echo "ERROR: $TARGET_ENV-mds-token-keypair-pem is not valid base64."
                    echo "Re-encode the VM /var/ssl/private/tokenKeypair.pem with:"
                    echo "  sudo base64 -w0 /var/ssl/private/tokenKeypair.pem"
                    echo "and paste the single-line output into the variable."
                    rm -f "$MDS_PRIV"
                    exit 1
                  }
                  if ! head -1 "$MDS_PRIV" | grep -q "^-----BEGIN"; then
                    echo "ERROR: decoded MDS keypair does not start with a PEM"
                    echo "BEGIN marker. Check the base64 source."
                    rm -f "$MDS_PRIV"
                    exit 1
                  fi
                  MDS_PUB=$(mktemp)
                  openssl rsa -in "$MDS_PRIV" -pubout -out "$MDS_PUB" 2>/dev/null || {
                    echo "ERROR: openssl could not derive a public key from the"
                    echo "decoded MDS private key. The input is not a valid RSA"
                    echo "private key — re-encode and try again."
                    rm -f "$MDS_PRIV" "$MDS_PUB"
                    exit 1
                  }
                  echo ""
                  echo "=== mds-token-keypair ==="
                  oc create secret generic mds-token-keypair \
                    -n "$OC_NS" --dry-run=client -o yaml \
                    --from-file=mdsTokenKeyPair.pem="$MDS_PRIV" \
                    --from-file=mdsPublicKey.pem="$MDS_PUB" \
                    | label_secret mds-token-keypair \
                    | oc apply -f -
                  rm -f "$MDS_PRIV" "$MDS_PUB"
                  fi

                  # One infrastructure identity for the Kafka internal listener,
                  # inter-broker traffic, and the KRaft controller path. Managed
                  # components retain their OAuth/RBAC identities and therefore
                  # do not need component-specific PLAIN credentials.
                  if is_eso_managed sasl-plain-internal; then
                    echo ""
                    echo "=== sasl-plain-internal ==="
                    echo "  SKIPPED — ESO-owned (ExternalSecret targets this name)."
                  else
                  SASL_JSON_TMP=$(mktemp)
                  SASL_PLAIN_TMP=$(mktemp)
                  printf '{\n  "admin": "%s"\n}\n' "$SASL_ADMIN" > "$SASL_JSON_TMP"
                  printf 'username=admin\npassword=%s\n' "$SASL_ADMIN" > "$SASL_PLAIN_TMP"
                  echo ""
                  echo "=== sasl-plain-internal ==="
                  oc create secret generic sasl-plain-internal \
                    -n "$OC_NS" --dry-run=client -o yaml \
                    --from-file=plain-users.json="$SASL_JSON_TMP" \
                    --from-file=kafka-server-listener-internal-plain-users.json="$SASL_JSON_TMP" \
                    --from-file=kraftcontroller-server-listener-controller-plain-users.json="$SASL_JSON_TMP" \
                    --from-file=plain.txt="$SASL_PLAIN_TMP" \
                    --from-file=plain-interbroker.txt="$SASL_PLAIN_TMP" \
                    | label_secret sasl-plain-internal \
                    | oc apply -f -
                  rm -f "$SASL_JSON_TMP" "$SASL_PLAIN_TMP"
                  fi

                  # DEV-only: Enforce two-account identity model safeguards
                  if [ "$TARGET_ENV" = "dev" ]; then
                    EXPECTED_C3_ID="0oa1ov6h5mwmQTCKI358"
                    EXPECTED_SSO_ID="0oa1o0ea1m26pITBQ358"

                    echo ""
                    echo "=== DEV Two-Account Identity Safeguards ==="
                    if [ -z "$OAUTH_C3_ID" ]; then
                      echo "FATAL: OAUTH_C3_ID is empty. Dev machine identity is required."
                      exit 1
                    fi
                    if [ -z "$OAUTH_MDS_SSO_ID" ]; then
                      echo "FATAL: OAUTH_MDS_SSO_ID is empty. Dev SSO identity is required."
                      exit 1
                    fi
                    if [ "$OAUTH_C3_ID" != "$EXPECTED_C3_ID" ]; then
                      echo "FATAL: OAUTH_C3_ID=$OAUTH_C3_ID, expected $EXPECTED_C3_ID"
                      exit 1
                    fi
                    if [ "$OAUTH_MDS_SSO_ID" != "$EXPECTED_SSO_ID" ]; then
                      echo "FATAL: OAUTH_MDS_SSO_ID=$OAUTH_MDS_SSO_ID, expected $EXPECTED_SSO_ID"
                      exit 1
                    fi
                    if [ "$OAUTH_C3_ID" = "$OAUTH_MDS_SSO_ID" ]; then
                      echo "FATAL: Machine and SSO client IDs are identical (separation violated)"
                      exit 1
                    fi
                    echo "✓ Machine identity: $OAUTH_C3_ID"
                    echo "✓ SSO identity: $OAUTH_MDS_SSO_ID"
                    echo "✓ Identities are different (separation confirmed)"
                  fi

                  # OAuth client credentials — one Secret per component, each
                  # with clientId/clientSecret AND bearer.txt (see helper above).
                  apply_oauth_secret oauth-broker         "$OAUTH_BROKER_ID"    "$OAUTH_BROKER_SECRET"
                  apply_oauth_secret oauth-schemaregistry "$OAUTH_SR_ID"        "$OAUTH_SR_SECRET"
                  apply_oauth_secret oauth-connect        "$OAUTH_CONNECT_ID"   "$OAUTH_CONNECT_SECRET"
                  apply_oauth_secret oauth-kafkarest      "$OAUTH_REST_ID"      "$OAUTH_REST_SECRET"
                  apply_oauth_secret oauth-controlcenter  "$OAUTH_C3_ID"        "$OAUTH_C3_SECRET"
                  apply_oauth_secret oauth-mds-rest       "$OAUTH_MDS_REST_ID"  "$OAUTH_MDS_REST_SECRET"
                  # oauth-mds-sso — separate Okta OIDC client used by MDS for browser-based SSO (C3 web UI login). Distinct from oauth-mds-rest which is MDS's own service-side OAuth client. Referenced from kafka.yaml spec.services.mds.provider.sso.clientCredentials.secretRef (runbook A22).
                  apply_oauth_secret oauth-mds-sso        "$OAUTH_MDS_SSO_ID"   "$OAUTH_MDS_SSO_SECRET"

                  # DEV-only: Validate oauth-mds-sso Secret structure after creation
                  if [ "$TARGET_ENV" = "dev" ]; then
                    echo ""
                    echo "=== Validating oauth-mds-sso Secret Structure ==="

                    if oc -n "$OC_NS" get secret oauth-mds-sso -o jsonpath='{.data.clientId}' 2>/dev/null | grep -q .; then
                      echo "✓ oauth-mds-sso contains clientId"
                    else
                      echo "FATAL: oauth-mds-sso missing or empty clientId"
                      exit 1
                    fi

                    if oc -n "$OC_NS" get secret oauth-mds-sso -o jsonpath='{.data.clientSecret}' 2>/dev/null | grep -q .; then
                      echo "✓ oauth-mds-sso contains clientSecret"
                    else
                      echo "FATAL: oauth-mds-sso missing or empty clientSecret"
                      exit 1
                    fi

                    if oc -n "$OC_NS" get secret oauth-mds-sso \
                        -o jsonpath='{.data.oidcClientSecret\.txt}' 2>/dev/null | grep -q .; then
                      echo "✓ oauth-mds-sso contains oidcClientSecret.txt"
                    else
                      echo "FATAL: oauth-mds-sso missing or empty oidcClientSecret.txt"
                      exit 1
                    fi
                  fi

                  # C3 Prometheus / Alertmanager require basic.txt. Server-side
                  # and client-side formats differ, so create separate Secrets.
                  PROM_SERVER_TMP=$(mktemp)
                  PROM_CLIENT_TMP=$(mktemp)
                  ALERT_SERVER_TMP=$(mktemp)
                  ALERT_CLIENT_TMP=$(mktemp)
                  printf '%s: %s\n' "$C3_PROM_USER" "$C3_PROM_PWD" > "$PROM_SERVER_TMP"
                  printf 'username=%s\npassword=%s\n' "$C3_PROM_USER" "$C3_PROM_PWD" > "$PROM_CLIENT_TMP"
                  printf '%s: %s\n' "$C3_ALERT_USER" "$C3_ALERT_PWD" > "$ALERT_SERVER_TMP"
                  printf 'username=%s\npassword=%s\n' "$C3_ALERT_USER" "$C3_ALERT_PWD" > "$ALERT_CLIENT_TMP"
                  apply_secret_from_file c3-prom-server-basic-auth basic.txt "$PROM_SERVER_TMP"
                  apply_secret_from_file c3-prom-client-basic-auth basic.txt "$PROM_CLIENT_TMP"
                  apply_secret_from_file c3-alert-server-basic-auth basic.txt "$ALERT_SERVER_TMP"
                  apply_secret_from_file c3-alert-client-basic-auth basic.txt "$ALERT_CLIENT_TMP"
                  rm -f "$PROM_SERVER_TMP" "$PROM_CLIENT_TMP" "$ALERT_SERVER_TMP" "$ALERT_CLIENT_TMP"

                  echo ""
                  echo "=== oc describe for every prereq Secret ==="
                  # describe prints key names + sizes only — no values, safe for the pipeline log.
                  for s in \
                      confluent-license cfk-license \
                      mds-token-keypair \
                      sasl-plain-internal \
                      oauth-broker oauth-schemaregistry oauth-connect \
                      oauth-kafkarest oauth-controlcenter oauth-mds-rest oauth-mds-sso \
                      c3-prom-server-basic-auth c3-prom-client-basic-auth \
                      c3-alert-server-basic-auth c3-alert-client-basic-auth; do
                    echo ""
                    echo "--- $s ---"
                    oc describe secret "$s" -n "$OC_NS"
                  done

                  echo ""
                  echo "=== Summary ==="
                  oc -n "$OC_NS" get secret \
                      confluent-license cfk-license \
                      mds-token-keypair \
                      sasl-plain-internal \
                      oauth-broker oauth-schemaregistry oauth-connect \
                      oauth-kafkarest oauth-controlcenter oauth-mds-rest oauth-mds-sso \
                      c3-prom-server-basic-auth c3-prom-client-basic-auth \
                      c3-alert-server-basic-auth c3-alert-client-basic-auth
              env:
                OC_NS: $(openshift-namespace)
                TARGET_ENV: ${{ parameters.environment }}
                BYPASS_ES_FOR: ${{ parameters.bypassEsoForSecrets }}
                CONFLUENT_LICENSE: $(${{ parameters.environment }}-confluent-license)
                MDS_PEM: $(${{ parameters.environment }}-mds-token-keypair-pem)
                SASL_ADMIN: $(${{ parameters.environment }}-sasl-plain-admin-pwd)
                OAUTH_BROKER_ID: $(${{ parameters.environment }}-oauth-broker-client-id)
                OAUTH_BROKER_SECRET: $(${{ parameters.environment }}-oauth-broker-client-secret)
                OAUTH_SR_ID: $(${{ parameters.environment }}-oauth-schemaregistry-client-id)
                OAUTH_SR_SECRET: $(${{ parameters.environment }}-oauth-schemaregistry-client-secret)
                OAUTH_CONNECT_ID: $(${{ parameters.environment }}-oauth-connect-client-id)
                OAUTH_CONNECT_SECRET: $(${{ parameters.environment }}-oauth-connect-client-secret)
                OAUTH_REST_ID: $(${{ parameters.environment }}-oauth-kafkarest-client-id)
                OAUTH_REST_SECRET: $(${{ parameters.environment }}-oauth-kafkarest-client-secret)
                OAUTH_C3_ID: $(${{ parameters.environment }}-oauth-controlcenter-client-id)
                OAUTH_C3_SECRET: $(${{ parameters.environment }}-oauth-controlcenter-client-secret)
                OAUTH_MDS_REST_ID: $(${{ parameters.environment }}-oauth-mds-rest-client-id)
                OAUTH_MDS_REST_SECRET: $(${{ parameters.environment }}-oauth-mds-rest-client-secret)
                OAUTH_MDS_SSO_ID: $(${{ parameters.environment }}-oauth-mds-sso-client-id)
                OAUTH_MDS_SSO_SECRET: $(${{ parameters.environment }}-oauth-mds-sso-client-secret)
                C3_PROM_USER: $(${{ parameters.environment }}-c3-prometheus-username)
                C3_PROM_PWD: $(${{ parameters.environment }}-c3-prometheus-password)
                C3_ALERT_USER: $(${{ parameters.environment }}-c3-alertmanager-username)
                C3_ALERT_PWD: $(${{ parameters.environment }}-c3-alertmanager-password)

            - task: Bash@3
              displayName: "Initialize Control Center-specific truststore (c3-trust-bundle)"
              inputs:
                targetType: filePath
                filePath: '.azure-pipelines/scripts/init-c3-truststore.sh'
                arguments: '$(openshift-namespace) $(Build.SourcesDirectory)/.azure-pipelines/truststore-references/qa-reference.jks'
              env:
                TARGET_ENV: ${{ parameters.environment }}
                OC_NS: $(openshift-namespace)
                TRUSTSTORE_PASSWORD: $(c3TruststorePassword)

            - task: Bash@3
              displayName: "Build and apply derived Kafka TLS Secret (kafka-tls-cfk)"
              inputs:
                targetType: filePath
                filePath: '.azure-pipelines/scripts/build-and-apply-derived-kafka-tls-secret.sh'
                arguments: '--namespace $(openshift-namespace) --environment ${{ parameters.environment }} --ca-bundle-conf $(Build.SourcesDirectory)/apps/confluent-platform/${{ parameters.environment }}/ca-bundle.conf'
              env:
                OC_NS: $(openshift-namespace)

          - ${{ if eq(parameters.action, 'install-or-update') }}:
            - task: Bash@3
              displayName: "Validate OpenShift namespace matches canonical (RESOLVED_NS enforcement)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  OC_NS_VAR="$(openshift-namespace)"
                  RESOLVED_NS_VAR="$(RESOLVED_NS)"

                  echo "=== Namespace Validation ==="
                  echo "openshift-namespace variable: $OC_NS_VAR"
                  echo "RESOLVED_NS (canonical):      $RESOLVED_NS_VAR"

                  if [ "$OC_NS_VAR" != "$RESOLVED_NS_VAR" ]; then
                    echo ""
                    echo "FATAL: Namespace mismatch!"
                    echo "  Variable group (openshift-namespace): $OC_NS_VAR"
                    echo "  Canonical (RESOLVED_NS):              $RESOLVED_NS_VAR"
                    echo ""
                    echo "Fix the openshift-namespace value in the variable group for $TARGET_ENV"
                    exit 1
                  fi

                  echo ""
                  echo "✓ Namespace validation passed: using $RESOLVED_NS_VAR"
              env:
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Pre-flight: verify env folder + prerequisite Secrets"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  echo "=== Git commit ==="
                  git rev-parse HEAD

                  echo ""
                  echo "=== Verifying env folder $ENV_DIR ==="
                  REQUIRED_FILES=(
                    kafkarestclass.yaml
                    kraftcontroller.yaml
                    kafka.yaml
                    schemaregistry.yaml
                    connect.yaml
                    kafkarest.yaml
                    controlcenter.yaml
                    cert-manager/kafka-tls-certificate.yaml
                    cert-manager/kraftcontroller-tls-certificate.yaml
                    cert-manager/schemaregistry-tls-certificate.yaml
                    cert-manager/connect-tls-certificate.yaml
                    cert-manager/kafkarest-tls-certificate.yaml
                    cert-manager/controlcenter-tls-certificate.yaml
                  )

                  # DEV-only: include mTLS client certificate and storage
                  if [ "$TARGET_ENV" = "dev" ]; then
                    REQUIRED_FILES+=(
                      storage/controlcenter-prometheus-pvc.yaml
                      cert-manager/cfk-operator-mds-client-certificate.yaml
                    )
                  fi
                  missing_files=0
                  for f in "${REQUIRED_FILES[@]}"; do
                    if [ -f "$ENV_DIR/$f" ]; then
                      echo "OK    $f"
                    else
                      echo "MISS  $f"
                      missing_files=$((missing_files+1))
                    fi
                  done
                  if [ "$missing_files" -gt 0 ]; then
                    echo ""
                    echo "ERROR: $missing_files file(s) missing in $ENV_DIR — this env is not"
                    echo "populated yet. Add the CRs (see apps/confluent-platform/dev/ as a"
                    echo "template) before running this pipeline against $TARGET_ENV."
                    exit 1
                  fi

                  echo ""
                  echo "=== Refusing to apply if any REPLACE_WITH_ marker remains ==="
                  if grep -nrE 'REPLACE_WITH_' "$ENV_DIR" --include='*.yaml' 2>/dev/null; then
                    echo "ERROR: unresolved placeholder(s) above. Fix before running."
                    exit 1
                  fi
                  echo "(no unresolved placeholders)"

                  echo ""
                  echo "=== Verifying prerequisite Secrets in $OC_NS ==="
                  REQUIRED_SECRETS=(
                    confluent-license
                    cfk-license
                    sasl-plain-internal
                    mds-token-keypair
                    oauth-broker
                    oauth-schemaregistry
                    oauth-connect
                    oauth-kafkarest
                    oauth-controlcenter
                    oauth-mds-rest
                    oauth-mds-sso
                    c3-prom-server-basic-auth
                    c3-prom-client-basic-auth
                    c3-alert-server-basic-auth
                    c3-alert-client-basic-auth
                  )
                  missing_secrets=0
                  for s in "${REQUIRED_SECRETS[@]}"; do
                    if oc get secret "$s" -n "$OC_NS" >/dev/null 2>&1; then
                      echo "OK    $s"
                    else
                      echo "MISS  $s"
                      missing_secrets=$((missing_secrets+1))
                    fi
                  done
                  if [ "$missing_secrets" -gt 0 ]; then
                    echo ""
                    echo "ERROR: $missing_secrets required Secret(s) missing in $OC_NS."
                    echo "See $ENV_DIR/prereqs/README.md for the full list and creation pattern,"
                    echo "then run this pipeline with action=create-prereqs to (re)populate."
                    exit 1
                  fi

                  echo ""
                  echo "=== Refusing installation while a CFK prerequisite or TLS Secret is terminating ==="
                  MANAGED_SECRET_NAMES=("${REQUIRED_SECRETS[@]}")
                  for cert_manifest in "$ENV_DIR"/cert-manager/*-certificate.yaml; do
                    [ -f "$cert_manifest" ] || continue
                    cert_secret=$(awk '$1 == "secretName:" {print $2; exit}' "$cert_manifest")
                    [ -n "$cert_secret" ] && MANAGED_SECRET_NAMES+=("$cert_secret")
                  done
                  terminating_secret_count=0
                  for secret_name in "${MANAGED_SECRET_NAMES[@]}"; do
                    deletion_timestamp=$(oc -n "$OC_NS" get secret "$secret_name" \
                      -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)
                    if [ -n "$deletion_timestamp" ]; then
                      echo "TERMINATING  Secret/$secret_name since $deletion_timestamp"
                      terminating_secret_count=$((terminating_secret_count + 1))
                    fi
                  done
                  if [ "$terminating_secret_count" -gt 0 ]; then
                    echo "FATAL: $terminating_secret_count required Secret(s) are still terminating."
                    echo "Complete action=uninstall (or run clear-stuck-prereq-finalizers) before reinstalling."
                    exit 1
                  fi
                  echo "OK: no required CFK Secret has a deletionTimestamp."

                  echo ""
                  echo "=== Verifying prerequisite Secret key contracts ==="
                  require_secret_key() {
                    local secret_name=$1
                    local key_name=$2
                    if oc -n "$OC_NS" get secret "$secret_name" \
                        -o go-template="{{ index .data \"$key_name\" }}" 2>/dev/null \
                        | grep -q .; then
                      echo "OK    $secret_name [$key_name]"
                    else
                      echo "MISS  $secret_name [$key_name]"
                      return 1
                    fi
                  }
                  key_contract_failed=0
                  for key in plain-users.json plain.txt plain-interbroker.txt; do
                    require_secret_key sasl-plain-internal "$key" || key_contract_failed=1
                  done
                  for secret_name in \
                    c3-prom-server-basic-auth \
                    c3-prom-client-basic-auth \
                    c3-alert-server-basic-auth \
                    c3-alert-client-basic-auth; do
                    require_secret_key "$secret_name" basic.txt || key_contract_failed=1
                  done
                  if [ "$key_contract_failed" -ne 0 ]; then
                    echo "ERROR: one or more prerequisite Secrets have an invalid key shape."
                    echo "Run action=create-prereqs or repair the owning ExternalSecret."
                    exit 1
                  fi
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Pre-flight: validate OAuth principals and scopes per environment"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  # Search deployable manifests only. Documentation and the
                  # intentionally disabled CyberArk templates may describe
                  # placeholders or other environments without being applied.
                  active_yaml_contains() {
                    local pattern=$1
                    grep -rE --include='*.yaml' --exclude='*disabled*.yaml' \
                      "$pattern" "$ENV_DIR" >/dev/null 2>&1
                  }

                  echo "=== Validating OAuth scope principals match environment ==="
                  case "$TARGET_ENV" in
                    dev)
                      # DEV should have dahDev_groups and 11547.DAH(Dev)
                      if active_yaml_contains 'dahQA_groups|dahUAT_groups|dahProd_groups'; then
                        echo "ERROR: DEV manifests contain non-DEV OAuth groups (QA/UAT/Prod)"
                        exit 1
                      fi
                      if active_yaml_contains '11547\.DAH\(QA\)|11547\.DAH\(UAT\)|11547\.DAH\(Prod\)'; then
                        echo "ERROR: DEV manifests contain non-DEV OAuth scopes"
                        exit 1
                      fi
                      echo "✅ DEV manifests use dahDev_groups and 11547.DAH(Dev)"

                      # DEV-only: two-account identity validation using YAML parsing
                      echo ""
                      echo "=== DEV Two-Account Identity Static Validation ==="
                      python3 .azure-pipelines/scripts/validate_dev_two_account_manifest.py "$ENV_DIR"
                      ;;
                    qa)
                      # QA should have dahQA_groups and 11547.DAH(QA)
                      if active_yaml_contains 'dahDev_groups|dahUAT_groups|dahProd_groups'; then
                        echo "ERROR: QA manifests contain non-QA OAuth groups"
                        exit 1
                      fi
                      if active_yaml_contains '11547\.DAH\(Dev\)|11547\.DAH\(UAT\)|11547\.DAH\(Prod\)'; then
                        echo "ERROR: QA manifests contain non-QA OAuth scopes"
                        exit 1
                      fi
                      echo "✅ QA manifests use dahQA_groups and 11547.DAH(QA)"
                      ;;
                    uat-p|uat-s)
                      # UAT should have dahUAT_groups and 11547.DAH(UAT)
                      if active_yaml_contains 'dahDev_groups|dahQA_groups|dahProd_groups'; then
                        echo "ERROR: UAT manifests contain non-UAT OAuth groups"
                        exit 1
                      fi
                      if active_yaml_contains '11547\.DAH\(Dev\)|11547\.DAH\(QA\)|11547\.DAH\(Prod\)'; then
                        echo "ERROR: UAT manifests contain non-UAT OAuth scopes"
                        exit 1
                      fi
                      echo "✅ UAT manifests use dahUAT_groups and 11547.DAH(UAT)"
                      ;;
                    prd|dr)
                      # PRD/DR should have dahProd_groups and 11547.DAH(Prod)
                      if active_yaml_contains 'dahDev_groups|dahQA_groups|dahUAT_groups'; then
                        echo "ERROR: PRD/DR manifests contain non-PRD OAuth groups"
                        exit 1
                      fi
                      if active_yaml_contains '11547\.DAH\(Dev\)|11547\.DAH\(QA\)|11547\.DAH\(UAT\)'; then
                        echo "ERROR: PRD/DR manifests contain non-PRD OAuth scopes"
                        exit 1
                      fi
                      echo "✅ PRD/DR manifests use dahProd_groups and 11547.DAH(Prod)"
                      ;;
                  esac

                  # Final check for unresolved REPLACE_WITH_* placeholders
                  echo ""
                  echo "=== Checking for unresolved placeholder values ==="
                  if active_yaml_contains 'REPLACE_WITH_'; then
                    echo "FATAL: Manifests contain unresolved REPLACE_WITH_* placeholders"
                    exit 1
                  fi
                  echo "✅ No unresolved placeholders"
              env:
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Pre-flight: validate DEV quota and migration capacity"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  if [ "$TARGET_ENV" != "dev" ]; then
                    echo "Resource budget in this package is DEV-specific; skipping for $TARGET_ENV."
                    exit 0
                  fi

                  echo "=== Validating DEV namespace capacity before mutation ==="
                  if ! oc get storageclass kafka >/dev/null 2>&1; then
                    echo "FATAL: required StorageClass/kafka does not exist."
                    exit 1
                  fi
                  sc_provisioner=$(oc get storageclass kafka -o jsonpath='{.provisioner}')
                  sc_reclaim=$(oc get storageclass kafka -o jsonpath='{.reclaimPolicy}')
                  sc_expand=$(oc get storageclass kafka -o jsonpath='{.allowVolumeExpansion}')
                  echo "StorageClass/kafka: provisioner=$sc_provisioner reclaimPolicy=$sc_reclaim expansion=$sc_expand"
                  if [ "$sc_provisioner" != "csi.vsphere.vmware.com" ] \
                     || [ "$sc_reclaim" != "Retain" ] \
                     || [ "$sc_expand" != "true" ]; then
                    echo "FATAL: StorageClass/kafka no longer matches the approved DEV contract."
                    exit 1
                  fi

                  quota_json=$(mktemp)
                  pods_json=$(mktemp)
                  pvcs_json=$(mktemp)
                  trap 'rm -f "$quota_json" "$pods_json" "$pvcs_json"' EXIT

                  oc -n "$OC_NS" get resourcequota compute-resources -o json > "$quota_json"
                  oc -n "$OC_NS" get pods -o json > "$pods_json"
                  oc -n "$OC_NS" get pvc -o json > "$pvcs_json"

                  python3 .azure-pipelines/scripts/validate_dev_resource_budget.py \
                    --quota "$quota_json" --pods "$pods_json" --pvcs "$pvcs_json"
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Validate and apply cert-manager Certificates"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  echo "=== PHASE 1: DRY-RUN Certificate CRs (before applying) ==="
                  DRYRUN_FAILED=0
                  for cert_file in "$ENV_DIR"/cert-manager/*-certificate.yaml; do
                    if [ ! -f "$cert_file" ]; then continue; fi

                    echo "Dry-run: $(basename "$cert_file")"
                    if ! oc apply --dry-run=server -f "$cert_file" 2>&1 | tee /tmp/cert_dryrun.log; then
                      echo "ERROR: Certificate dry-run failed"
                      DRYRUN_FAILED=$((DRYRUN_FAILED+1))
                    fi
                  done

                  if [ "$DRYRUN_FAILED" -gt 0 ]; then
                    echo ""
                    echo "FATAL: $DRYRUN_FAILED certificate(s) failed dry-run validation"
                    exit 1
                  fi

                  echo ""
                  echo "=== PHASE 2: APPLY Certificate CRs (real) ==="
                  for cert in "$ENV_DIR"/cert-manager/*-certificate.yaml; do
                    if [ ! -f "$cert" ]; then continue; fi
                    echo ""
                    echo "+ oc apply -f $cert"
                    oc apply -f "$cert"
                  done

                  echo ""
                  echo "=== PHASE 3: WAIT for Certificate Ready ==="
                  # Backend serving certs (svc.cluster.local) + Ingress edge certs (apps.<cluster>.ocp.fcbint.net). 10 min cap per secret (approver-policy + Keyfactor RTT).
                  CERT_NAMES=(
                    kafka-tls
                    kraftcontroller-tls
                    schemaregistry-tls
                    connect-tls
                    kafkarest-tls
                    controlcenter-tls
                    kafka-mds-ingress-tls
                    schemaregistry-ingress-tls
                    connect-ingress-tls
                    kafkarest-ingress-tls
                    controlcenter-ingress-tls
                  )

                  # DEV-specific: add mTLS client certificate for CFK operator KafkaRestClass reconciliation
                  if [ "$TARGET_ENV" = "dev" ]; then
                    CERT_NAMES+=(cfk-operator-mds-client)
                  fi
                  validate_certificate_secret() {
                    local cert_name=$1
                    local secret_name=$2
                    local cert_tmp
                    cert_tmp=$(mktemp -d)

                    # Extract tls.crt and tls.key using go-template for dot-safe lookups
                    local crt_data key_data
                    crt_data=$(oc -n "$OC_NS" get secret "$secret_name" \
                      -o go-template="{{ index .data \"tls.crt\" }}" 2>/dev/null || true)
                    key_data=$(oc -n "$OC_NS" get secret "$secret_name" \
                      -o go-template="{{ index .data \"tls.key\" }}" 2>/dev/null || true)

                    if [ -z "$crt_data" ] || [ -z "$key_data" ]; then
                      echo "  ERROR: Certificate/$cert_name → Secret/$secret_name missing tls.crt or tls.key"
                      rm -rf "$cert_tmp"
                      return 1
                    fi

                    # Decode and save to temp files for validation
                    if ! printf '%s' "$crt_data" | base64 -d > "$cert_tmp/tls.crt" 2>/dev/null \
                      || ! printf '%s' "$key_data" | base64 -d > "$cert_tmp/tls.key" 2>/dev/null; then
                      echo "  ERROR: Certificate/$cert_name → Secret/$secret_name: base64 decode failed"
                      rm -rf "$cert_tmp"
                      return 1
                    fi

                    # Validate certificate is not expired
                    if ! openssl x509 -in "$cert_tmp/tls.crt" -noout -checkend 86400 >/dev/null; then
                      echo "  ERROR: Certificate/$cert_name → Secret/$secret_name: certificate is invalid or expires within 24 hours"
                      rm -rf "$cert_tmp"
                      return 1
                    fi

                    # Validate tls.crt and tls.key match
                    local cert_pub key_pub
                    cert_pub=$(openssl x509 -in "$cert_tmp/tls.crt" -pubkey -noout \
                      | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')
                    key_pub=$(openssl pkey -in "$cert_tmp/tls.key" -pubout -outform DER 2>/dev/null \
                      | sha256sum | awk '{print $1}')
                    if [ -z "$cert_pub" ] || [ "$cert_pub" != "$key_pub" ]; then
                      echo "  ERROR: Certificate/$cert_name → Secret/$secret_name: tls.crt and tls.key do not match"
                      rm -rf "$cert_tmp"
                      return 1
                    fi

                    # For mTLS certificates, validate clientAuth EKU
                    if [[ "$cert_name" == *"mds-client"* ]]; then
                      if ! openssl x509 -in "$cert_tmp/tls.crt" -noout -text | grep -q "TLS Web Client Authentication"; then
                        echo "  ERROR: Certificate/$cert_name → Secret/$secret_name: missing TLS Web Client Authentication EKU"
                        rm -rf "$cert_tmp"
                        return 1
                      fi
                    fi

                    local dns_name
                    while IFS= read -r dns_name; do
                      [ -z "$dns_name" ] && continue
                      if ! openssl x509 -in "$cert_tmp/tls.crt" -noout \
                          -checkhost "$dns_name" >/dev/null 2>&1; then
                        echo "  ERROR: certificate SAN does not cover $dns_name"
                        rm -rf "$cert_tmp"
                        return 1
                      fi
                    done < <(oc -n "$OC_NS" get certificate "$cert_name" \
                      -o jsonpath='{range .spec.dnsNames[*]}{.}{"\n"}{end}')

                    if [ "$cert_name" = kafka-tls ]; then
                      if ! oc -n "$OC_NS" get secret "$cert_name" \
                          -o jsonpath='{.data.ca\.crt}' | grep -q .; then
                        echo "  ERROR: kafka-tls must contain ca.crt for verified MDS TLS"
                        rm -rf "$cert_tmp"
                        return 1
                      fi
                    fi

                    rm -rf "$cert_tmp"
                    return 0
                  }

                  cert_failed=0
                  for cert_name in "${CERT_NAMES[@]}"; do
                    echo ""
                    echo "Waiting for certificate/$cert_name..."

                    # Wait for Certificate Ready=True condition
                    for i in $(seq 1 60); do
                      ready=$(oc -n "$OC_NS" get certificate "$cert_name" \
                        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")

                      if [ "$ready" = "True" ]; then
                        # Certificate is ready, retrieve its actual Secret name from spec.secretName
                        secret_name=$(oc -n "$OC_NS" get certificate "$cert_name" \
                          -o jsonpath='{.spec.secretName}' 2>/dev/null || echo "")

                        if [ -z "$secret_name" ]; then
                          echo "  ERROR: certificate/$cert_name has no spec.secretName"
                          cert_failed=$((cert_failed+1))
                          break
                        fi

                        # Verify the Secret exists and has keys
                        if oc -n "$OC_NS" get secret "$secret_name" >/dev/null 2>&1; then
                          crt=$(oc -n "$OC_NS" get secret "$secret_name" \
                            -o go-template="{{ index .data \"tls.crt\" }}" 2>/dev/null | wc -c)
                          key=$(oc -n "$OC_NS" get secret "$secret_name" \
                            -o go-template="{{ index .data \"tls.key\" }}" 2>/dev/null | wc -c)

                          if [ "$crt" -ge 100 ] && [ "$key" -ge 100 ] \
                             && validate_certificate_secret "$cert_name" "$secret_name"; then
                            echo "  ✅ ready after $((i*10))s (Certificate/$cert_name → Secret/$secret_name, valid lifetime/SAN/key/EKU)"
                            break
                          fi
                        fi
                      fi

                      if [ "$i" -eq 60 ]; then
                        echo ""
                        echo "ERROR: certificate/$cert_name not Ready=True after 10 min."
                        echo "Final certificate conditions:"
                        oc describe certificate "$cert_name" -n "$OC_NS" 2>&1 | tail -30 || true
                        echo ""
                        echo "CertificateRequests:"
                        oc get certificaterequest -n "$OC_NS" 2>&1 | tail -10 || true
                        cert_failed=$((cert_failed+1))
                        break
                      fi
                      sleep 10
                    done
                  done

                  if [ "$cert_failed" -gt 0 ]; then
                    echo ""
                    echo "FATAL: $cert_failed certificate(s) not ready after waiting"
                    exit 1
                  fi

                  # DEV-only: validate mTLS client certificate secret contents
                  if [ "$TARGET_ENV" = "dev" ]; then
                    echo ""
                    echo "=== PHASE 3b: Validating DEV mTLS client certificate secret ==="
                    MTLS_SECRET="cfk-operator-mds-client-tls"
                    echo "Verifying Secret/$MTLS_SECRET contains required keys with correct format..."

                    # Validate tls.crt, tls.key, ca.crt exist and are nonempty using go-template
                    for key in tls.crt tls.key ca.crt; do
                      value=$(oc -n "$OC_NS" get secret "$MTLS_SECRET" \
                        -o go-template="{{ index .data \"$key\" }}" 2>/dev/null || true)

                      if [ -z "$value" ]; then
                        echo "  ERROR: Secret/$MTLS_SECRET missing or empty key: $key"
                        exit 1
                      fi
                      echo "  ✓ $key present and nonempty"
                    done

                    # Validate tls.crt has clientAuth EKU
                    crt_data=$(oc -n "$OC_NS" get secret "$MTLS_SECRET" \
                      -o go-template="{{ index .data \"tls.crt\" }}" 2>/dev/null | base64 -d)
                    if ! printf '%s' "$crt_data" | openssl x509 -noout -text | grep -q "TLS Web Client Authentication"; then
                      echo "  ERROR: Secret/$MTLS_SECRET tls.crt missing TLS Web Client Authentication EKU"
                      exit 1
                    fi
                    echo "  ✓ tls.crt has TLS Web Client Authentication EKU"
                  fi

                  echo ""
                  echo "=== PHASE 4: DRY-RUN Dependent Resources (after certificates ready) ==="
                  for manifest in kafkarestclass.yaml kraftcontroller.yaml kafka.yaml rbac/rolebindings.yaml; do
                    path="$ENV_DIR/$manifest"
                    [ -f "$path" ] || continue

                    echo "Dry-run: $manifest"
                    if ! oc apply --dry-run=server -f "$path" 2>&1 | tee /tmp/manifest_dryrun.log; then
                      echo "ERROR: Dry-run failed for $manifest"
                      exit 1
                    fi
                  done

                  echo ""
                  echo "✅ Certificate and dependent manifest validation complete"
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Pre-flight: validate listener authentication and ports"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  echo "=== Validating hybrid listener contract ==="
                  python3 --version
                  python3 .azure-pipelines/scripts/validate_listeners.py "$ENV_DIR"

              env:
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Pre-flight: oc apply --dry-run=server validation"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  echo "=== Pre-Flight: Dry-Run Validation (Server-Side) ==="
                  echo "Testing manifest admission against OpenShift API schema..."
                  echo ""

                  # Define manifests to validate with dry-run. Order: prerequisites before dependents.
                  # Network policy, storage, RBAC first, then CRs. Certificates already applied in previous task.
                  MANIFESTS_TO_VALIDATE=(
                    "network-policy/network-policy.yaml"
                    "storage/controlcenter-prometheus-pvc.yaml"
                    "rbac/rolebindings.yaml"
                    "kafkarestclass.yaml"
                    "kraftcontroller.yaml"
                    "kafka.yaml"
                    "schemaregistry.yaml"
                    "connect.yaml"
                    "kafkarest.yaml"
                    "controlcenter.yaml"
                  )

                  # Ingress and external-secrets are optional
                  for ingress_file in "$ENV_DIR"/ingress/*.yaml; do
                    if [ -f "$ingress_file" ]; then
                      MANIFESTS_TO_VALIDATE+=("ingress/$(basename "$ingress_file")")
                    fi
                  done

                  for extSecret_file in "$ENV_DIR"/externalsecrets/*.yaml; do
                    if [ -f "$extSecret_file" ]; then
                      MANIFESTS_TO_VALIDATE+=("externalsecrets/$(basename "$extSecret_file")")
                    fi
                  done

                  DRY_RUN_FAILED=0
                  DRY_RUN_PASSED=0

                  for manifest in "${MANIFESTS_TO_VALIDATE[@]}"; do
                    manifest_path="$ENV_DIR/$manifest"

                    if [ ! -f "$manifest_path" ]; then
                      echo "  SKIP (not found): $manifest"
                      continue
                    fi

                    # Skip fully commented documentation/templates, but continue validating
                    # every file that contains active YAML.
                    if ! grep -Eq '^[[:space:]]*[^#[:space:]]' "$manifest_path"; then
                      echo "  SKIP (comment-only template): $manifest"
                      continue
                    fi

                    echo "  Testing: $manifest"

                    if oc apply --dry-run=server -f "$manifest_path" -n "$OC_NS" >/dev/null 2>&1; then
                      echo "    ✓ passes dry-run"
                      DRY_RUN_PASSED=$((DRY_RUN_PASSED+1))
                    else
                      echo "    ✗ FAILED dry-run validation:"
                      oc apply --dry-run=server -f "$manifest_path" -n "$OC_NS" 2>&1 | sed 's/^/      /'
                      DRY_RUN_FAILED=$((DRY_RUN_FAILED+1))
                    fi
                  done

                  echo ""
                  echo "=== Dry-Run Summary ==="
                  echo "  Passed: $DRY_RUN_PASSED"
                  echo "  Failed: $DRY_RUN_FAILED"

                  if [ "$DRY_RUN_FAILED" -gt 0 ]; then
                    echo ""
                    echo "FATAL: $DRY_RUN_FAILED manifest(s) failed dry-run validation."
                    echo "Fix schema violations above before proceeding."
                    exit 1
                  else
                    echo ""
                    echo "OK: All manifests ready for application."
                  fi
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}

            - task: Bash@3
              displayName: "Apply Confluent Platform CRs (phased — wait for Kafka before SR/Connect/REST/C3)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  # Component selectors. ADO serializes booleans as "True"/"False" (capitalized). "All" on = every component in scope; "All" off = union of checked components.
                  is_true() { [ "$1" = "True" ]; }

                  APPLY_ALL=${APPLY_ALL:-True}
                  if is_true "$APPLY_ALL"; then
                    APPLY_KRAFT=True
                    APPLY_KAFKA=True
                    APPLY_SR=True
                    APPLY_CONNECT=True
                    APPLY_KREST=True
                    APPLY_C3=True
                  else
                    APPLY_KRAFT=${APPLY_KRAFT_CONTROLLER:-False}
                    APPLY_KAFKA=${APPLY_KAFKA:-False}
                    APPLY_SR=${APPLY_SCHEMA_REGISTRY:-False}
                    APPLY_CONNECT=${APPLY_CONNECT:-False}
                    APPLY_KREST=${APPLY_KAFKA_REST_PROXY:-False}
                    APPLY_C3=${APPLY_CONTROL_CENTER:-False}
                  fi

                  echo "=== Components in scope for this install-or-update run ==="
                  printf "  %-22s %s\n" "All (master switch)" "$APPLY_ALL"
                  printf "  %-22s %s\n" "KRaft Controller"    "$APPLY_KRAFT"
                  printf "  %-22s %s\n" "Kafka Broker"        "$APPLY_KAFKA"
                  printf "  %-22s %s\n" "Schema Registry"     "$APPLY_SR"
                  printf "  %-22s %s\n" "Kafka Connect"       "$APPLY_CONNECT"
                  printf "  %-22s %s\n" "Kafka REST Proxy"    "$APPLY_KREST"
                  printf "  %-22s %s\n" "Control Center"      "$APPLY_C3"
                  echo ""

                  if ! is_true "$APPLY_KRAFT" && ! is_true "$APPLY_KAFKA" \
                     && ! is_true "$APPLY_SR" && ! is_true "$APPLY_CONNECT" \
                     && ! is_true "$APPLY_KREST" && ! is_true "$APPLY_C3"; then
                    echo "ERROR: no components in scope — 'All' is off AND every individual"
                    echo "component checkbox is off. Either check 'All' for a full install,"
                    echo "or check at least one individual component for a targeted upgrade."
                    exit 1
                  fi

                  # DEV-only: static contract checks for mTLS KafkaRestClass
                  if [ "$TARGET_ENV" = "dev" ]; then
                    echo ""
                    echo "=== DEV mTLS Static Contract Checks ==="
                    dev_contract_passed=0
                    dev_contract_failed=0

                    # Check kafkarestclass.yaml endpoint
                    if grep -q "https://kafka\.dah-flink-dev\.svc\.cluster\.local:8090" "$ENV_DIR/kafkarestclass.yaml"; then
                      echo "  ✓ kafkarestclass endpoint correct"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ kafkarestclass endpoint incorrect"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check kafkarestclass authentication type is mtls
                    if grep -q "type: mtls" "$ENV_DIR/kafkarestclass.yaml"; then
                      echo "  ✓ kafkarestclass authentication type is mtls"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ kafkarestclass authentication type is not mtls"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check kafkarestclass sslClientAuthentication
                    if grep -A5 "authentication:" "$ENV_DIR/kafkarestclass.yaml" | grep -q "sslClientAuthentication: true"; then
                      echo "  ✓ kafkarestclass sslClientAuthentication is true"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ kafkarestclass sslClientAuthentication is not true"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check kafkarestclass tls.secretRef is correct
                    if grep -q "secretRef: cfk-operator-mds-client-tls" "$ENV_DIR/kafkarestclass.yaml"; then
                      echo "  ✓ kafkarestclass tls.secretRef is cfk-operator-mds-client-tls"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ kafkarestclass tls.secretRef is incorrect"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check kafka.yaml has provider.mtls with sslClientAuthentication: requested
                    mtls_ssl_check=$(python3 -c 'import sys,yaml; data=yaml.safe_load(open(sys.argv[1])); value=data.get("spec",{}).get("services",{}).get("mds",{}).get("provider",{}).get("mtls",{}).get("sslClientAuthentication"); print("pass" if value == "requested" else "fail")' "$ENV_DIR/kafka.yaml" 2>/dev/null || echo "error")

                    if [ "$mtls_ssl_check" = "pass" ]; then
                      echo "  ✓ kafka.yaml provider.mtls has sslClientAuthentication: requested"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ kafka.yaml provider.mtls configuration incorrect or missing"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check kafka.yaml has cfk-operator-rbac principal in superUsers
                    if grep -q "User:cfk-operator-rbac" "$ENV_DIR/kafka.yaml"; then
                      echo "  ✓ kafka.yaml has User:cfk-operator-rbac in superUsers"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ kafka.yaml missing User:cfk-operator-rbac in superUsers"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check kafka.yaml has cfk-operator-rbac principal in impersonation.admins
                    if grep -A20 "impersonation:" "$ENV_DIR/kafka.yaml" | grep -q "User:cfk-operator-rbac"; then
                      echo "  ✓ kafka.yaml has User:cfk-operator-rbac in impersonation.admins"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ kafka.yaml missing User:cfk-operator-rbac in impersonation.admins"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Static validation: fail if OAuth overrides exist while kafkaRest uses mTLS
                    if grep -q "confluent.kafkarest.sasl.oauthbearer" "$ENV_DIR/kafka.yaml"; then
                      echo "  ✗ CONFLICT: confluent.kafkarest.sasl.oauthbearer present while dependencies.kafkaRest.authentication.type is mtls"
                      dev_contract_failed=$((dev_contract_failed+1))
                    else
                      echo "  ✓ No OAuth overrides conflict with mTLS kafkaRest"
                      dev_contract_passed=$((dev_contract_passed+1))
                    fi

                    # Validate actual issued certificate: FQDN CN and clientAuth EKU
                    echo "  Validating actual issued cfk-operator-mds-client certificate..."
                    cert_cn_actual=$(oc -n "$OC_NS" get secret cfk-operator-mds-client-tls \
                      -o jsonpath='{.data.tls\.crt}' 2>/dev/null | base64 -d 2>/dev/null | \
                      openssl x509 -noout -subject 2>/dev/null | sed 's/^subject=//' | sed 's/^ *//' | sed 's/CN = //' | sed 's/,.*//')

                    if [ "$cert_cn_actual" = "cfk-operator-rbac.apps.dv.ocp.fcbint.net" ]; then
                      echo "  ✓ Issued certificate CN is cfk-operator-rbac.apps.dv.ocp.fcbint.net"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ Issued certificate CN is '$cert_cn_actual', expected cfk-operator-rbac.apps.dv.ocp.fcbint.net"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Validate principal mapping: FQDN CN maps to short principal
                    if grep -q "cfk-operator-rbac.*apps.*dv.*ocp.*fcbint.*net.*cfk-operator-rbac" "$ENV_DIR/kafka.yaml"; then
                      echo "  ✓ principalMappingRules maps FQDN CN to cfk-operator-rbac"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ Missing principalMappingRule for cfk-operator-rbac.apps.dv.ocp.fcbint.net"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check issued certificate has clientAuth EKU
                    if oc -n "$OC_NS" get secret cfk-operator-mds-client-tls \
                      -o jsonpath='{.data.tls\.crt}' 2>/dev/null | base64 -d 2>/dev/null | \
                      openssl x509 -noout -text 2>/dev/null | grep -q "TLS Web Client Authentication"; then
                      echo "  ✓ Issued certificate has TLS Web Client Authentication EKU"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ Issued certificate missing TLS Web Client Authentication EKU"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check certificate commonName (approved FQDN that maps to short principal)
                    certificate_cn_check=$(python3 -c 'import sys,yaml; data=yaml.safe_load(open(sys.argv[1])); print("pass" if data.get("spec",{}).get("commonName") == "cfk-operator-rbac.apps.dv.ocp.fcbint.net" else "fail")' "$ENV_DIR/cert-manager/cfk-operator-mds-client-certificate.yaml" 2>/dev/null || echo "error")

                    if [ "$certificate_cn_check" = "pass" ]; then
                      echo "  ✓ certificate commonName is cfk-operator-rbac.apps.dv.ocp.fcbint.net"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ certificate commonName is incorrect"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check certificate secretName
                    if grep -q "secretName: cfk-operator-mds-client-tls" "$ENV_DIR/cert-manager/cfk-operator-mds-client-certificate.yaml"; then
                      echo "  ✓ certificate secretName is cfk-operator-mds-client-tls"
                      dev_contract_passed=$((dev_contract_passed+1))
                    else
                      echo "  ✗ certificate secretName is incorrect"
                      dev_contract_failed=$((dev_contract_failed+1))
                    fi

                    # Check kafka-tls has clientAuth EKU

                    echo ""
                    echo "Contract checks: $dev_contract_passed passed, $dev_contract_failed failed"
                    if [ "$dev_contract_failed" -gt 0 ]; then
                      echo "ERROR: DEV mTLS contract violations detected. Fix manifests before proceeding."
                      exit 1
                    fi
                  fi

                  # Phased apply: controller + Kafka first, wait for cluster-ready, THEN apply Phase 2 (SR/Connect/REST/C3). Without this, SR crashes after kafkastore.init.timeout.ms and CrashLoopBackOffs (runbook A14). Poll status.conditions["platform.confluent.io/cluster-ready"]==True directly — `oc wait` mis-parses the slash in the condition type.

                  wait_for_cr_ready() {
                    local kind=$1
                    local name=$2
                    local timeout=$3
                    local elapsed=0
                    local step=10

                    echo ""
                    echo "=== Waiting up to ${timeout}s for $kind/$name to report cluster-ready and no rolling update ==="
                    while [ "$elapsed" -lt "$timeout" ]; do
                      # `|| true` so a transient NotFound in the first ~10s post-apply (API admitting, operator hasn't written status yet) doesn't trip `set -e` and abort the wait. Only exit via the explicit `return 1` on timeout.
                      local cluster_ready rolling
                      cluster_ready=$(oc -n "$OC_NS" get "$kind" "$name" \
                        -o jsonpath='{.status.conditions[?(@.type=="platform.confluent.io/cluster-ready")].status}' \
                        2>/dev/null || echo "")
                      rolling=$(oc -n "$OC_NS" get "$kind" "$name" \
                        -o jsonpath='{.status.conditions[?(@.type=="platform.confluent.io/rolling")].status}' \
                        2>/dev/null || echo "")
                      if [ "$cluster_ready" = "True" ] && [ "$rolling" != "True" ]; then
                        echo "  $kind/$name cluster-ready=True, rolling!=True after ${elapsed}s."
                        return 0
                      fi

                      # Heartbeat every 60s — show conditions holding the CR up.
                      if [ "$elapsed" -gt 0 ] && [ $((elapsed % 60)) -eq 0 ]; then
                        echo "  ${elapsed}s elapsed, $kind/$name not yet ready. Current conditions:"
                        oc -n "$OC_NS" get "$kind" "$name" \
                          -o jsonpath='{range .status.conditions[*]}    {.type}={.status} ({.reason}: {.message}){"\n"}{end}' \
                          2>/dev/null \
                          || echo "    (status block not populated yet — CR just admitted)"
                      fi
                      sleep "$step" || true
                      elapsed=$((elapsed + step))
                    done

                    echo ""
                    echo "ERROR: $kind/$name did not reach cluster-ready=True within ${timeout}s."
                    echo "Final conditions:"
                    oc -n "$OC_NS" get "$kind" "$name" \
                      -o jsonpath='{range .status.conditions[*]}    {.type}={.status} ({.reason}: {.message}){"\n"}{end}' \
                      2>/dev/null \
                      || echo "    (no status block present at all)"
                    echo ""
                    echo "Investigate before applying the dependent CRs (SR / Connect / REST / C3)."
                    return 1
                  }

                  # An existing CFK CR can retain cluster-ready=True briefly after
                  # `oc apply` increments metadata.generation. Wait until the
                  # operator has observed the new generation before trusting its
                  # readiness conditions. Older CFK status schemas may omit
                  # observedGeneration; in that case allow a reconciliation grace
                  # period and rely on the StatefulSet rollout gate below.
                  wait_for_cr_reconcile() {
                    local kind=$1
                    local name=$2
                    local timeout=$3
                    local desired observed elapsed=0 step=10

                    desired=$(oc -n "$OC_NS" get "$kind" "$name" \
                      -o jsonpath='{.metadata.generation}')
                    echo "=== Waiting for $kind/$name generation $desired to be observed ==="

                    while [ "$elapsed" -lt "$timeout" ]; do
                      apply_failed=$(oc -n "$OC_NS" get "$kind" "$name" \
                        -o jsonpath='{range .status.conditions[?(@.reason=="ApplyFailed")]}{.message}{end}' \
                        2>/dev/null || true)
                      if [ -n "$apply_failed" ]; then
                        echo "ERROR: $kind/$name reported ApplyFailed before creating its workload:"
                        echo "  $apply_failed"
                        return 1
                      fi

                      observed=$(oc -n "$OC_NS" get "$kind" "$name" \
                        -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)

                      if [[ "$observed" =~ ^[0-9]+$ ]] && [ "$observed" -ge "$desired" ]; then
                        echo "  Operator observed generation $observed after ${elapsed}s."
                        return 0
                      fi

                      if [ -z "$observed" ] && [ "$elapsed" -ge 120 ]; then
                        echo "  status.observedGeneration is unavailable; reconciliation grace period completed."
                        return 0
                      fi

                      sleep "$step"
                      elapsed=$((elapsed + step))
                    done

                    echo "ERROR: operator did not observe $kind/$name generation $desired within ${timeout}s."
                    return 1
                  }

                  wait_for_statefulset_rollout() {
                    local name=$1
                    local timeout=$2
                    local cr_kind=${3:-$name}
                    local deadline=$((SECONDS + timeout))
                    local remaining apply_failed

                    echo "=== Waiting up to ${timeout}s for StatefulSet/$name to be created ==="
                    while ! oc -n "$OC_NS" get statefulset "$name" >/dev/null 2>&1; do
                      apply_failed=$(oc -n "$OC_NS" get "$cr_kind" "$name" \
                        -o jsonpath='{range .status.conditions[?(@.reason=="ApplyFailed")]}{.message}{end}' \
                        2>/dev/null || true)
                      if [ -n "$apply_failed" ]; then
                        echo "ERROR: $cr_kind/$name reported ApplyFailed; StatefulSet/$name cannot be created:"
                        echo "  $apply_failed"
                        return 1
                      fi
                      if [ "$SECONDS" -ge "$deadline" ]; then
                        echo "ERROR: StatefulSet/$name was not created within ${timeout}s."
                        oc -n "$OC_NS" get "$cr_kind" "$name" -o yaml || true
                        return 1
                      fi
                      sleep 10
                    done

                    remaining=$((deadline - SECONDS))
                    [ "$remaining" -gt 0 ] || remaining=1
                    echo "=== Waiting for StatefulSet/$name rollout to complete (${remaining}s remaining) ==="
                    if ! oc -n "$OC_NS" rollout status "statefulset/$name" \
                        --timeout="${remaining}s"; then
                      echo "ERROR: StatefulSet/$name rollout did not complete within ${timeout}s."
                      oc -n "$OC_NS" get statefulset "$name" -o wide || true
                      oc -n "$OC_NS" get pods -l "app=$name" -o wide || true
                      return 1
                    fi

                    # Require two consecutive fully-ready observations. This
                    # prevents an old ready revision from being accepted while
                    # CFK is beginning a new rollout.
                    local stable=0 replicas ready updated current update
                    while [ "$stable" -lt 2 ] && [ "$SECONDS" -lt "$deadline" ]; do
                      replicas=$(oc -n "$OC_NS" get statefulset "$name" \
                        -o jsonpath='{.spec.replicas}')
                      ready=$(oc -n "$OC_NS" get statefulset "$name" \
                        -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
                      updated=$(oc -n "$OC_NS" get statefulset "$name" \
                        -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || true)
                      current=$(oc -n "$OC_NS" get statefulset "$name" \
                        -o jsonpath='{.status.currentRevision}' 2>/dev/null || true)
                      update=$(oc -n "$OC_NS" get statefulset "$name" \
                        -o jsonpath='{.status.updateRevision}' 2>/dev/null || true)

                      if [ "$ready" = "$replicas" ] && [ "$updated" = "$replicas" ] \
                         && [ -n "$current" ] && [ "$current" = "$update" ]; then
                        stable=$((stable + 1))
                      else
                        stable=0
                      fi
                      [ "$stable" -lt 2 ] && sleep 10
                    done
                    if [ "$stable" -lt 2 ]; then
                      echo "ERROR: StatefulSet/$name did not remain fully ready for two consecutive observations."
                      oc -n "$OC_NS" get statefulset "$name" -o wide || true
                      return 1
                    fi
                    echo "  StatefulSet/$name is fully rolled out and stable."
                  }

                  # Pre-Phase: NetworkPolicy for CFK-operator ingress (Jolokia :7777 probe).
                  # DEV: App team has RBAC permission to create NetworkPolicies in dev (auto-apply).
                  # Upper environments (qa, uat-p, uat-s, prd, dr): apply if file exists; if RBAC
                  # forbidden, contact infrastructure team (Rick/Tom) or submit SNOW request.
                  if [ -f "$ENV_DIR/network-policy/network-policy.yaml" ]; then
                    echo ""
                    echo "+ oc apply -f $ENV_DIR/network-policy/network-policy.yaml"
                    if ! oc apply -f "$ENV_DIR/network-policy/network-policy.yaml"; then
                      if [ "$TARGET_ENV" != "dev" ]; then
                        echo ""
                        echo "WARNING: NetworkPolicy apply failed for $TARGET_ENV (likely RBAC permission)."
                        echo "         Contact infrastructure team (Rick/Tom) or submit SNOW request."
                      else
                        exit 1
                      fi
                    fi
                  else
                    echo ""
                    echo "(NetworkPolicy file not found — skipping)"
                  fi

                  echo "=== Phase 1a: KRaftController ==="
                  if is_true "$APPLY_KRAFT"; then
                    echo ""
                    echo "+ oc apply -f $ENV_DIR/kraftcontroller.yaml"
                    oc apply -f "$ENV_DIR/kraftcontroller.yaml"
                    wait_for_cr_reconcile kraftcontroller kraftcontroller 300
                    wait_for_statefulset_rollout kraftcontroller 600
                  else
                    echo "(KRaft Controller skipped — checkbox off)"
                  fi

                  if is_true "$APPLY_KRAFT" || is_true "$APPLY_KAFKA"; then
                    wait_for_cr_ready kraftcontroller kraftcontroller 600
                  fi

                  echo ""
                  echo "=== Phase 1b: Kafka (with existing-cluster bootstrap) ==="
                  if is_true "$APPLY_KAFKA"; then
                    KAFKA_YAML="$ENV_DIR/kafka.yaml"
                    if [ ! -f "$KAFKA_YAML" ]; then
                      echo "ABORT: $KAFKA_YAML not found in checkout."
                      exit 1
                    fi

                    # DEV-only bootstrap gate: if Kafka already exists (upgrade scenario), apply rolebindings first
                    if [ "$TARGET_ENV" = "dev" ] && \
                       oc -n "$OC_NS" get kafka kafka >/dev/null 2>&1 && \
                       oc -n "$OC_NS" get kafkarestclass default >/dev/null 2>&1; then
                      echo ""
                      echo "=== DEV existing-cluster bootstrap: Kafka/KafkaRestClass detected ==="
                      echo "Applying rolebindings BEFORE kafka.yaml rolling update..."

                      # Require rolebindings.yaml for DEV bootstrap
                      if [ ! -f "$ENV_DIR/rbac/rolebindings.yaml" ]; then
                        echo "FATAL: $ENV_DIR/rbac/rolebindings.yaml required for DEV bootstrap but not found."
                        exit 1
                      fi

                      echo "+ oc apply -f $ENV_DIR/rbac/rolebindings.yaml"
                      oc apply -f "$ENV_DIR/rbac/rolebindings.yaml"
                      echo ""
                      echo "=== Waiting for kafka-embedded-rest-systemadmin to reach app-ready=True ==="
                      rb_deadline=$((SECONDS + 300))
                      while true; do
                        rb_app_ready=$(oc -n "$OC_NS" get confluentrolebinding kafka-embedded-rest-systemadmin \
                          -o jsonpath='{.status.conditions[?(@.type=="platform.confluent.io/app-ready")].status}' \
                          2>/dev/null || true)
                        rb_state=$(oc -n "$OC_NS" get confluentrolebinding kafka-embedded-rest-systemadmin \
                          -o jsonpath='{.status.state}' 2>/dev/null || true)
                        if [ "$rb_app_ready" = "True" ]; then
                          echo "✅ kafka-embedded-rest-systemadmin app-ready=True (state=$rb_state)"
                          break
                        fi
                        if [ "$SECONDS" -ge "$rb_deadline" ]; then
                          echo "FATAL: kafka-embedded-rest-systemadmin did not reach app-ready=True within 300s"
                          oc -n "$OC_NS" describe confluentrolebinding kafka-embedded-rest-systemadmin || true
                          exit 1
                        fi
                        echo "  Waiting... app-ready=$rb_app_ready state=$rb_state"
                        sleep 10
                      done
                    fi

                    echo ""
                    echo "+ oc apply -f $KAFKA_YAML"
                    oc apply -f "$KAFKA_YAML"
                    wait_for_cr_reconcile kafka kafka 300
                    wait_for_statefulset_rollout kafka 900
                    wait_for_cr_ready kafka kafka 900

                    # After Kafka is ready, apply KafkaRestClass
                    # (must come after Kafka CR for mTLS principal validation)
                    echo ""
                    echo "=== Phase 1b (continued): KafkaRestClass (after Kafka ready) ==="
                    echo ""
                    echo "+ oc apply -f $ENV_DIR/kafkarestclass.yaml"
                    oc apply -f "$ENV_DIR/kafkarestclass.yaml"

                    # Wait for KafkaRestClass discovery to complete
                    # CFK 3.1.x does not populate status.state; check observedGeneration, kafkaClusterID, endpoint instead.
                    echo ""
                    echo "=== Waiting for KafkaRestClass discovery to complete ==="
                    KREST_CLASS_TIMEOUT=300
                    KREST_CLASS_ELAPSED=0
                    KREST_CLASS_STEP=10
                    krc_ready_success=false

                    while [ "$KREST_CLASS_ELAPSED" -lt "$KREST_CLASS_TIMEOUT" ]; do
                      GEN=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "")
                      OBSERVED=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo "")
                      CLUSTER_ID=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.status.kafkaClusterID}' 2>/dev/null || echo "")
                      ENDPOINT=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.status.endpoint}' 2>/dev/null || echo "")

                      if [[ "$OBSERVED" == "$GEN" && -n "$CLUSTER_ID" && -n "$ENDPOINT" ]]; then
                        echo "  ✅ KafkaRestClass discovery succeeded after ${KREST_CLASS_ELAPSED}s"
                        echo "      observedGeneration=$OBSERVED, kafkaClusterID=$CLUSTER_ID, endpoint=$ENDPOINT"
                        krc_ready_success=true
                        break
                      fi

                      if [ "$KREST_CLASS_ELAPSED" -gt 0 ] && [ $((KREST_CLASS_ELAPSED % 60)) -eq 0 ]; then
                        echo "  ${KREST_CLASS_ELAPSED}s elapsed, KafkaRestClass discovery not complete."
                        echo "      observedGeneration=$OBSERVED (expected $GEN), kafkaClusterID=$CLUSTER_ID, endpoint=$ENDPOINT"
                      fi

                      sleep "$KREST_CLASS_STEP" || true
                      KREST_CLASS_ELAPSED=$((KREST_CLASS_ELAPSED + KREST_CLASS_STEP))
                    done

                    if [ "$krc_ready_success" != true ]; then
                      echo ""
                      echo "ERROR: KafkaRestClass discovery did not complete within ${KREST_CLASS_TIMEOUT}s."
                      echo "Final KafkaRestClass status:"
                      oc -n "$OC_NS" get kafkarestclass default -o yaml || true
                      echo ""
                      echo "Related KafkaRestClass events (filtered by current object UID):"
                      KRC_UID=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.metadata.uid}' 2>/dev/null || echo "")
                      oc -n "$OC_NS" get events --field-selector involvedObject.uid="$KRC_UID" --sort-by='.lastTimestamp' || true
                      echo ""
                      echo "CFK operator pod logs (last 50 lines):"
                      oc -n confluent-operator logs -l app.kubernetes.io/name=confluent-operator --tail=50 || true
                      exit 1
                    fi
                  else
                    echo "(Kafka Broker skipped — checkbox off; kafkarestclass.yaml also not applied)"
                  fi

                  if is_true "$APPLY_KAFKA" || is_true "$APPLY_SR" \
                     || is_true "$APPLY_CONNECT" || is_true "$APPLY_KREST" \
                     || is_true "$APPLY_C3"; then
                    wait_for_cr_ready kafka kafka 900
                  fi

                  # Apply RBAC rolebindings AFTER Kafka/MDS and KafkaRestClass are ready.
                  # Rolebindings cannot reconcile before these prerequisites exist.
                  echo ""
                  echo "=== Phase 1c: RBAC rolebindings (after KafkaRestClass ready) ==="
                  if is_true "$APPLY_KAFKA" || is_true "$APPLY_SR" \
                     || is_true "$APPLY_CONNECT" || is_true "$APPLY_KREST" \
                     || is_true "$APPLY_C3"; then
                    if [ -f "$ENV_DIR/rbac/rolebindings.yaml" ]; then
                      echo "+ oc apply -f $ENV_DIR/rbac/rolebindings.yaml"
                      rolebinding_resources=$(oc apply -f "$ENV_DIR/rbac/rolebindings.yaml" -o name)

                      echo "=== Waiting up to 300s for every applied ConfluentRolebinding to reach app-ready=True ==="
                      rb_deadline=$((SECONDS + 300))
                      while true; do
                        rb_pending=0

                        while IFS= read -r rb_resource; do
                          [ -n "$rb_resource" ] || continue

                          rb_generation=$(oc -n "$OC_NS" get "$rb_resource" \
                            -o jsonpath='{.metadata.generation}' 2>/dev/null || true)
                          rb_observed=$(oc -n "$OC_NS" get "$rb_resource" \
                            -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)
                          rb_app_ready=$(oc -n "$OC_NS" get "$rb_resource" \
                            -o jsonpath='{.status.conditions[?(@.type=="platform.confluent.io/app-ready")].status}' \
                            2>/dev/null || true)

                          # Require generation to be observed AND app-ready=True
                          generation_current=false
                          if [ -z "$rb_observed" ] || [ "$rb_observed" = "$rb_generation" ]; then
                            generation_current=true
                          fi

                          if [ "$generation_current" = true ] && [ "$rb_app_ready" = "True" ]; then
                            printf '  READY   %-60s generation=%s app-ready=%s\n' \
                              "$rb_resource" "${rb_generation:-n/a}" "${rb_app_ready:-n/a}"
                          else
                            printf '  PENDING %-60s generation=%s observed=%s app-ready=%s\n' \
                              "$rb_resource" "${rb_generation:-n/a}" "${rb_observed:-n/a}" \
                              "${rb_app_ready:-n/a}"
                            rb_pending=$((rb_pending + 1))
                          fi
                        done <<< "$rolebinding_resources"

                        if [ "$rb_pending" -eq 0 ]; then
                          echo "OK: all applied ConfluentRolebindings are app-ready in MDS."
                          break
                        fi

                        if [ "$SECONDS" -ge "$rb_deadline" ]; then
                          echo "FATAL: $rb_pending ConfluentRolebinding(s) did not reach app-ready=True within 300s."
                          echo "Rolebinding status:"
                          oc -n "$OC_NS" get confluentrolebinding 2>&1 || true
                          echo "Recent rolebinding/operator events:"
                          oc -n "$OC_NS" get events --sort-by=.lastTimestamp 2>&1 \
                            | grep -Ei 'rolebind|kafkarestclass|metadata|mds|oauth|error|fail' \
                            | tail -80 || true
                          exit 1
                        fi

                        sleep 10
                      done
                    else
                      echo "FATAL: $ENV_DIR/rbac/rolebindings.yaml not found; managed components cannot be authorized."
                      exit 1
                    fi
                  else
                    echo "(RBAC rolebindings skipped — no Kafka or managed component selected)"
                  fi

                  # Post-Kafka verification: listener ports, MDS readiness, oauth-mds-sso Secret presence.
                  if is_true "$APPLY_KAFKA" || is_true "$APPLY_SR" \
                     || is_true "$APPLY_CONNECT" || is_true "$APPLY_KREST" \
                     || is_true "$APPLY_C3"; then
                    echo ""
                    echo "=== Verifying Kafka Listeners ==="

                    # 1. Check Kafka CR exists and is cluster-ready
                    if ! oc get kafka kafka -n "$OC_NS" >/dev/null 2>&1; then
                      echo "FATAL: Kafka CR not found"
                      exit 1
                    fi

                    kafka_ready=$(oc -n "$OC_NS" get kafka kafka \
                      -o jsonpath='{.status.conditions[?(@.type=="platform.confluent.io/cluster-ready")].status}' 2>/dev/null || echo "")

                    if [ "$kafka_ready" != "True" ]; then
                      echo "FATAL: Kafka not cluster-ready"
                      oc -n "$OC_NS" describe kafka kafka | grep -A 10 "Conditions:" || true
                      exit 1
                    fi

                    # 2. Check Service exists and exposes ports 9071, 9092, 8090
                    if ! oc get svc kafka -n "$OC_NS" >/dev/null 2>&1; then
                      echo "FATAL: Kafka Service not found"
                      exit 1
                    fi

                    svc_ports=$(oc -n "$OC_NS" get svc kafka -o jsonpath='{.spec.ports[*].port}' 2>/dev/null || echo "")

                    for port in 9071 9092 8090; do
                      if ! echo "$svc_ports" | grep -qw "$port"; then
                        echo "FATAL: Kafka Service does not expose port $port"
                        oc -n "$OC_NS" get svc kafka -o yaml | grep -A 20 "ports:" || true
                        exit 1
                      fi
                    done

                    # 3. Check every EndpointSlice for ready endpoint addresses.
                    if ! oc get endpointslices -l kubernetes.io/service-name=kafka -n "$OC_NS" >/dev/null 2>&1; then
                      echo "FATAL: No EndpointSlices for Kafka Service"
                      exit 1
                    fi

                    ready_addrs=$(oc -n "$OC_NS" get endpointslices \
                      -l kubernetes.io/service-name=kafka \
                      -o json | python3 .azure-pipelines/scripts/validate_endpointslices.py)

                    if [ "$ready_addrs" -lt 1 ]; then
                      echo "FATAL: No ready endpoints for Kafka"
                      exit 1
                    fi

                    echo "✅ Kafka listener validation passed (cluster-ready + Service + EndpointSlices)"
                  fi

                  # MDS readiness validation (separate gate).
                  if is_true "$APPLY_KAFKA" || is_true "$APPLY_SR" \
                     || is_true "$APPLY_CONNECT" || is_true "$APPLY_KREST" \
                     || is_true "$APPLY_C3"; then
                    echo ""
                    echo "=== Validating MDS Readiness ==="

                    # Check oauth-mds-sso Secret exists and has clientId + oidcClientSecret.txt
                    if ! oc get secret oauth-mds-sso -n "$OC_NS" >/dev/null 2>&1; then
                      echo "FATAL: oauth-mds-sso Secret missing"
                      exit 1
                    fi

                    has_client_id=$(oc -n "$OC_NS" get secret oauth-mds-sso \
                      -o jsonpath='{.data.clientId}' 2>/dev/null | wc -c)
                    has_oidc_secret=$(oc -n "$OC_NS" get secret oauth-mds-sso \
                      -o jsonpath='{.data.oidcClientSecret\.txt}' 2>/dev/null | wc -c)

                    if [ "$has_client_id" -lt 10 ]; then
                      echo "FATAL: oauth-mds-sso missing clientId"
                      exit 1
                    fi
                    if [ "$has_oidc_secret" -lt 10 ]; then
                      echo "FATAL: oauth-mds-sso missing oidcClientSecret.txt"
                      exit 1
                    fi

                    # Test verified TLS connectivity to MDS at :8090.
                    mds_ready=0
                    # Extract CA cert from kafka-tls Secret
                    CA_CERT_B64=$(oc -n "$OC_NS" get secret kafka-tls -o jsonpath='{.data.ca\.crt}' 2>/dev/null || echo "")
                    if [ -z "$CA_CERT_B64" ]; then
                      echo "ERROR: kafka-tls Secret missing ca.crt key"
                      exit 1
                    fi
                    CA_CERT=$(echo "$CA_CERT_B64" | base64 -d)

                    # Install the CA in the Kafka container once. Keep the probe
                    # itself in a single-quoted remote shell so Azure's outer
                    # shell cannot expand command substitutions or $http_code.
                    printf '%s\n' "$CA_CERT" \
                      | oc -n "$OC_NS" exec -i kafka-0 -- \
                          sh -c 'umask 077; cat > /tmp/mds-ca-cert.pem'

                    # This endpoint can return 200, 401, 403, or 404 depending on
                    # the Confluent Platform/MDS version and authentication mode.
                    # Any HTTP response below 500 proves that the TLS listener is
                    # reachable. A connection/TLS failure yields curl code 000;
                    # a 5xx response means MDS is not ready. Kafka/MDS can take
                    # several minutes to initialize after a broker rollout.
                    for i in {1..60}; do
                      http_code=$(oc -n "$OC_NS" exec kafka-0 -- \
                        sh -c 'timeout 5 curl --silent --show-error \
                          --write-out "%{http_code}" --output /dev/null \
                          --cacert /tmp/mds-ca-cert.pem \
                          --resolve "kafka.'"$OC_NS"'.svc.cluster.local:8090:127.0.0.1" \
                          "https://kafka.'"$OC_NS"'.svc.cluster.local:8090/" \
                          2>/dev/null || true' \
                        2>/dev/null | tr -cd '0-9')
                      http_code=${http_code:-000}

                      if [[ "$http_code" =~ ^[1-4][0-9][0-9]$ ]]; then
                        echo "✅ MDS TLS listener is responding at :8090 with HTTP $http_code (attempt $i)"
                        mds_ready=1
                        break
                      fi
                      echo "  MDS attempt $i/60 returned HTTP $http_code; retrying..."
                      if [ "$i" -lt 60 ]; then
                        sleep 10
                      fi
                    done
                    if [ "$mds_ready" -eq 0 ]; then
                      echo "FATAL: MDS TLS listener did not return an HTTP response below 500 at :8090 after 600s"
                      oc logs -n "$OC_NS" kafka-0 --all-containers | tail -50 || true
                      exit 1
                    fi
                  fi

                  # Unconditional KafkaRestClass readiness gate before rolebindings
                  # (required whenever ANY managed component is selected)
                  # CFK 3.1.x does not populate status.state; check observedGeneration, kafkaClusterID, endpoint instead.
                  if is_true "$APPLY_SR" || is_true "$APPLY_CONNECT" \
                     || is_true "$APPLY_KREST" || is_true "$APPLY_C3"; then
                    echo ""
                    echo "=== Pre-RBAC: Verifying KafkaRestClass readiness ==="

                    # Verify KafkaRestClass/default exists and is ready
                    krc_present=$(oc -n "$OC_NS" get kafkarestclass default 2>/dev/null || true)
                    if [ -z "$krc_present" ]; then
                      echo "ERROR: KafkaRestClass/default not found. Cannot proceed with RBAC/components."
                      exit 1
                    fi

                    krc_ready_gate=false
                    krc_gate_timeout=$((SECONDS + 300))

                    while [ "$SECONDS" -lt "$krc_gate_timeout" ]; do
                      GEN=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "")
                      OBSERVED=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo "")
                      CLUSTER_ID=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.status.kafkaClusterID}' 2>/dev/null || echo "")
                      ENDPOINT=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.status.endpoint}' 2>/dev/null || echo "")

                      if [[ "$OBSERVED" == "$GEN" && -n "$CLUSTER_ID" && -n "$ENDPOINT" ]]; then
                        echo "✅ KafkaRestClass/default is ready"
                        echo "      observedGeneration=$OBSERVED, kafkaClusterID=$CLUSTER_ID, endpoint=$ENDPOINT"
                        krc_ready_gate=true
                        break
                      fi

                      sleep 10
                    done

                    if [ "$krc_ready_gate" != true ]; then
                      echo "ERROR: KafkaRestClass/default readiness gate failed after 300s."
                      oc -n "$OC_NS" get kafkarestclass default -o yaml || true
                      echo ""
                      echo "Related KafkaRestClass events (filtered by current object UID):"
                      KRC_UID=$(oc -n "$OC_NS" get kafkarestclass default -o jsonpath='{.metadata.uid}' 2>/dev/null || echo "")
                      oc -n "$OC_NS" get events --field-selector involvedObject.uid="$KRC_UID" --sort-by='.lastTimestamp' || true
                      exit 1
                    fi
                  fi

                  echo ""
                  echo "=== Phase 2: Schema Registry, Connect, REST Proxy, Control Center ==="
                  if is_true "$APPLY_SR"; then
                    echo ""
                    echo "+ oc apply -f $ENV_DIR/schemaregistry.yaml"
                    oc apply -f "$ENV_DIR/schemaregistry.yaml"
                  else
                    echo "(Schema Registry skipped — checkbox off)"
                  fi
                  if is_true "$APPLY_CONNECT"; then
                    echo ""
                    echo "+ oc apply -f $ENV_DIR/connect.yaml"
                    oc apply -f "$ENV_DIR/connect.yaml"
                  else
                    echo "(Kafka Connect skipped — checkbox off)"
                  fi
                  if is_true "$APPLY_KREST"; then
                    echo ""
                    echo "+ oc apply -f $ENV_DIR/kafkarest.yaml"
                    oc apply -f "$ENV_DIR/kafkarest.yaml"
                  else
                    echo "(Kafka REST Proxy skipped — checkbox off)"
                  fi
                  if is_true "$APPLY_C3"; then
                    echo ""
                    if [ "$TARGET_ENV" = "dev" ]; then
                      C3_PROM_PVC="$ENV_DIR/storage/controlcenter-prometheus-pvc.yaml"
                      C3_PROM_PVC_NAME=prometheus-data-controlcenter-0
                      echo "=== Preparing Control Center Prometheus storage ==="
                      if [ ! -f "$C3_PROM_PVC" ]; then
                        echo "FATAL: $C3_PROM_PVC is required before Control Center."
                        exit 1
                      fi

                      # A PVC's StorageClass is immutable. Fail with a precise
                      # recovery instruction instead of repeatedly applying a
                      # correct manifest to an old classless Pending claim.
                      if oc -n "$OC_NS" get pvc "$C3_PROM_PVC_NAME" >/dev/null 2>&1; then
                        existing_sc=$(oc -n "$OC_NS" get pvc "$C3_PROM_PVC_NAME" \
                          -o jsonpath='{.spec.storageClassName}')
                        existing_size=$(oc -n "$OC_NS" get pvc "$C3_PROM_PVC_NAME" \
                          -o jsonpath='{.spec.resources.requests.storage}')
                        if [ "$existing_sc" != "kafka" ]; then
                          echo "FATAL: PVC/$C3_PROM_PVC_NAME uses StorageClass '${existing_sc:-<none>}', expected kafka."
                          echo "Run action=uninstall with wipePVCs=true, then reinstall."
                          exit 1
                        fi
                        echo "Existing PVC/$C3_PROM_PVC_NAME uses kafka ($existing_size); applying desired expansion."
                      fi

                      echo "+ oc apply -f $C3_PROM_PVC"
                      oc apply -f "$C3_PROM_PVC"
                      echo "=== Waiting up to 300s for PVC/$C3_PROM_PVC_NAME to bind ==="
                      if ! oc -n "$OC_NS" wait --for=jsonpath='{.status.phase}'=Bound \
                          "pvc/$C3_PROM_PVC_NAME" --timeout=300s; then
                        echo "FATAL: PVC/$C3_PROM_PVC_NAME did not bind."
                        oc -n "$OC_NS" describe pvc "$C3_PROM_PVC_NAME" || true
                        exit 1
                      fi
                    fi

                    echo "+ oc apply -f $ENV_DIR/controlcenter.yaml"
                    oc apply -f "$ENV_DIR/controlcenter.yaml"
                  else
                    echo "(Control Center skipped — checkbox off)"
                  fi

                  echo ""
                  echo "=== Cluster status (immediate post-apply) ==="
                  oc get kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass \
                    -n "$OC_NS" 2>&1 || true

                  echo ""
                  echo "=== Pods ==="
                  oc get pods -n "$OC_NS" -l app.kubernetes.io/part-of=confluent-platform 2>&1 || true

                  echo ""
                  echo "NOTE: Phase 2 CRs (SR / Connect / REST / C3) typically take an"
                  echo "additional 3-8 minutes to converge after this step exits. Monitor:"
                  echo "  oc -n $OC_NS get kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter"
                  echo "  oc -n $OC_NS get pods -l app.kubernetes.io/part-of=confluent-platform"
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}
                APPLY_ALL: ${{ parameters.applyAll }}
                APPLY_KRAFT_CONTROLLER: ${{ parameters.applyKRaftController }}
                APPLY_KAFKA: ${{ parameters.applyKafka }}
                APPLY_SCHEMA_REGISTRY: ${{ parameters.applySchemaRegistry }}
                APPLY_CONNECT: ${{ parameters.applyConnect }}
                APPLY_KAFKA_REST_PROXY: ${{ parameters.applyKafkaRestProxy }}
                APPLY_CONTROL_CENTER: ${{ parameters.applyControlCenter }}

            - task: Bash@3
              displayName: "Verify all managed components independently before Ingress"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  # Readiness check helper for managed components (SR / Connect / REST / C3).
                  wait_component_ready() {
                    local kind=$1
                    local name=$2
                    local timeout=${3:-300}
                    local elapsed=0
                    local step=10

                    echo "Waiting up to ${timeout}s for $kind/$name to report cluster-ready and no rolling update..."
                    while [ "$elapsed" -lt "$timeout" ]; do
                      local cluster_ready rolling
                      # Check for platform.confluent.io/cluster-ready condition (CFK 3.1+)
                      cluster_ready=$(oc -n "$OC_NS" get "$kind" "$name" \
                        -o jsonpath='{.status.conditions[?(@.type=="platform.confluent.io/cluster-ready")].status}' \
                        2>/dev/null || echo "")
                      rolling=$(oc -n "$OC_NS" get "$kind" "$name" \
                        -o jsonpath='{.status.conditions[?(@.type=="platform.confluent.io/rolling")].status}' \
                        2>/dev/null || echo "")
                      if [ "$cluster_ready" = "True" ] && [ "$rolling" != "True" ]; then
                        echo "  $kind/$name cluster-ready=True, rolling!=True after ${elapsed}s."
                        return 0
                      fi

                      if [ "$elapsed" -gt 0 ] && [ $((elapsed % 60)) -eq 0 ]; then
                        echo "  ${elapsed}s elapsed, $kind/$name not yet ready. Current conditions:"
                        oc -n "$OC_NS" get "$kind" "$name" \
                          -o jsonpath='{range .status.conditions[*]}    {.type}={.status}{"\n"}{end}' \
                          2>/dev/null \
                          || echo "    (status block not populated yet)"
                      fi
                      sleep "$step" || true
                      elapsed=$((elapsed + step))
                    done

                    echo "ERROR: $kind/$name did not reach cluster-ready=True within ${timeout}s."
                    echo "Conditions:"
                    oc -n "$OC_NS" get "$kind" "$name" \
                      -o jsonpath='{range .status.conditions[*]}    {.type}={.status} ({.reason}){"\n"}{end}' \
                      2>/dev/null \
                      || echo "    (no status block)"
                    return 1
                  }

                  # Component selection (same logic as CR apply task).
                  is_true() { [ "$1" = "True" ]; }

                  APPLY_ALL=${APPLY_ALL:-True}
                  if is_true "$APPLY_ALL"; then
                    APPLY_SR=True
                    APPLY_CONNECT=True
                    APPLY_KREST=True
                    APPLY_C3=True
                  else
                    APPLY_SR=${APPLY_SCHEMA_REGISTRY:-False}
                    APPLY_CONNECT=${APPLY_CONNECT:-False}
                    APPLY_KREST=${APPLY_KAFKA_REST_PROXY:-False}
                    APPLY_C3=${APPLY_CONTROL_CENTER:-False}
                  fi

                  echo "=== Verifying all selected managed components independently ==="
                  echo "All component CRs were applied in the preceding task. Readiness checks"
                  echo "now run concurrently so one unhealthy component cannot hide another."

                  readiness_dir=$(mktemp -d)
                  readiness_count=0

                  start_readiness_check() {
                    local key=$1
                    local kind=$2
                    local name=$3
                    local timeout=$4

                    readiness_count=$((readiness_count + 1))
                    readiness_key[$readiness_count]=$key
                    readiness_kind[$readiness_count]=$kind
                    readiness_name[$readiness_count]=$name
                    readiness_log[$readiness_count]="$readiness_dir/$key.log"

                    (
                      wait_component_ready "$kind" "$name" "$timeout"
                    ) >"${readiness_log[$readiness_count]}" 2>&1 &
                    readiness_pid[$readiness_count]=$!
                  }

                  declare -a readiness_key readiness_kind readiness_name readiness_log readiness_pid

                  if is_true "$APPLY_SR"; then
                    start_readiness_check schemaregistry schemaregistry schemaregistry 300
                  fi
                  if is_true "$APPLY_CONNECT"; then
                    start_readiness_check connect connect connect 300
                  fi
                  if is_true "$APPLY_KREST"; then
                    start_readiness_check kafkarest kafkarestproxy kafkarest 300
                  fi
                  if is_true "$APPLY_C3"; then
                    start_readiness_check controlcenter controlcenter controlcenter 300
                  fi

                  any_failed=0
                  for ((i=1; i<=readiness_count; i++)); do
                    if wait "${readiness_pid[$i]}"; then
                      readiness_result=PASS
                    else
                      readiness_result=FAIL
                      any_failed=1
                    fi

                    echo ""
                    echo "------------------------------------------------------------"
                    echo "${readiness_result}: ${readiness_kind[$i]}/${readiness_name[$i]}"
                    echo "------------------------------------------------------------"
                    sed -n '1,240p' "${readiness_log[$i]}"

                    if [ "$readiness_result" = FAIL ]; then
                      echo ""
                      echo "CR snapshot:"
                      oc -n "$OC_NS" get "${readiness_kind[$i]}" "${readiness_name[$i]}" \
                        -o wide 2>&1 || true
                      echo "Recent pod state:"
                      oc -n "$OC_NS" get pods \
                        -l "app=${readiness_name[$i]}" -o wide 2>&1 || true
                      echo "Recent matching log errors:"
                      for pod in $(oc -n "$OC_NS" get pods \
                          -l "app=${readiness_name[$i]}" \
                          -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                        echo "### pod/$pod"
                        oc -n "$OC_NS" logs "$pod" --all-containers=true --tail=250 2>&1 \
                          | grep -Ei 'error|exception|fatal|pkix|oauth|invalid token|user identity' \
                          | tail -80 || true
                      done
                    fi
                  done

                  if [ "$readiness_count" -eq 0 ]; then
                    echo "No managed component selected; readiness gate skipped."
                  elif [ "$any_failed" -ne 0 ]; then
                    echo ""
                    echo "FATAL: One or more selected managed components are not ready."
                    echo "All selected components were checked; review each PASS/FAIL section above."
                    echo "Ingress application remains blocked until every selected component is ready."
                    exit 1
                  else
                    echo ""
                    echo "OK: every selected managed component is independently ready."
                  fi
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}
                APPLY_ALL: ${{ parameters.applyAll }}
                APPLY_SCHEMA_REGISTRY: ${{ parameters.applySchemaRegistry }}
                APPLY_CONNECT: ${{ parameters.applyConnect }}
                APPLY_KAFKA_REST_PROXY: ${{ parameters.applyKafkaRestProxy }}
                APPLY_CONTROL_CENTER: ${{ parameters.applyControlCenter }}

            - task: Bash@3
              displayName: "Apply public Ingresses (per-component, gated by checkboxes)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  # Same gating model as the CR apply: "All" overrides per-component flags. Ingress applied only when its component is in scope.
                  is_true() { [ "$1" = "True" ]; }

                  APPLY_ALL=${APPLY_ALL:-True}
                  if is_true "$APPLY_ALL"; then
                    APPLY_KAFKA=True
                    APPLY_SR=True
                    APPLY_CONNECT=True
                    APPLY_KREST=True
                    APPLY_C3=True
                  else
                    APPLY_KAFKA=${APPLY_KAFKA:-False}
                    APPLY_SR=${APPLY_SCHEMA_REGISTRY:-False}
                    APPLY_CONNECT=${APPLY_CONNECT:-False}
                    APPLY_KREST=${APPLY_KAFKA_REST_PROXY:-False}
                    APPLY_C3=${APPLY_CONTROL_CENTER:-False}
                  fi

                  apply_if() {
                    local flag=$1
                    local file=$2
                    local label=$3
                    if is_true "$flag"; then
                      if [ -f "$ENV_DIR/ingress/$file" ]; then
                        echo ""
                        echo "+ oc apply -f $ENV_DIR/ingress/$file"
                        oc apply -f "$ENV_DIR/ingress/$file"
                      else
                        echo "(skip $label — $ENV_DIR/ingress/$file not present in this env yet)"
                      fi
                    else
                      echo "($label Ingress skipped — checkbox off)"
                    fi
                  }

                  echo ""
                  echo "=== Pre-Ingress Validation (FCB Container Team requirements) ==="

                  # FCB's ingress-router namespace does not carry the optional
                  # network.openshift.io/policy-group=ingress label. The
                  # NetworkPolicy therefore selects the immutable namespace
                  # name label kubernetes.io/metadata.name=openshift-ingress.
                  # Do not require cluster-scoped namespace-list permission
                  # from the Azure DevOps service account here.

                  # 1. Validate reencrypt-bundle Secret only if reencrypt Ingresses are selected.
                  # C3 uses passthrough and does not require reencrypt-bundle.
                  # SR, REST, Connect require reencrypt-bundle.
                  # FCB trust-manager publishes the bundle as tls.crt; retain ca.crt compatibility.
                  need_reencrypt_bundle=false
                  is_true "$APPLY_SR" && need_reencrypt_bundle=true
                  is_true "$APPLY_KREST" && need_reencrypt_bundle=true
                  is_true "$APPLY_CONNECT" && need_reencrypt_bundle=true

                  if [ "$need_reencrypt_bundle" = "true" ]; then
                    echo ""
                    echo "1. Validating reencrypt-bundle CA Secret..."
                    if ! oc -n "$OC_NS" get secret reencrypt-bundle >/dev/null 2>&1; then
                      echo "FATAL: Secret/reencrypt-bundle does not exist"
                      exit 1
                    fi
                    ca_key="ca.crt"
                    ca_b64="$(oc -n "$OC_NS" get secret reencrypt-bundle -o jsonpath='{.data.ca\.crt}' 2>/dev/null || true)"
                    if [ -z "$ca_b64" ]; then
                      ca_key="tls.crt"
                      ca_b64="$(oc -n "$OC_NS" get secret reencrypt-bundle -o jsonpath='{.data.tls\.crt}' 2>/dev/null || true)"
                    fi
                    if [ -z "$ca_b64" ]; then
                      echo "FATAL: Secret/reencrypt-bundle has no CA data (expected nonempty ca.crt or tls.crt)"
                      exit 1
                    fi
                    if ! ca_pem="$(printf '%s' "$ca_b64" | base64 --decode 2>/dev/null)"; then
                      echo "FATAL: Secret/reencrypt-bundle key $ca_key is not valid Base64"
                      exit 1
                    fi
                    if ! grep -q -- '-----BEGIN CERTIFICATE-----' <<<"$ca_pem"; then
                      echo "FATAL: Secret/reencrypt-bundle key $ca_key does not contain a PEM certificate"
                      exit 1
                    fi
                    unset ca_b64 ca_pem
                    echo "  ✓ reencrypt-bundle exists with valid PEM CA data in $ca_key"
                  else
                    echo ""
                    echo "1. Skipping reencrypt-bundle validation (only Control Center selected)"
                  fi

                  # 2. Validate backend Services and ports (scoped to selected components)
                  echo ""
                  echo "2. Validating backend Services and ports (selected components only)..."
                  declare -A svc_ports=(
                    [schemaregistry]=8081
                    [kafkarest]=8082
                    [connect]=8083
                    [controlcenter]=9021
                  )
                  declare -A svc_applies=(
                    [schemaregistry]="$APPLY_SR"
                    [kafkarest]="$APPLY_KREST"
                    [connect]="$APPLY_CONNECT"
                    [controlcenter]="$APPLY_C3"
                  )

                  for svc in "${!svc_ports[@]}"; do
                    if ! is_true "${svc_applies[$svc]}"; then
                      echo "  (skip Service/$svc — not selected)"
                      continue
                    fi
                    port="${svc_ports[$svc]}"
                    if ! oc -n "$OC_NS" get service "$svc" >/dev/null 2>&1; then
                      echo "  FAIL: Service/$svc does not exist"
                      exit 1
                    fi
                    if ! oc -n "$OC_NS" get service "$svc" -o jsonpath='{.spec.ports[?(@.port=='$port')]}' 2>/dev/null | grep -q .; then
                      echo "  FAIL: Service/$svc does not expose port $port"
                      exit 1
                    fi
                    echo "  ✓ Service/$svc exists and exposes port $port"
                  done

                  # If Kafka is selected, also validate MDS on port 8090
                  if is_true "$APPLY_KAFKA"; then
                    echo "  ✓ Kafka selected; MDS 8090 will be validated in NetworkPolicy"
                  fi

                  # 3. Validate Services have ready EndpointSlices (scoped to selected)
                  echo ""
                  echo "3. Validating EndpointSlices have ready addresses (selected only)..."
                  for svc in "${!svc_ports[@]}"; do
                    if ! is_true "${svc_applies[$svc]}"; then
                      continue
                    fi
                    ready_addrs=$(oc -n "$OC_NS" get endpointslices \
                      -l kubernetes.io/service-name="$svc" -o json 2>/dev/null | \
                      python3 -c 'import json,sys;d=json.load(sys.stdin);ready=any(ep.get("addresses")and ep.get("conditions",{}).get("ready",True)is not False for e in d.get("items",[])for ep in(e.get("endpoints")or[]));print("ready"if ready else"not-ready")')
                    if [[ "$ready_addrs" != "ready" ]]; then
                      echo "  FAIL: Service/$svc has no ready EndpointSlices"
                      exit 1
                    fi
                    echo "  ✓ Service/$svc has ready endpoints"
                  done

                  # 4. Validate NetworkPolicy contains router namespace and all required ports
                  echo ""
                  echo "4. Validating NetworkPolicy for ingress-router rule..."
                  np_file="$ENV_DIR/network-policy/network-policy.yaml"
                  if [ ! -f "$np_file" ]; then
                    echo "  FAIL: NetworkPolicy file not found at $np_file"
                    exit 1
                  fi
                  if ! grep -q "kubernetes.io/metadata.name.*openshift-ingress" "$np_file"; then
                    echo "  FAIL: NetworkPolicy missing openshift-ingress namespace selector"
                    exit 1
                  fi

                  # Required ports based on selected components
                  required_np_ports=()
                  is_true "$APPLY_SR" && required_np_ports+=(8081)
                  is_true "$APPLY_KREST" && required_np_ports+=(8082)
                  is_true "$APPLY_CONNECT" && required_np_ports+=(8083)
                  is_true "$APPLY_C3" && required_np_ports+=(9021)
                  is_true "$APPLY_KAFKA" && required_np_ports+=(8090)

                  # Validate NetworkPolicy has all required ports using Python YAML parser (ports passed as args)
                  python3 -c 'import sys,yaml; d=yaml.safe_load(open(sys.argv[1])); allowed={int(e["port"]) for r in d.get("spec",{}).get("ingress",[]) for f in r.get("from",[]) if f.get("namespaceSelector",{}).get("matchLabels",{}).get("kubernetes.io/metadata.name")=="openshift-ingress" for e in r.get("ports",[]) if "port" in e}; required={int(x) for x in sys.argv[2:]}; missing=required-allowed; print("Missing ingress-router ports: %s" % sorted(missing)) if missing else None; sys.exit(1 if missing else 0)' "$np_file" "${required_np_ports[@]}" || exit 1
                  echo "  ✓ NetworkPolicy has ingress-router rule with all required ports"

                  # 5. Validate each selected Ingress before application
                  echo ""
                  echo "5. Validating selected Ingress manifests..."
                  declare -A ingress_files=(
                    [schemaregistry]=schemaregistry-ingress.yaml
                    [kafkarest]=kafkarest-ingress.yaml
                    [connect]=connect-ingress.yaml
                    [controlcenter]=controlcenter-ingress.yaml
                  )

                  for svc in "${!svc_applies[@]}"; do
                    if ! is_true "${svc_applies[$svc]}"; then
                      continue
                    fi
                    ingress_file="$ENV_DIR/ingress/${ingress_files[$svc]}"
                    if [ ! -f "$ingress_file" ]; then
                      echo "  FAIL: Ingress file not found: $ingress_file"
                      exit 1
                    fi

                    # Control Center uses passthrough; other components use reencrypt
                    if [ "$svc" = "controlcenter" ]; then
                      # C3-specific validation: passthrough, empty path, ImplementationSpecific, port 9021, no destination-CA
                      if ! grep -q "apps.dv.ocp.fcbint.net" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress missing floating apps.dv.ocp.fcbint.net hostname"
                        exit 1
                      fi
                      if ! grep -q "openshift-core-zone" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress missing openshift-core-zone ingressClassName"
                        exit 1
                      fi
                      if ! grep -q "route.openshift.io/termination.*passthrough" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress missing passthrough termination"
                        exit 1
                      fi
                      if grep -q "destination-ca-certificate" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress must not have destination-ca-certificate annotation (passthrough does not use it)"
                        exit 1
                      fi
                      if ! grep -q 'path: ""' "$ingress_file"; then
                        echo "  FAIL: $svc Ingress must have empty path for passthrough"
                        exit 1
                      fi
                      if ! grep -q "pathType: ImplementationSpecific" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress must use ImplementationSpecific pathType for passthrough"
                        exit 1
                      fi
                      python3 -c "import yaml,sys;d=yaml.safe_load(open('$ingress_file'));p=9021;found=any(int(path.get('backend',{}).get('service',{}).get('port',{}).get('number',0))==p for rule in d.get('spec',{}).get('rules',[])for path in rule.get('http',{}).get('paths',[]));sys.exit(0 if found else 1)" || exit 1
                      echo "  ✓ $svc Ingress manifest valid (passthrough, port 9021)"
                    else
                      # Reencrypt validation for SR, REST, Connect
                      if ! grep -q "apps.dv.ocp.fcbint.net" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress missing floating apps.dv.ocp.fcbint.net hostname"
                        exit 1
                      fi
                      if ! grep -q "openshift-core-zone" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress missing openshift-core-zone ingressClassName"
                        exit 1
                      fi
                      if ! grep -q "route.openshift.io/termination.*reencrypt" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress missing reencrypt termination"
                        exit 1
                      fi
                      if ! grep -q "reencrypt-bundle" "$ingress_file"; then
                        echo "  FAIL: $svc Ingress missing reencrypt-bundle destination CA"
                        exit 1
                      fi
                      port="${svc_ports[$svc]}"
                      python3 -c "import yaml,sys;d=yaml.safe_load(open('$ingress_file'));p=int('$port');found=any(int(path.get('backend',{}).get('service',{}).get('port',{}).get('number',0))==p for rule in d.get('spec',{}).get('rules',[])for path in rule.get('http',{}).get('paths',[]));sys.exit(0 if found else 1)" || exit 1
                      echo "  ✓ $svc Ingress manifest valid (reencrypt, port $port)"
                    fi
                  done

                  echo ""
                  echo "✅ All pre-Ingress validations passed"

                  echo ""
                  echo "=== Apply Ingress CRs (one per CFK component UI/REST) ==="
                  apply_if "$APPLY_KAFKA"   kafka-mds-ingress.yaml      "Kafka MDS"
                  apply_if "$APPLY_SR"      schemaregistry-ingress.yaml "Schema Registry"
                  apply_if "$APPLY_CONNECT" connect-ingress.yaml        "Kafka Connect"
                  apply_if "$APPLY_KREST"   kafkarest-ingress.yaml      "Kafka REST Proxy"
                  apply_if "$APPLY_C3"      controlcenter-ingress.yaml  "Control Center"

                  echo ""
                  echo "=== Ingress status ==="
                  oc get ingress -n "$OC_NS" 2>&1 || true

                  echo ""
                  echo "NOTE: public hostnames follow the Container Team's"
                  echo "Internal-OCP pattern from https://confluence.fcpd.fcbint.net/spaces/CONV/pages/172530278/OpenShift+Ingress:"
                  echo "  <component>.apps.<env-cluster>.ocp.fcbint.net"
                  echo "DNS is automatic via the cluster wildcard for dev/qa;"
                  echo "UAT/PRD add Floating-DNS CNAMEs per the Confluence page."
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}
                APPLY_ALL: ${{ parameters.applyAll }}
                APPLY_KAFKA: ${{ parameters.applyKafka }}
                APPLY_SCHEMA_REGISTRY: ${{ parameters.applySchemaRegistry }}
                APPLY_CONNECT: ${{ parameters.applyConnect }}
                APPLY_KAFKA_REST_PROXY: ${{ parameters.applyKafkaRestProxy }}
                APPLY_CONTROL_CENTER: ${{ parameters.applyControlCenter }}

          - ${{ if eq(parameters.action, 'uninstall') }}:
            - task: Bash@3
              displayName: "Uninstall Confluent Platform CRs"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-platform/$TARGET_ENV"

                  # cfk-resources webhook blocks CR delete when backing PVs use reclaimPolicy=Delete (data-loss guardrail). Label the stateful CRs with allow-pv-deletion=true to opt in. Applies to Kafka, KRaftController, ControlCenter.
                  echo "=== Labeling stateful CRs for allow-pv-deletion ==="
                  PV_LABEL="confluent-operator.webhooks.platform.confluent.io/allow-pv-deletion=true"
                  for kind_name in \
                      "kafka kafka" \
                      "kraftcontroller kraftcontroller" \
                      "controlcenter controlcenter"; do
                    kind=${kind_name% *}; name=${kind_name#* }
                    if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                      echo "+ oc -n $OC_NS label $kind $name $PV_LABEL --overwrite"
                      oc -n "$OC_NS" label "$kind" "$name" "$PV_LABEL" --overwrite
                    fi
                  done

                  echo ""
                  echo "=== Deleting Confluent Platform CRs (reverse dependency order) ==="
                  # Reverse order so dependents shut down before backends. No `|| true` — we want the pipeline to fail loudly on a silent webhook-rejected delete (the operator would recreate any PVCs the later wipePVCs sub-step then tries to delete).
                  DELETE_ORDER=(
                    rbac/rolebindings.yaml
                    controlcenter.yaml
                    kafkarest.yaml
                    connect.yaml
                    schemaregistry.yaml
                    storage/controlcenter-prometheus-pvc.yaml
                    kafkarestclass.yaml
                    kafka.yaml
                    kraftcontroller.yaml
                  )
                  FAIL=0

                  # ConfluentRoleBindings may be created outside
                  # rolebindings.yaml (for example bootstrap SystemAdmin and
                  # component-internal bindings). Delete every binding in this
                  # namespace before KafkaRestClass/Kafka disappear, otherwise
                  # their finalizers can no longer complete MDS discovery.
                  echo ""
                  echo "=== Deleting all namespace ConfluentRoleBindings ==="
                  while IFS= read -r rolebinding_name; do
                    [ -z "$rolebinding_name" ] && continue
                    echo "+ oc -n $OC_NS delete $rolebinding_name --wait=true --timeout=2m"
                    if ! oc -n "$OC_NS" delete "$rolebinding_name" \
                        --wait=true --timeout=2m; then
                      echo "FAIL: deletion of $rolebinding_name did not complete cleanly"
                      FAIL=1
                    fi
                  done < <(oc -n "$OC_NS" get confluentrolebinding \
                    -o name 2>/dev/null || true)

                  # Browser-facing routes are dependents of the component
                  # Services. Remove them first so a clean uninstall does not
                  # leave routes pointing at Services that no longer exist.
                  for ingress in "$ENV_DIR"/ingress/*.yaml; do
                    [ -f "$ingress" ] || continue
                    echo "+ oc delete -f $ingress --ignore-not-found --wait=true --timeout=2m"
                    if ! oc delete -f "$ingress" --ignore-not-found --wait=true --timeout=2m; then
                      echo "FAIL: deletion of $ingress did not complete cleanly"
                      FAIL=1
                    fi
                  done

                  for f in "${DELETE_ORDER[@]}"; do
                    if [ -f "$ENV_DIR/$f" ]; then
                      echo ""
                      echo "+ oc delete -f $ENV_DIR/$f --ignore-not-found --wait=true --timeout=5m"
                      if ! oc delete -f "$ENV_DIR/$f" --ignore-not-found --wait=true --timeout=5m; then
                        echo "FAIL: deletion of $f did not complete cleanly"
                        FAIL=1
                      fi
                    fi
                  done

                  # Always-on force-finalizer fallback: drop finalizers on CRs stuck Terminating once their sts/pods are gone (runbook E3 Connect-graceful-flush case). Inner safety gate prevents short-circuiting an in-progress cleanup.
                  if [ "$FAIL" -ne 0 ]; then
                    echo ""
                    echo "=== Uninstall didn't go clean — checking for CRs stuck in Terminating ==="
                    STUCK=$(oc -n "$OC_NS" get \
                      kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass,confluentrolebinding \
                      -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.kind}{"/"}{.metadata.name}{"\n"}{end}' \
                      2>/dev/null)

                    if [ -z "$STUCK" ]; then
                      echo "No CRs with deletionTimestamp set — FAIL was set for another reason; not clearing it."
                    else
                      echo "Stuck CRs found:"
                      echo "$STUCK" | sed 's/^/  /'
                      CLEARED=0
                      while IFS=/ read -r kind name; do
                        [ -z "$kind" ] && continue
                        # Safety gate: only patch finalizers when there is
                        # no live StatefulSet / Pod for this instance. If
                        # there is, the operator is mid-cleanup and we
                        # could orphan storage / leak PVs by short-circuiting
                        # it. Better to fail loudly and let a human look.
                        SS_LEFT=$(oc -n "$OC_NS" get sts \
                          -l "app.kubernetes.io/instance=$name" \
                          --no-headers --ignore-not-found 2>/dev/null | wc -l | tr -d ' ')
                        POD_LEFT=$(oc -n "$OC_NS" get pod \
                          -l "app.kubernetes.io/instance=$name" \
                          --no-headers --ignore-not-found 2>/dev/null | wc -l | tr -d ' ')
                        if [ "${SS_LEFT:-0}" -gt 0 ] || [ "${POD_LEFT:-0}" -gt 0 ]; then
                          echo "  SKIP $kind/$name — StatefulSet=$SS_LEFT Pod=$POD_LEFT still present; not safe to short-circuit"
                          continue
                        fi
                        echo "+ oc -n $OC_NS patch $kind $name --type=merge -p '{\"metadata\":{\"finalizers\":[]}}'"
                        if oc -n "$OC_NS" patch "$kind" "$name" \
                            --type=merge -p '{"metadata":{"finalizers":[]}}'; then
                          CLEARED=$((CLEARED+1))
                        fi
                      done <<< "$STUCK"

                      # Re-check after the patch sweep.
                      STILL_STUCK=$(oc -n "$OC_NS" get \
                        kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass,confluentrolebinding \
                        -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.kind}{"/"}{.metadata.name}{"\n"}{end}' \
                        2>/dev/null | grep -c . || true)

                      if [ "${STILL_STUCK:-0}" -eq 0 ]; then
                        echo "All stuck CRs cleared after finalizer patch ($CLEARED total). Clearing FAIL."
                        FAIL=0
                      else
                        echo "WARNING: $STILL_STUCK CR(s) still stuck after finalizer patch — investigate manually."
                      fi
                    fi
                  fi

                  # Never delete TLS Secrets or PVCs while a CFK CR or Pod is
                  # still alive. That can strand finalizers and recreate the
                  # exact Kafka ApplyFailed condition this uninstall prevents.
                  REMAINING_CFK_OBJECTS=$(oc -n "$OC_NS" get \
                    kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass,confluentrolebinding \
                    -o name 2>/dev/null || true)
                  REMAINING_CFK_PODS=$(oc -n "$OC_NS" get pods \
                    -l app.kubernetes.io/part-of=confluent-platform \
                    -o name 2>/dev/null || true)
                  if [ -n "$REMAINING_CFK_OBJECTS" ] || [ -n "$REMAINING_CFK_PODS" ]; then
                    echo "FATAL: CFK resources remain; refusing to delete TLS Secrets or PVCs."
                    [ -n "$REMAINING_CFK_OBJECTS" ] && printf '%s\n' "$REMAINING_CFK_OBJECTS" | sed 's/^/  /'
                    [ -n "$REMAINING_CFK_PODS" ] && printf '%s\n' "$REMAINING_CFK_PODS" | sed 's/^/  /'
                    exit 1
                  fi

                  echo ""
                  echo "=== Deleting cert-manager Certificates and generated TLS Secrets ==="
                  CERT_SECRET_NAMES=()
                  for cert in "$ENV_DIR"/cert-manager/*-certificate.yaml; do
                    if [ -f "$cert" ]; then
                      cert_secret=$(awk '$1 == "secretName:" {print $2; exit}' "$cert")
                      [ -n "$cert_secret" ] && CERT_SECRET_NAMES+=("$cert_secret")
                      echo "+ oc delete -f $cert --ignore-not-found --wait=true --timeout=2m"
                      if ! oc delete -f "$cert" --ignore-not-found --wait=true --timeout=2m; then
                        echo "FAIL: Certificate deletion did not complete for $cert"
                        FAIL=1
                      fi
                    fi
                  done

                  # A clean reinstall must not inherit cert-manager Secrets
                  # carrying stale CFK finalizers. This was the root cause of
                  # Kafka ApplyFailed on 2026-08-15. At this point all CFK CRs
                  # and pods have already been removed, so it is safe to delete
                  # these generated TLS Secrets and strip CFK-only finalizers.
                  for secret_name in "${CERT_SECRET_NAMES[@]}"; do
                    if ! oc -n "$OC_NS" get secret "$secret_name" >/dev/null 2>&1; then
                      continue
                    fi
                    echo "+ oc delete secret/$secret_name --wait=false"
                    oc -n "$OC_NS" delete secret "$secret_name" --wait=false || true
                    sleep 2
                    if oc -n "$OC_NS" get secret "$secret_name" >/dev/null 2>&1; then
                      keep_finalizers=$(oc -n "$OC_NS" get secret "$secret_name" -o json \
                        | python3 -c 'import json,sys; o=json.load(sys.stdin); f=o.get("metadata",{}).get("finalizers") or []; print(json.dumps([x for x in f if not x.startswith("secret.finalizers.platform.confluent.io/")]))')
                      echo "  Secret/$secret_name is still present; preserving non-CFK finalizers and removing CFK finalizers."
                      oc -n "$OC_NS" patch secret "$secret_name" --type=merge \
                        -p "{\"metadata\":{\"finalizers\":$keep_finalizers}}" || FAIL=1
                    fi
                  done

                  TLS_SECRET_DEADLINE=$((SECONDS + 120))
                  while true; do
                    REMAINING_TLS_SECRETS=()
                    for secret_name in "${CERT_SECRET_NAMES[@]}"; do
                      if oc -n "$OC_NS" get secret "$secret_name" >/dev/null 2>&1; then
                        REMAINING_TLS_SECRETS+=("$secret_name")
                      fi
                    done
                    [ "${#REMAINING_TLS_SECRETS[@]}" -eq 0 ] && break
                    if [ "$SECONDS" -ge "$TLS_SECRET_DEADLINE" ]; then
                      echo "FATAL: generated TLS Secrets remain after uninstall: ${REMAINING_TLS_SECRETS[*]}"
                      FAIL=1
                      break
                    fi
                    sleep 5
                  done
                  [ "${#REMAINING_TLS_SECRETS[@]}" -eq 0 ] \
                    && echo "All generated TLS Secrets are absent; certificate recreation can start cleanly."

                  # Remove only Confluent Platform prerequisite Secrets created
                  # by this pipeline. Preserve the shared confluent-license
                  # Secret because CMF consumes it. Also preserve every active
                  # ExternalSecret target: ESO owns that lifecycle and may
                  # recreate the Secret immediately if it is deleted here.
                  echo ""
                  echo "=== Deleting pipeline-owned Confluent Platform prerequisite Secrets ==="
                  declare -A ESO_TARGETS=()
                  while IFS= read -r eso_target; do
                    [ -n "$eso_target" ] && ESO_TARGETS["$eso_target"]=1
                  done < <(oc -n "$OC_NS" get externalsecrets.external-secrets.io \
                    -o jsonpath='{range .items[*]}{.spec.target.name}{"\n"}{end}' \
                    2>/dev/null || true)

                  CFK_PREREQ_SECRETS=(
                    cfk-license
                    mds-token-keypair
                    sasl-plain-internal
                    oauth-broker
                    oauth-schemaregistry
                    oauth-connect
                    oauth-kafkarest
                    oauth-controlcenter
                    oauth-mds-rest
                    oauth-mds-sso
                    c3-prom-server-basic-auth
                    c3-prom-client-basic-auth
                    c3-alert-server-basic-auth
                    c3-alert-client-basic-auth
                    # Legacy names from the earlier C3 secret contract. The
                    # current manifests no longer reference these, but remove
                    # them during a clean uninstall so an old deployment does
                    # not leak credentials into the next installation.
                    c3-prometheus-basic-auth
                    c3-prometheus-client-basic-auth
                    c3-prometheus-server-basic-auth
                    c3-alertmanager-client-basic-auth
                    c3-alertmanager-server-basic-auth
                  )
                  DELETED_CFK_PREREQ_SECRETS=()
                  for secret_name in "${CFK_PREREQ_SECRETS[@]}"; do
                    if [ -n "${ESO_TARGETS[$secret_name]:-}" ]; then
                      echo "PRESERVE  Secret/$secret_name (managed by ExternalSecret)"
                      continue
                    fi
                    if ! oc -n "$OC_NS" get secret "$secret_name" >/dev/null 2>&1; then
                      echo "ABSENT    Secret/$secret_name"
                      continue
                    fi
                    echo "+ oc -n $OC_NS delete secret/$secret_name --wait=true --timeout=2m"
                    if oc -n "$OC_NS" delete secret "$secret_name" \
                        --wait=true --timeout=2m; then
                      DELETED_CFK_PREREQ_SECRETS+=("$secret_name")
                    else
                      echo "FAIL: deletion of Secret/$secret_name did not complete cleanly"
                      FAIL=1
                    fi
                  done

                  for secret_name in "${DELETED_CFK_PREREQ_SECRETS[@]}"; do
                    if oc -n "$OC_NS" get secret "$secret_name" >/dev/null 2>&1; then
                      echo "FAIL: pipeline-owned Secret/$secret_name remains after uninstall"
                      FAIL=1
                    fi
                  done
                  echo "PRESERVE  Secret/confluent-license (shared with CMF)"

                  if [ -f "$ENV_DIR/network-policy/network-policy.yaml" ]; then
                    echo "+ oc delete -f $ENV_DIR/network-policy/network-policy.yaml --ignore-not-found --wait=true --timeout=2m"
                    if ! oc delete -f "$ENV_DIR/network-policy/network-policy.yaml" \
                        --ignore-not-found --wait=true --timeout=2m; then
                      echo "FAIL: NetworkPolicy deletion did not complete cleanly"
                      FAIL=1
                    fi
                  fi

                  echo ""
                  echo "=== Remaining Confluent Platform objects ==="
                  oc get kafka,kraftcontroller,schemaregistry,connect,kafkarestproxy,controlcenter,kafkarestclass,confluentrolebinding \
                    -n "$OC_NS" 2>&1 || true
                  oc get pods -n "$OC_NS" -l app.kubernetes.io/part-of=confluent-platform 2>&1 || true

                  # Optional PVC wipe — folded in so wipe-and-rebuild is one run. Tolerate "True"/"true" (ADO uses capitalized).
                  if [ "$WIPE_PVCS" = "True" ] || [ "$WIPE_PVCS" = "true" ]; then
                    echo ""
                    echo "=== wipePVCs=true — deleting orphaned CFK PVCs ==="
                    # CFK PVCs normally use data<N>-<statefulset>-<ordinal>.
                    # Include the bundled C3 Prometheus naming variants used
                    # across Control Center Next Gen releases.
                    PVC_REGEX='^(data[0-9]+-(kafka|kraftcontroller|controlcenter)-[0-9]+|prometheus(-data)?-controlcenter-[0-9]+)$'
                    MATCHED=$(
                      oc -n "$OC_NS" get pvc \
                        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                        | grep -E "$PVC_REGEX" \
                        || true
                    )
                    if [ -z "$MATCHED" ]; then
                      echo "No matching PVCs found — nothing to delete."
                    else
                      echo "PVCs to delete:"
                      echo "$MATCHED" | sed 's/^/  - /'
                      PVC_DELETE_FAILED=0
                      for pvc in $MATCHED; do
                        echo "+ oc delete pvc/$pvc -n $OC_NS --wait=true --timeout=2m"
                        if ! oc -n "$OC_NS" delete pvc "$pvc" --wait=true --timeout=2m; then
                          echo "FAIL: PVC $pvc was not deleted cleanly"
                          PVC_DELETE_FAILED=1
                        fi
                      done
                      echo ""
                      echo "=== Remaining PVCs in $OC_NS ==="
                      oc -n "$OC_NS" get pvc 2>&1 || true

                      REMAINING_TARGET_PVCS=$(
                        oc -n "$OC_NS" get pvc \
                          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                          | grep -E "$PVC_REGEX" || true
                      )
                      if [ "$PVC_DELETE_FAILED" -ne 0 ] || [ -n "$REMAINING_TARGET_PVCS" ]; then
                        echo "FATAL: clean uninstall requested, but targeted CFK PVCs remain:"
                        printf '%s\n' "$REMAINING_TARGET_PVCS" | sed '/^$/d; s/^/  - /'
                        FAIL=1
                      fi
                    fi
                  else
                    echo ""
                    echo "NOTE: PVCs from the Kafka, KRaftController, and ControlCenter"
                    echo "StatefulSets are preserved (wipePVCs=false). On the next install"
                    echo "CFK will try to re-bind by PVC name, and FCB Gatekeeper's"
                    echo "[ceph-storage] policy will reject the StatefulSet because the"
                    echo "regenerated volumeClaimTemplate omits storageClassName. To"
                    echo "force a fresh PVC creation path, re-run this pipeline with"
                    echo "action=uninstall AND wipePVCs=true."
                  fi

                  echo ""
                  echo "NOTE: pipeline-owned CFK prerequisite Secrets were removed."
                  echo "Shared Secret/confluent-license and active ExternalSecret targets were preserved."

                  if [ "$FAIL" -ne 0 ]; then
                    echo ""
                    echo "ERROR: one or more CR deletions failed. See log above. The most"
                    echo "common cause is the cfk-resources webhook rejecting deletion of"
                    echo "a CR whose PVs use reclaimPolicy=Delete — we label the CRs with"
                    echo "allow-pv-deletion=true before deleting, but the label step only"
                    echo "runs for CRs that exist at the time. If a stale finalizer is"
                    echo "the cause, investigate with: oc -n $OC_NS get <kind>/<name> -o yaml"
                    exit 1
                  fi
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}
                WIPE_PVCS: ${{ parameters.wipePVCs }}

          - ${{ if eq(parameters.action, 'clear-stuck-prereq-finalizers') }}:
            - task: Bash@3
              displayName: "Clear CFK finalizers on Secrets stuck in Terminating (ESO-safe)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  # Clears CFK's `secret.finalizers.platform.confluent.io/*` finalizers from Secrets left Terminating after uninstall (runbook A13). ESO finalizers (external-secrets.io/*) are preserved — filter the finalizers array, drop only CFK-stamped entries, write back. Damaging ESO bookkeeping would break the CyberArk re-sync path.

                  echo "=== ESO-managed Secrets in $OC_NS (preserved by this action) ==="
                  oc -n "$OC_NS" get externalsecrets.external-secrets.io \
                    -o jsonpath='{range .items[*]}{.spec.target.name}{"\t(from ExternalSecret "}{.metadata.name}{")\n"}{end}' \
                    2>/dev/null \
                    | awk -F '\t' 'NF>=2 {printf "  %-40s %s\n", $1, $2}' \
                    || echo "  (no ExternalSecrets found in namespace, or CRD missing)"
                  echo ""

                  echo "=== Scanning $OC_NS for Secrets stuck in Terminating ==="
                  STUCK=$(oc -n "$OC_NS" get secrets \
                    -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.metadata.name}{"\n"}{end}' \
                    2>/dev/null)

                  if [ -z "$STUCK" ]; then
                    echo "No Secrets in $OC_NS have a deletionTimestamp set — nothing to clear."
                    echo "(If you came here expecting stuck Secrets, double-check the namespace via the openshift-namespace variable group entry.)"
                    exit 0
                  fi

                  echo ""
                  echo "Found stuck Secrets (current finalizers shown):"
                  while IFS= read -r sec; do
                    [ -z "$sec" ] && continue
                    DT=$(oc -n "$OC_NS" get secret "$sec" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null)
                    FZ=$(oc -n "$OC_NS" get secret "$sec" -o jsonpath='{.metadata.finalizers}' 2>/dev/null)
                    echo "  $sec  (deletionTimestamp=$DT)"
                    echo "    finalizers: $FZ"
                  done <<< "$STUCK"

                  echo ""
                  echo "=== Selectively removing only secret.finalizers.platform.confluent.io/* finalizers ==="
                  CLEARED=0
                  SKIPPED=0
                  FAILED=0
                  while IFS= read -r sec; do
                    [ -z "$sec" ] && continue

                    # Read current finalizers as JSON (jq isn't guaranteed on FCB pipeline image; python3 is).
                    CURRENT_JSON=$(oc -n "$OC_NS" get secret "$sec" \
                      -o jsonpath='{.metadata.finalizers}' 2>/dev/null)

                    if [ -z "$CURRENT_JSON" ] || [ "$CURRENT_JSON" = "<no value>" ]; then
                      echo ""
                      echo "  $sec — no finalizers field present; API server will GC on next tick"
                      SKIPPED=$((SKIPPED+1))
                      continue
                    fi

                    # Drop CFK-stamped finalizers, keep the rest. One-line python avoids YAML-indent issues; JSON piped via stdin avoids shell quoting (runbook H4).
                    FILTERED_JSON=$(printf '%s' "$CURRENT_JSON" | python3 -c 'import json,sys; cur=json.load(sys.stdin); pfx="secret.finalizers.platform.confluent.io/"; print(json.dumps({"keep":[f for f in cur if not f.startswith(pfx)], "drop":[f for f in cur if f.startswith(pfx)]}))')

                    KEEP=$(printf '%s' "$FILTERED_JSON" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["keep"]))')
                    DROP=$(printf '%s' "$FILTERED_JSON" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["drop"]))')

                    echo ""
                    echo "  $sec"
                    echo "    dropping CFK finalizers: $DROP"
                    echo "    preserving foreign finalizers (ESO / other): $KEEP"

                    if [ "$DROP" = "[]" ]; then
                      echo "    no CFK finalizers to remove — skipping. If this Secret is still stuck"
                      echo "    Terminating, an ESO/other controller's finalizer is blocking it; ask"
                      echo "    that controller's owner to investigate."
                      SKIPPED=$((SKIPPED+1))
                      continue
                    fi

                    # Patch the finalizers array to the filtered list.
                    if [ "$KEEP" = "[]" ]; then
                      # Empty array — use merge patch with null to fully clear.
                      echo "    + oc patch secret $sec --type=merge -p '{\"metadata\":{\"finalizers\":null}}'"
                      if oc -n "$OC_NS" patch secret "$sec" --type=merge \
                          -p '{"metadata":{"finalizers":null}}' 2>&1; then
                        CLEARED=$((CLEARED+1))
                      else
                        echo "    FAIL: could not patch $sec"
                        FAILED=$((FAILED+1))
                      fi
                    else
                      # Non-empty filtered array — replace with the KEEP list.
                      echo "    + oc patch secret $sec --type=merge -p '{\"metadata\":{\"finalizers\":$KEEP}}'"
                      if oc -n "$OC_NS" patch secret "$sec" --type=merge \
                          -p "{\"metadata\":{\"finalizers\":$KEEP}}" 2>&1; then
                        CLEARED=$((CLEARED+1))
                      else
                        echo "    FAIL: could not patch $sec"
                        FAILED=$((FAILED+1))
                      fi
                    fi
                  done <<< "$STUCK"

                  sleep 2

                  echo ""
                  echo "=== Verification: any Secrets still stuck? ==="
                  STILL=$(oc -n "$OC_NS" get secrets \
                    -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.metadata.name}{"\t"}{.metadata.finalizers}{"\n"}{end}' \
                    2>/dev/null)
                  if [ -z "$STILL" ]; then
                    echo "Clean — no Secrets carry a deletionTimestamp anymore."
                  else
                    echo "Some Secrets still report deletionTimestamp (likely held by non-CFK finalizers):"
                    echo "$STILL" | awk -F '\t' '{printf "  %-40s %s\n", $1, $2}'
                  fi

                  echo ""
                  echo "=== Summary ==="
                  echo "  CFK finalizers cleared on: $CLEARED Secret(s)"
                  echo "  Skipped (no CFK fz to remove): $SKIPPED Secret(s)"
                  echo "  Failed: $FAILED Secret(s)"
                  echo ""
                  echo "Next steps:"
                  echo "  1. For Secrets cleared above: re-run action=create-prereqs to re-provision"
                  echo "     (skipping any ESO-managed names — those will be re-synced from CyberArk by ESO)."
                  echo "  2. Then action=install-or-update to bring the CFK stack back."
                  echo ""
                  echo "If anything is still stuck Terminating after this run, it's held by a non-CFK"
                  echo "finalizer (most likely ESO's external-secrets.io/finalizer). DO NOT manually"
                  echo "remove ESO finalizers — that would corrupt ESO's reconciliation state. Instead,"
                  echo "delete the ExternalSecret CR that targets the stuck Secret, let ESO clean up,"
                  echo "and re-apply the ExternalSecret to recreate the Secret from CyberArk."

                  if [ "$FAILED" -ne 0 ]; then
                    exit 1
                  fi
              env:
                OC_NS: $(RESOLVED_NS)
                TARGET_ENV: ${{ parameters.environment }}
