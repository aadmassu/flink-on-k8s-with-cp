# Scenario 2: Deploy operators into an existing ArgoCD
# Use this pipeline when ArgoCD is already installed and running on the cluster.
#
# This pipeline:
#   1. Verifies ArgoCD is running
#   2. Deploys cert-manager (via ArgoCD Application)
#   3. Deploys Confluent Operator and Flink Operator (via ArgoCD Applications)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values:
      - dev
      - qa
      - stg
      - prd

  - name: kubernetesServiceConnection
    displayName: "Kubernetes Service Connection"
    type: string
    default: "<your-service-connection>"

  - name: argocdNamespace
    displayName: "ArgoCD Namespace"
    type: string
    default: argocd

variables:
  ENV: ${{ parameters.environment }}
  ARGOCD_NS: ${{ parameters.argocdNamespace }}

stages:
  - stage: Deploy
    displayName: "Deploy Operators (${{ parameters.environment }})"
    jobs:
      - job: DeployOperators
        displayName: "Deploy into Existing ArgoCD"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: KubernetesManifest@1
            displayName: "Set Kubernetes context"
            inputs:
              action: "reject"
              kubernetesServiceConnection: ${{ parameters.kubernetesServiceConnection }}

          - task: Bash@3
            displayName: "Verify ArgoCD is running"
            inputs:
              targetType: inline
              script: |
                echo "Checking ArgoCD in namespace: $(ARGOCD_NS)"
                kubectl get pods -n $(ARGOCD_NS) | grep argocd

                echo ""
                echo "Verifying Application CRD exists..."
                kubectl get crd applications.argoproj.io

          - task: Bash@3
            displayName: "Update app namespace (if not default)"
            condition: ne('${{ parameters.argocdNamespace }}', 'argocd')
            inputs:
              targetType: inline
              script: |
                echo "Updating metadata.namespace to $(ARGOCD_NS) in app definitions..."
                for app in cert-manager confluent-operator confluent-flink-operator; do
                  sed -i "s/namespace: argocd/namespace: $(ARGOCD_NS)/" apps/${app}/$(ENV)/app.yaml
                done

          - task: Bash@3
            displayName: "Deploy cert-manager"
            inputs:
              targetType: inline
              script: |
                kubectl apply -f apps/cert-manager/$(ENV)/app.yaml

                echo "Waiting for cert-manager to become healthy..."
                kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
                  application/cert-manager-$(ENV) \
                  -n $(ARGOCD_NS) --timeout=180s

                echo "Verifying cert-manager pods..."
                kubectl get pods -n cert-manager

          - task: Bash@3
            displayName: "Deploy Confluent Operator"
            inputs:
              targetType: inline
              script: |
                kubectl apply -f apps/confluent-operator/$(ENV)/app.yaml

                echo "Waiting for Confluent Operator to become healthy..."
                kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
                  application/confluent-operator-$(ENV) \
                  -n $(ARGOCD_NS) --timeout=180s

          - task: Bash@3
            displayName: "Deploy Flink Operator"
            inputs:
              targetType: inline
              script: |
                kubectl apply -f apps/confluent-flink-operator/$(ENV)/app.yaml

                echo "Waiting for Flink Operator to become healthy..."
                kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
                  application/confluent-flink-operator-$(ENV) \
                  -n $(ARGOCD_NS) --timeout=180s

          - task: Bash@3
            displayName: "Verify deployment"
            inputs:
              targetType: inline
              script: |
                echo "=== ArgoCD Applications ==="
                kubectl get applications -n $(ARGOCD_NS) \
                  -o custom-columns=NAME:.metadata.name,HEALTH:.status.health.status,SYNC:.status.sync.status

                echo ""
                echo "=== Operator Pods ==="
                kubectl get pods -n confluent-$(ENV)
                kubectl get pods -n cert-manager
