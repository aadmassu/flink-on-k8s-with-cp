# 2. cert-manager — TLS certificate management for operator webhooks
#
# Required pipeline variables (via Openshift-ROSA-VAR-Groups):
#   OPENSHIFT_SERVER  — OpenShift API URL
#   OPENSHIFT_TOKEN   — oc login token (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]

variables:
  - group: Openshift-ROSA-VAR-Groups
  - name: ENV
    value: ${{ parameters.environment }}

stages:
  - stage: CertManager
    displayName: "cert-manager (${{ parameters.environment }})"
    jobs:
      - job: CertManager
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - task: Bash@3
            displayName: "Install oc + helm CLI"
            inputs:
              targetType: inline
              script: |
                curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                  | tar xz -C /usr/local/bin oc kubectl
                curl -sL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz \
                  | tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm

          - task: Bash@3
            displayName: "Login + Install cert-manager"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                oc login "$(OPENSHIFT_SERVER)" --token="$(OPENSHIFT_TOKEN)" --insecure-skip-tls-verify
                oc whoami

                helm repo add jetstack https://charts.jetstack.io 2>/dev/null || true
                helm repo update jetstack

                helm upgrade --install cert-manager jetstack/cert-manager \
                  --namespace cert-manager \
                  --version v1.19.4 \
                  -f apps/cert-manager/$(ENV)/values.yaml \
                  -f apps/cert-manager/openshift-overlay.yaml \
                  --wait --timeout 10m

                echo "==> Waiting for CRDs..."
                for CRD in certificates.cert-manager.io issuers.cert-manager.io; do
                  echo "    $CRD..."
                  RETRIES=0
                  until oc get crd "$CRD" &>/dev/null; do
                    RETRIES=$((RETRIES + 1))
                    if [ "$RETRIES" -ge 30 ]; then echo "ERROR: $CRD not found."; exit 1; fi
                    sleep 2
                  done
                  oc wait --for=condition=Established "crd/$CRD" --timeout=60s
                done

                echo ""
                helm status cert-manager -n cert-manager
                oc get pods -n cert-manager
