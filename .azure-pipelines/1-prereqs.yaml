# 1. OpenShift prerequisites — SCC, ClusterRoleBindings, namespaces
#
# Required pipeline variables (via Openshift-ROSA-VAR-Groups):
#   OPENSHIFT_SERVER  — OpenShift API URL
#   OPENSHIFT_TOKEN   — oc login token (mark as secret)
#   CONFLUENT_LICENSE — Confluent license key JWT (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]

variables:
  - group: Openshift-ROSA-VAR-Groups
  - name: ENV
    value: ${{ parameters.environment }}
  - name: NS
    value: "dah-kafka-${{ parameters.environment }}"

stages:
  - stage: Prereqs
    displayName: "Prerequisites (${{ parameters.environment }})"
    jobs:
      - job: Prereqs
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - task: Bash@3
            displayName: "Install oc CLI"
            inputs:
              targetType: inline
              script: |
                curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                  | tar xz -C /usr/local/bin oc kubectl

          - task: Bash@3
            displayName: "Login + Apply prerequisites"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                oc login "$(OPENSHIFT_SERVER)" --token="$(OPENSHIFT_TOKEN)" --insecure-skip-tls-verify
                oc whoami
                oc cluster-info

                echo ""
                echo "==> Creating namespaces..."
                oc create namespace $(NS) --dry-run=client -o yaml | oc apply -f -
                oc create namespace cert-manager --dry-run=client -o yaml | oc apply -f -

                echo ""
                echo "==> Applying SCC and ClusterRoleBindings..."
                oc apply -f openshift-prereqs/$(ENV)/manifests/

                echo ""
                echo "==> Creating Confluent license secret..."
                oc create secret generic confluent-license \
                  --from-literal=license.txt="$(CONFLUENT_LICENSE)" \
                  -n $(NS) --dry-run=client -o yaml | oc apply -f -

                echo ""
                echo "=== Namespaces ==="
                oc get namespace $(NS) cert-manager

                echo ""
                echo "=== SCC ==="
                oc get scc confluent-scc

                echo ""
                echo "=== ClusterRoleBindings ==="
                oc get clusterrolebinding -l '!olm.owner' | grep confluent-scc || true
