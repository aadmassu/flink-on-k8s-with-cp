# 1. OpenShift prerequisites — SCC, ClusterRoleBindings, namespaces
#
# Required pipeline variables (set in Azure DevOps > Pipelines > Edit > Variables):
#   OPENSHIFT_SERVER  — OpenShift API URL (e.g. https://api.cfk-dev.oe41.p1.openshiftapps.com:6443)
#   OPENSHIFT_TOKEN   — oc login token (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]

variables:
  ENV: ${{ parameters.environment }}
  NS: "dah-kafka-${{ parameters.environment }}"

stages:
  - stage: Prereqs
    displayName: "Prerequisites (${{ parameters.environment }})"
    jobs:
      - job: Prereqs
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: Bash@3
            displayName: "Install oc CLI"
            inputs:
              targetType: inline
              script: |
                curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                  | tar xz -C /usr/local/bin oc kubectl

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                oc login "$(OPENSHIFT_SERVER)" --token="$(OPENSHIFT_TOKEN)" --insecure-skip-tls-verify

          - task: Bash@3
            displayName: "Verify cluster connectivity"
            inputs:
              targetType: inline
              script: |
                oc cluster-info
                oc get nodes

          - task: Bash@3
            displayName: "Create namespaces"
            inputs:
              targetType: inline
              script: |
                oc create namespace $(NS) --dry-run=client -o yaml | oc apply -f -
                oc create namespace cert-manager --dry-run=client -o yaml | oc apply -f -
                echo "Namespaces ready."

          - task: Bash@3
            displayName: "Apply SCC and ClusterRoleBindings"
            inputs:
              targetType: inline
              script: |
                oc apply -f openshift-prereqs/$(ENV)/manifests/
                echo "SCC and ClusterRoleBindings applied."

          - task: Bash@3
            displayName: "Verify"
            inputs:
              targetType: inline
              script: |
                echo "=== Namespaces ==="
                oc get namespace $(NS) cert-manager

                echo ""
                echo "=== SCC ==="
                oc get scc confluent-scc

                echo ""
                echo "=== ClusterRoleBindings ==="
                oc get clusterrolebinding -l '!olm.owner' | grep confluent-scc || true
