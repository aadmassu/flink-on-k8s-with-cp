# Pipeline:  5-cmf
# Purpose:   Install Confluent Manager for Apache Flink (CMF) via Helm
# Author:    Ayele Admassu
# Created:   2026-04-09
#
# Variable Group: <env>-openshift-credentials
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-dev-namespace         — target namespace
#   openshift-dev-api               — OpenShift API server URL

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: uat-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: CMF
    displayName: "CMF (${{ parameters.environment }})"
    jobs:
      - job: CMF
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-dev-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: dah-flink-${{ parameters.environment }}

          - task: Bash@3
            displayName: "Install CMF"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                echo "=== Git commit ==="
                git rev-parse HEAD

                echo ""
                echo "=== Resources CMF will create ==="
                helm template confluent-cmf charts/confluent-manager-for-apache-flink \
                  --namespace "$OC_NS" \
                  -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                  --set namespaced=true \
                  | grep -E "^kind:|^  name:|^  namespace:" || true

                echo ""
                echo "=== Checking for stuck Helm release ==="
                STATUS=$(helm status confluent-cmf -n "$OC_NS" -o json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || true)
                if echo "$STATUS" | grep -qE "pending-install|pending-upgrade|pending-rollback"; then
                  echo "Found stuck release ($STATUS), rolling back..."
                  helm rollback confluent-cmf -n "$OC_NS" || helm uninstall confluent-cmf -n "$OC_NS" --no-hooks
                fi

                echo ""
                echo "=== Creating CMF secrets ==="
                # FCB Common Metadata standard requires these labels on every object
                # (https://confluence.fcpd.fcbint.net/display/CONV/OpenShift+Resource+Common+Metadata)
                create_labeled_secret() {
                  local name=$1
                  local key=$2
                  local value=$3
                  oc create secret generic "$name" \
                    --from-literal="$key=$value" \
                    -n "$OC_NS" --dry-run=client -o yaml \
                    | oc label --local -f - --dry-run=client -o yaml \
                        app.kubernetes.io/name=confluent-manager-for-apache-flink \
                        app.kubernetes.io/instance="$name" \
                        app.kubernetes.io/component=cmf \
                        fcbint.net/app-id=11547 \
                    | oc apply -f -
                }

                create_labeled_secret cmf-db-credentials password "$CMF_DB_PWD"
                create_labeled_secret cmf-encryption-key key "$CMF_ENC_KEY"
                create_labeled_secret confluent-license license.txt "$CMF_LICENSE"

                echo ""
                echo "=== Verifying cmf-tls Secret exists ==="
                # CMF reads the TLS cert/key from this Secret on startup. If it's
                # missing, the pod will crashloop with an opaque Spring error —
                # fail fast here instead.
                if ! oc get secret cmf-tls -n "$OC_NS" >/dev/null 2>&1; then
                  echo "ERROR: secret/cmf-tls not found in $OC_NS."
                  echo "Run the cmf-tls pipeline first to provision the cert-manager Certificate."
                  exit 1
                fi
                echo "secret/cmf-tls found."

                # ----------------------------------------------------------
                # TEMPORARY DIAGNOSTIC MODE — helm upgrade commented out so we
                # don't burn 10 minutes on the --wait while we figure out why
                # the previous install kept rolling back. Restore the helm
                # block below once we have a clean install path again.
                # ----------------------------------------------------------
                # echo ""
                # echo "=== Installing CMF ==="
                # helm upgrade --install confluent-cmf charts/confluent-manager-for-apache-flink \
                #   --namespace "$OC_NS" \
                #   -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                #   --set namespaced=true \
                #   --set cmf.database.jdbc.url="$CMF_DB_URL" \
                #   --set cmf.database.jdbc.user="$CMF_DB_USER" \
                #   --wait --timeout 10m
                #
                # echo ""
                # helm status confluent-cmf -n "$OC_NS"
                # oc get pods -n "$OC_NS" -l app.kubernetes.io/name=confluent-manager-for-apache-flink

                echo ""
                echo "=================================================================="
                echo " DIAGNOSTIC 1 — helm history confluent-cmf (rollbacks visible here)"
                echo "=================================================================="
                helm history confluent-cmf -n "$OC_NS" 2>&1 || true

                echo ""
                echo "=================================================================="
                echo " DIAGNOSTIC 2 — helm get values (current revision)"
                echo "=================================================================="
                helm get values confluent-cmf -n "$OC_NS" 2>&1 || true

                echo ""
                echo "=================================================================="
                echo " DIAGNOSTIC 3 — helm get manifest, container securityContext slice"
                echo "=================================================================="
                helm get manifest confluent-cmf -n "$OC_NS" 2>&1 \
                  | grep -B2 -A10 -E "securityContext|runAsUser|fsGroup|allowPrivilegeEscalation" \
                  || echo "(no securityContext / runAs / fsGroup matches in rendered manifest)"

                echo ""
                echo "=================================================================="
                echo " DIAGNOSTIC 4 — live Deployment pod template (what's actually running)"
                echo "=================================================================="
                oc get deployment confluent-manager-for-apache-flink -n "$OC_NS" -o yaml 2>&1 \
                  | grep -B2 -A10 -E "securityContext|runAsUser|fsGroup|allowPrivilegeEscalation" \
                  || echo "(no securityContext / runAs / fsGroup matches in live Deployment)"

                echo ""
                echo "=================================================================="
                echo " DIAGNOSTIC 5 — current ReplicaSets (helps spot rolled-back revisions)"
                echo "=================================================================="
                oc get rs -n "$OC_NS" --sort-by=.metadata.creationTimestamp 2>&1 || true

                echo ""
                echo "=================================================================="
                echo " DIAGNOSTIC 6 — what helm WOULD install right now (template only)"
                echo "=================================================================="
                helm template confluent-cmf charts/confluent-manager-for-apache-flink \
                  --namespace "$OC_NS" \
                  -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                  --set namespaced=true \
                  --set cmf.database.jdbc.url="$CMF_DB_URL" \
                  --set cmf.database.jdbc.user="$CMF_DB_USER" 2>&1 \
                  | grep -B2 -A10 -E "securityContext|runAsUser|fsGroup|allowPrivilegeEscalation" \
                  || echo "(no securityContext / runAs / fsGroup matches in template)"
            env:
              OC_NS: dah-flink-${{ parameters.environment }}
              TARGET_ENV: ${{ parameters.environment }}
              CMF_DB_URL: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
              CMF_DB_USER: $(${{ parameters.environment }}-cmf-sql-server-user)
              CMF_DB_PWD: $(${{ parameters.environment }}-cmf-sql-server-user-password)
              CMF_ENC_KEY: $(${{ parameters.environment }}-cmf-encryption-key)
              CMF_LICENSE: $(${{ parameters.environment }}-confluent-license)
