# Pipeline:  5-cmf
# Purpose:   Install Confluent Manager for Apache Flink (CMF) via Helm
# Author:    Ayele Admassu
# Created:   2026-04-09
#
# Variable Group: kafka-openshift-credentials-<env>
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-namespace         — target namespace
#   openshift-api               — OpenShift API server URL

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd, dr]
  - name: action
    displayName: "Action"
    type: string
    default: install
    values: [install, uninstall]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: kafka-openshift-credentials-uat
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: CMF
    displayName: "CMF ${{ parameters.action }} (${{ parameters.environment }})"
    jobs:
      - job: CMF
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: dah-flink-${{ parameters.environment }}

          - ${{ if eq(parameters.action, 'install') }}:
            - task: Bash@3
              displayName: "Install CMF"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  echo "=== Git commit ==="
                  git rev-parse HEAD

                  echo ""
                  echo "=== Resources CMF will create ==="
                  helm template confluent-cmf charts/confluent-manager-for-apache-flink \
                    --namespace "$OC_NS" \
                    -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                    --set namespaced=true \
                    | grep -E "^kind:|^  name:|^  namespace:" || true

                  echo ""
                  echo "=== Checking for stuck Helm release ==="
                  STATUS=$(helm status confluent-cmf -n "$OC_NS" -o json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || true)
                  if echo "$STATUS" | grep -qE "pending-install|pending-upgrade|pending-rollback"; then
                    echo "Found stuck release ($STATUS), rolling back..."
                    helm rollback confluent-cmf -n "$OC_NS" || helm uninstall confluent-cmf -n "$OC_NS" --no-hooks
                  fi

                  echo ""
                  echo "=== Creating CMF secrets ==="
                  # FCB Common Metadata standard requires these labels on every object
                  # (https://confluence.fcpd.fcbint.net/display/CONV/OpenShift+Resource+Common+Metadata)
                  create_labeled_secret() {
                    local name=$1
                    local key=$2
                    local value=$3
                    oc create secret generic "$name" \
                      --from-literal="$key=$value" \
                      -n "$OC_NS" --dry-run=client -o yaml \
                      | oc label --local -f - --dry-run=client -o yaml \
                          app.kubernetes.io/name=confluent-manager-for-apache-flink \
                          app.kubernetes.io/instance="$name" \
                          app.kubernetes.io/component=cmf \
                          fcbint.net/app-id=11547 \
                      | oc apply -f -
                  }

                  # Helper: apply an ESO ExternalSecret, force an immediate re-sync
                  # (so stale Secret content from a prior variable-group run doesn't
                  # pass the check), and wait for Ready=True. Used in dev for the
                  # three CyberArk-backed CMF Secrets (license, DB password,
                  # encryption key). On timeout, prints the live status block and
                  # exits 1.
                  apply_externalsecret_and_wait() {
                    local name=$1
                    local file=$2
                    echo ""
                    echo "--- ExternalSecret/$name  (from $file) ---"
                    oc apply -n "$OC_NS" -f "$file"
                    oc -n "$OC_NS" annotate externalsecret "$name" \
                      force-sync="$(date +%s)" --overwrite

                    echo "  waiting up to 120s for Ready=True..."
                    if ! timeout 120 bash -c "until [ \"\$(oc -n '$OC_NS' get externalsecret '$name' -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null)\" = 'True' ]; do sleep 3; done"; then
                      echo "ERROR: ExternalSecret/$name did not reach Ready=True within 120s."
                      echo ""
                      echo "Current status:"
                      oc -n "$OC_NS" get externalsecret "$name" -o yaml | sed -n '/^status:/,$p' | head -30
                      echo ""
                      echo "Diagnose with:"
                      echo "  oc -n $OC_NS describe externalsecret $name"
                      echo "Common causes: wrong CyberArk Address (property), wrong UserName (key),"
                      echo "or the SecretStore 11547-d-key-fp is in a non-Ready state."
                      exit 1
                    fi
                    echo "  ExternalSecret/$name is Ready=True."
                    oc -n "$OC_NS" get secret "$name" -o jsonpath='    Secret ownerRefs={.metadata.ownerReferences[*].kind}/{.metadata.ownerReferences[*].name}{"\n    Secret resourceVersion="}{.metadata.resourceVersion}{"\n"}'
                    oc -n "$OC_NS" get externalsecret "$name" -o jsonpath='    ES refreshTime={.status.refreshTime}{"\n    ES syncedResourceVersion="}{.status.syncedResourceVersion}{"\n"}'
                  }

                  # In dev, all three sensitive CMF Secrets (license, DB password,
                  # encryption key) come from CyberArk via ESO. In other envs they
                  # still come from the kafka-openshift-credentials-<env> variable group
                  # until those accounts are onboarded into CyberArk + per-env
                  # ExternalSecrets are added under apps/confluent-cmf/<env>/.
                  if [ "$TARGET_ENV" = "dev" ]; then
                    echo ""
                    echo "=== dev — applying ESO ExternalSecrets (CyberArk-backed) ==="
                    apply_externalsecret_and_wait confluent-license  apps/confluent-cmf/dev/externalsecrets/externalsecret-confluent-license.yaml
                    apply_externalsecret_and_wait cmf-db-credentials apps/confluent-cmf/dev/externalsecrets/externalsecret-cmf-db-password.yaml
                    apply_externalsecret_and_wait cmf-encryption-key apps/confluent-cmf/dev/externalsecrets/externalsecret-cmf-encryption-key.yaml
                  else
                    create_labeled_secret confluent-license  license.txt "$CMF_LICENSE"
                    create_labeled_secret cmf-db-credentials password    "$CMF_DB_PWD"
                    create_labeled_secret cmf-encryption-key key         "$CMF_ENC_KEY"
                  fi

                  echo ""
                  echo "=== Verifying cmf-tls Secret exists ==="
                  # CMF reads the TLS cert/key from this Secret on startup. If it's
                  # missing, the pod will crashloop with an opaque Spring error —
                  # fail fast here instead.
                  if ! oc get secret cmf-tls -n "$OC_NS" >/dev/null 2>&1; then
                    echo "ERROR: secret/cmf-tls not found in $OC_NS."
                    echo "Run the cmf-tls pipeline first to provision the cert-manager Certificate."
                    exit 1
                  fi
                  echo "secret/cmf-tls found."

                  echo ""
                  echo "=== Installing CMF ==="
                  helm upgrade --install confluent-cmf charts/confluent-manager-for-apache-flink \
                    --namespace "$OC_NS" \
                    -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                    --set namespaced=true \
                    --set cmf.database.jdbc.url="$CMF_DB_URL" \
                    --set cmf.database.jdbc.user="$CMF_DB_USER" \
                    --wait --timeout 10m

                  echo ""
                  helm status confluent-cmf -n "$OC_NS"
                  oc get pods -n "$OC_NS" -l app.kubernetes.io/name=confluent-manager-for-apache-flink
              env:
                OC_NS: dah-flink-${{ parameters.environment }}
                TARGET_ENV: ${{ parameters.environment }}
                CMF_DB_URL: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
                CMF_DB_USER: $(${{ parameters.environment }}-cmf-sql-server-user)
                CMF_DB_PWD: $(${{ parameters.environment }}-cmf-sql-server-user-password)
                CMF_ENC_KEY: $(${{ parameters.environment }}-cmf-encryption-key)
                CMF_LICENSE: $(${{ parameters.environment }}-confluent-license)

            - task: Bash@3
              displayName: "Apply CMF UI Ingress (Certificate + Ingress)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  ENV_DIR="apps/confluent-cmf/$TARGET_ENV"

                  # Two files, applied in order: Certificate first (Keyfactor
                  # signs over ~minutes), then Ingress (consumes the Secret).
                  # HAProxy router serves 503 for the host until the cert
                  # Secret materializes — that's fine; the Ingress can land
                  # immediately and the route flips Ready when cert-manager
                  # finishes. We don't block the pipeline waiting for the
                  # cert here because the manifests exist whether or not the
                  # cert is signed yet; a follow-up run will materialize it.
                  #
                  # Both files only get applied if they exist in the env
                  # directory (dev has them as of today; qa/uat/prd/dr will
                  # be added per-env when those envs are ready to expose
                  # CMF). See https://confluence.fcpd.fcbint.net/spaces/CONV/pages/172530278/OpenShift+Ingress for the FCB pattern.
                  for f in cmf-ingress-tls-certificate.yaml cmf-ingress.yaml; do
                    if [ -f "$ENV_DIR/$f" ]; then
                      echo ""
                      echo "+ oc apply -f $ENV_DIR/$f"
                      oc apply -f "$ENV_DIR/$f"
                    else
                      echo "(skip $f — not present in $ENV_DIR yet)"
                    fi
                  done

                  echo ""
                  echo "=== CMF Ingress status ==="
                  oc get ingress -n "$OC_NS" -l app.kubernetes.io/part-of=confluent-manager-for-flink 2>&1 || true
              env:
                OC_NS: dah-flink-${{ parameters.environment }}
                TARGET_ENV: ${{ parameters.environment }}

          - ${{ if eq(parameters.action, 'uninstall') }}:
            - task: Bash@3
              displayName: "Uninstall CMF"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  echo "=== Helm release status (before) ==="
                  helm status confluent-cmf -n "$OC_NS" 2>&1 | head -20 || echo "(no release)"

                  echo ""
                  echo "=== Uninstalling Helm release ==="
                  helm uninstall confluent-cmf -n "$OC_NS" --wait --timeout 5m || true

                  # In dev all three Secrets (license, db, encryption-key) are
                  # ESO-managed. Their ExternalSecrets carry deletionPolicy=Retain
                  # so deleting the ExternalSecret does NOT cascade to the
                  # underlying Secret — we delete both explicitly. cmf-tls is
                  # preserved either way (owned by cert-manager via the
                  # cmf-tls pipeline). SQL Server data persists.
                  if [ "$TARGET_ENV" = "dev" ]; then
                    echo ""
                    echo "=== Deleting ExternalSecrets (dev — ESO-managed) ==="
                    oc -n "$OC_NS" delete externalsecret \
                      confluent-license cmf-db-credentials cmf-encryption-key \
                      --ignore-not-found
                  fi

                  echo ""
                  echo "=== Deleting CMF Secrets ==="
                  oc -n "$OC_NS" delete secret \
                    confluent-license cmf-db-credentials cmf-encryption-key \
                    --ignore-not-found

                  echo ""
                  echo "=== Remaining CMF objects ==="
                  oc -n "$OC_NS" get pods,deploy,svc,secret \
                    -l app.kubernetes.io/name=confluent-manager-for-apache-flink || true
              env:
                OC_NS: dah-flink-${{ parameters.environment }}
