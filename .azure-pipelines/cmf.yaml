# Pipeline:  5-cmf
# Purpose:   Install Confluent Manager for Apache Flink (CMF) via Helm
# Author:    Ayele Admassu
# Created:   2026-04-09
#
# Variable Group: <env>-openshift-credentials
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-dev-namespace         — target namespace
#   openshift-dev-api               — OpenShift API server URL

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd]
  - name: action
    displayName: "Action"
    type: string
    default: install
    values: [install, uninstall]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: uat-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: CMF
    displayName: "CMF ${{ parameters.action }} (${{ parameters.environment }})"
    jobs:
      - job: CMF
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-dev-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: dah-flink-${{ parameters.environment }}

          - ${{ if eq(parameters.action, 'install') }}:
            - task: Bash@3
              displayName: "Install CMF"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  echo "=== Git commit ==="
                  git rev-parse HEAD

                  echo ""
                  echo "=== Resources CMF will create ==="
                  helm template confluent-cmf charts/confluent-manager-for-apache-flink \
                    --namespace "$OC_NS" \
                    -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                    --set namespaced=true \
                    | grep -E "^kind:|^  name:|^  namespace:" || true

                  echo ""
                  echo "=== Checking for stuck Helm release ==="
                  STATUS=$(helm status confluent-cmf -n "$OC_NS" -o json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || true)
                  if echo "$STATUS" | grep -qE "pending-install|pending-upgrade|pending-rollback"; then
                    echo "Found stuck release ($STATUS), rolling back..."
                    helm rollback confluent-cmf -n "$OC_NS" || helm uninstall confluent-cmf -n "$OC_NS" --no-hooks
                  fi

                  echo ""
                  echo "=== Creating CMF secrets ==="
                  # FCB Common Metadata standard requires these labels on every object
                  # (https://confluence.fcpd.fcbint.net/display/CONV/OpenShift+Resource+Common+Metadata)
                  create_labeled_secret() {
                    local name=$1
                    local key=$2
                    local value=$3
                    oc create secret generic "$name" \
                      --from-literal="$key=$value" \
                      -n "$OC_NS" --dry-run=client -o yaml \
                      | oc label --local -f - --dry-run=client -o yaml \
                          app.kubernetes.io/name=confluent-manager-for-apache-flink \
                          app.kubernetes.io/instance="$name" \
                          app.kubernetes.io/component=cmf \
                          fcbint.net/app-id=11547 \
                      | oc apply -f -
                  }

                  create_labeled_secret cmf-db-credentials password "$CMF_DB_PWD"
                  create_labeled_secret cmf-encryption-key key "$CMF_ENC_KEY"

                  # confluent-license secret source — DEV migrated to ESO/CyberArk,
                  # other envs still consume the variable-group value. Once an
                  # ExternalSecret exists per env, swap each branch over.
                  if [ "$TARGET_ENV" = "dev" ]; then
                    echo ""
                    echo "=== dev — applying ExternalSecret for confluent-license (CyberArk) ==="
                    oc apply -n "$OC_NS" -f apps/confluent-cmf/dev/externalsecrets/externalsecret-confluent-license.yaml

                    # Force an immediate re-sync — without this, if a stale
                    # Secret already exists from the legacy variable-group
                    # flow, the next check would pass instantly against the
                    # OLD content. The annotation triggers ESO to refresh
                    # from CyberArk regardless of refreshInterval.
                    oc -n "$OC_NS" annotate externalsecret confluent-license \
                      force-sync="$(date +%s)" --overwrite

                    # Wait on the ExternalSecret's status, not just Secret
                    # existence. status.conditions[type=Ready].status=True
                    # means ESO successfully fetched from CyberArk and wrote
                    # the Secret. status.syncedResourceVersion changes on
                    # every refresh, so we can also tell content was updated.
                    echo "=== Waiting up to 120s for ExternalSecret confluent-license Ready=True ==="
                    if ! timeout 120 bash -c "until [ \"\$(oc -n '$OC_NS' get externalsecret confluent-license -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null)\" = 'True' ]; do sleep 3; done"; then
                      echo "ERROR: ExternalSecret confluent-license did not reach Ready=True within 120s."
                      echo ""
                      echo "Current ExternalSecret status:"
                      oc -n "$OC_NS" get externalsecret confluent-license -o yaml | sed -n '/^status:/,$p' | head -30
                      echo ""
                      echo "Diagnose with:"
                      echo "  oc -n $OC_NS describe externalsecret confluent-license"
                      echo "Common causes: wrong CyberArk Address (property), wrong UserName (key),"
                      echo "or the SecretStore 11547-d-key-fp is in a non-Ready state."
                      exit 1
                    fi
                    echo "ExternalSecret confluent-license is Ready=True."
                    echo ""
                    echo "Materialized Secret owner + refresh metadata:"
                    oc -n "$OC_NS" get secret confluent-license -o jsonpath='{"  ownerRefs="}{.metadata.ownerReferences[*].kind}{"/"}{.metadata.ownerReferences[*].name}{"\n  resourceVersion="}{.metadata.resourceVersion}{"\n"}'
                    oc -n "$OC_NS" get externalsecret confluent-license -o jsonpath='{"  refreshTime="}{.status.refreshTime}{"\n  syncedResourceVersion="}{.status.syncedResourceVersion}{"\n"}'
                  else
                    create_labeled_secret confluent-license license.txt "$CMF_LICENSE"
                  fi

                  echo ""
                  echo "=== Verifying cmf-tls Secret exists ==="
                  # CMF reads the TLS cert/key from this Secret on startup. If it's
                  # missing, the pod will crashloop with an opaque Spring error —
                  # fail fast here instead.
                  if ! oc get secret cmf-tls -n "$OC_NS" >/dev/null 2>&1; then
                    echo "ERROR: secret/cmf-tls not found in $OC_NS."
                    echo "Run the cmf-tls pipeline first to provision the cert-manager Certificate."
                    exit 1
                  fi
                  echo "secret/cmf-tls found."

                  echo ""
                  echo "=== Installing CMF ==="
                  helm upgrade --install confluent-cmf charts/confluent-manager-for-apache-flink \
                    --namespace "$OC_NS" \
                    -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                    --set namespaced=true \
                    --set cmf.database.jdbc.url="$CMF_DB_URL" \
                    --set cmf.database.jdbc.user="$CMF_DB_USER" \
                    --wait --timeout 10m

                  echo ""
                  helm status confluent-cmf -n "$OC_NS"
                  oc get pods -n "$OC_NS" -l app.kubernetes.io/name=confluent-manager-for-apache-flink
              env:
                OC_NS: dah-flink-${{ parameters.environment }}
                TARGET_ENV: ${{ parameters.environment }}
                CMF_DB_URL: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
                CMF_DB_USER: $(${{ parameters.environment }}-cmf-sql-server-user)
                CMF_DB_PWD: $(${{ parameters.environment }}-cmf-sql-server-user-password)
                CMF_ENC_KEY: $(${{ parameters.environment }}-cmf-encryption-key)
                CMF_LICENSE: $(${{ parameters.environment }}-confluent-license)

          - ${{ if eq(parameters.action, 'uninstall') }}:
            - task: Bash@3
              displayName: "Uninstall CMF"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  echo "=== Helm release status (before) ==="
                  helm status confluent-cmf -n "$OC_NS" 2>&1 | head -20 || echo "(no release)"

                  echo ""
                  echo "=== Uninstalling Helm release ==="
                  helm uninstall confluent-cmf -n "$OC_NS" --wait --timeout 5m || true

                  echo ""
                  echo "=== Deleting pipeline-managed secrets ==="
                  # cmf-tls is intentionally preserved — owned by cert-manager
                  # via the cmf-tls pipeline. SQL Server data persists.
                  oc -n "$OC_NS" delete secret \
                    cmf-db-credentials cmf-encryption-key \
                    --ignore-not-found

                  # confluent-license: in dev the Secret is owned by an ESO
                  # ExternalSecret (CyberArk-backed). Delete the ExternalSecret
                  # and ESO cascade-deletes the Secret via ownerReference. In
                  # other envs the pipeline still owns the Secret directly.
                  if [ "$TARGET_ENV" = "dev" ]; then
                    oc -n "$OC_NS" delete externalsecret confluent-license --ignore-not-found
                  else
                    oc -n "$OC_NS" delete secret confluent-license --ignore-not-found
                  fi

                  echo ""
                  echo "=== Remaining CMF objects ==="
                  oc -n "$OC_NS" get pods,deploy,svc,secret \
                    -l app.kubernetes.io/name=confluent-manager-for-apache-flink || true
              env:
                OC_NS: dah-flink-${{ parameters.environment }}
