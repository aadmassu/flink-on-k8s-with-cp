# Pipeline:  5-cmf
# Purpose:   Install/uninstall Confluent Manager for Apache Flink (CMF) via Helm.
# Author:    Ayu Admassu
# Created:   2026-04-09
# Updated:   2026-07-31
#
# Secrets (license, cmf-db-credentials, cmf-encryption-key) come from CyberArk via ESO
# ExternalSecrets under apps/confluent-cmf/<env>/externalsecrets/. DB URL + user stay in
# variable group kafka-openshift-credentials-<env>.

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat-p, uat-s, prd, dr]
  - name: action
    displayName: "Action"
    type: string
    default: install
    values: [install, uninstall]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat-p') }}:
    - group: kafka-openshift-credentials-uat-p
  - ${{ if eq(parameters.environment, 'uat-s') }}:
    - group: kafka-openshift-credentials-uat-s
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: CMF
    displayName: "CMF ${{ parameters.action }} (${{ parameters.environment }})"
    jobs:
      - job: CMF
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - ${{ if eq(parameters.action, 'install') }}:
            - task: Bash@3
              displayName: "Install CMF"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail
                  TARGET_ENV="${{ parameters.environment }}"

                  echo "=== Git commit ==="
                  git rev-parse HEAD

                  echo ""
                  echo "=== Resources CMF will create ==="
                  helm template confluent-cmf charts/confluent-manager-for-apache-flink \
                    --namespace "$OC_NS" \
                    -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                    --set namespaced=true \
                    | grep -E "^kind:|^  name:|^  namespace:" || true

                  echo ""
                  echo "=== Checking for stuck Helm release ==="
                  STATUS=$(helm status confluent-cmf -n "$OC_NS" -o json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || true)
                  if echo "$STATUS" | grep -qE "pending-install|pending-upgrade|pending-rollback"; then
                    echo "Found stuck release ($STATUS), rolling back..."
                    helm rollback confluent-cmf -n "$OC_NS" || helm uninstall confluent-cmf -n "$OC_NS" --no-hooks
                  fi

                  echo ""
                  echo "=== Provisioning CMF Secrets via ESO (CyberArk-backed) ==="
                  # Delete any pre-existing Secret (variable-group-era or otherwise) so ESO can
                  # create it fresh with creationPolicy=Owner, then apply the ExternalSecret,
                  # force-sync, and wait for Ready=True.
                  apply_externalsecret_and_wait() {
                    local name=$1
                    local file=$2
                    echo ""
                    echo "--- ExternalSecret/$name  (from $file) ---"
                    oc -n "$OC_NS" delete secret "$name" --ignore-not-found
                    oc apply -n "$OC_NS" -f "$file"
                    oc -n "$OC_NS" annotate externalsecret "$name" \
                      force-sync="$(date +%s)" --overwrite

                    echo "  waiting up to 120s for Ready=True..."
                    if ! timeout 120 bash -c "until [ \"\$(oc -n '$OC_NS' get externalsecret '$name' -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null)\" = 'True' ]; do sleep 3; done"; then
                      echo "ERROR: ExternalSecret/$name did not reach Ready=True within 120s."
                      echo ""
                      echo "Current status:"
                      oc -n "$OC_NS" get externalsecret "$name" -o yaml | sed -n '/^status:/,$p' | head -30
                      echo ""
                      echo "Diagnose: oc -n $OC_NS describe externalsecret $name"
                      exit 1
                    fi
                    echo "  ExternalSecret/$name is Ready=True."
                    oc -n "$OC_NS" get secret "$name" -o jsonpath='    Secret ownerRefs={.metadata.ownerReferences[*].kind}/{.metadata.ownerReferences[*].name}{"\n    Secret resourceVersion="}{.metadata.resourceVersion}{"\n"}'
                    oc -n "$OC_NS" get externalsecret "$name" -o jsonpath='    ES refreshTime={.status.refreshTime}{"\n    ES syncedResourceVersion="}{.status.syncedResourceVersion}{"\n"}'
                  }

                  ES_DIR="apps/confluent-cmf/$TARGET_ENV/externalsecrets"
                  apply_externalsecret_and_wait confluent-license   "$ES_DIR/externalsecret-confluent-license.yaml"
                  apply_externalsecret_and_wait cmf-db-credentials  "$ES_DIR/externalsecret-cmf-db-password.yaml"

                  # TEMPORARY WORKAROUND (prd/dr only): Create cmf-encryption-key Secret directly
                  # TODO: Remove after Tushar updates CyberArk with the encryption key
                  if [ "$TARGET_ENV" = "prd" ] || [ "$TARGET_ENV" = "dr" ]; then
                    echo ""
                    echo "=== TEMPORARY: Creating cmf-encryption-key Secret directly (bypass ESO) ==="
                    oc -n "$OC_NS" create secret generic cmf-encryption-key \
                      --from-literal=key='6a+zypYzJoSHO6An9RPtUDJ41Ivx4DUdbqnNBEr7S6Q=' \
                      -o yaml --dry-run=client | oc apply -f -
                    echo "cmf-encryption-key Secret created (temporary, for prd/dr only)"
                  else
                    echo ""
                    echo "=== Provisioning cmf-encryption-key via ESO (CyberArk) ==="
                    apply_externalsecret_and_wait cmf-encryption-key  "$ES_DIR/externalsecret-cmf-encryption-key.yaml"
                  fi

                  echo ""
                  echo "=== Verifying cmf-tls Secret exists ==="
                  # Owned by cert-manager via the cmf-tls pipeline; fail fast if missing.
                  if ! oc get secret cmf-tls -n "$OC_NS" >/dev/null 2>&1; then
                    echo "ERROR: secret/cmf-tls not found in $OC_NS."
                    echo "Run the cmf-tls pipeline first to provision the cert-manager Certificate."
                    exit 1
                  fi
                  echo "secret/cmf-tls found."

                  echo ""
                  echo "=== Installing CMF ==="
                  helm upgrade --install confluent-cmf charts/confluent-manager-for-apache-flink \
                    --namespace "$OC_NS" \
                    -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                    --set namespaced=true \
                    --set cmf.database.jdbc.url="$CMF_DB_URL" \
                    --set cmf.database.jdbc.user="$CMF_DB_USER" \
                    --wait --timeout 10m

                  echo ""
                  helm status confluent-cmf -n "$OC_NS"
                  oc get pods -n "$OC_NS" -l app.kubernetes.io/name=confluent-manager-for-apache-flink
              env:
                OC_NS: $(openshift-namespace)
                CMF_DB_URL: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
                CMF_DB_USER: $(${{ parameters.environment }}-cmf-sql-server-user)

            - task: Bash@3
              displayName: "Apply CMF UI Ingress (Certificate + Ingress)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail
                  TARGET_ENV="${{ parameters.environment }}"

                  ENV_DIR="apps/confluent-cmf/$TARGET_ENV"

                  # Certificate first (Keyfactor signs over ~minutes), then Ingress. Skips
                  # files not present in the env dir — added per-env when ready to expose CMF.
                  for f in cmf-ingress-tls-certificate.yaml cmf-ingress.yaml; do
                    if [ -f "$ENV_DIR/$f" ]; then
                      echo ""
                      echo "+ oc apply -f $ENV_DIR/$f"
                      oc apply -f "$ENV_DIR/$f"
                    else
                      echo "(skip $f — not present in $ENV_DIR yet)"
                    fi
                  done

                  echo ""
                  echo "=== CMF Ingress status ==="
                  oc get ingress -n "$OC_NS" -l app.kubernetes.io/part-of=confluent-manager-for-flink 2>&1 || true
              env:
                OC_NS: $(openshift-namespace)

          - ${{ if eq(parameters.action, 'uninstall') }}:
            - task: Bash@3
              displayName: "Uninstall CMF"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail
                  TARGET_ENV="${{ parameters.environment }}"

                  echo "=== Helm release status (before) ==="
                  helm status confluent-cmf -n "$OC_NS" 2>&1 | head -20 || echo "(no release)"

                  echo ""
                  echo "=== Uninstalling Helm release ==="
                  helm uninstall confluent-cmf -n "$OC_NS" --wait --timeout 5m || true

                  # ExternalSecrets use deletionPolicy=Retain so deleting the ES does not cascade
                  # to the underlying Secret — delete both explicitly. cmf-tls is owned by
                  # cert-manager and preserved. SQL Server data persists.
                  echo ""
                  echo "=== Deleting ExternalSecrets and their Secrets ==="
                  oc -n "$OC_NS" delete externalsecret \
                    confluent-license cmf-db-credentials cmf-encryption-key \
                    --ignore-not-found
                  oc -n "$OC_NS" delete secret \
                    confluent-license cmf-db-credentials cmf-encryption-key \
                    --ignore-not-found

                  echo ""
                  echo "=== Remaining CMF objects ==="
                  oc -n "$OC_NS" get pods,deploy,svc,secret \
                    -l app.kubernetes.io/name=confluent-manager-for-apache-flink || true
              env:
                OC_NS: $(openshift-namespace)
