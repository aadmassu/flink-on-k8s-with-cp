# Pipeline:  5-cmf
# Purpose:   Install Confluent Manager for Apache Flink (CMF) via Helm
# Author:    Ayele Admassu
# Created:   2026-04-09
#
# Variable Group: <env>-openshift-credentials
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-dev-namespace         — target namespace
#   openshift-dev-api               — OpenShift API server URL
#
# Secret provisioning has two modes (controlled by the `useESO` parameter):
#   useESO=false (default): create K8s Secrets directly from ADO variable
#                           group values. Used pre-CyberArk integration.
#   useESO=true:            apply the env's ExternalSecret manifests and wait
#                           for ESO to sync them from the CyberArk safe.
#                           Use after the FCB Container Platforms team has
#                           onboarded our safe (SNOW form) and the env's
#                           apps/flink-secrets/<env>/flink-secrets.yaml has
#                           had its TODO placeholders filled in.
#
# Once ESO is the steady state, drop the parameter and the legacy branch.

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]
  - name: useESO
    displayName: "Source secrets from CyberArk via ESO"
    type: boolean
    default: false
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'stg') }}:
    - group: stg-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: CMF
    displayName: "CMF (${{ parameters.environment }})"
    jobs:
      - job: CMF
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-dev-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: dah-flink-${{ parameters.environment }}

          - ${{ if eq(parameters.useESO, false) }}:
            - task: Bash@3
              displayName: "Provision CMF secrets (legacy: ADO variable group)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  echo "=== Creating CMF secrets from ADO variable group ==="
                  # FCB Common Metadata standard requires these labels on every object
                  # (https://confluence.fcpd.fcbint.net/display/CONV/OpenShift+Resource+Common+Metadata)
                  create_labeled_secret() {
                    local name=$1
                    local key=$2
                    local value=$3
                    oc create secret generic "$name" \
                      --from-literal="$key=$value" \
                      -n "$OC_NS" --dry-run=client -o yaml \
                      | oc label --local -f - --dry-run=client -o yaml \
                          app.kubernetes.io/name=confluent-manager-for-apache-flink \
                          app.kubernetes.io/instance="$name" \
                          app.kubernetes.io/component=cmf \
                          fcbint.net/app-id=11547 \
                      | oc apply -f -
                  }

                  create_labeled_secret cmf-db-credentials password "$CMF_DB_PWD"
                  create_labeled_secret cmf-encryption-key key "$CMF_ENC_KEY"
                  create_labeled_secret confluent-license license.txt "$CMF_LICENSE"
              env:
                OC_NS: dah-flink-${{ parameters.environment }}
                CMF_DB_PWD: $(${{ parameters.environment }}-cmf-sql-server-user-password)
                CMF_ENC_KEY: $(${{ parameters.environment }}-cmf-encryption-key)
                CMF_LICENSE: $(${{ parameters.environment }}-confluent-license)

          - ${{ if eq(parameters.useESO, true) }}:
            - task: Bash@3
              displayName: "Provision CMF secrets (ESO: CyberArk-backed)"
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail

                  MANIFEST="apps/flink-secrets/$TARGET_ENV/flink-secrets.yaml"

                  echo "=== Applying ExternalSecrets ==="
                  if grep -q "<TODO" "$MANIFEST"; then
                    echo "ERROR: $MANIFEST still contains <TODO...> placeholders."
                    echo "Fill them in with the ClusterSecretStore name and CyberArk safe key/property"
                    echo "(provided by FCB Container Platforms after the SNOW onboarding) before enabling useESO."
                    exit 1
                  fi
                  oc apply -f "$MANIFEST"

                  echo ""
                  echo "=== Waiting for ExternalSecrets to reach Ready=True ==="
                  for es in cmf-db-credentials cmf-encryption-key confluent-license; do
                    echo ""
                    echo "--- ExternalSecret/$es ---"
                    oc wait --for=condition=Ready=True \
                      externalsecret/$es -n "$OC_NS" --timeout=5m
                  done

                  echo ""
                  echo "=== Verifying K8s Secrets exist and ESO owns them ==="
                  for s in cmf-db-credentials cmf-encryption-key confluent-license; do
                    OWNER=$(oc get secret "$s" -n "$OC_NS" \
                      -o jsonpath='{.metadata.ownerReferences[?(@.kind=="ExternalSecret")].name}')
                    if [ -z "$OWNER" ]; then
                      echo "ERROR: secret/$s exists but is not owned by an ExternalSecret."
                      echo "Either delete the legacy secret first or set creationPolicy: Merge in $MANIFEST."
                      exit 1
                    fi
                    echo "secret/$s OK (owned by ExternalSecret/$OWNER)"
                  done
              env:
                OC_NS: dah-flink-${{ parameters.environment }}
                TARGET_ENV: ${{ parameters.environment }}

          - task: Bash@3
            displayName: "Install CMF"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                echo "=== Git commit ==="
                git rev-parse HEAD

                echo ""
                echo "=== Resources the chart will apply (some may be pre-created in FCB, e.g. ServiceAccount, Service) ==="
                helm template confluent-cmf charts/confluent-manager-for-apache-flink \
                  --namespace "$OC_NS" \
                  -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                  -f apps/confluent-cmf/openshift-overlay.yaml \
                  --set namespaced=true \
                  | grep -E "^kind:|^  name:|^  namespace:" || true

                echo ""
                echo "=== Checking for stuck Helm release ==="
                STATUS=$(helm status confluent-cmf -n "$OC_NS" -o json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || true)
                if echo "$STATUS" | grep -qE "pending-install|pending-upgrade|pending-rollback"; then
                  echo "Found stuck release ($STATUS), rolling back..."
                  helm rollback confluent-cmf -n "$OC_NS" || helm uninstall confluent-cmf -n "$OC_NS" --no-hooks
                fi

                echo ""
                echo "=== Installing CMF ==="
                helm upgrade --install confluent-cmf charts/confluent-manager-for-apache-flink \
                  --namespace "$OC_NS" \
                  -f apps/confluent-cmf/$TARGET_ENV/values.yaml \
                  -f apps/confluent-cmf/openshift-overlay.yaml \
                  --set namespaced=true \
                  --set cmf.database.jdbc.url="$CMF_DB_URL" \
                  --set cmf.database.jdbc.user="$CMF_DB_USER" \
                  --wait --timeout 10m

                echo ""
                helm status confluent-cmf -n "$OC_NS"
                oc get pods -n "$OC_NS" -l app.kubernetes.io/name=confluent-manager-for-apache-flink
            env:
              OC_NS: dah-flink-${{ parameters.environment }}
              TARGET_ENV: ${{ parameters.environment }}
              CMF_DB_URL: $(${{ parameters.environment }}-cmf-sql-server-jdbc-url)
              CMF_DB_USER: $(${{ parameters.environment }}-cmf-sql-server-user)
