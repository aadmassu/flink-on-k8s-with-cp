# Pipeline:  0-check-tools
# Purpose:   Verify CLI tools, OpenShift connectivity, and service account RBAC
# Author:    Ayele Admassu
# Created:   2026-04-06
#
# Variable Group: <env>-openshift-credentials
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-dev-namespace         — target namespace
#   openshift-dev-api               — OpenShift API server URL

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'stg') }}:
    - group: stg-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: CheckTools
    displayName: "Check Server Tools"
    jobs:
      - job: CheckTools
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "System info"
            inputs:
              targetType: inline
              script: |
                echo "=== OS ==="
                uname -a
                cat /etc/os-release 2>/dev/null || true

                echo ""
                echo "=== User ==="
                whoami
                id

                echo ""
                echo "=== PATH ==="
                echo "$PATH"

          - task: Bash@3
            displayName: "Check oc CLI"
            inputs:
              targetType: inline
              script: |
                echo "=== oc ==="
                which oc 2>/dev/null && oc version --client || echo "oc NOT found"

          - task: Bash@3
            displayName: "Check helm CLI"
            inputs:
              targetType: inline
              script: |
                echo "=== helm ==="
                which helm 2>/dev/null && helm version || echo "helm NOT found"

          - task: Bash@3
            displayName: "Check kubectl CLI"
            inputs:
              targetType: inline
              script: |
                echo "=== kubectl ==="
                which kubectl 2>/dev/null && kubectl version --client || echo "kubectl NOT found"

          - task: Bash@3
            displayName: "Check other tools"
            inputs:
              targetType: inline
              script: |
                echo "=== curl ==="
                which curl 2>/dev/null && curl --version | head -1 || echo "curl NOT found"

                echo ""
                echo "=== git ==="
                which git 2>/dev/null && git --version || echo "git NOT found"

                echo ""
                echo "=== docker ==="
                which docker 2>/dev/null && docker --version || echo "docker NOT found"

                echo ""
                echo "=== podman ==="
                which podman 2>/dev/null && podman --version || echo "podman NOT found"

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $(openshift-dev-api)..."
                oc login "$(openshift-dev-api)" \
                  --username="$(openshift-service-account-name)" \
                  --password="$(openshift-service-account-pwd)" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $(openshift-dev-namespace) ==="
                oc project "$(openshift-dev-namespace)"

          - task: Bash@3
            displayName: "List CRDs"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "=== Flink-related CRDs ==="
                oc get crds | grep -i flink || echo "No Flink CRDs found"

                echo ""
                echo "=== Confluent-related CRDs ==="
                oc get crds | grep -i confluent || echo "No Confluent CRDs found"

          - task: Bash@3
            displayName: "List Secrets"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "=== Secrets in $(openshift-dev-namespace) ==="
                oc get secrets -n "$(openshift-dev-namespace)"

          - task: Bash@3
            displayName: "List Pods"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "=== Pods in $(openshift-dev-namespace) ==="
                oc get pods -n "$(openshift-dev-namespace)" -o wide
