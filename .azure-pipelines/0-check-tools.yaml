# 0. Check server capabilities — download and verify oc, helm, kubectl
#
# Required pipeline variables (via dev-openshift-credentials):
#   openshift-service-account-name — service account username
#   openshift-service-account-pwd  — service account password (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]
  - name: openshiftServer
    displayName: "OpenShift API Server URL"
    type: string
  - name: namespace
    displayName: "Target Namespace"
    type: string
    default: "dah-kafka-dev"

variables:
  - group: dev-openshift-credentials
  - name: NS
    value: ${{ parameters.namespace }}

stages:
  - stage: CheckTools
    displayName: "Check Server Tools"
    jobs:
      - job: CheckTools
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "System info"
            inputs:
              targetType: inline
              script: |
                echo "=== OS ==="
                uname -a
                cat /etc/os-release 2>/dev/null || true

                echo ""
                echo "=== User ==="
                whoami
                id

                echo ""
                echo "=== PATH ==="
                echo "$PATH"

          - task: Bash@3
            displayName: "Check oc CLI"
            inputs:
              targetType: inline
              script: |
                echo "=== oc ==="
                which oc 2>/dev/null && oc version --client || echo "oc NOT found"

          - task: Bash@3
            displayName: "Check helm CLI"
            inputs:
              targetType: inline
              script: |
                echo "=== helm ==="
                which helm 2>/dev/null && helm version || echo "helm NOT found"

          - task: Bash@3
            displayName: "Check kubectl CLI"
            inputs:
              targetType: inline
              script: |
                echo "=== kubectl ==="
                which kubectl 2>/dev/null && kubectl version --client || echo "kubectl NOT found"

          - task: Bash@3
            displayName: "Check other tools"
            inputs:
              targetType: inline
              script: |
                echo "=== curl ==="
                which curl 2>/dev/null && curl --version | head -1 || echo "curl NOT found"

                echo ""
                echo "=== git ==="
                which git 2>/dev/null && git --version || echo "git NOT found"

                echo ""
                echo "=== docker ==="
                which docker 2>/dev/null && docker --version || echo "docker NOT found"

                echo ""
                echo "=== podman ==="
                which podman 2>/dev/null && podman --version || echo "podman NOT found"

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at ${{ parameters.openshiftServer }}..."
                oc login "${{ parameters.openshiftServer }}" \
                  --username="$(openshift-service-account-name)" \
                  --password="$(openshift-service-account-pwd)" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $(NS) ==="
                oc project "$(NS)"

          - task: Bash@3
            displayName: "List CRDs"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "=== Flink-related CRDs ==="
                oc get crds | grep -i flink || echo "No Flink CRDs found"

                echo ""
                echo "=== Confluent-related CRDs ==="
                oc get crds | grep -i confluent || echo "No Confluent CRDs found"

          - task: Bash@3
            displayName: "List Secrets"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "=== Secrets in $(NS) ==="
                oc get secrets -n "$(NS)"

          - task: Bash@3
            displayName: "List Pods"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "=== Pods in $(NS) ==="
                oc get pods -n "$(NS)" -o wide
