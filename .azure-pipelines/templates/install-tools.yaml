# Reusable template: download oc, helm, kubectl from Artifactory
# Usage:
#   - template: templates/install-tools.yaml

steps:
  - task: Bash@3
    displayName: "Download kubectl"
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        TOOL_DIR="$(Pipeline.Workspace)/tools"
        mkdir -p "$TOOL_DIR"

        echo "Downloading kubectl..."
        curl -sSLk -o "$TOOL_DIR/kubectl" \
          "https://artifactory.fcbint.net/artifactory/kubectl-remote/v1.31.0/bin/linux/amd64/kubectl"
        chmod +x "$TOOL_DIR/kubectl"

        echo "##vso[task.prependpath]$TOOL_DIR"
        "$TOOL_DIR/kubectl" version --client

  - task: Bash@3
    displayName: "Download helm"
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        TOOL_DIR="$(Pipeline.Workspace)/tools"
        mkdir -p "$TOOL_DIR"

        echo "Downloading helm..."
        curl -sSLk -o /tmp/helm.tar.gz \
          "https://artifactory.fcbint.net/artifactory/helm-client/helm-v3.18.3-linux-amd64.tar.gz"
        tar xz -C "$TOOL_DIR" --strip-components=1 -f /tmp/helm.tar.gz linux-amd64/helm
        chmod +x "$TOOL_DIR/helm"
        rm -f /tmp/helm.tar.gz

        echo "##vso[task.prependpath]$TOOL_DIR"
        "$TOOL_DIR/helm" version

  - task: Bash@3
    displayName: "Download oc"
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        TOOL_DIR="$(Pipeline.Workspace)/tools"
        mkdir -p "$TOOL_DIR"

        echo "Downloading oc..."
        curl -sSLk -o "$TOOL_DIR/oc" \
          "https://artifactory.fcbint.net/artifactory/openshift-tools/client/linux/openshift-client-linux.4.14.9.tar.gz/oc"
        chmod +x "$TOOL_DIR/oc"

        echo "##vso[task.prependpath]$TOOL_DIR"
        "$TOOL_DIR/oc" version --client
