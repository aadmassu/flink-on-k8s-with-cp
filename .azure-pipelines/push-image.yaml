# Pipeline:  push-image
# Purpose:   Load a Docker image from repo tar file and push to Artifactory
# Author:    Ayele Admassu
# Created:   2026-04-16
#
# Variable Group: <env>-openshift-credentials
#   artifactory-svc-user          — Artifactory service account username
#   artifactory-svc-user-password — Artifactory service account password (secret)

trigger: none

parameters:
  - name: artifactoryRepo
    displayName: "Artifactory Repo"
    type: string
    default: nonprod
    # nonprod = camdepositsharedservices-docker-dev (consumed by dev / qa / uat)
    # prd     = camdepositsharedservices-docker-prod (consumed by prd only)
    values: [nonprod, prd]
  - name: sourceTar
    displayName: "Source tar filename in repo root"
    type: string
    default: "cp-cmf-2.3.0-fcb-2-amd64.tar"
  - name: targetTag
    displayName: "Target Tag in Artifactory"
    type: string
    default: "2.3.0-fcb-preview-2"

variables:
  - ${{ if eq(parameters.artifactoryRepo, 'nonprod') }}:
    - name: REGISTRY_REPO
      value: camdepositsharedservices-docker-dev
    # Artifactory creds shared across the per-env variable groups; pick dev for nonprod pushes.
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.artifactoryRepo, 'prd') }}:
    - name: REGISTRY_REPO
      value: camdepositsharedservices-docker-prod
    - group: prd-openshift-credentials

stages:
  - stage: PushImage
    displayName: "Push Image (${{ parameters.artifactoryRepo }} / ${{ parameters.targetTag }})"
    jobs:
      - job: PushImage
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - task: Bash@3
            displayName: "Load, tag, and push image"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                REGISTRY="artifactory.fcbint.net/$REGISTRY_REPO"
                TARGET_IMAGE="$REGISTRY/confluentinc/cp-cmf:$TARGET_TAG"

                echo "=== Loading image from $SOURCE_TAR ==="
                if [ ! -f "$SOURCE_TAR" ]; then
                  echo "ERROR: $SOURCE_TAR not found in repo root"
                  exit 1
                fi

                # Use podman if available, otherwise docker
                CONTAINER_CLI="docker"
                if command -v podman &>/dev/null; then
                  CONTAINER_CLI="podman"
                fi
                echo "Using $CONTAINER_CLI"

                LOAD_OUTPUT=$($CONTAINER_CLI load < "$SOURCE_TAR")
                echo "$LOAD_OUTPUT"
                SOURCE_IMAGE=$(echo "$LOAD_OUTPUT" | grep -oE 'Loaded image:?\s+\S+' | awk '{print $NF}' | head -1)
                if [ -z "$SOURCE_IMAGE" ]; then
                  echo "ERROR: Could not detect loaded image from tar"
                  exit 1
                fi

                echo ""
                echo "=== Tagging $SOURCE_IMAGE as $TARGET_IMAGE ==="
                $CONTAINER_CLI tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

                echo ""
                echo "=== Logging in to Artifactory ==="
                echo "$ART_PWD" | $CONTAINER_CLI login artifactory.fcbint.net --username "$ART_USER" --password-stdin

                echo ""
                echo "=== Pushing $TARGET_IMAGE ==="
                $CONTAINER_CLI push "$TARGET_IMAGE"

                echo ""
                echo "=== Done ==="
                echo "Image pushed: $TARGET_IMAGE"
            env:
              SOURCE_TAR: ${{ parameters.sourceTar }}
              TARGET_TAG: ${{ parameters.targetTag }}
              REGISTRY_REPO: $(REGISTRY_REPO)
              ART_USER: $(artifactory-svc-user)
              ART_PWD: $(artifactory-svc-user-password)
