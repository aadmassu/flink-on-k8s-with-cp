# Pipeline:  diagnostics
# Purpose:   Read-only dump of the CFK-managed Confluent Platform cluster
#            state in dah-flink-<env> AND the CMF (Confluent Manager for
#            Apache Flink) install in the same namespace:
#              CFK side — ESO-managed Secrets inventory, Secrets stuck in
#              Terminating, prerequisite Secrets matrix, CR auth spec,
#              recent Warning events, full CR + StatefulSet yaml,
#              status.conditions table, `oc explain` against the live CRD
#              schema, the last 200 lines of the operator log filtered
#              for errors.
#              CMF side — Helm release state, prereq Secrets (incl.
#              cmf-encryption-key byte-length validation that mirrors
#              CMF's encryptionConfigInitializer check), Deployment +
#              Pod state, image-tag drift vs the FCB-required
#              2.3.0-fcb-preview-2 build, namespace-scoped RBAC, rendered
#              cmf-config ConfigMap, Service/Endpoints, DB reachability
#              from inside the pod (DNS + TCP probe), pod log tail
#              filtered for Spring/CMF boot markers, REST API health
#              probe, and CMF-scoped events.
#            Touches nothing — `set +e` and a trailing `exit 0` keep it
#            strictly observational.
# Author:    Ayu Admassu
# Created:   2026-06-17
#
# Was previously embedded in confluent-platform.yaml under
# action=diagnostics (and ran automatically as the first step of
# action=install-or-update). Moved here so it can be invoked standalone
# — and so install-or-update's startup is faster when you don't need
# the dump.
#
# Variable Group: kafka-openshift-credentials-<env>
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-api               — OpenShift API server URL
#   openshift-namespace         — target namespace (dah-flink-<env>)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd, dr]

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: kafka-openshift-credentials-uat
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: Diagnostics
    displayName: "Confluent Platform diagnostics (${{ parameters.environment }})"
    jobs:
      - job: Diagnostics
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "Diagnostics: dump Secret + CR state"
            inputs:
              targetType: inline
              script: |
                # Diagnostics intentionally never fail — they just log
                # state. set +e so a missing CR or secret prints an
                # error line but doesn't abort the pipeline.
                set +e

                # FIRST PASS — ESO-managed Secrets inventory. Lists every
                # ExternalSecret CR's target Secret name so the rest of
                # the diagnostic output makes clear which Secrets the
                # pipeline owns vs which ESO owns. At FCB the ESO-managed
                # set is (as of 2026-06-09): confluent-license,
                # cmf-encryption-key, cmf-db-credentials — but this scans
                # the live cluster rather than hardcoding, so the list
                # stays accurate as more ExternalSecrets are added.
                echo "=== ESO-managed Secrets in $OC_NS (do not manually create or finalizer-clear) ==="
                ESO_LIST=$(oc -n "$OC_NS" get externalsecrets.external-secrets.io \
                  -o jsonpath='{range .items[*]}{.spec.target.name}{"\t(from ExternalSecret "}{.metadata.name}{", store "}{.spec.secretStoreRef.name}{")\n"}{end}' \
                  2>/dev/null)
                if [ -z "$ESO_LIST" ]; then
                  echo "  (no ExternalSecrets in namespace, or external-secrets CRD missing)"
                else
                  echo "$ESO_LIST" | awk -F '\t' 'NF>=2 {printf "  %-40s %s\n", $1, $2}'
                fi
                echo ""

                # SECOND PASS: any Secret stuck in Terminating state will
                # block the next install reconcile with a "no new
                # finalizers can be added if the object is being deleted"
                # error from the API server. Surface it at the TOP of
                # the diagnostic output so it's the first thing seen,
                # rather than buried 1300+ lines down in a CR condition
                # message. See runbook/LESSONS_LEARNED.md A13 and
                # action=clear-stuck-prereq-finalizers for the recovery.
                echo "=== Pre-flight: Secrets stuck in Terminating? ==="
                STUCK_SECRETS=$(oc -n "$OC_NS" get secrets \
                  -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.metadata.name}{"\t"}{.metadata.deletionTimestamp}{"\t"}{.metadata.finalizers}{"\n"}{end}' \
                  2>/dev/null)
                if [ -z "$STUCK_SECRETS" ]; then
                  echo "OK — no Secrets in $OC_NS carry a deletionTimestamp."
                else
                  echo "WARNING — the following Secrets are stuck in Terminating:"
                  printf "%-40s %-25s %s\n" "NAME" "deletionTimestamp" "finalizers"
                  echo "$STUCK_SECRETS" | awk -F '\t' 'NF>=3 {printf "%-40s %-25s %s\n", $1, $2, $3}'
                  echo ""
                  echo "The next install reconcile will fail trying to add new finalizers to these."
                  echo "Recovery: re-run confluent-platform with action=clear-stuck-prereq-finalizers,"
                  echo "then action=create-prereqs to re-provision, then action=install-or-update."
                fi
                echo ""

                echo "=== Secret: sasl-plain-internal — keys ==="
                echo "(expected: kafka-server-listener-internal-plain-users.json)"
                oc -n "$OC_NS" get secret sasl-plain-internal \
                  -o jsonpath='{.data}' 2>/dev/null \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d.keys()))" \
                  2>&1 || echo "(secret missing or not parseable)"

                echo ""
                echo "=== Secret: mds-token-keypair — keys ==="
                echo "(expected: ['mdsPublicKey.pem', 'mdsTokenKeyPair.pem'])"
                oc -n "$OC_NS" get secret mds-token-keypair \
                  -o jsonpath='{.data}' 2>/dev/null \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d.keys()))" \
                  2>&1 || echo "(secret missing or not parseable)"

                # Operator vs init-container minor must match (LESSONS_LEARNED
                # D1). When they drift, the init container's config-rendering
                # logic gets out of sync with what the operator validates,
                # producing "ApplyFailed" with no further detail in the CR
                # status. Surface both versions at the top, side by side.
                echo ""
                echo "=== Operator version vs init container versions in CR specs ==="
                # Print the version each CR reports independently. After a 3.1→3.2
                # operator roll, one CR's controller may be reconciling (version
                # stamped) while another sits cold (no version stamped). The
                # difference is the signal — collapsing to a single number hides it.
                echo "  Operator (from CR .status.operatorVersion):"
                for kind_name in \
                    "kraftcontroller kraftcontroller" \
                    "kafka kafka" \
                    "schemaregistry schemaregistry" \
                    "connect connect" \
                    "kafkarestproxy kafkarest" \
                    "controlcenter controlcenter"; do
                  kind=${kind_name% *}; name=${kind_name#* }
                  if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                    V=$(oc -n "$OC_NS" get "$kind" "$name" \
                      -o jsonpath='{.status.operatorVersion}' 2>/dev/null)
                    printf "    %-25s %s\n" "$kind/$name" "${V:-<not stamped>}"
                  fi
                done
                echo "  (chart 0.1351.x = CFK 3.1.x; 0.1514.x = CFK 3.2.x)"
                echo ""
                echo "  Per-CR init container images (must match operator minor):"
                for kind_name in \
                    "kafka kafka" \
                    "kraftcontroller kraftcontroller" \
                    "schemaregistry schemaregistry" \
                    "connect connect" \
                    "kafkarestproxy kafkarest" \
                    "controlcenter controlcenter"; do
                  kind=${kind_name% *}; name=${kind_name#* }
                  if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                    IMG=$(oc -n "$OC_NS" get "$kind" "$name" -o jsonpath='{.spec.image.init}' 2>/dev/null)
                    printf "    %-25s init = %s\n" "$kind/$name" "${IMG:-<unset>}"
                  fi
                done

                # Comprehensive present/missing matrix for every Secret the
                # install expects. Split into three groups:
                #   prereq    — created by `create-prereqs` action (or ESO)
                #   tls       — cert-manager Certificates write these
                #   oauth     — env-specific OAuth client credentials
                # Missing prereq or TLS Secret is the most common cause of a
                # CFK pod that schedules but can't pass init.
                echo ""
                echo "=== Expected CFK Secrets — present/missing matrix ==="
                print_secret_status() {
                  local group=$1; shift
                  echo ""
                  echo "  [$group]"
                  for s in "$@"; do
                    if oc -n "$OC_NS" get secret "$s" >/dev/null 2>&1; then
                      AGE=$(oc -n "$OC_NS" get secret "$s" -o jsonpath='{.metadata.creationTimestamp}')
                      printf "    %-42s PRESENT (created %s)\n" "$s" "$AGE"
                    else
                      printf "    %-42s MISSING\n" "$s"
                    fi
                  done
                }
                print_secret_status "Prereq Secrets (manual / ESO)" \
                  confluent-license sasl-plain-internal mds-token-keypair \
                  cmf-encryption-key cmf-db-credentials \
                  c3-prometheus-basic-auth c3-alertmanager-basic-auth
                print_secret_status "TLS Secrets (cert-manager Certificate-issued)" \
                  kafka-tls kraftcontroller-tls schemaregistry-tls \
                  connect-tls kafkarest-tls controlcenter-tls \
                  kafka-mds-ingress-tls schemaregistry-ingress-tls \
                  connect-ingress-tls kafkarest-ingress-tls \
                  controlcenter-ingress-tls
                print_secret_status "OAuth Secrets (Okta client credentials)" \
                  oauth-broker oauth-schemaregistry oauth-connect \
                  oauth-kafkarest oauth-controlcenter oauth-mds-rest

                # cert-manager Certificate objects — Ready condition tells us
                # whether Keyfactor has issued the cert. A Secret that is
                # MISSING in the matrix above is almost always paired with a
                # Certificate that's `Ready=False` here (issuance pending,
                # CSR rejected, ClusterIssuer broken, etc.).
                echo ""
                echo "=== cert-manager Certificates (Ready condition + age) ==="
                if oc -n "$OC_NS" get certificates.cert-manager.io >/dev/null 2>&1; then
                  printf "  %-50s %-8s %-30s %s\n" "NAME" "READY" "REASON" "SECRET"
                  oc -n "$OC_NS" get certificates.cert-manager.io \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\t"}{.reason}{"\t"}{end}{.spec.secretName}{"\n"}{end}' \
                    2>/dev/null \
                    | awk -F '\t' 'NF>=4 {printf "  %-50s %-8s %-30s %s\n", $1, $2, $3, $4}' \
                    || echo "  (failed to render — try `oc get certificates -o wide` manually)"
                else
                  echo "  (cert-manager CRD not found in cluster)"
                fi

                for cr_kind in connect kafkarestproxy schemaregistry controlcenter; do
                  cr_name=$cr_kind
                  [ "$cr_kind" = "kafkarestproxy" ] && cr_name=kafkarest
                  [ "$cr_kind" = "controlcenter" ] && cr_name=controlcenter
                  [ "$cr_kind" = "schemaregistry" ] && cr_name=schemaregistry

                  echo ""
                  echo "=== CR: $cr_kind/$cr_name — spec.authentication ==="
                  echo "(expected: nested authentication.oauth.{secretRef, configuration})"
                  oc -n "$OC_NS" get "$cr_kind" "$cr_name" \
                    -o jsonpath='{.spec.authentication}' 2>/dev/null \
                    | python3 -m json.tool 2>&1 \
                    || echo "(CR not found yet — expected on first install)"
                done

                # Per-CR events (every severity, scoped by .metadata.uid). The
                # operator's pod is in a different namespace and the pipeline SA
                # is namespace-scoped to dah-flink-<env> — so we can't read the
                # operator log directly. But the events it emits on these CRs
                # land in OUR namespace, so we can pull them. This usually
                # surfaces "ApplyFailed" / "Reconciling" / "ValidationFailed"
                # messages with the actual reason CFK gave up.
                # NOTE: bash reserves the name UID (built-in: current-user UID,
                # readonly). Using CR_UID for our scratch variable instead.
                echo ""
                echo "=== Events per CR (all severities, scoped by .metadata.uid) ==="
                for kind_name in \
                    "kraftcontroller kraftcontroller" \
                    "kafka kafka" \
                    "schemaregistry schemaregistry" \
                    "connect connect" \
                    "kafkarestproxy kafkarest" \
                    "controlcenter controlcenter" \
                    "kafkarestclass default"; do
                  kind=${kind_name% *}; name=${kind_name#* }
                  if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                    CR_UID=$(oc -n "$OC_NS" get "$kind" "$name" -o jsonpath='{.metadata.uid}' 2>/dev/null)
                    echo ""
                    echo "--- $kind/$name (uid=$CR_UID) ---"
                    EVENTS=$(oc -n "$OC_NS" get events \
                      --field-selector "involvedObject.uid=$CR_UID" \
                      --sort-by=.lastTimestamp 2>/dev/null \
                      -o custom-columns=TIME:.lastTimestamp,TYPE:.type,REASON:.reason,MSG:.message 2>/dev/null)
                    if [ -n "$EVENTS" ] && [ "$EVENTS" != "No resources found in $OC_NS namespace." ]; then
                      echo "$EVENTS" | tail -15
                    else
                      echo "  (no events for this CR within the K8s event retention window — typically 1h)"
                    fi
                  fi
                done

                # NetworkPolicies in the namespace. If the operator's namespace
                # has an EgressNetworkPolicy or our namespace has an IngressNP
                # that drops traffic from the operator, that's what shows up as
                # "i/o timeout" on Jolokia (port 7777) queries — and the kafka
                # reconciler treats Jolokia timeout as "controller unavailable."
                echo ""
                echo "=== NetworkPolicies in $OC_NS ==="
                oc -n "$OC_NS" get networkpolicies 2>/dev/null || echo "  (no NetworkPolicies, or oc error)"
                echo ""
                oc -n "$OC_NS" describe networkpolicies 2>/dev/null \
                  | sed -n '/^Name:/,/^Events:/p' | head -80 \
                  || echo "  (no NetworkPolicies to describe)"

                # Tail of each Confluent component pod's main container log.
                # The operator log is unreachable from our SA, but the component
                # pods themselves run in our namespace and we can read their
                # logs. Catches: init-container script errors, JVM heap settings,
                # listener bind failures, Jolokia start banner, OAuth token
                # validation, ESO Secret lookup failures.
                echo ""
                echo "=== Component pod logs (last 60 lines per pod, filtered) ==="
                for pod in $(oc -n "$OC_NS" get pods -o jsonpath='{range .items[?(@.metadata.labels.confluent-platform=="true")]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
                  echo ""
                  echo "############### pod/$pod (main) ###############"
                  oc -n "$OC_NS" logs "$pod" --tail=60 2>&1 \
                    | grep -iE 'error|warn|exception|listener|jolokia|startup|kafka.controller|raft|oauth' \
                    | tail -40 \
                    || echo "  (no matching log lines)"
                done

                # Pod age + node placement — catches partial rolls (some pods on
                # new revision, some on old) and anti-affinity outcomes.
                echo ""
                echo "=== Pod age + node placement (catch stuck rolls) ==="
                oc -n "$OC_NS" get pods -o custom-columns='POD:.metadata.name,STATUS:.status.phase,AGE:.metadata.creationTimestamp,NODE:.spec.nodeName' --sort-by=.metadata.creationTimestamp 2>/dev/null

                echo ""
                echo "=== Recent Warning events (last 30) ==="
                # The KIND/.involvedObject.name slash syntax above doesn't
                # actually work — custom-columns can't concatenate two
                # jsonpath expressions in one column, so the column comes
                # out as "<none>" for every row and we can't tell which
                # resource each warning is on. Split into two columns.
                oc -n "$OC_NS" get events --sort-by=.lastTimestamp \
                  --field-selector type=Warning \
                  -o custom-columns=TIME:.lastTimestamp,REASON:.reason,KIND:.involvedObject.kind,NAME:.involvedObject.name,MSG:.message \
                  2>/dev/null | tail -30 \
                  || echo "(no Warning events or oc error)"

                echo ""
                echo "=== Kafka broker Services (headless + LB + any auto-created TOKEN/MDS Service) ==="
                # When Phase 2 MDS/RBAC is enabled, CFK auto-rewires SR/Connect/KafkaRest to reach the broker via a TOKEN/OAUTHBEARER listener (typically :9073). If that listener isn't declared in spec.listeners on the Kafka CR, no corresponding Service exists here and clients time out fetching cluster metadata (runbook A22).
                oc -n "$OC_NS" get svc -l app.kubernetes.io/name=kafka -o wide 2>&1 || echo "(no kafka Services or oc error)"
                echo ""
                oc -n "$OC_NS" get svc -o custom-columns=NAME:.metadata.name,TYPE:.spec.type,PORTS:.spec.ports[*].port 2>&1 | grep -iE '^(NAME|kafka)' || echo "(no kafka-named Services)"

                echo ""
                echo "=== Rendered listener config inside kafka-0 (server.properties) ==="
                # Proves whether ports like 9073 are actually open on the running broker vs only referenced in the operator's derived client config. Grep for the listener declaration lines; falls back to /etc/kafka if /mnt/config isn't the render path.
                if oc -n "$OC_NS" get pod kafka-0 >/dev/null 2>&1; then
                  oc -n "$OC_NS" exec kafka-0 -- sh -c \
                    'grep -E "^listeners|^advertised\.listeners|^listener\.security\.protocol\.map|9073|OAUTHBEARER|TOKEN" /mnt/config/server.properties 2>/dev/null || grep -rE "^listeners|^advertised\.listeners|^listener\.security\.protocol\.map|9073|OAUTHBEARER|TOKEN" /etc/kafka/ 2>/dev/null || echo "  (server.properties not found at /mnt/config or /etc/kafka)"' \
                    2>&1 || echo "  (oc exec into kafka-0 failed)"
                else
                  echo "(kafka-0 pod not found — brokers may not be scheduled yet)"
                fi

                echo ""
                echo "=== CFK CR status conditions ==="
                for kind in kafka kraftcontroller schemaregistry connect kafkarestproxy controlcenter kafkarestclass; do
                  echo ""
                  echo "--- $kind ---"
                  oc -n "$OC_NS" get "$kind" -o custom-columns=NAME:.metadata.name,READY:.status.replicas.ready,REPLICAS:.status.replicas.total,PHASE:.status.phase,MSG:.status.kafka.state 2>/dev/null \
                    || echo "(no $kind in namespace)"
                  oc -n "$OC_NS" get "$kind" -o jsonpath='{range .items[*]}{.metadata.name}{":\n"}{range .status.conditions[*]}  - type={.type} status={.status} reason={.reason} message={.message}{"\n"}{end}{end}' 2>/dev/null
                done

                echo ""
                echo "=== Pods (all in namespace) ==="
                oc -n "$OC_NS" get pods -o wide 2>/dev/null || true

                # For every container in every pod, show how it last died if
                # it ever did. Surfaces OOMKilled (exit 137), Error (exit 1
                # from configure script), Completed (graceful exit), and the
                # exit-code-to-restart-count ratio — instant signal vs the
                # full pod yaml dump below. Empty `lastExit=` columns mean
                # the container has never terminated; that's the healthy
                # path.
                echo ""
                echo "=== Container restart history (restartCount + lastState.terminated per container) ==="
                oc -n "$OC_NS" get pods -o jsonpath='{range .items[*]}POD={.metadata.name}{"\n"}{range .status.containerStatuses[*]}  container={.name} restartCount={.restartCount} lastExit={.lastState.terminated.exitCode} lastReason={.lastState.terminated.reason} lastStartedAt={.lastState.terminated.startedAt} lastFinishedAt={.lastState.terminated.finishedAt}{"\n"}{end}{range .status.initContainerStatuses[*]}  initContainer={.name} restartCount={.restartCount} lastExit={.lastState.terminated.exitCode} lastReason={.lastState.terminated.reason}{"\n"}{end}{end}' 2>/dev/null \
                  || echo "  (no pods, or oc/jsonpath error)"

                # `describe pod` events for any pod NOT in Ready state.
                # Bounded by the not-Ready filter so it doesn't dump 30+
                # pod events when the cluster is healthy. ImagePullBackOff,
                # FailedScheduling, FailedMount, OOMKilled, container
                # admission denials — all surface here cleanly.
                echo ""
                echo "=== Describe events for non-Ready pods (admission / scheduling / image / probe failures) ==="
                NON_READY=$(oc -n "$OC_NS" get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null \
                  | awk -F '\t' '$2 != "True" {print $1}')
                if [ -z "$NON_READY" ]; then
                  echo "  (every pod has Ready=True — no events to dump)"
                else
                  for pod in $NON_READY; do
                    echo ""
                    echo "############### $pod ###############"
                    oc -n "$OC_NS" describe pod "$pod" 2>/dev/null | sed -n '/^Events:/,/^$/p' \
                      | head -40
                  done
                fi

                echo ""
                echo "=== PVCs ==="
                oc -n "$OC_NS" get pvc -o wide 2>/dev/null || true

                # PVCs stuck in Pending = StatefulSet pod stuck on volume
                # attach. Surface the events on each Pending PVC so the
                # storage class / provisioner reason is visible.
                PENDING_PVCS=$(oc -n "$OC_NS" get pvc -o jsonpath='{range .items[?(@.status.phase!="Bound")]}{.metadata.name}{"\n"}{end}' 2>/dev/null)
                if [ -n "$PENDING_PVCS" ]; then
                  echo ""
                  echo "=== Events on PVCs not in Bound state ==="
                  for pvc in $PENDING_PVCS; do
                    echo ""
                    echo "############### pvc/$pvc ###############"
                    oc -n "$OC_NS" describe pvc "$pvc" 2>/dev/null | sed -n '/^Events:/,/^$/p'
                  done
                fi

                echo ""
                echo "=== StatefulSets in namespace ==="
                oc -n "$OC_NS" get sts -o wide 2>/dev/null || echo "(no StatefulSets)"

                # Namespace-level resource accounting — admission rejects
                # ("exceeded quota: compute-resources") and per-pod limit
                # squeezes (LimitRange's per-container max) cause the
                # mysterious "kraftcontroller pod availability never
                # satisfied" CFK condition message just as often as any
                # actual CFK fault. Surface both here so the data is
                # adjacent to the pod/STS state.
                echo ""
                echo "=== ResourceQuota usage (hard vs used) ==="
                oc -n "$OC_NS" describe resourcequota 2>&1 \
                  || echo "  (no ResourceQuota in namespace)"

                echo ""
                echo "=== LimitRange (per-pod / per-container admission constraints) ==="
                if oc -n "$OC_NS" get limitrange >/dev/null 2>&1; then
                  oc -n "$OC_NS" describe limitrange 2>&1
                else
                  echo "  (no LimitRange in namespace — pods admitted on the per-CR resource block alone)"
                fi

                # Service / Endpoints — quick scan for a Service with zero
                # Endpoints (selector mismatch, no pods Ready, port name
                # mismatch). The Kafka CR's "waiting for controller pod
                # availability" message often resolves down to "the
                # kraftcontroller Service has no Endpoints yet" when the
                # CR-level cluster-ready condition is True but the operator
                # is still waiting on the headless Service.
                echo ""
                echo "=== Services + Endpoints (catch zero-Endpoint Services) ==="
                oc -n "$OC_NS" get svc 2>/dev/null
                echo ""
                oc -n "$OC_NS" get endpoints 2>/dev/null \
                  | awk 'NR==1 || $2=="<none>" || NR<999' \
                  | head -30
                echo ""
                echo "(Look for any service with ENDPOINTS=<none>; that's the broken edge.)"

                # Dump the FULL StatefulSet yaml — no sed, no head, nothing
                # trimmed. We need to see the entire manifest CFK is
                # producing so we can review the vct AND every other
                # field together (storage class, annotations, owner refs,
                # spec.template, the whole shape). For kraftcontroller
                # and controlcenter the sts likely won't exist (rejected
                # at admission), which the dump will surface explicitly.
                echo ""
                echo "=== Full StatefulSet yaml (kafka, kraftcontroller, controlcenter, schemaregistry, connect, kafkarest) ==="
                for sts in kafka kraftcontroller controlcenter schemaregistry connect kafkarest; do
                  echo ""
                  echo "############### sts/$sts ###############"
                  if oc -n "$OC_NS" get sts "$sts" >/dev/null 2>&1; then
                    oc -n "$OC_NS" get sts "$sts" -o yaml
                  else
                    echo "(sts/$sts not found — likely rejected at admission or not yet created)"
                  fi
                done

                # Dump the FULL CR yaml for every CFK component — no sed,
                # no head, nothing trimmed. The live yaml from the API
                # server shows what survived admission (compare against
                # the source files in apps/confluent-platform/dev/ to
                # spot anything CRD pruning may have dropped).
                echo ""
                echo "=== Full CR yaml (kafka, kraftcontroller, controlcenter, schemaregistry, connect, kafkarest, kafkarestclass) ==="
                for kind_name in \
                    "kafka kafka" \
                    "kraftcontroller kraftcontroller" \
                    "controlcenter controlcenter" \
                    "schemaregistry schemaregistry" \
                    "connect connect" \
                    "kafkarestproxy kafkarest" \
                    "kafkarestclass default"; do
                  kind=${kind_name% *}; name=${kind_name#* }
                  echo ""
                  echo "############### $kind/$name ###############"
                  if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                    oc -n "$OC_NS" get "$kind" "$name" -o yaml
                  else
                    echo "($kind/$name not found in namespace)"
                  fi
                done

                # Focused conditions table — flattens each CR's
                # status.conditions into a one-line-per-condition view so
                # the cluster-ready / resources-ready / statefulset-available
                # truth is scannable without grepping the full yaml. Same
                # data as in the full-CR dump above, just easier to read.
                echo ""
                echo "=== CR status.conditions (focus: cluster-ready) ==="
                for kind_name in \
                    "kraftcontroller kraftcontroller" \
                    "kafka kafka" \
                    "schemaregistry schemaregistry" \
                    "connect connect" \
                    "kafkarestproxy kafkarest" \
                    "controlcenter controlcenter"; do
                  kind=${kind_name% *}; name=${kind_name#* }
                  echo ""
                  echo "--- $kind/$name ---"
                  if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                    printf "%-12s %-50s %-10s %-25s %s\n" "NAME" "TYPE" "STATUS" "REASON" "MESSAGE"
                    oc -n "$OC_NS" get "$kind" "$name" -o jsonpath='{range .status.conditions[*]}{.type}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.message}{"\n"}{end}' 2>&1 \
                      | awk -v name="$name" -F '\t' 'NF>=3 {printf "%-12s %-50s %-10s %-25s %s\n", name, $1, $2, $3, $4}' \
                      || echo "(no conditions array)"
                  else
                    echo "($kind/$name not found)"
                  fi
                done

                # Generation drift — `metadata.generation` vs `status.observedGeneration`. If they differ, the operator hasn't yet reconciled the latest spec, so any condition messages on the CR are stale (runbook A18).
                echo ""
                echo "=== CR generation drift (spec vs observed) ==="
                printf "%-24s %-12s %-12s %s\n" "KIND/NAME" "GENERATION" "OBSERVED" "VERDICT"
                for kind_name in \
                    "kraftcontroller kraftcontroller" \
                    "kafka kafka" \
                    "schemaregistry schemaregistry" \
                    "connect connect" \
                    "kafkarestproxy kafkarest" \
                    "controlcenter controlcenter"; do
                  kind=${kind_name% *}; name=${kind_name#* }
                  if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                    GEN=$(oc -n "$OC_NS" get "$kind" "$name" -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "?")
                    OBS=$(oc -n "$OC_NS" get "$kind" "$name" -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo "?")
                    [ -z "$GEN" ] && GEN="?"
                    [ -z "$OBS" ] && OBS="?"
                    if [ "$GEN" = "$OBS" ]; then verdict="reconciled"; else verdict="STALE — conditions reflect older spec"; fi
                    printf "%-24s %-12s %-12s %s\n" "$kind/$name" "$GEN" "$OBS" "$verdict"
                  fi
                done

                # Recent Events in the operator namespace — sorted by lastTimestamp. Surfaces what the operator pod itself is emitting (BackOff, FailedMount, OOMKilled, etc) that explains a stuck reconcile loop.
                OPNS_LOCAL=confluent-operator
                echo ""
                echo "=== Recent Events in $OPNS_LOCAL (last 30, sorted by lastTimestamp) ==="
                oc -n "$OPNS_LOCAL" get events --sort-by=.lastTimestamp 2>&1 | tail -31 || echo "(forbidden or namespace missing)"

                # Operator pod restart history — `lastState.terminated` shows why the pod restarted (OOMKilled / Error / Completed). High restartCount + recent terminated state = operator-crash-loop pattern (memory: project_fcb_cfk_operator_crash_loop).
                echo ""
                echo "=== Operator pod restart history ($OPNS_LOCAL) ==="
                oc -n "$OPNS_LOCAL" get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\n  restartCount="}{.status.containerStatuses[0].restartCount}{"\n  startedAt="}{.status.containerStatuses[0].state.running.startedAt}{"\n  lastTerminatedReason="}{.status.containerStatuses[0].lastState.terminated.reason}{"\n  lastTerminatedAt="}{.status.containerStatuses[0].lastState.terminated.finishedAt}{"\n  lastExitCode="}{.status.containerStatuses[0].lastState.terminated.exitCode}{"\n\n"}{end}' 2>&1 \
                  || echo "(forbidden)"

                # `oc explain` returns the CRD SCHEMA as the API server
                # sees it on THIS cluster — independent of any applied
                # CR. Use it as ground truth for whether a field exists
                # in the installed CRD (different from our vendored
                # chart CRDs, which may be at a different patch level).
                # The user (Rick) explicitly asked for this — it answers
                # "did the API server prune my field, or did CFK ignore
                # it after preserving it?" directly, without inference.
                echo ""
                echo "=== oc explain — CRD schema as the cluster sees it ==="
                for query in \
                    "kraftcontroller" \
                    "kraftcontroller.spec" \
                    "kraftcontroller.spec.volumeClaimTemplates" \
                    "kraftcontroller.spec.storageClass" \
                    "kraftcontroller.spec.podTemplate" \
                    "kraftcontroller.spec.listeners" \
                    "kraftcontroller.spec.listeners.controller" \
                    "kafka" \
                    "kafka.spec" \
                    "kafka.spec.volumeClaimTemplates" \
                    "kafka.spec.storageClass" \
                    "kafka.spec.dependencies" \
                    "kafka.spec.dependencies.kRaftController" \
                    "kafka.spec.dependencies.kRaftController.controllerListener" \
                    "kafka.spec.listeners" \
                    "kafka.spec.listeners.internal" \
                    "kafka.spec.listeners.external" \
                    "kafka.spec.listeners.external.authentication" \
                    "kafka.spec.listeners.external.authentication.oauthSettings" \
                    "kafka.spec.listeners.custom" \
                    "kafka.spec.services" \
                    "kafka.spec.services.mds" \
                    "kafka.spec.services.mds.provider" \
                    "kafka.spec.services.mds.provider.oauth" \
                    "kafka.spec.services.mds.provider.oauth.configurations" \
                    "kafka.spec.services.mds.provider.oauth.clientCredentials" \
                    "kafka.spec.services.kafkaRest" \
                    "kafka.spec.services.observer" \
                    "kafka.spec.authorization" \
                    "kafka.spec.authorization.type" \
                    "kafka.spec.identityProvider" \
                    "kafka.spec.identityProvider.file" \
                    "kafka.spec.tls" \
                    "kafka.spec.fips" \
                    "schemaregistry" \
                    "schemaregistry.spec" \
                    "schemaregistry.spec.tls" \
                    "schemaregistry.spec.dependencies" \
                    "schemaregistry.spec.dependencies.kafka" \
                    "schemaregistry.spec.dependencies.kafka.authentication" \
                    "schemaregistry.spec.dependencies.kafka.tls" \
                    "schemaregistry.spec.dependencies.mds" \
                    "schemaregistry.spec.authentication" \
                    "schemaregistry.spec.authorization" \
                    "controlcenter" \
                    "controlcenter.spec" \
                    "controlcenter.spec.volumeClaimTemplates" \
                    "controlcenter.spec.storageClass"; do
                  echo ""
                  echo "############### oc explain $query ###############"
                  oc explain "$query" 2>&1 || true
                done

                # The CFK operator and the Apache Flink operator both live in the
                # `confluent-operator` namespace at FCB. Probe it by name — the
                # previous wildcard `oc get pods -A | grep confluent-operator`
                # approach silently returned empty when the namespace-scoped
                # service account doesn't have cluster-wide pod-list, which
                # erased every signal we had about operator health (D1).
                OPNS=confluent-operator
                echo ""
                echo "=== CFK operator namespace probe ($OPNS) ==="
                echo "--- Deployments ---"
                oc -n "$OPNS" get deploy -o wide 2>&1 || echo "(forbidden or namespace missing)"
                echo ""
                echo "--- Pods (with restart counts + node) ---"
                oc -n "$OPNS" get pods -o wide 2>&1 || echo "(forbidden or namespace missing)"
                echo ""
                echo "--- Pod readiness + restartCount breakdown ---"
                oc -n "$OPNS" get pods -o jsonpath='{range .items[*]}{.metadata.name}{"  phase="}{.status.phase}{"  "}{range .status.containerStatuses[*]}{.name}=ready:{.ready}/restarts:{.restartCount} {end}{"\n"}{end}' 2>&1 \
                  || echo "(forbidden)"
                echo ""
                echo "--- Services ---"
                oc -n "$OPNS" get svc 2>&1 || echo "(forbidden)"
                echo ""
                echo "--- Endpoints (catch zero-endpoint services — webhook services break here) ---"
                oc -n "$OPNS" get endpoints 2>&1 || echo "(forbidden)"

                echo ""
                echo "=== CFK operator pod logs (last 400 lines, filtered) ==="
                # Iterate every pod in confluent-operator and tail their logs.
                # Filter for the reconcile signals we care about. Don't pre-grep
                # for `confluent-operator` in the pod name — the Apache Flink
                # operator pod name doesn't carry it, and we want its logs too
                # because the CMF→FlinkDeployment apply failures observed in the
                # CMF tail trace back to it.
                OP_PODS=$(oc -n "$OPNS" get pods -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
                if [ -z "$OP_PODS" ]; then
                  echo "(no pods found in $OPNS — namespace empty, missing, or list denied)"
                else
                  for p in $OP_PODS; do
                    echo ""
                    echo "############### $OPNS/$p ###############"
                    oc -n "$OPNS" logs "$p" --tail=400 --all-containers=true 2>&1 \
                      | grep -iE 'error|warn|reconcile|apply|webhook|timeout|context deadline|kafka|kraft|kraftcontroller|dah-flink' \
                      | tail -80 \
                      || echo "(no matching log lines)"
                  done
                fi

                # Webhook services with empty Endpoints are the most common
                # cause of CR-apply timeouts ("context deadline exceeded") that
                # have no event trail on the CR itself — the kube-apiserver
                # blocks on a Pre-/Post- webhook call to a Service with no
                # backing pods and finally times out. Filter the webhook
                # configs down by name pattern (confluent/cfk/flink/kafka) AND
                # by clientConfig.service.namespace, then cross-check those
                # services against the Endpoints in the operator namespace.
                # Python parse beats yaml-grep here — the indentation pattern
                # varies between OpenShift releases and a brittle filter would
                # silently regress on the next cluster upgrade.
                echo ""
                echo "=== Webhooks targeting $OPNS namespace (apply-timeout suspects) ==="
                for whkind in mutatingwebhookconfiguration validatingwebhookconfiguration; do
                  echo ""
                  echo "--- $whkind entries with clientConfig.service.namespace=$OPNS ---"
                  oc get "$whkind" -o json 2>/dev/null \
                    | python3 -c "
                import json, sys
                try:
                    data = json.load(sys.stdin)
                except Exception as e:
                    print('(could not parse — likely forbidden cluster-scoped read: %s)' % e); sys.exit(0)
                hits = 0
                for item in data.get('items', []):
                    cfg_name = item['metadata']['name']
                    for wh in item.get('webhooks', []):
                        svc = (wh.get('clientConfig') or {}).get('service') or {}
                        if svc.get('namespace') == '$OPNS':
                            hits += 1
                            print('  config=%s' % cfg_name)
                            print('    webhook=%s' % wh.get('name'))
                            print('    service=%s/%s:%s' % (svc.get('namespace'), svc.get('name'), svc.get('port', 443)))
                            print('    timeoutSeconds=%s  failurePolicy=%s  sideEffects=%s' % (
                                wh.get('timeoutSeconds'), wh.get('failurePolicy'), wh.get('sideEffects')))
                            rules = wh.get('rules') or []
                            for r in rules:
                                print('    rule: groups=%s versions=%s ops=%s resources=%s scope=%s' % (
                                    r.get('apiGroups'), r.get('apiVersions'),
                                    r.get('operations'), r.get('resources'), r.get('scope')))
                if hits == 0:
                    print('  (no webhook found whose clientConfig.service.namespace=$OPNS)')
                "
                done
                echo ""
                echo "--- Webhook-targeted services in $OPNS — Endpoints cross-check ---"
                # Side-by-side: every Service in $OPNS plus its Endpoints. A
                # service that webhooks point at with zero Endpoints is the
                # smoking gun (matches "no endpoints available for service X"
                # in CMF tail at line ~1861 of the prior diagnostic dump).
                echo "Services in $OPNS:"
                oc -n "$OPNS" get svc 2>&1 || echo "(forbidden)"
                echo ""
                echo "Endpoints in $OPNS (look for zero-address subsets):"
                oc -n "$OPNS" get endpoints -o jsonpath='{range .items[*]}{.metadata.name}{"  subsets="}{range .subsets[*]}addrs=[{range .addresses[*]}{.ip},{end}] ports=[{range .ports[*]}{.port}/{.protocol},{end}] {end}{"\n"}{end}' 2>&1 \
                  || echo "(forbidden)"

                # The narrow probe above only catches webhooks pointing AT $OPNS,
                # but the Kafka CR's status condition message "Timeout: request
                # did not complete within requested timeout - context deadline
                # exceeded" comes from the K8s API server when an admission
                # webhook in the apply path times out. The operator applies
                # downstream resources for the Kafka CR (StatefulSet, Service,
                # ConfigMap, Secret). ANY webhook that matches those resource
                # kinds will fire — regardless of where its backend Service
                # lives — and can stall the apply if its endpoints are gone or
                # its constraint is slow.
                echo ""
                echo "=== ALL cluster webhooks that could fire on a Kafka-CR apply (broader probe) ==="
                # Rule shape we care about: rules.apiGroups intersects
                # {"", "apps", "platform.confluent.io"} AND rules.resources
                # intersects {kafkas, statefulsets, services, configmaps,
                # secrets, persistentvolumeclaims} AND operations contains
                # CREATE or UPDATE. Anything else can't block the Kafka
                # reconcile and is filtered out to keep the dump readable.
                for whkind in mutatingwebhookconfiguration validatingwebhookconfiguration; do
                  echo ""
                  echo "--- $whkind entries matching Kafka-CR apply path ---"
                  oc get "$whkind" -o json 2>/dev/null \
                    | python3 -c "
                import json, sys
                try:
                    data = json.load(sys.stdin)
                except Exception as e:
                    print('(could not parse: %s)' % e); sys.exit(0)
                TARGET_RESOURCES = {'kafkas','statefulsets','services','configmaps','secrets','persistentvolumeclaims','*'}
                TARGET_GROUPS = {'', 'apps', 'platform.confluent.io', '*'}
                hits = 0
                for item in data.get('items', []):
                    cfg_name = item['metadata']['name']
                    for wh in item.get('webhooks', []):
                        matched_rule = None
                        for r in (wh.get('rules') or []):
                            groups = set(r.get('apiGroups') or [])
                            resources = set(r.get('resources') or [])
                            ops = set(r.get('operations') or [])
                            if (groups & TARGET_GROUPS) and (resources & TARGET_RESOURCES) and ({'CREATE','UPDATE','*'} & ops):
                                matched_rule = r
                                break
                        if not matched_rule:
                            continue
                        hits += 1
                        svc = (wh.get('clientConfig') or {}).get('service') or {}
                        url = (wh.get('clientConfig') or {}).get('url')
                        ns_sel = wh.get('namespaceSelector') or {}
                        print('  config=%s' % cfg_name)
                        print('    webhook=%s' % wh.get('name'))
                        if svc:
                            print('    service=%s/%s:%s path=%s' % (svc.get('namespace'),svc.get('name'),svc.get('port',443),svc.get('path')))
                        if url:
                            print('    url=%s' % url)
                        print('    timeout=%ss  failurePolicy=%s  sideEffects=%s' % (
                            wh.get('timeoutSeconds'), wh.get('failurePolicy'), wh.get('sideEffects')))
                        print('    matched-rule: groups=%s resources=%s ops=%s scope=%s' % (
                            matched_rule.get('apiGroups'), matched_rule.get('resources'),
                            matched_rule.get('operations'), matched_rule.get('scope')))
                        if ns_sel:
                            print('    namespaceSelector=%s' % json.dumps(ns_sel))
                if hits == 0:
                    print('  (no webhook found whose rules cover Kafka CR apply-path resources)')
                "
                done

                # For every webhook flagged above, the next question is whether
                # its backend Service actually has Endpoints. Since the SA can
                # list cluster-scoped MWC/VWC but is typically denied listing
                # endpoints in other namespaces (we already see this for
                # confluent-operator), try anyway per webhook namespace and
                # report which ones returned zero addresses or forbidden.
                echo ""
                echo "--- Endpoint reachability for webhook backend services flagged above ---"
                oc get mutatingwebhookconfiguration validatingwebhookconfiguration -o json 2>/dev/null \
                  | python3 -c "
                import json, sys, subprocess
                try:
                    data = json.load(sys.stdin)
                except Exception as e:
                    print('(could not parse: %s)' % e); sys.exit(0)
                TARGET_RESOURCES = {'kafkas','statefulsets','services','configmaps','secrets','persistentvolumeclaims','*'}
                TARGET_GROUPS = {'', 'apps', 'platform.confluent.io', '*'}
                seen = set()
                for item in data.get('items', []):
                    for wh in item.get('webhooks', []):
                        for r in (wh.get('rules') or []):
                            groups = set(r.get('apiGroups') or [])
                            resources = set(r.get('resources') or [])
                            ops = set(r.get('operations') or [])
                            if not ((groups & TARGET_GROUPS) and (resources & TARGET_RESOURCES) and ({'CREATE','UPDATE','*'} & ops)):
                                continue
                            svc = (wh.get('clientConfig') or {}).get('service') or {}
                            ns = svc.get('namespace')
                            nm = svc.get('name')
                            if not ns or not nm:
                                break
                            key = (ns, nm)
                            if key in seen:
                                break
                            seen.add(key)
                            print('  endpoint check: %s/%s' % (ns, nm))
                            r = subprocess.run(['oc','-n',ns,'get','endpoints',nm,'-o','jsonpath={range .subsets[*]}addresses=[{range .addresses[*]}{.ip},{end}] ports=[{range .ports[*]}{.port}/{.protocol},{end}]{end}'],
                                               capture_output=True, text=True)
                            out = (r.stdout or '').strip() or '(empty subsets — ZERO ENDPOINTS, this webhook will time out)'
                            err = (r.stderr or '').strip()
                            if r.returncode != 0:
                                print('    %s' % (err or 'forbidden'))
                            else:
                                print('    %s' % out)
                            break
                "

                # When the operator silently stops touching a CR (Kafka CR in
                # dev sat 8 days without a status update while KRaftController
                # kept reconciling), the only on-cluster record of who-wrote-
                # what-and-when is metadata.managedFields. Compact view of each
                # entry's manager + operation + subresource + time is enough to
                # spot a reconciler that's gone cold.
                echo ""
                echo "=== Kafka + KRaftController managedFields timeline (who/what/when) ==="
                for kind_name in "kafka kafka" "kraftcontroller kraftcontroller"; do
                  kind=${kind_name% *}; name=${kind_name#* }
                  echo ""
                  echo "--- $kind/$name ---"
                  if oc -n "$OC_NS" get "$kind" "$name" >/dev/null 2>&1; then
                    oc -n "$OC_NS" get "$kind" "$name" -o jsonpath='{range .metadata.managedFields[*]}{.time}  manager={.manager}  op={.operation}  sub={.subresource}{"\n"}{end}' 2>&1
                  else
                    echo "(CR not found)"
                  fi
                done

                # Kafka reconciler in dah-flink-dev sat 8 days with cluster-ready=False;
                # operator log shows every loop dials
                # kraftcontroller-{0,1,2}.kraftcontroller.dah-flink-dev:7777/jolokia/
                # and gets "i/o timeout". confluent-operator namespace is RBAC-blocked
                # from this SA, so we probe :7777 from inside dah-flink-dev (where the
                # SA has access) to separate "jolokia not listening" from "operator-
                # namespace can't egress to dah-flink-dev pod IPs". Uses pure bash
                # /dev/tcp so we don't depend on curl/ss/netstat being in the image.
                echo ""
                echo "=== kraftcontroller :7777 jolokia reachability probe ==="
                for i in 0 1 2; do
                  pod="kraftcontroller-$i"
                  echo ""
                  echo "--- $pod local listen (from inside the pod) ---"
                  if oc -n "$OC_NS" get pod "$pod" >/dev/null 2>&1; then
                    oc -n "$OC_NS" exec "$pod" -c kraftcontroller -- bash -c '
                      if (exec 5<>/dev/tcp/127.0.0.1/7777) 2>/dev/null; then
                        echo "LOCAL 7777 OPEN"
                        exec 5<&-
                      else
                        echo "LOCAL 7777 CLOSED"
                      fi
                      if (exec 5<>/dev/tcp/127.0.0.1/7203) 2>/dev/null; then
                        echo "LOCAL 7203 OPEN (jmx)"
                        exec 5<&-
                      else
                        echo "LOCAL 7203 CLOSED (jmx)"
                      fi
                    ' 2>&1 || echo "(exec failed)"
                  else
                    echo "(pod not found)"
                  fi
                done

                # Cross-pod reachability: from cmf-service (in the same namespace),
                # try to reach kraftcontroller-0:7777. If LOCAL is OPEN but this is
                # CLOSED, the problem is dah-flink-dev ingress; if both OPEN, the
                # operator-namespace egress is the only remaining suspect.
                echo ""
                echo "--- intra-namespace probe (from cmf-service pod) ---"
                CMF_POD=$(oc -n "$OC_NS" get pods -l app.kubernetes.io/name=confluent-manager-for-apache-flink -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                if [ -n "$CMF_POD" ]; then
                  oc -n "$OC_NS" exec "$CMF_POD" -- bash -c '
                    for target in kraftcontroller-0 kraftcontroller-1 kraftcontroller-2; do
                      host="${target}.kraftcontroller.dah-flink-dev.svc.cluster.local"
                      if (exec 5<>/dev/tcp/${host}/7777) 2>/dev/null; then
                        echo "INTRA-NS ${target}:7777 OPEN"
                        exec 5<&-
                      else
                        echo "INTRA-NS ${target}:7777 CLOSED"
                      fi
                    done
                  ' 2>&1 || echo "(exec failed)"
                else
                  echo "(no cmf pod found — skipping cross-pod probe)"
                fi

                # =====================================================================
                # CMF (Confluent Manager for Apache Flink)
                # =====================================================================
                # CMF is deployed as a standalone Helm chart (not via CFK CRDs) into
                # the same namespace as the Confluent Platform CRs. Diagnostics below
                # are deliberately self-contained: every probe handles the absent /
                # crashlooping case so the section still produces useful output when
                # the install has never succeeded.

                echo ""
                echo "================================================================"
                echo "=== CMF diagnostics ============================================"
                echo "================================================================"

                # CMF.1 — Helm release state.
                # Try `helm status` first (richer output). If helm isn't on PATH or
                # the release isn't found, fall back to listing the Helm release
                # Secrets directly (sh.helm.release.v1.confluent-cmf.v<n>), which
                # K8s holds even without helm CLI.
                echo ""
                echo "=== CMF.1  Helm release state (confluent-cmf) ==="
                if command -v helm >/dev/null 2>&1; then
                  helm status confluent-cmf -n "$OC_NS" 2>&1 | head -40 \
                    || echo "  (helm status failed — release may not be installed)"
                else
                  echo "  (helm CLI not on PATH — listing release Secrets instead)"
                fi
                echo ""
                echo "--- Helm release Secrets (most recent first) ---"
                oc -n "$OC_NS" get secrets \
                  --field-selector type=helm.sh/release.v1 \
                  --sort-by=.metadata.creationTimestamp 2>/dev/null \
                  | grep -E 'NAME|confluent-cmf' | tail -10 \
                  || echo "  (no helm release Secrets found)"

                # CMF.2 — Prereq Secrets present/missing matrix (CMF-specific).
                # The CFK matrix above includes cmf-encryption-key + cmf-db-credentials
                # but CMF also relies on cmf-tls (TLS Secret for the REST endpoint —
                # cmf.yaml fails fast if it's missing) and confluent-license (shared
                # with CFK Kafka but consumed in raw-JWT form by CMF per LESSONS_LEARNED
                # C1).
                echo ""
                echo "=== CMF.2  Prereq Secrets — present/missing matrix ==="
                for s in confluent-license cmf-db-credentials cmf-encryption-key cmf-tls; do
                  if oc -n "$OC_NS" get secret "$s" >/dev/null 2>&1; then
                    AGE=$(oc -n "$OC_NS" get secret "$s" -o jsonpath='{.metadata.creationTimestamp}')
                    TYPE=$(oc -n "$OC_NS" get secret "$s" -o jsonpath='{.type}')
                    KEYS=$(oc -n "$OC_NS" get secret "$s" -o jsonpath='{.data}' 2>/dev/null \
                      | python3 -c "import json,sys; d=json.load(sys.stdin); print(','.join(sorted(d.keys())))" 2>/dev/null)
                    printf "  %-25s PRESENT  type=%-22s keys=[%s]  created=%s\n" "$s" "$TYPE" "$KEYS" "$AGE"
                  else
                    printf "  %-25s MISSING\n" "$s"
                  fi
                done

                # CMF.3 — cmf-encryption-key SHAPE validation.
                # This is the single highest-signal CMF check. CMF accepts only
                # 128-bit (16-byte) or 256-bit (32-byte) raw keys, stored as
                # base64 in Secret.data.key. The 2026-06-18 UAT install was
                # blocked for hours by a double-base64-encoded key (44 raw bytes
                # = 352 bits). Decoding once here mirrors exactly what CMF does
                # at boot, so the output is a hard yes/no on whether
                # encryptionConfigInitializer will pass.
                # See: runbook/LESSONS_LEARNED.md C5.
                echo ""
                echo "=== CMF.3  cmf-encryption-key byte-length validation ==="
                KEY_B64=$(oc -n "$OC_NS" get secret cmf-encryption-key \
                  -o jsonpath='{.data.key}' 2>/dev/null)
                if [ -z "$KEY_B64" ]; then
                  echo "  MISSING — Secret cmf-encryption-key not present or has no .data.key field"
                  echo "  Action: set the *-cmf-encryption-key Azure DevOps variable to the output"
                  echo "          of 'openssl rand -base64 32' and re-run the cmf pipeline."
                else
                  # K8s stores .data.* base64-encoded for transport; decode once to
                  # see exactly the bytes CMF receives at read time.
                  DECODED_LEN=$(printf '%s' "$KEY_B64" | base64 -d 2>/dev/null | wc -c | tr -d ' ')
                  BITS=$((DECODED_LEN * 8))
                  if [ "$DECODED_LEN" = "16" ] || [ "$DECODED_LEN" = "32" ]; then
                    echo "  OK — cmf-encryption-key decodes to $DECODED_LEN raw bytes (${BITS}-bit AES)."
                    echo "       CMF's encryptionConfigInitializer will accept this."
                  else
                    echo "  PROBLEM — cmf-encryption-key decodes to $DECODED_LEN bytes (${BITS} bits)."
                    echo "  CMF accepts only 16 (AES-128) or 32 (AES-256) raw bytes."
                    echo "  Symptom at boot: 'Fatal exception: The provided encryption key is of ${BITS} bits'."
                    echo "  Most common cause: the variable value got base64-encoded twice (e.g. via"
                    echo "  'oc create secret --from-literal=key=\$(openssl rand -base64 32)'). The"
                    echo "  cmf.yaml pipeline now branches off create_labeled_secret for this Secret —"
                    echo "  see commit 343a93f and runbook/LESSONS_LEARNED.md C5."
                  fi
                fi

                # CMF.4 — Deployment + Pod state. CMF runs as a single Deployment
                # named `cmf` (Helm chart's default release name). Replicas, ready
                # count, restart count, and lastState.terminated tell us in one
                # screen whether the pod ever got past init.
                echo ""
                echo "=== CMF.4  Deployment + Pod state ==="
                if oc -n "$OC_NS" get deploy cmf >/dev/null 2>&1; then
                  oc -n "$OC_NS" get deploy cmf -o wide 2>/dev/null
                  echo ""
                  echo "--- ReplicaSet history (most recent on top) ---"
                  oc -n "$OC_NS" get rs -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                    --sort-by=.metadata.creationTimestamp -o wide 2>/dev/null | tac
                  echo ""
                  echo "--- Pod state ---"
                  oc -n "$OC_NS" get pods -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                    -o wide 2>/dev/null
                  echo ""
                  echo "--- Container restart history (CMF pod) ---"
                  oc -n "$OC_NS" get pods -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                    -o jsonpath='{range .items[*]}POD={.metadata.name}{"\n"}{range .status.containerStatuses[*]}  container={.name} restartCount={.restartCount} lastExit={.lastState.terminated.exitCode} lastReason={.lastState.terminated.reason} lastFinishedAt={.lastState.terminated.finishedAt}{"\n"}{end}{end}' 2>/dev/null
                else
                  echo "  Deployment/cmf not found — Helm install never completed (or chart name differs)."
                fi

                # CMF.5 — image tag.
                # FCB requires 2.3.0-fcb-preview-2 (stock 2.3.0 has known bugs at FCB —
                # see [[project-cmf-image-tag]] memory). Surface the tag in use vs the
                # expected one so a drift is immediately visible.
                echo ""
                echo "=== CMF.5  Image tag (vs FCB-required 2.3.0-fcb-preview-2) ==="
                IMG=$(oc -n "$OC_NS" get deploy cmf \
                  -o jsonpath='{.spec.template.spec.containers[?(@.name=="cmf")].image}' 2>/dev/null)
                if [ -z "$IMG" ]; then
                  # Fall back to whatever's listed as the main container if the name
                  # doesn't match `cmf`.
                  IMG=$(oc -n "$OC_NS" get deploy cmf \
                    -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)
                fi
                if [ -z "$IMG" ]; then
                  echo "  (Deployment/cmf not found — cannot read image)"
                else
                  echo "  Running image: $IMG"
                  case "$IMG" in
                    *2.3.0-fcb-preview-2*) echo "  OK — matches FCB-required tag.";;
                    *)                     echo "  WARNING — does NOT contain '2.3.0-fcb-preview-2'. Stock 2.3.0 has known bugs at FCB; verify with Confluent before promoting.";;
                  esac
                fi

                # CMF.6 — namespace-scoped RBAC (ServiceAccount + Role + RoleBinding).
                # CMF at FCB runs namespace-scoped against dah-flink-<env>, NOT
                # cluster-wide (per [[project-cmf-namespace-scoped]]). The Helm chart
                # emits Role/RoleBinding when `namespaced=true` is set; if it ever
                # emits ClusterRole/ClusterRoleBinding instead, that's the chart
                # rendering the wrong scope and the install will fail Gatekeeper
                # admission for cluster-scoped SA wiring.
                echo ""
                echo "=== CMF.6  Namespace-scoped RBAC (SA + Role + RoleBinding) ==="
                echo "--- ServiceAccount ---"
                oc -n "$OC_NS" get sa -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>/dev/null \
                  || echo "  (no SA matched)"
                echo ""
                echo "--- Role (namespace-scoped — expected) ---"
                oc -n "$OC_NS" get role -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>/dev/null \
                  || echo "  (no Role matched)"
                echo "--- RoleBinding ---"
                oc -n "$OC_NS" get rolebinding -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>/dev/null \
                  || echo "  (no RoleBinding matched)"
                echo ""
                echo "--- ClusterRole / ClusterRoleBinding (should NOT exist for namespaced install) ---"
                oc get clusterrole -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>/dev/null \
                  | grep -v '^NAME' | head -5
                oc get clusterrolebinding -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>/dev/null \
                  | grep -v '^NAME' | head -5
                echo "  (above two lists should be EMPTY for a namespaced install)"

                # CMF.7 — cmf-config.yaml ConfigMap contents.
                # This is the rendered Helm output of values.yaml + chart templates.
                # If something authored in apps/confluent-cmf/<env>/values.yaml didn't
                # land in cmf-config.yaml, the chart silently dropped the field or
                # the helm --set overrides clobbered it. The container reads this
                # file at startup (see dump.txt line 1: '/opt/config/cmf-config.yaml').
                echo ""
                echo "=== CMF.7  ConfigMap cmf-config.yaml (rendered) ==="
                # CFK Helm chart names this ConfigMap 'cmf-config' or 'confluent-cmf-config'
                # depending on chart version. Try both.
                for cm in cmf-config confluent-cmf-config cmf; do
                  if oc -n "$OC_NS" get cm "$cm" >/dev/null 2>&1; then
                    echo "--- ConfigMap/$cm ---"
                    oc -n "$OC_NS" get cm "$cm" -o jsonpath='{.data}' 2>/dev/null \
                      | python3 -c "import json,sys; d=json.load(sys.stdin); [print(f'=== {k} ===\n{v}\n') for k,v in d.items()]" 2>/dev/null
                    break
                  fi
                done

                # CMF.8 — Service + Endpoints. Zero-Endpoint Service means the
                # selector doesn't match a Ready pod — the CMF pod is unhealthy
                # or the chart's labels drifted from the Service selector.
                echo ""
                echo "=== CMF.8  Service + Endpoints ==="
                oc -n "$OC_NS" get svc -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>/dev/null \
                  || echo "  (no CMF Service matched)"
                echo ""
                oc -n "$OC_NS" get endpoints -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>/dev/null \
                  || echo "  (no CMF Endpoints matched)"
                echo "  (Endpoints <none> means the Service selector matches no Ready pod.)"

                # CMF.9 — DB reachability from inside the pod.
                # CMF connects to SQL Server (per [[project-fcb-infrastructure]] and
                # the dump.txt JDBC URL). If DNS or TCP to port 3085 is broken, CMF
                # boot hangs at the Flyway migration step with cryptic
                # 'Could not get Connection for extracting meta-data'. This probe
                # uses bash's built-in /dev/tcp redirect (no nc/curl required) and
                # uses getent hosts to confirm DNS resolves.
                echo ""
                echo "=== CMF.9  DB reachability from inside the cmf pod ==="
                CMF_POD=$(oc -n "$OC_NS" get pods -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                if [ -z "$CMF_POD" ]; then
                  echo "  (no CMF pod found — cannot probe from inside)"
                else
                  # Pull the JDBC URL from the rendered ConfigMap so we test the
                  # *actual* configured host, not a hard-coded guess.
                  JDBC_URL=$(oc -n "$OC_NS" get cm cmf-config -o jsonpath='{.data.cmf-config\.yaml}' 2>/dev/null \
                    | grep -E '^\s*url:' | head -1 | sed -E 's/.*url:\s*"?([^"]+).*/\1/')
                  if [ -z "$JDBC_URL" ]; then
                    JDBC_URL=$(oc -n "$OC_NS" get cm confluent-cmf-config -o jsonpath='{.data.cmf-config\.yaml}' 2>/dev/null \
                      | grep -E '^\s*url:' | head -1 | sed -E 's/.*url:\s*"?([^"]+).*/\1/')
                  fi
                  DB_HOST=$(printf '%s' "$JDBC_URL" | sed -E 's#jdbc:sqlserver://([^:;]+).*#\1#')
                  DB_PORT=$(oc -n "$OC_NS" get cm cmf-config -o jsonpath='{.data.cmf-config\.yaml}' 2>/dev/null \
                    | grep -E '^\s*port:' | head -1 | awk '{print $2}')
                  [ -z "$DB_PORT" ] && DB_PORT=3085
                  if [ -n "$DB_HOST" ]; then
                    echo "  Probing $DB_HOST:$DB_PORT from $CMF_POD..."
                    oc -n "$OC_NS" exec "$CMF_POD" -- bash -c "getent hosts $DB_HOST 2>/dev/null || echo 'DNS lookup FAILED'" 2>&1 | head -3
                    oc -n "$OC_NS" exec "$CMF_POD" -- bash -c "timeout 5 bash -c '</dev/tcp/$DB_HOST/$DB_PORT' 2>&1 && echo 'TCP OK ($DB_HOST:$DB_PORT reachable)' || echo 'TCP probe FAILED — check NetworkPolicy / firewall / SQL Server listening'" 2>&1 | head -3
                  else
                    echo "  (could not extract DB host from ConfigMap; skipping probe)"
                  fi
                fi

                # CMF.10 — pod log tail filtered for boot markers.
                # Greps for the specific Spring/CMF log lines that mark each boot
                # milestone: encryption init pass/fail, Flyway DB schema apply,
                # Tomcat startup, the started-application banner, and any fatal
                # exception. Tighter filter than the generic component-pod-logs
                # block above (which only handles confluent-platform-labeled pods,
                # not CMF).
                echo ""
                echo "=== CMF.10  Pod log tail filtered for boot markers (last 200 matched lines) ==="
                if [ -n "$CMF_POD" ]; then
                  oc -n "$OC_NS" logs "$CMF_POD" --tail=2000 2>&1 \
                    | grep -iE 'error|fatal|exception|caused by|encryptionConfigInitializer|flyway|migrat|tomcat|Started CmfApplication|listener|jdbc|authentication|oauth|jwks' \
                    | tail -200 \
                    || echo "  (no matching log lines)"
                else
                  echo "  (no CMF pod — cannot fetch logs)"
                fi

                # CMF.11 — REST API health probe from inside the pod.
                # If the pod is Ready, the REST endpoint listens on https://localhost:8080.
                # The endpoint shape varies by build — try a few common probes and report
                # the first non-empty response. With OAuth disabled (current uat posture)
                # an unauthenticated GET to / should at least return a 401/403/200, which
                # is enough to confirm Tomcat is up.
                echo ""
                echo "=== CMF.11  REST API health probe (https://localhost:8080) ==="
                if [ -n "$CMF_POD" ]; then
                  for path in /actuator/health /cmf/api/v1/environments /; do
                    echo "--- GET $path ---"
                    oc -n "$OC_NS" exec "$CMF_POD" -- bash -c \
                      "curl -sk --max-time 5 -o /tmp/r -w 'HTTP %{http_code} (%{size_download}B in %{time_total}s)\n' https://localhost:8080$path && head -c 400 /tmp/r ; echo" 2>&1 \
                      | head -8 \
                      || echo "  (probe failed)"
                    echo ""
                  done
                else
                  echo "  (no CMF pod — cannot probe REST endpoint)"
                fi

                # CMF.12 — recent Warning events scoped to CMF objects.
                # The generic Warning event block above lists every Warning in the
                # namespace; this filters to CMF Deployment / Pod / ConfigMap /
                # Secret events so the CMF-side noise is isolated.
                echo ""
                echo "=== CMF.12  Recent events scoped to CMF objects (last 20) ==="
                oc -n "$OC_NS" get events --sort-by=.lastTimestamp 2>/dev/null \
                  | awk 'NR==1 || /cmf|confluent-manager-for-apache-flink/' \
                  | tail -20 \
                  || echo "  (no CMF-tagged events)"

                echo ""
                echo "=== End of diagnostics ==="
                # Always succeed.
                exit 0
            env:
              OC_NS: $(openshift-namespace)
