# Pipeline:  diagnostics
# Purpose:   Read-only dump of the CFK-managed Confluent Platform cluster
#            state in dah-flink-<env>: ESO-managed Secrets inventory,
#            Secrets stuck in Terminating, key prerequisite Secrets,
#            CR auth spec, recent Warning events, full CR + StatefulSet
#            yaml, status.conditions table, `oc explain` against the
#            live CRD schema, and the last 200 lines of the operator
#            log filtered for errors. Touches nothing — `set +e` and a
#            trailing `exit 0` keep it strictly observational.
# Author:    Ayele Admassu
# Created:   2026-06-17
#
# Was previously embedded in confluent-platform.yaml under
# action=diagnostics (and ran automatically as the first step of
# action=install-or-update). Moved here so it can be invoked standalone
# — and so install-or-update's startup is faster when you don't need
# the dump.
#
# Variable Group: kafka-openshift-credentials-<env>
#   openshift-service-account-name  — service account username
#   openshift-service-account-pwd   — service account password (secret)
#   openshift-api               — OpenShift API server URL
#   openshift-namespace         — target namespace (dah-flink-<env>)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd, dr]

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: kafka-openshift-credentials-uat
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: Diagnostics
    displayName: "Confluent Platform diagnostics (${{ parameters.environment }})"
    jobs:
      - job: Diagnostics
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Logging in to OpenShift at $OC_API..."
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                echo ""
                echo "=== Logged-in user ==="
                oc whoami

                echo ""
                echo "=== Switching to namespace $OC_NS ==="
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - template: templates/diagnostics-step.yaml
