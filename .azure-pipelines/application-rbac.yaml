# Manage application-onboarding ConfluentRolebinding resources.
#
# The environment's onboarding-rolebindings.yaml is the only source of truth.
# This pipeline does not render principals, replace placeholders, or call MDS
# directly. Every committed principal, role, and cluster scope is applied as-is.

trigger: none

parameters:
  - name: action
    displayName: "Action"
    type: string
    default: apply
    values:
      - apply
      - delete

  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values:
      - dev
      - qa
      - uat-p
      - uat-s
      - prd
      - dr

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat-p') }}:
    - group: kafka-openshift-credentials-uat-p
  - ${{ if eq(parameters.environment, 'uat-s') }}:
    - group: kafka-openshift-credentials-uat-s
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr

stages:
  - stage: ManageApplicationRBAC
    displayName: "${{ parameters.action }} application RBAC (${{ parameters.environment }})"
    jobs:
      - job: ManageApplicationRBAC
        displayName: "Manage application-onboarding role bindings"
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify
                oc project "$OC_NS"
                echo "Logged in as $(oc whoami); namespace=$OC_NS"
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-namespace)

          - task: Bash@3
            displayName: "${{ parameters.action }} application-onboarding RBAC"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                case "$TARGET_ENV" in
                  dev)         EXPECTED_NS="dah-flink-dev" ;;
                  qa)          EXPECTED_NS="dah-flink-qa" ;;
                  uat-p|uat-s) EXPECTED_NS="dah-flink-uat" ;;
                  prd|dr)      EXPECTED_NS="dah-flink-prod" ;;
                  *) echo "FATAL: unsupported environment: $TARGET_ENV"; exit 1 ;;
                esac

                if [ "$OC_NS" != "$EXPECTED_NS" ]; then
                  echo "FATAL: variable-group namespace '$OC_NS' does not match '$EXPECTED_NS'."
                  exit 1
                fi

                MANIFEST="apps/confluent-platform/$TARGET_ENV/rbac/onboarding-rolebindings.yaml"
                if [ ! -f "$MANIFEST" ]; then
                  echo "FATAL: $MANIFEST is missing."
                  exit 1
                fi

                # Validate the committed manifest without modifying it.
                python3 - "$MANIFEST" "$EXPECTED_NS" <<'PY'
                import sys
                import yaml

                path, expected_namespace = sys.argv[1:]
                with open(path, "r") as stream:
                    documents = [item for item in yaml.safe_load_all(stream) if item]

                if not documents:
                    raise SystemExit("FATAL: onboarding manifest contains no resources")

                names = set()
                for index, item in enumerate(documents, 1):
                    if (item.get("apiVersion") != "platform.confluent.io/v1beta1" or
                            item.get("kind") != "ConfluentRolebinding"):
                        raise SystemExit(
                            "FATAL: document %d is not a ConfluentRolebinding" % index)

                    metadata = item.get("metadata") or {}
                    spec = item.get("spec") or {}
                    name = metadata.get("name")

                    if not name or name in names:
                        raise SystemExit(
                            "FATAL: missing or duplicate metadata.name in document %d" % index)
                    names.add(name)

                    if metadata.get("namespace") != expected_namespace:
                        raise SystemExit(
                            "FATAL: %s targets namespace %r; expected %r" %
                            (name, metadata.get("namespace"), expected_namespace))

                    labels = metadata.get("labels") or {}
                    if labels.get("rbac.fcbint.net/managed-by") != "application-onboarding":
                        raise SystemExit(
                            "FATAL: %s is missing the application-onboarding ownership label" % name)

                    principal = spec.get("principal") or {}
                    if principal.get("type") not in ("user", "group"):
                        raise SystemExit("FATAL: %s has an invalid principal type" % name)
                    if not principal.get("name"):
                        raise SystemExit("FATAL: %s has an empty principal name" % name)
                    if "__ONBOARDING_" in str(principal.get("name")):
                        raise SystemExit(
                            "FATAL: %s contains an unresolved principal placeholder" % name)

                    if not spec.get("role"):
                        raise SystemExit("FATAL: %s has no role" % name)

                    reference = spec.get("kafkaRestClassRef") or {}
                    if (reference.get("name") != "default" or
                            reference.get("namespace") != expected_namespace):
                        raise SystemExit(
                            "FATAL: %s has an invalid KafkaRestClass reference" % name)

                print("PASS: validated %d committed role binding(s)" % len(documents))
                PY

                # Fail before mutation if the required CFK resources are unavailable.
                oc -n "$OC_NS" get kafka kafka >/dev/null
                oc -n "$OC_NS" get kafkarestclass default >/dev/null

                case "$ACTION" in
                  apply)
                    echo "Applying $MANIFEST unchanged"
                    oc apply --dry-run=server -f "$MANIFEST"
                    oc apply -f "$MANIFEST"
                    echo "PASS: committed onboarding manifest applied unchanged."
                    ;;
                  delete)
                    echo "Deleting resources declared in $MANIFEST"
                    oc delete -f "$MANIFEST" --ignore-not-found=true --wait=true
                    echo "PASS: resources declared in the onboarding manifest deleted."
                    ;;
                  *)
                    echo "FATAL: unsupported action: $ACTION"
                    exit 1
                    ;;
                esac

                echo
                echo "Current application-onboarding role bindings:"
                oc -n "$OC_NS" get confluentrolebinding \
                  -l rbac.fcbint.net/managed-by=application-onboarding \
                  -o custom-columns='NAME:.metadata.name,PRINCIPAL-TYPE:.spec.principal.type,PRINCIPAL:.spec.principal.name,ROLE:.spec.role,STATE:.status.state' \
                  --sort-by=.metadata.name
            env:
              ACTION: ${{ parameters.action }}
              TARGET_ENV: ${{ parameters.environment }}
              OC_NS: $(openshift-namespace)
