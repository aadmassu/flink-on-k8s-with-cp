# Pipeline:  verify-flink-setup
# Purpose:   End-to-end health check for the FCB Flink/CMF stack in
#            dah-flink-<env>. Lightweight in-cluster checks — does not deploy
#            anything and does not contact external systems.
#
#            For external connectivity tests (VM Kafka, Schema Registry, REST
#            Proxy, NetApp S3, SQL Server) use connectivity-test.yaml — that
#            pipeline deploys a busybox pod inside the namespace.
#
# Author:    Ayu Admassu
# Created:   2026-04-29
#
# Variable Group: kafka-openshift-credentials-<env>
#
# DESIGN NOTE — pipeline never aborts on a failed step.
#   Every step uses `condition: always()` and explicitly exits 0 after
#   recording PASS/FAIL to /tmp/verify-results/<step>. The pipeline runs
#   every check end-to-end even if earlier steps are red, so you can read
#   the log top-to-bottom and see which layers work and which don't. The
#   final step prints a summary table and is the one place that surfaces an
#   overall PASS/FAIL — it does not exit non-zero either.

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd, dr]
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: kafka-openshift-credentials-dev
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: kafka-openshift-credentials-qa
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: kafka-openshift-credentials-uat
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: kafka-openshift-credentials-prd
  - ${{ if eq(parameters.environment, 'dr') }}:
    - group: kafka-openshift-credentials-dr
  - name: RESULT_DIR
    value: /tmp/verify-results

stages:
  - stage: VerifyFlinkSetup
    displayName: "Verify Flink Setup (${{ parameters.environment }})"
    jobs:
      - job: Verify
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          # ============================================================
          # STEP 1 — CLI tools sanity
          # ============================================================
          - task: Bash@3
            displayName: "STEP 1 — CLI tools sanity"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="1-tools"
                mkdir -p "$RESULT_DIR"
                FAIL=""

                banner() {
                  echo ""
                  echo "================================================================="
                  echo " $1"
                  echo "================================================================="
                  echo ""
                }
                check_tool() {
                  local name=$1; shift
                  echo ""
                  echo "--- $name ---"
                  if "$@"; then
                    echo "[ok] $name available"
                  else
                    echo "[!!] $name not available"
                    FAIL="$FAIL $name"
                  fi
                }

                banner "STEP 1 — Build-agent tools (oc, helm, kubectl, curl, python3, PyYAML)"

                check_tool oc      oc version --client
                check_tool helm    helm version
                check_tool kubectl kubectl version --client
                check_tool curl    curl --version
                check_tool python3 python3 --version

                echo ""
                echo "--- python3 PyYAML (lazy-installed by REST pipelines; informational only) ---"
                if python3 -c 'import yaml; print("PyYAML", yaml.__version__)' 2>/dev/null; then
                  echo "[ok] PyYAML present"
                else
                  echo "[i ] PyYAML not yet installed (will be lazy-installed by REST pipelines)"
                fi

                banner "STEP 1 RESULT"
                if [ -z "$FAIL" ]; then
                  echo "PASS — all required tools available"
                  echo "PASS" > "$RESULT_DIR/$STEP"
                else
                  echo "FAIL — missing tools:$FAIL"
                  echo "FAIL: missing tools:$FAIL" > "$RESULT_DIR/$STEP"
                fi
                exit 0
            env:
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 2 — Login to OpenShift
          # ============================================================
          - task: Bash@3
            displayName: "STEP 2 — Login to OpenShift"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="2-login"
                mkdir -p "$RESULT_DIR"

                echo ""
                echo "================================================================="
                echo " STEP 2 — oc login + namespace context"
                echo "================================================================="
                echo ""
                echo "API: $OC_API"
                echo "User: $OC_USER"
                echo "Target namespace: $OC_NS"
                echo ""

                if oc login "$OC_API" \
                     --username="$OC_USER" \
                     --password="$OC_PWD" \
                     --insecure-skip-tls-verify; then
                  echo ""
                  echo "Logged-in identity: $(oc whoami)"
                  echo "Cluster server:     $(oc whoami --show-server)"
                  echo "Token (first 8):    $(oc whoami -t | head -c 8)..."
                  echo ""
                  if oc project "$OC_NS" >/dev/null 2>&1; then
                    echo "[ok] Switched context to namespace $OC_NS"
                    RESULT="PASS"
                  else
                    echo "[!!] Cannot switch to namespace $OC_NS (does it exist? has the SA access?)"
                    RESULT="FAIL: cannot switch to namespace $OC_NS"
                  fi
                else
                  echo "[!!] oc login failed — subsequent steps that talk to the cluster will also fail."
                  RESULT="FAIL: oc login failed"
                fi

                echo ""
                echo "================================================================="
                echo " STEP 2 RESULT: $RESULT"
                echo "================================================================="
                echo "$RESULT" > "$RESULT_DIR/$STEP"
                exit 0
            env:
              OC_API: $(openshift-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: dah-flink-${{ parameters.environment }}
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 3 — Namespace + flink-operator SA + RBAC
          # ============================================================
          - task: Bash@3
            displayName: "STEP 3 — Namespace + flink-operator SA + RBAC"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="3-rbac"
                mkdir -p "$RESULT_DIR"
                FAIL=""

                echo ""
                echo "================================================================="
                echo " STEP 3 — Namespace pre-reqs and flink-operator RBAC"
                echo "================================================================="

                echo ""
                echo "--- Namespace $OC_NS ---"
                if ! oc get namespace "$OC_NS"; then
                  echo "[!!] Namespace $OC_NS not found"
                  FAIL="$FAIL namespace"
                fi

                echo ""
                echo "--- ServiceAccount flink-operator -n $OC_NS ---"
                if ! oc get sa flink-operator -n "$OC_NS"; then
                  echo "[!!] flink-operator SA missing"
                  FAIL="$FAIL serviceaccount"
                fi

                echo ""
                echo "--- All Roles in $OC_NS ---"
                oc get roles -n "$OC_NS" 2>&1 | head -40 || true

                echo ""
                echo "--- All RoleBindings in $OC_NS ---"
                oc get rolebindings -n "$OC_NS" 2>&1 | head -40 || true

                echo ""
                echo "--- RoleBinding flink-operator-dah-flink (FCB fcb-security chart) ---"
                oc get rolebinding flink-operator-dah-flink -n "$OC_NS" -o yaml 2>&1 | head -40 || \
                  echo "[i ] flink-operator-dah-flink rolebinding not present; FCB may use a different name"

                echo ""
                echo "--- Auth check: can flink-operator list deployments? ---"
                ANS=$(oc auth can-i list deployments \
                  --as=system:serviceaccount:$OC_NS:flink-operator \
                  -n "$OC_NS" 2>&1 || true)
                echo "Answer: $ANS"
                if [ "$ANS" != "yes" ]; then
                  echo "[!!] flink-operator SA cannot list deployments — fcb-security RoleBinding may be missing or pointing at the wrong SA."
                  FAIL="$FAIL deployments-list"
                fi

                echo ""
                echo "--- Auth check: can flink-operator manage flink CRs? ---"
                for verb in get list watch create update delete; do
                  ANS=$(oc auth can-i "$verb" flinkdeployments.flink.apache.org \
                    --as=system:serviceaccount:$OC_NS:flink-operator \
                    -n "$OC_NS" 2>&1 || true)
                  echo "$verb flinkdeployments: $ANS"
                done

                echo ""
                echo "================================================================="
                if [ -z "$FAIL" ]; then
                  echo " STEP 3 RESULT: PASS"
                  echo "PASS" > "$RESULT_DIR/$STEP"
                else
                  echo " STEP 3 RESULT: FAIL ($FAIL)"
                  echo "FAIL:$FAIL" > "$RESULT_DIR/$STEP"
                fi
                echo "================================================================="
                exit 0
            env:
              OC_NS: dah-flink-${{ parameters.environment }}
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 4 — ClusterIssuer keyfactor + ClusterSecretStore
          # ============================================================
          - task: Bash@3
            displayName: "STEP 4 — ClusterIssuer keyfactor + ClusterSecretStore"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="4-issuer"
                mkdir -p "$RESULT_DIR"
                FAIL=""

                echo ""
                echo "================================================================="
                echo " STEP 4 — TLS infra: ClusterIssuer keyfactor + ClusterSecretStore"
                echo "================================================================="

                echo ""
                echo "--- ClusterIssuer keyfactor ---"
                # Brief check only — the full ClusterIssuer YAML (which carries
                # the bound Keyfactor template name) is dumped by the cmf-tls
                # pipeline's failure-path diagnostics. Run that pipeline if you
                # need to chase a Keyfactor template / wildcard-vs-Entity issue.
                if ! oc get clusterissuer keyfactor 2>&1; then
                  echo "[!!] ClusterIssuer keyfactor not found — cert-manager + Keyfactor onboarding may be incomplete."
                  FAIL="$FAIL clusterissuer"
                fi

                echo ""
                echo "--- ClusterIssuer Ready condition ---"
                READY=$(oc get clusterissuer keyfactor -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                MSG=$(oc get clusterissuer keyfactor -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null || echo "")
                echo "Ready=$READY"
                echo "Message: $MSG"
                if [ "$READY" != "True" ]; then
                  echo "[!!] ClusterIssuer keyfactor not Ready"
                  FAIL="$FAIL issuer-not-ready"
                fi

                echo ""
                echo "--- ClusterSecretStore (ESO; informational only — not on the CMF critical path) ---"
                if oc get clustersecretstore 2>&1; then
                  echo "[ok] ClusterSecretStore present"
                else
                  echo "[i ] No ClusterSecretStore — CyberArk onboarding via SNOW pending"
                fi

                echo ""
                echo "================================================================="
                if [ -z "$FAIL" ]; then
                  echo " STEP 4 RESULT: PASS"
                  echo "PASS" > "$RESULT_DIR/$STEP"
                else
                  echo " STEP 4 RESULT: FAIL ($FAIL)"
                  echo "FAIL:$FAIL" > "$RESULT_DIR/$STEP"
                fi
                echo "================================================================="
                exit 0
            env:
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 5 — CMF TLS Certificate + Secret
          # ============================================================
          - task: Bash@3
            displayName: "STEP 5 — CMF TLS Certificate + Secret"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="5-cmf-tls"
                mkdir -p "$RESULT_DIR"
                FAIL=""

                echo ""
                echo "================================================================="
                echo " STEP 5 — Certificate cmf-tls + resulting Secret"
                echo "================================================================="

                echo ""
                echo "--- Certificate cmf-tls -n $OC_NS ---"
                if ! oc get certificate cmf-tls -n "$OC_NS" 2>&1; then
                  echo "[!!] Certificate cmf-tls missing — run the cmf-tls pipeline."
                  FAIL="$FAIL certificate-missing"
                fi

                # Note: deep diagnostics (describe certificate / certificaterequest /
                # events / clusterissuer YAML) live in the cmf-tls pipeline's
                # "Diagnostics on failure" task. If this step reports cert-not-Ready,
                # re-run cmf-tls.yaml — its failure path will dump the rejection
                # reason from Keyfactor.

                echo ""
                echo "--- Certificate Ready condition ---"
                READY=$(oc get certificate cmf-tls -n "$OC_NS" \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                MSG=$(oc get certificate cmf-tls -n "$OC_NS" \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null || echo "")
                NOT_AFTER=$(oc get certificate cmf-tls -n "$OC_NS" \
                  -o jsonpath='{.status.notAfter}' 2>/dev/null || echo "")
                echo "Ready=$READY"
                echo "Message: $MSG"
                echo "Not after: $NOT_AFTER"
                if [ "$READY" != "True" ]; then
                  echo "[!!] cmf-tls Certificate not Ready"
                  FAIL="$FAIL certificate-not-ready"
                fi

                echo ""
                echo "--- Secret cmf-tls ---"
                if ! oc get secret cmf-tls -n "$OC_NS" 2>&1; then
                  echo "[!!] Secret cmf-tls not found"
                  FAIL="$FAIL secret-missing"
                else
                  echo ""
                  echo "--- Secret data keys ---"
                  KEYS=$(oc get secret cmf-tls -n "$OC_NS" -o jsonpath='{.data}' \
                    | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(sorted(d.keys())))" 2>/dev/null || echo "")
                  echo "Keys present: $KEYS"
                  for k in tls.crt tls.key ca.crt; do
                    if echo " $KEYS " | grep -q " $k "; then
                      LEN=$(oc get secret cmf-tls -n "$OC_NS" -o jsonpath="{.data.${k//./\\.}}" \
                        | base64 -d 2>/dev/null | wc -c | tr -d ' ')
                      echo "[ok] $k ($LEN bytes decoded)"
                    else
                      echo "[!!] $k missing from Secret"
                      FAIL="$FAIL key-$k"
                    fi
                  done
                fi

                echo ""
                echo "================================================================="
                if [ -z "$FAIL" ]; then
                  echo " STEP 5 RESULT: PASS"
                  echo "PASS" > "$RESULT_DIR/$STEP"
                else
                  echo " STEP 5 RESULT: FAIL ($FAIL)"
                  echo "FAIL:$FAIL" > "$RESULT_DIR/$STEP"
                fi
                echo "================================================================="
                exit 0
            env:
              OC_NS: dah-flink-${{ parameters.environment }}
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 6 — CMF pod + Service
          # ============================================================
          - task: Bash@3
            displayName: "STEP 6 — CMF pod Ready + Service shape"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="6-cmf-pod"
                mkdir -p "$RESULT_DIR"
                FAIL=""

                echo ""
                echo "================================================================="
                echo " STEP 6 — CMF Deployment pod + cmf-service"
                echo "================================================================="

                echo ""
                echo "--- Helm release status ---"
                helm status confluent-cmf -n "$OC_NS" 2>&1 | head -30 \
                  || echo "[!!] helm release 'confluent-cmf' not found in $OC_NS"

                echo ""
                echo "--- Pods (label app.kubernetes.io/name=confluent-manager-for-apache-flink) ---"
                oc get pods -n "$OC_NS" \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink -o wide 2>&1 || true

                READY=$(oc get pods -n "$OC_NS" \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "")
                RESTARTS=$(oc get pods -n "$OC_NS" \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo "?")
                IMAGE=$(oc get pods -n "$OC_NS" \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null || echo "?")
                SA=$(oc get pods -n "$OC_NS" \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -o jsonpath='{.items[0].spec.serviceAccountName}' 2>/dev/null || echo "?")
                echo ""
                echo "Ready:        $READY"
                echo "Restarts:     $RESTARTS"
                echo "Image:        $IMAGE"
                echo "ServiceAccnt: $SA"
                if [ "$READY" != "true" ]; then
                  echo ""
                  echo "[!!] CMF pod not Ready — describe + last 50 log lines:"
                  oc describe pod -n "$OC_NS" \
                    -l app.kubernetes.io/name=confluent-manager-for-apache-flink 2>&1 | tail -40 || true
                  echo ""
                  oc logs -n "$OC_NS" \
                    -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                    --tail=50 2>&1 || true
                  FAIL="$FAIL pod-not-ready"
                fi

                echo ""
                echo "--- Service cmf-service ---"
                if ! oc get svc cmf-service -n "$OC_NS" 2>&1; then
                  echo "[!!] cmf-service not found"
                  FAIL="$FAIL svc-missing"
                else
                  PORT=$(oc get svc cmf-service -n "$OC_NS" \
                    -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || echo "?")
                  TARGET=$(oc get svc cmf-service -n "$OC_NS" \
                    -o jsonpath='{.spec.ports[0].targetPort}' 2>/dev/null || echo "?")
                  PORTNAME=$(oc get svc cmf-service -n "$OC_NS" \
                    -o jsonpath='{.spec.ports[0].name}' 2>/dev/null || echo "?")
                  echo "port name:   $PORTNAME"
                  echo "port:        $PORT"
                  echo "targetPort:  $TARGET"
                  if [ "$PORT" != "443" ]; then
                    echo "[!!] cmf-service port expected 443, got $PORT"
                    FAIL="$FAIL svc-port"
                  fi

                  echo ""
                  echo "--- Endpoints ---"
                  oc get endpoints cmf-service -n "$OC_NS" 2>&1 || true
                fi

                echo ""
                echo "================================================================="
                if [ -z "$FAIL" ]; then
                  echo " STEP 6 RESULT: PASS"
                  echo "PASS" > "$RESULT_DIR/$STEP"
                else
                  echo " STEP 6 RESULT: FAIL ($FAIL)"
                  echo "FAIL:$FAIL" > "$RESULT_DIR/$STEP"
                fi
                echo "================================================================="
                exit 0
            env:
              OC_NS: dah-flink-${{ parameters.environment }}
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 7 — CMF REST endpoint reachable
          # ============================================================
          - task: Bash@3
            displayName: "STEP 7 — CMF REST endpoint reachable (HTTPS via apiserver proxy)"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="7-rest"
                mkdir -p "$RESULT_DIR"
                FAIL=""

                echo ""
                echo "================================================================="
                echo " STEP 7 — CMF REST endpoint over HTTPS"
                echo "================================================================="

                API_SERVER=$(oc whoami --show-server 2>/dev/null || echo "")
                OC_TOKEN=$(oc whoami -t 2>/dev/null || echo "")
                if [ -z "$API_SERVER" ] || [ -z "$OC_TOKEN" ]; then
                  echo "[!!] no oc session — STEP 2 must succeed first"
                  echo "FAIL:no-session" > "$RESULT_DIR/$STEP"
                  exit 0
                fi

                # https: prefix tells the apiserver service-proxy to dial the
                # backend over TLS — same wiring the CMF REST pipelines use.
                PROXY_BASE="$API_SERVER/api/v1/namespaces/$OC_NS/services/https:cmf-service:443/proxy"
                echo "Proxy base: $PROXY_BASE"
                echo ""

                echo "--- GET /cmf/api/v1/environments ---"
                START=$(date +%s%3N)
                HTTP=$(curl -sS -k -o /tmp/cmf-resp.txt -D /tmp/cmf-headers.txt \
                  -w "%{http_code}" \
                  -H "Authorization: Bearer $OC_TOKEN" \
                  "$PROXY_BASE/cmf/api/v1/environments" 2>&1 || echo "000")
                END=$(date +%s%3N)
                MS=$((END - START))
                echo "HTTP status:   $HTTP"
                echo "Response time: ${MS}ms"
                echo ""
                echo "--- Response headers (first 10) ---"
                head -10 /tmp/cmf-headers.txt 2>/dev/null || true
                echo ""
                echo "--- Response body (first 500 bytes) ---"
                head -c 500 /tmp/cmf-resp.txt 2>/dev/null || true
                echo ""

                if [ "$HTTP" != "200" ]; then
                  echo "[!!] CMF REST endpoint returned HTTP $HTTP (expected 200)"
                  FAIL="$FAIL http-$HTTP"
                fi

                echo ""
                echo "================================================================="
                if [ -z "$FAIL" ]; then
                  echo " STEP 7 RESULT: PASS"
                  echo "PASS" > "$RESULT_DIR/$STEP"
                else
                  echo " STEP 7 RESULT: FAIL ($FAIL)"
                  echo "FAIL:$FAIL" > "$RESULT_DIR/$STEP"
                fi
                echo "================================================================="
                exit 0
            env:
              OC_NS: dah-flink-${{ parameters.environment }}
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 8 — Environment / Catalog / Database registered
          # ============================================================
          - task: Bash@3
            displayName: "STEP 8 — Environment / Catalog / Database registered in CMF"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                STEP="8-state"
                mkdir -p "$RESULT_DIR"
                FAIL=""

                echo ""
                echo "================================================================="
                echo " STEP 8 — CMF state: Environment / KafkaCatalog / KafkaDatabase"
                echo "================================================================="

                ENV_NAME="${{ parameters.environment }}"

                python3 -c 'import yaml' 2>/dev/null \
                  || pip3 install --quiet --user pyyaml 2>/dev/null \
                  || python3 -m pip install --quiet --user pyyaml 2>/dev/null \
                  || true

                yaml_name() {
                  python3 -c "import yaml,sys; d=yaml.safe_load(open('$1')); print(d.get('name') or (d.get('metadata') or {}).get('name',''))" 2>/dev/null
                }

                ENV_RES=$(yaml_name "apps/confluent-flink/$ENV_NAME/environment.yaml")
                CAT_NAME=$(yaml_name "apps/confluent-flink/$ENV_NAME/kafka-catalog.yaml")
                DB_NAME=$(yaml_name "apps/confluent-flink/$ENV_NAME/kafka-database.yaml")
                echo "Names from manifests:"
                echo "  Environment    = $ENV_RES"
                echo "  Kafka Catalog  = $CAT_NAME"
                echo "  Kafka Database = $DB_NAME"

                API_SERVER=$(oc whoami --show-server 2>/dev/null || echo "")
                OC_TOKEN=$(oc whoami -t 2>/dev/null || echo "")
                if [ -z "$API_SERVER" ] || [ -z "$OC_TOKEN" ]; then
                  echo "[!!] no oc session — STEP 2 must succeed first"
                  echo "FAIL:no-session" > "$RESULT_DIR/$STEP"
                  exit 0
                fi
                PROXY_BASE="$API_SERVER/api/v1/namespaces/$OC_NS/services/https:cmf-service:443/proxy"

                check_resource() {
                  local label=$1; local path=$2; local name=$3
                  echo ""
                  echo "--- $label '$name' ---"
                  HTTP=$(curl -sS -k -o /tmp/r.txt -w "%{http_code}" \
                    -H "Authorization: Bearer $OC_TOKEN" \
                    "$PROXY_BASE$path" 2>&1 || echo "000")
                  echo "HTTP: $HTTP"
                  echo "Body (first 400 bytes):"
                  head -c 400 /tmp/r.txt 2>/dev/null || true
                  echo ""
                  if [ "$HTTP" = "200" ]; then
                    echo "[ok] $label '$name' present in CMF"
                    return 0
                  else
                    echo "[!!] $label '$name' missing or unreachable (HTTP $HTTP) — re-run the flink-environments pipeline."
                    return 1
                  fi
                }

                check_resource "Environment"    "/cmf/api/v1/environments/$ENV_RES"                       "$ENV_RES"  || FAIL="$FAIL env"
                check_resource "Kafka Catalog"  "/cmf/api/v1/catalogs/kafka/$CAT_NAME"                    "$CAT_NAME" || FAIL="$FAIL catalog"
                check_resource "Kafka Database" "/cmf/api/v1/catalogs/kafka/$CAT_NAME/databases/$DB_NAME" "$DB_NAME"  || FAIL="$FAIL database"

                echo ""
                echo "================================================================="
                if [ -z "$FAIL" ]; then
                  echo " STEP 8 RESULT: PASS"
                  echo "PASS" > "$RESULT_DIR/$STEP"
                else
                  echo " STEP 8 RESULT: FAIL ($FAIL)"
                  echo "FAIL:$FAIL" > "$RESULT_DIR/$STEP"
                fi
                echo "================================================================="
                exit 0
            env:
              OC_NS: dah-flink-${{ parameters.environment }}
              RESULT_DIR: $(RESULT_DIR)

          # ============================================================
          # STEP 9 — Diagnostic dump (always)
          # ============================================================
          - task: Bash@3
            displayName: "STEP 9 — Diagnostic dump"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail
                echo ""
                echo "================================================================="
                echo " STEP 9 — Diagnostic dump (informational)"
                echo "================================================================="

                echo ""
                echo "--- Pods in $OC_NS ---"
                oc get pods -n "$OC_NS" -o wide 2>&1 || true

                echo ""
                echo "--- Events (last 30, sorted by lastTimestamp) ---"
                oc get events -n "$OC_NS" --sort-by=.lastTimestamp 2>&1 | tail -30 || true

                echo ""
                echo "--- Secrets in $OC_NS ---"
                oc get secrets -n "$OC_NS" 2>&1 || true

                echo ""
                echo "--- ConfigMaps in $OC_NS ---"
                oc get cm -n "$OC_NS" 2>&1 || true

                echo ""
                echo "--- CRDs (Flink / Confluent / cert-manager / ESO) ---"
                oc get crds 2>&1 | grep -iE "flink|confluent|cert-manager|external-secrets" || echo "(none)"

                exit 0
            env:
              OC_NS: dah-flink-${{ parameters.environment }}

          # ============================================================
          # STEP 10 — Final summary table
          # ============================================================
          - task: Bash@3
            displayName: "STEP 10 — Summary"
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -uo pipefail

                echo ""
                echo "================================================================="
                echo " VERIFY FLINK SETUP — SUMMARY  (env: ${{ parameters.environment }})"
                echo "================================================================="
                echo ""
                printf "%-30s %s\n" "STEP" "RESULT"
                printf "%-30s %s\n" "----" "------"

                for f in 1-tools 2-login 3-rbac 4-issuer 5-cmf-tls 6-cmf-pod 7-rest 8-state; do
                  if [ -f "$RESULT_DIR/$f" ]; then
                    printf "%-30s %s\n" "$f" "$(cat "$RESULT_DIR/$f")"
                  else
                    printf "%-30s %s\n" "$f" "(did not run)"
                  fi
                done

                echo ""
                echo "================================================================="
                echo " Notes"
                echo "================================================================="
                echo " * This pipeline does NOT exit non-zero on failure — read the"
                echo "   table above. Re-run after fixing whichever step is FAIL."
                echo " * External connectivity (VM Kafka, Schema Registry, REST Proxy,"
                echo "   NetApp S3, SQL Server) is tested separately by"
                echo "   connectivity-test.yaml."
                echo "================================================================="
                exit 0
            env:
              RESULT_DIR: $(RESULT_DIR)
