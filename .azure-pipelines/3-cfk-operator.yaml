# 3. CFK Operator + webhook TLS — Confluent for Kubernetes
#
# Required pipeline variables:
#   OPENSHIFT_SERVER  — OpenShift API URL
#   OPENSHIFT_TOKEN   — oc login token (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]

variables:
  - group: Openshift-ROSA-VAR-Groups
  - name: ENV
    value: ${{ parameters.environment }}
  - name: NS
    value: "dah-kafka-${{ parameters.environment }}"

stages:
  - stage: CFK
    displayName: "CFK Operator (${{ parameters.environment }})"
    jobs:
      - job: CFK
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: HelmInstaller@1
            displayName: "Install Helm"
            inputs:
              helmVersionToInstall: "3.14.0"

          - task: Bash@3
            displayName: "Install oc CLI"
            inputs:
              targetType: inline
              script: |
                curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                  | tar xz -C /usr/local/bin oc kubectl

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                oc login "$(OPENSHIFT_SERVER)" --token="$(OPENSHIFT_TOKEN)" --insecure-skip-tls-verify

          - task: Bash@3
            displayName: "Add Helm repo"
            inputs:
              targetType: inline
              script: |
                helm repo add confluent https://packages.confluent.io/helm 2>/dev/null || true
                helm repo update confluent

          - task: Bash@3
            displayName: "Install CFK Operator"
            inputs:
              targetType: inline
              script: |
                helm upgrade --install confluent-operator confluent/confluent-for-kubernetes \
                  --namespace $(NS) \
                  --version 0.1351.59 \
                  -f apps/confluent-operator/$(ENV)/values.yaml \
                  -f apps/confluent-operator/openshift-overlay.yaml \
                  --wait --timeout 10m

          - task: Bash@3
            displayName: "Apply webhook TLS"
            inputs:
              targetType: inline
              script: |
                cat <<'EOF' | oc apply -n $(NS) -f -
                ---
                apiVersion: cert-manager.io/v1
                kind: Issuer
                metadata:
                  name: cfk-selfsigned-issuer
                spec:
                  selfSigned: {}
                ---
                apiVersion: v1
                kind: Secret
                metadata:
                  name: cfk-jks-password
                stringData:
                  password: changeit
                ---
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: confluent-operator-serving-cert
                spec:
                  secretName: confluent-operator-serving-cert
                  issuerRef:
                    name: cfk-selfsigned-issuer
                    kind: Issuer
                  dnsNames:
                    - confluent-operator.dah-kafka-$(ENV).svc
                    - confluent-operator.dah-kafka-$(ENV).svc.cluster.local
                  duration: 8760h
                  renewBefore: 720h
                  keystores:
                    pkcs12:
                      create: true
                      passwordSecretRef:
                        name: cfk-jks-password
                        key: password
                ---
                apiVersion: v1
                kind: Secret
                metadata:
                  name: cfk-jks-password-file
                stringData:
                  jksPassword.txt: "jksPassword=changeit"
                EOF

                oc wait --for=condition=Ready certificate/confluent-operator-serving-cert \
                  -n $(NS) --timeout=120s
                echo "CFK webhook TLS ready."

          - task: Bash@3
            displayName: "Wait for CFK CRDs"
            inputs:
              targetType: inline
              script: |
                for CRD in flinkenvironments.platform.confluent.io cmfrestclasses.platform.confluent.io; do
                  echo "Waiting for $CRD..."
                  RETRIES=0
                  until oc get crd "$CRD" &>/dev/null; do
                    RETRIES=$((RETRIES + 1))
                    if [ "$RETRIES" -ge 30 ]; then echo "ERROR: $CRD not found."; exit 1; fi
                    sleep 2
                  done
                  oc wait --for=condition=Established "crd/$CRD" --timeout=60s
                done
                echo "CFK CRDs ready."

          - task: Bash@3
            displayName: "Verify"
            inputs:
              targetType: inline
              script: |
                helm status confluent-operator -n $(NS)
                echo ""
                oc get pods -n $(NS) -l app=confluent-operator
                echo ""
                oc get certificate -n $(NS)
