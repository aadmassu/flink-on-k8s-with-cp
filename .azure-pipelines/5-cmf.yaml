# 5. CMF — Confluent Manager for Apache Flink
#
# Required pipeline variables (via Openshift-ROSA-VAR-Groups):
#   OPENSHIFT_SERVER  — OpenShift API URL
#   OPENSHIFT_TOKEN   — oc login token (mark as secret)

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, stg, prd]

variables:
  - group: Openshift-ROSA-VAR-Groups
  - name: ENV
    value: ${{ parameters.environment }}
  - name: NS
    value: "dah-kafka-${{ parameters.environment }}"

stages:
  - stage: CMF
    displayName: "CMF (${{ parameters.environment }})"
    jobs:
      - job: CMF
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: Bash@3
            displayName: "Install oc + helm CLI"
            inputs:
              targetType: inline
              script: |
                curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                  | tar xz -C /usr/local/bin oc kubectl
                curl -sL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz \
                  | tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm

          - task: Bash@3
            displayName: "Login + Install CMF"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                oc login "$(OPENSHIFT_SERVER)" --token="$(OPENSHIFT_TOKEN)" --insecure-skip-tls-verify
                oc whoami

                helm upgrade --install confluent-cmf charts/confluent-manager-for-apache-flink \
                  --namespace $(NS) \
                  -f apps/confluent-cmf/$(ENV)/values.yaml \
                  -f apps/confluent-cmf/openshift-overlay.yaml \
                  --wait --timeout 10m

                echo ""
                helm status confluent-cmf -n $(NS)
                oc get pods -n $(NS) -l app.kubernetes.io/name=confluent-manager-for-apache-flink
