# Pipeline: flink-application
# Purpose: Install/update the AEP rate-limit Flink application through CMF REST API.

trigger: none

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: dev
    values: [dev, qa, uat, prd]

  - name: application
    displayName: "Application folder"
    type: string
    default: aep-rate-limit

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: dev-openshift-credentials
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: qa-openshift-credentials
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: uat-openshift-credentials
  - ${{ if eq(parameters.environment, 'prd') }}:
    - group: prd-openshift-credentials

stages:
  - stage: FlinkApplication
    displayName: "Install Flink Application (${{ parameters.environment }})"
    jobs:
      - job: FlinkApplication
        pool: DevOpsLinux
        steps:
          - checkout: self
            env:
              GIT_SSL_NO_VERIFY: "true"

          - template: templates/install-tools.yaml

          - task: Bash@3
            displayName: "Login to OpenShift"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                oc login "$OC_API" \
                  --username="$OC_USER" \
                  --password="$OC_PWD" \
                  --insecure-skip-tls-verify

                oc whoami
                oc project "$OC_NS"
            env:
              OC_API: $(openshift-dev-api)
              OC_USER: $(openshift-service-account-name)
              OC_PWD: $(openshift-service-account-pwd)
              OC_NS: $(openshift-dev-namespace)

          - task: Bash@3
            displayName: "Apply app ConfigMap and Secret"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                APP_DIR="apps/confluent-flink/$TARGET_ENV/applications/$APP_NAME"
                CONFIGMAP="$APP_DIR/aep-rate-limit-configmap.yaml"

                if [ ! -f "$CONFIGMAP" ]; then
                  echo "ERROR: $CONFIGMAP not found"
                  exit 1
                fi

                echo "=== Applying ConfigMap ==="
                oc apply -f "$CONFIGMAP" -n "$OC_NS"

                echo "=== Creating/updating Secret ==="
                oc create secret generic aep-rate-limit-secrets \
                  -n "$OC_NS" \
                  --from-literal=BOOTSTRAP_SERVERS="$BOOTSTRAP_SERVERS" \
                  --from-literal=SECURITY_PROTOCOL="$SECURITY_PROTOCOL" \
                  --from-literal=AEP_API_KEY="$AEP_API_KEY" \
                  --from-literal=AEP_CLIENT_SECRET="$AEP_CLIENT_SECRET" \
                  --from-literal=AEP_HEADER_1_VALUE="$AEP_HEADER_1_VALUE" \
                  --dry-run=client -o yaml | oc apply -f -

                echo "=== Verifying resources ==="
                oc get configmap aep-rate-limit-config -n "$OC_NS"
                oc get secret aep-rate-limit-secrets -n "$OC_NS"
            env:
              TARGET_ENV: ${{ parameters.environment }}
              APP_NAME: ${{ parameters.application }}
              OC_NS: $(openshift-dev-namespace)

              BOOTSTRAP_SERVERS: $(dev-kafka-broker-hosts)
              SECURITY_PROTOCOL: PLAINTEXT

              AEP_API_KEY: $(dev-aep-api-key)
              AEP_CLIENT_SECRET: $(dev-aep-client-secret)
              AEP_HEADER_1_NAME: $(dev-aep-header-1-name)
              AEP_HEADER_1_VALUE: $(dev-aep-dataset-id)

          - task: Bash@3
            displayName: "Submit FlinkApplication to CMF"
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                APP_DIR="apps/confluent-flink/$TARGET_ENV/applications/$APP_NAME"
                APP_FILE="$APP_DIR/aep-rate-limit-application.yaml"

                if [ ! -f "$APP_FILE" ]; then
                  echo "ERROR: $APP_FILE not found"
                  exit 1
                fi

                echo "=== Waiting for CMF pod to be Ready ==="
                oc wait --for=condition=Ready pod \
                  -l app.kubernetes.io/name=confluent-manager-for-apache-flink \
                  -n "$OC_NS" --timeout=180s

                API_SERVER=$(oc whoami --show-server)
                OC_TOKEN=$(oc whoami -t)
                PROXY_BASE="$API_SERVER/api/v1/namespaces/$OC_NS/services/https:cmf-service:443/proxy"

                echo "=== Checking CMF environments ==="
                curl -sS -k \
                  -H "Authorization: Bearer $OC_TOKEN" \
                  "$PROXY_BASE/cmf/api/v1/environments" | head -100

                echo ""
                echo "=== Submitting FlinkApplication ==="
                echo "NOTE: This pipeline currently creates the application. If it already exists, delete/update flow may be required."
                curl --fail-with-body -sS -k -X POST \
                  -H "Authorization: Bearer $OC_TOKEN" \
                  -H "Content-Type: application/yaml" \
                  --data-binary "@$APP_FILE" \
                  "$PROXY_BASE/cmf/api/v1/environments/$FLINK_ENV/applications"

                echo ""
                echo "=== Verifying application ==="
                curl --fail-with-body -sS -k \
                  -H "Authorization: Bearer $OC_TOKEN" \
                  "$PROXY_BASE/cmf/api/v1/environments/$FLINK_ENV/applications/aep-rate-limit-job" | head -200

                echo ""
                echo "=== Waiting for generated FlinkDeployment ==="
                for i in $(seq 1 60); do
                  if oc get flinkdeployment aep-rate-limit-job -n "$OC_NS" >/dev/null 2>&1; then
                    echo "FlinkDeployment found."
                    break
                  fi

                  if [ "$i" -eq 60 ]; then
                    echo "ERROR: FlinkDeployment aep-rate-limit-job was not created within timeout."
                    oc get flinkdeployments.flink.apache.org -n "$OC_NS" || true
                    oc get events -n "$OC_NS" --sort-by=.lastTimestamp | tail -50 || true
                    exit 1
                  fi

                  echo "Waiting for FlinkDeployment... attempt $i"
                  sleep 10
                done

                oc get flinkdeployment aep-rate-limit-job -n "$OC_NS"
                oc get pods -n "$OC_NS" | grep aep-rate-limit || true
            env:
              TARGET_ENV: ${{ parameters.environment }}
              APP_NAME: ${{ parameters.application }}
              OC_NS: $(openshift-dev-namespace)
              FLINK_ENV: dah-flink-${{ parameters.environment }}