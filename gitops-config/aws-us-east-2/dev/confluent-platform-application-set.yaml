---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-platform-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: dev-cluster
            url: https://dev-cluster.aws-us-east-2.example.com
            environment: dev
  template:
    metadata:
      name: "confluent-platform-{{environment}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/PLACEHOLDER_ORG/FCB.git
        path: "apps/confluent-platform/{{environment}}/manifests"
        targetRevision: HEAD
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      ignoreDifferences:
        - group: platform.confluent.io
          kind: "*"
          jsonPointers:
            - /status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
