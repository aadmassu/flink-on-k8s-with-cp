---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-operator-stg
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: stg-cluster
            url: https://stg-cluster.aws-us-east-2.example.com
            environment: stg
  template:
    metadata:
      name: "confluent-operator-{{environment}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://packages.confluent.io/helm
        chart: confluent-for-kubernetes
        targetRevision: 0.*
        helm:
          valueFiles:
            - $values/apps/confluent-operator/{{environment}}/values.yaml
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
