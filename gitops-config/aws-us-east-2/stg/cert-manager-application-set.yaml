---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-stg
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: stg-cluster
            url: https://stg-cluster.aws-us-east-2.example.com
            environment: stg
  template:
    metadata:
      name: "cert-manager-{{environment}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: 1.*
        helm:
          valueFiles:
            - $values/apps/cert-manager/{{environment}}/values.yaml
      destination:
        server: "{{url}}"
        namespace: cert-manager
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
