---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-flink-stg
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: stg-cluster
            url: https://stg-cluster.example.com
            environment: stg
  template:
    metadata:
      name: "confluent-flink-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: git@github.com:aadmassu/flink-on-k8s-with-cp.git
          targetRevision: HEAD
          path: apps/confluent-flink/{{environment}}
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
