---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-platform-stg
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: stg-cluster
            url: https://stg-cluster.example.com
            environment: stg
  template:
    metadata:
      name: "confluent-platform-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://Psyncopate-Internal@dev.azure.com/Psyncopate-Internal/Confluent/_git/flink-on-k8s-with-cp
          targetRevision: HEAD
          path: apps/confluent-platform/{{environment}}
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
