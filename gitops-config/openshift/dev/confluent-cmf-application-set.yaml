---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-cmf-dev
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: dev-cluster
            url: https://kubernetes.default.svc
            environment: dev
  template:
    metadata:
      name: "confluent-cmf-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://packages.confluent.io/helm
          chart: confluent-manager-for-apache-flink
          targetRevision: 2.2.0
          helm:
            valueFiles:
              - $values/apps/confluent-cmf/{{environment}}/values.yaml
              - $values/apps/confluent-cmf/openshift-overlay.yaml
        - repoURL: https://Psyncopate-Internal@dev.azure.com/Psyncopate-Internal/Confluent/_git/flink-on-k8s-with-cp
          targetRevision: feature/openshift
          ref: values
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
