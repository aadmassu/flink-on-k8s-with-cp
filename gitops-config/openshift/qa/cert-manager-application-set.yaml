---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-qa
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: qa-cluster
            url: https://qa-cluster.example.com
            environment: qa
  template:
    metadata:
      name: "cert-manager-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: v1.19.4
          helm:
            valueFiles:
              - $values/apps/cert-manager/{{environment}}/values.yaml
              - $values/apps/cert-manager/openshift-overlay.yaml
        - repoURL: git@github.com:aadmassu/flink-on-k8s-with-cp.git
          targetRevision: HEAD
          ref: values
      destination:
        server: "{{url}}"
        namespace: cert-manager
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
