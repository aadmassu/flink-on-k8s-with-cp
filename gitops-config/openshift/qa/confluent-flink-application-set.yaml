---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-flink-qa
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: qa-cluster
            url: https://qa-cluster.example.com
            environment: qa
  template:
    metadata:
      name: "confluent-flink-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://Psyncopate-Internal@dev.azure.com/Psyncopate-Internal/Confluent/_git/flink-on-k8s-with-cp
          targetRevision: HEAD
          path: apps/confluent-flink/{{environment}}
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
