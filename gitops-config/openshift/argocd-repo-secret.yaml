---
# ArgoCD repository credentials for Azure DevOps.
# Apply with: ARGOCD_REPO_PAT=<your-pat> envsubst < argocd-repo-secret.yaml | oc apply -f -
# Or the deploy script will create this automatically using $ARGOCD_REPO_PAT.
apiVersion: v1
kind: Secret
metadata:
  name: azure-devops-repo
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://Psyncopate-Internal@dev.azure.com/Psyncopate-Internal/Confluent/_git/flink-on-k8s-with-cp
  username: Psyncopate-Internal
  password: ${ARGOCD_REPO_PAT}
