---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-prd
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: prd-cluster
            url: https://prd-cluster.example.com
            environment: prd
  template:
    metadata:
      name: "cert-manager-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: v1.19.4
          helm:
            valueFiles:
              - $values/apps/cert-manager/{{environment}}/values.yaml
              - $values/apps/cert-manager/openshift-overlay.yaml
        - repoURL: https://Psyncopate-Internal@dev.azure.com/Psyncopate-Internal/Confluent/_git/flink-on-k8s-with-cp
          targetRevision: HEAD
          ref: values
      destination:
        server: "{{url}}"
        namespace: cert-manager
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
