---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-flink-prd
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: prd-cluster
            url: https://prd-cluster.example.com
            environment: prd
  template:
    metadata:
      name: "confluent-flink-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: git@github.com:aadmassu/flink-on-k8s-with-cp.git
        path: "apps/confluent-flink/openshift/{{environment}}/manifests"
        targetRevision: HEAD
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
