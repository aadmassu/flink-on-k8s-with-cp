---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: confluent-flink-operator-prd
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - cluster: prd-cluster
            url: https://prd-cluster.example.com
            environment: prd
  template:
    metadata:
      name: "confluent-flink-operator-{{environment}}"
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://packages.confluent.io/helm
          chart: flink-kubernetes-operator
          targetRevision: 1.130.2
          helm:
            valueFiles:
              - $values/apps/confluent-flink-operator/{{environment}}/values.yaml
              - $values/apps/confluent-flink-operator/openshift-overlay.yaml
        - repoURL: https://Psyncopate-Internal@dev.azure.com/Psyncopate-Internal/Confluent/_git/flink-on-k8s-with-cp
          targetRevision: HEAD
          ref: values
      destination:
        server: "{{url}}"
        namespace: "confluent-{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
