---
# Secret reference template
# Actual secrets are stored in Kubernetes Secrets / external secret stores.
# This file documents the expected secret references per environment.

secrets:
  kafka:
    credentialSecretRef: kafka-credentials
    tlsSecretRef: kafka-tls
  schemaRegistry:
    credentialSecretRef: schema-registry-credentials
    tlsSecretRef: schema-registry-tls
  connect:
    credentialSecretRef: connect-credentials
    tlsSecretRef: connect-tls
  controlCenter:
    credentialSecretRef: control-center-credentials
    tlsSecretRef: control-center-tls
  ksqldb:
    credentialSecretRef: ksqldb-credentials
    tlsSecretRef: ksqldb-tls
  flink:
    credentialSecretRef: flink-credentials
    tlsSecretRef: flink-tls
