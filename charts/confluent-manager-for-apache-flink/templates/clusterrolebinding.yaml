{{- if .Values.rbac }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.namespaced }}
kind: RoleBinding
{{- else }}
kind: ClusterRoleBinding
{{- end }}
metadata:
  labels:
    {{- include "cmf.labels" . | nindent 4 }}
  name: {{ include "cmf.name" . }}
  {{- if .Values.namespaced }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
subjects:
- kind: ServiceAccount
  name: {{ include "cmf.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  {{- if .Values.namespaced }}
  kind: Role
  {{- else }}
  kind: ClusterRole
  {{- end }}
  name: {{ include "cmf.name" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}