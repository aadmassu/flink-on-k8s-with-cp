apiVersion: v1
kind: Service
metadata:
  name: cmf-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmf.labels" . | nindent 4 }}
spec:
  # Service selects the pods to attach to using the selectors. The selector is a key-value pair, which must match the labels on the pods.
  selector:
    {{- include "cmf.selectorLabels" . | nindent 4 }}
  ports:
    # CMF serves HTTPS on container port 8080 (TLS terminated by Spring Boot
    # using the cmf-tls Secret produced by cert-manager). Service exposes 443.
    - name: cmf-https
      protocol: TCP
      port: 443
      targetPort: 8080