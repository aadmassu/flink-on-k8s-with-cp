# 5. CMF — Confluent Manager for Apache Flink

name: "5 - CMF"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, stg, prd]
        default: dev
      openshift_server:
        description: "OpenShift API server URL"
        required: true
        type: string

jobs:
  cmf:
    name: "CMF (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: "dah-kafka-${{ inputs.environment }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar xz -C /usr/local/bin oc kubectl

      - name: Login to OpenShift
        run: oc login "${{ inputs.openshift_server }}" --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Install CMF
        run: |
          ENV=${{ inputs.environment }}
          helm upgrade --install confluent-cmf charts/confluent-manager-for-apache-flink \
            --namespace ${{ env.NS }} \
            -f apps/confluent-cmf/${ENV}/values.yaml \
            -f apps/confluent-cmf/openshift-overlay.yaml \
            --wait --timeout 10m

      - name: Verify
        run: |
          helm status confluent-cmf -n ${{ env.NS }}
          oc get pods -n ${{ env.NS }} -l app.kubernetes.io/name=confluent-manager-for-apache-flink
