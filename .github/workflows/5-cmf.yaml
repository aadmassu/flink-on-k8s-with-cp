# 5. CMF — Confluent Manager for Apache Flink

name: "5 - CMF"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, stg, prd]
        default: dev
      openshift_server:
        description: "OpenShift API server URL"
        required: true
        type: string

jobs:
  cmf:
    name: "CMF (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: "dah-kafka-${{ inputs.environment }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar xz -C /usr/local/bin oc kubectl

      - name: Login to OpenShift
        run: oc login "${{ inputs.openshift_server }}" --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Apply CMF
        run: |
          oc apply -f apps/confluent-cmf/${{ inputs.environment }}/cmf.yaml

          echo "Waiting for CMF to be ready..."
          oc rollout status deployment/confluent-manager-for-apache-flink \
            -n ${{ env.NS }} --timeout=300s

          oc get pods -n ${{ env.NS }} -l app.kubernetes.io/name=confluent-manager-for-apache-flink
