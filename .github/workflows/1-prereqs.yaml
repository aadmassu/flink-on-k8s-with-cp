# 1. OpenShift prerequisites — SCC, ClusterRoleBindings, namespaces

name: "1 - Prerequisites"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, stg, prd]
        default: dev
      openshift_server:
        description: "OpenShift API server URL"
        required: true
        type: string

jobs:
  prereqs:
    name: "Prerequisites (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: "confluent-${{ inputs.environment }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar xz -C /usr/local/bin oc kubectl

      - name: Login to OpenShift
        run: oc login "${{ inputs.openshift_server }}" --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Verify cluster connectivity
        run: |
          oc cluster-info
          oc get nodes

      - name: Create namespaces
        run: |
          oc create namespace ${{ env.NS }} --dry-run=client -o yaml | oc apply -f -
          oc create namespace cert-manager --dry-run=client -o yaml | oc apply -f -

      - name: Apply SCC and ClusterRoleBindings
        run: |
          oc apply -f openshift-prereqs/${{ inputs.environment }}/manifests/
          echo "SCC and ClusterRoleBindings applied."

      - name: Verify
        run: |
          oc get namespace ${{ env.NS }} cert-manager
          oc get scc confluent-scc
          oc get clusterrolebinding -l '!olm.owner' | grep confluent-scc || true
