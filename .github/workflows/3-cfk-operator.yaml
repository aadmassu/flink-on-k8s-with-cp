# 3. CFK Operator + webhook TLS — Confluent for Kubernetes

name: "3 - CFK Operator"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, stg, prd]
        default: dev
      openshift_server:
        description: "OpenShift API server URL"
        required: true
        type: string

jobs:
  cfk:
    name: "CFK Operator (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: "dah-kafka-${{ inputs.environment }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar xz -C /usr/local/bin oc kubectl

      - name: Login to OpenShift
        run: oc login "${{ inputs.openshift_server }}" --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Add Helm repo
        run: |
          helm repo add confluent https://packages.confluent.io/helm 2>/dev/null || true
          helm repo update confluent

      - name: Apply webhook TLS (before Helm install)
        run: |
          ENV=${{ inputs.environment }}
          cat <<EOF | oc apply -n ${{ env.NS }} -f -
          ---
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: cfk-selfsigned-issuer
          spec:
            selfSigned: {}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cfk-jks-password
          stringData:
            password: changeit
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: confluent-operator-serving-cert
          spec:
            secretName: confluent-operator-serving-cert
            issuerRef:
              name: cfk-selfsigned-issuer
              kind: Issuer
            dnsNames:
              - confluent-operator.dah-kafka-${ENV}.svc
              - confluent-operator.dah-kafka-${ENV}.svc.cluster.local
            duration: 8760h
            renewBefore: 720h
            keystores:
              pkcs12:
                create: true
                passwordSecretRef:
                  name: cfk-jks-password
                  key: password
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cfk-jks-password-file
          stringData:
            jksPassword.txt: "jksPassword=changeit"
          EOF

          oc wait --for=condition=Ready certificate/confluent-operator-serving-cert \
            -n ${{ env.NS }} --timeout=120s
          echo "CFK webhook TLS ready."

      - name: Install CFK Operator
        run: |
          ENV=${{ inputs.environment }}
          helm upgrade --install confluent-operator confluent/confluent-for-kubernetes \
            --namespace ${{ env.NS }} \
            --version 0.1351.59 \
            -f apps/confluent-operator/${ENV}/values.yaml \
            -f apps/confluent-operator/openshift-overlay.yaml \
            --wait --timeout 10m

      - name: Wait for CFK CRDs
        run: |
          for CRD in flinkenvironments.platform.confluent.io cmfrestclasses.platform.confluent.io; do
            echo "Waiting for $CRD..."
            RETRIES=0
            until oc get crd "$CRD" &>/dev/null; do
              RETRIES=$((RETRIES + 1))
              if [ "$RETRIES" -ge 30 ]; then echo "ERROR: $CRD not found."; exit 1; fi
              sleep 2
            done
            oc wait --for=condition=Established "crd/$CRD" --timeout=60s
          done

      - name: Verify
        run: |
          helm status confluent-operator -n ${{ env.NS }}
          oc get pods -n ${{ env.NS }} -l app=confluent-operator
          oc get certificate -n ${{ env.NS }}
