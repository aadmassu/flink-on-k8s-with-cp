# Scenario 1: Full deployment - Install ArgoCD + all operators
# Use this workflow when deploying to a cluster that does NOT have ArgoCD installed.
#
# This workflow:
#   1. Installs ArgoCD via Helm
#   2. Deploys cert-manager (via ArgoCD ApplicationSet)
#   3. Deploys Confluent Operator and Flink Operator (via ArgoCD ApplicationSets)

name: "Full Deploy (ArgoCD + Operators)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - stg
          - prd
        default: dev
      cluster_context:
        description: "Kubeconfig context name for the target cluster"
        required: true
        type: string

env:
  ARGOCD_NAMESPACE: argocd

jobs:
  deploy:
    name: "Deploy ArgoCD + Operators (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.28.0"

      - name: Configure kubeconfig
        run: |
          # Configure cluster access
          # Replace this step with your cluster authentication method:
          #   - For EKS: aws eks update-kubeconfig --name <cluster> --region <region>
          #   - For AKS: az aks get-credentials --resource-group <rg> --name <cluster>
          #   - For GKE: gcloud container clusters get-credentials <cluster> --region <region>
          #   - For OpenShift: oc login <server> --token=<token>
          echo "Configure your cluster authentication here"
          kubectl config use-context ${{ inputs.cluster_context }}

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Add Helm repositories
        run: |
          helm repo add argo-cd https://argoproj.github.io/argo-helm 2>/dev/null || true
          helm repo add confluent https://packages.confluent.io/helm 2>/dev/null || true
          helm repo add jetstack https://charts.jetstack.io 2>/dev/null || true
          helm repo update

      - name: Install ArgoCD
        run: |
          ENV=${{ inputs.environment }}

          helm upgrade --install argocd argo-cd/argo-cd \
            --namespace ${ARGOCD_NAMESPACE} \
            --create-namespace \
            -f apps/argocd/${ENV}/values.yaml \
            --wait --timeout 5m

          echo "Waiting for ArgoCD pods to be ready..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/part-of=argocd \
            -n ${ARGOCD_NAMESPACE} --timeout=300s

      - name: Deploy cert-manager
        run: |
          ENV=${{ inputs.environment }}

          kubectl apply -f gitops-config/aws-us-east-2/${ENV}/cert-manager-application-set.yaml

          echo "Waiting for cert-manager to become healthy..."
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
            application/cert-manager-${ENV} \
            -n ${ARGOCD_NAMESPACE} --timeout=180s

          echo "Verifying cert-manager pods..."
          kubectl get pods -n cert-manager

      - name: Deploy Confluent Operator
        run: |
          ENV=${{ inputs.environment }}

          kubectl apply -f gitops-config/aws-us-east-2/${ENV}/confluent-operator-application-set.yaml

          echo "Waiting for Confluent Operator to become healthy..."
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
            application/confluent-operator-${ENV} \
            -n ${ARGOCD_NAMESPACE} --timeout=180s

      - name: Deploy Flink Operator
        run: |
          ENV=${{ inputs.environment }}

          kubectl apply -f gitops-config/aws-us-east-2/${ENV}/confluent-flink-operator-application-set.yaml

          echo "Waiting for Flink Operator to become healthy..."
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
            application/confluent-flink-operator-${ENV} \
            -n ${ARGOCD_NAMESPACE} --timeout=180s

      - name: Verify deployment
        run: |
          ENV=${{ inputs.environment }}

          echo "=== ArgoCD Applications ==="
          kubectl get applications -n ${ARGOCD_NAMESPACE} \
            -o custom-columns=NAME:.metadata.name,HEALTH:.status.health.status,SYNC:.status.sync.status

          echo ""
          echo "=== Operator Pods ==="
          kubectl get pods -n confluent-${ENV}
          kubectl get pods -n cert-manager
