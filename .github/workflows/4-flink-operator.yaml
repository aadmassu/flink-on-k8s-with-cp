# 4. Flink Operator — Confluent Flink Kubernetes Operator

name: "4 - Flink Operator"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, stg, prd]
        default: dev
      openshift_server:
        description: "OpenShift API server URL"
        required: true
        type: string

jobs:
  flink-operator:
    name: "Flink Operator (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: "confluent-${{ inputs.environment }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar xz -C /usr/local/bin oc kubectl

      - name: Login to OpenShift
        run: oc login "${{ inputs.openshift_server }}" --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Add Helm repo
        run: |
          helm repo add confluent https://packages.confluent.io/helm 2>/dev/null || true
          helm repo update confluent

      - name: Install Flink Operator
        run: |
          ENV=${{ inputs.environment }}
          helm upgrade --install confluent-flink-operator confluent/flink-kubernetes-operator \
            --namespace ${{ env.NS }} \
            --version 1.130.2 \
            -f apps/confluent-flink-operator/${ENV}/values.yaml \
            -f apps/confluent-flink-operator/openshift-overlay.yaml \
            --wait --timeout 3m

      - name: Verify
        run: |
          helm status confluent-flink-operator -n ${{ env.NS }}
          oc get pods -n ${{ env.NS }} -l app.kubernetes.io/name=flink-kubernetes-operator
