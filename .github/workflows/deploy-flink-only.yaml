# Flink-only deployment — no ArgoCD, no Kustomize.
# All components installed via Helm and oc apply.
#
# Steps:
#   1. SCC + namespaces
#   2. cert-manager (Helm)
#   3. CFK Operator (Helm) + webhook TLS
#   4. Flink Operator (Helm)
#   5. CMF (Helm — noauth + local SQLite)
#   6. Flink CRs (oc apply)

name: "Deploy Flink-Only"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - stg
          - prd
        default: dev
      openshift_server:
        description: "OpenShift API server URL"
        required: true
        type: string
      openshift_token:
        description: "OpenShift login token (or use secret)"
        required: false
        type: string

env:
  NS: "confluent-${{ inputs.environment }}"

jobs:
  deploy:
    name: "Flink-Only Deploy (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar xz -C /usr/local/bin oc kubectl

      - name: Login to OpenShift
        run: |
          TOKEN="${{ inputs.openshift_token || secrets.OPENSHIFT_TOKEN }}"
          oc login "${{ inputs.openshift_server }}" --token="$TOKEN" --insecure-skip-tls-verify

      - name: Verify cluster connectivity
        run: |
          oc cluster-info
          oc get nodes

      - name: Create namespaces
        run: |
          oc create namespace ${{ env.NS }} --dry-run=client -o yaml | oc apply -f -
          oc create namespace cert-manager --dry-run=client -o yaml | oc apply -f -

      - name: Apply OpenShift prerequisites (SCC + bindings)
        run: |
          oc apply -f openshift-prereqs/${{ inputs.environment }}/manifests/
          echo "SCC and ClusterRoleBindings applied."

      - name: Add Helm repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io 2>/dev/null || true
          helm repo add confluent https://packages.confluent.io/helm 2>/dev/null || true
          helm repo update

      - name: Install cert-manager
        run: |
          ENV=${{ inputs.environment }}
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --version v1.19.4 \
            -f apps/cert-manager/${ENV}/values.yaml \
            -f apps/cert-manager/openshift-overlay.yaml \
            --wait --timeout 3m

          for CRD in certificates.cert-manager.io issuers.cert-manager.io; do
            echo "Waiting for $CRD..."
            RETRIES=0
            until oc get crd "$CRD" &>/dev/null; do
              RETRIES=$((RETRIES + 1))
              if [ "$RETRIES" -ge 30 ]; then echo "ERROR: $CRD not found."; exit 1; fi
              sleep 2
            done
            oc wait --for=condition=Established "crd/$CRD" --timeout=60s
          done
          echo "cert-manager CRDs ready."

      - name: Install CFK Operator
        run: |
          ENV=${{ inputs.environment }}
          helm upgrade --install confluent-operator confluent/confluent-for-kubernetes \
            --namespace ${{ env.NS }} \
            --version 0.1351.59 \
            -f apps/confluent-operator/${ENV}/values.yaml \
            -f apps/confluent-operator/openshift-overlay.yaml \
            --wait --timeout 3m

      - name: Apply CFK webhook TLS
        run: |
          ENV=${{ inputs.environment }}
          cat <<EOF | oc apply -n ${{ env.NS }} -f -
          ---
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: cfk-selfsigned-issuer
          spec:
            selfSigned: {}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cfk-jks-password
          stringData:
            password: changeit
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: confluent-operator-serving-cert
          spec:
            secretName: confluent-operator-serving-cert
            issuerRef:
              name: cfk-selfsigned-issuer
              kind: Issuer
            dnsNames:
              - confluent-operator.confluent-${ENV}.svc
              - confluent-operator.confluent-${ENV}.svc.cluster.local
            duration: 8760h
            renewBefore: 720h
            keystores:
              pkcs12:
                create: true
                passwordSecretRef:
                  name: cfk-jks-password
                  key: password
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cfk-jks-password-file
          stringData:
            jksPassword.txt: "jksPassword=changeit"
          EOF

          oc wait --for=condition=Ready certificate/confluent-operator-serving-cert \
            -n ${{ env.NS }} --timeout=120s
          echo "CFK webhook TLS ready."

      - name: Wait for CFK CRDs
        run: |
          for CRD in flinkenvironments.platform.confluent.io cmfrestclasses.platform.confluent.io; do
            echo "Waiting for $CRD..."
            RETRIES=0
            until oc get crd "$CRD" &>/dev/null; do
              RETRIES=$((RETRIES + 1))
              if [ "$RETRIES" -ge 30 ]; then echo "ERROR: $CRD not found."; exit 1; fi
              sleep 2
            done
            oc wait --for=condition=Established "crd/$CRD" --timeout=60s
          done
          echo "CFK CRDs ready."

      - name: Install Flink Operator
        run: |
          ENV=${{ inputs.environment }}
          helm upgrade --install confluent-flink-operator confluent/flink-kubernetes-operator \
            --namespace ${{ env.NS }} \
            --version 1.130.2 \
            -f apps/confluent-flink-operator/${ENV}/values.yaml \
            -f apps/confluent-flink-operator/openshift-overlay.yaml \
            --wait --timeout 3m

      - name: Install CMF
        run: |
          ENV=${{ inputs.environment }}
          helm upgrade --install confluent-cmf confluent/confluent-manager-for-apache-flink \
            --namespace ${{ env.NS }} \
            --version 2.2.0 \
            -f apps/confluent-cmf/${ENV}/values.yaml \
            -f apps/confluent-cmf/openshift-overlay.yaml \
            --wait --timeout 3m

      - name: Apply Flink CRs
        run: |
          ENV=${{ inputs.environment }}
          oc apply -f apps/confluent-flink/${ENV}/

          echo "Waiting for Flink session cluster..."
          RETRIES=0
          until oc get flinkdeployment flink-session -n ${{ env.NS }} &>/dev/null; do
            RETRIES=$((RETRIES + 1))
            if [ "$RETRIES" -ge 30 ]; then echo "ERROR: FlinkDeployment not found."; exit 1; fi
            sleep 5
          done
          oc wait --for=jsonpath='{.status.jobManagerDeploymentStatus}'=READY \
            flinkdeployment/flink-session -n ${{ env.NS }} --timeout=300s
          echo "Flink session cluster is READY."

      - name: Verify deployment
        run: |
          echo "=== Helm Releases ==="
          helm list -n ${{ env.NS }}
          helm list -n cert-manager

          echo ""
          echo "=== Pods ==="
          oc get pods -n ${{ env.NS }}
          oc get pods -n cert-manager

          echo ""
          echo "=== Flink CRs ==="
          oc get flinkdeployment,flinkenvironment,cmfrestclass -n ${{ env.NS }}
