# 6. Flink CRs — CMFRestClass, FlinkEnvironment, PVC, session cluster

name: "6 - Flink CRs"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, qa, stg, prd]
        default: dev
      openshift_server:
        description: "OpenShift API server URL"
        required: true
        type: string

jobs:
  flink-crs:
    name: "Flink CRs (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: "dah-kafka-${{ inputs.environment }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar xz -C /usr/local/bin oc kubectl

      - name: Login to OpenShift
        run: oc login "${{ inputs.openshift_server }}" --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Apply Flink CRs
        run: |
          oc apply -f apps/confluent-flink/${{ inputs.environment }}/
          echo "Flink CRs applied."

      - name: Wait for Flink session cluster
        run: |
          echo "Waiting for FlinkDeployment..."
          RETRIES=0
          until oc get flinkdeployment flink-session -n ${{ env.NS }} &>/dev/null; do
            RETRIES=$((RETRIES + 1))
            if [ "$RETRIES" -ge 30 ]; then echo "ERROR: FlinkDeployment not found."; exit 1; fi
            sleep 5
          done
          oc wait --for=jsonpath='{.status.jobManagerDeploymentStatus}'=READY \
            flinkdeployment/flink-session -n ${{ env.NS }} --timeout=300s
          echo "Flink session cluster is READY."

      - name: Verify
        run: |
          oc get flinkdeployment,flinkenvironment,cmfrestclass,pvc -n ${{ env.NS }}
          oc get pods -n ${{ env.NS }} -l app=flink-session
