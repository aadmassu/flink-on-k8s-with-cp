---
# Per-environment ServiceAccount that CMF expects to exist.
# Name pattern hardcoded in CMF: cmf-env-sa-<envName>
# Manifests below follow the exact shape Confluent's CMF team specified,
# with FCB-required labels added (instance, component, fcbint.net/app-id).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmf-env-sa-dah-flink-dev
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: flink-kubernetes-operator
    app.kubernetes.io/instance: cmf-env-sa-dah-flink-dev
    app.kubernetes.io/component: cmf-environment
    app.kubernetes.io/version: "1.0.1"
    confluent.io/managedBy: cmf
    fcbint.net/app-id: "11547"
---
# Role granting the per-env SA permissions to manage Flink app workloads
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmf-env-role-dah-flink-dev
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: flink-kubernetes-operator
    app.kubernetes.io/instance: cmf-env-role-dah-flink-dev
    app.kubernetes.io/component: cmf-environment
    app.kubernetes.io/version: "1.0.1"
    confluent.io/managedBy: cmf
    fcbint.net/app-id: "11547"
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/finalizers"]
    verbs: ["*"]
---
# RoleBinding for the main role → per-env SA
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmf-env-rolebinding-dah-flink-dev
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: flink-kubernetes-operator
    app.kubernetes.io/instance: cmf-env-rolebinding-dah-flink-dev
    app.kubernetes.io/component: cmf-environment
    app.kubernetes.io/version: "1.0.1"
    confluent.io/managedBy: cmf
    fcbint.net/app-id: "11547"
subjects:
  - kind: ServiceAccount
    name: cmf-env-sa-dah-flink-dev
    namespace: dah-flink-dev
roleRef:
  kind: Role
  name: cmf-env-role-dah-flink-dev
  apiGroup: rbac.authorization.k8s.io
---
# Role scoped to the per-env encryption key secret (read-only by name)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmf-env-secret-role-dah-flink-dev
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: flink-kubernetes-operator
    app.kubernetes.io/instance: cmf-env-secret-role-dah-flink-dev
    app.kubernetes.io/component: cmf-environment
    app.kubernetes.io/version: "1.0.1"
    confluent.io/managedBy: cmf
    fcbint.net/app-id: "11547"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cmf-env-key-dah-flink-dev"]
    verbs: ["get"]
---
# RoleBinding for the secret role → per-env SA
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmf-env-secret-rolebinding-dah-flink-dev
  namespace: dah-flink-dev
  labels:
    app.kubernetes.io/name: flink-kubernetes-operator
    app.kubernetes.io/instance: cmf-env-secret-rolebinding-dah-flink-dev
    app.kubernetes.io/component: cmf-environment
    app.kubernetes.io/version: "1.0.1"
    confluent.io/managedBy: cmf
    fcbint.net/app-id: "11547"
subjects:
  - kind: ServiceAccount
    name: cmf-env-sa-dah-flink-dev
    namespace: dah-flink-dev
roleRef:
  kind: Role
  name: cmf-env-secret-role-dah-flink-dev
  apiGroup: rbac.authorization.k8s.io
