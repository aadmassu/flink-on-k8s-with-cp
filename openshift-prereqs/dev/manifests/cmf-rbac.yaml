---
# ServiceAccount for CMF pod in dah-flink-dev
# CMF uses this SA at runtime to manage FlinkDeployments, pods, configmaps, etc.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: dah-flink-dev
---
# Namespace-scoped Role granting CMF + Flink Operator + Flink Jobs the permissions they need
# Covers: CMF (manage apps, environments, catalogs), Flink Operator (manage deployments),
#         and Flink Jobs (pods, configmaps)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: dah-flink-dev
rules:
  # Core resources — CMF + Flink Operator + Flink Jobs
  - apiGroups: [""]
    resources: ["pods", "services", "events", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "delete", "update"]
  # Apps — Flink Operator manages deployments and replicasets
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/finalizers", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Flink CRDs — CMF + Flink Operator
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinkdeployments/finalizers", "flinkdeployments/status",
                "flinksessionjobs", "flinksessionjobs/finalizers", "flinksessionjobs/status",
                "flinkstatesnapshots", "flinkstatesnapshots/finalizers", "flinkstatesnapshots/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Ingress — Flink Operator creates ingresses for Flink UI
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions"]
    resources: ["deployments", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election — Flink Operator uses leases for HA
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC — CMF creates roles/rolebindings for Flink jobs
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
# RoleBinding connecting the SA to the Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: dah-flink-dev
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: dah-flink-dev
roleRef:
  kind: Role
  name: flink
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for cluster-scoped event watching (CMF requires this)
# CMF's k8sFKOExceptionEventWatcher bean watches events at cluster scope.
# This is read-only — no create, modify, or delete access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmf-event-reader
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding granting the flink SA cluster-scoped event access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmf-event-reader-dah-flink-dev
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: dah-flink-dev
roleRef:
  kind: ClusterRole
  name: cmf-event-reader
  apiGroup: rbac.authorization.k8s.io
