---
# ServiceAccount for CMF pod in dah-flink-dev
# CMF uses this SA at runtime to manage FlinkDeployments, pods, configmaps, etc.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: dah-flink-dev
---
# Namespace-scoped Role granting CMF the permissions it needs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: dah-flink-dev
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/finalizers"]
    verbs: ["*"]
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinkdeployments/status", "flinkstatesnapshots", "flinkstatesnapshots/status"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets"]
    verbs: ["create", "get", "list", "watch", "delete", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
# RoleBinding connecting the SA to the Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: dah-flink-dev
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: dah-flink-dev
roleRef:
  kind: Role
  name: flink
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for cluster-scoped event watching (CMF requires this)
# CMF's k8sFKOExceptionEventWatcher bean watches events at cluster scope.
# This is read-only — no create, modify, or delete access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmf-event-reader
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding granting the flink SA cluster-scoped event access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmf-event-reader-dah-flink-dev
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: dah-flink-dev
roleRef:
  kind: ClusterRole
  name: cmf-event-reader
  apiGroup: rbac.authorization.k8s.io
