---
# ServiceAccount for CMF pod in dah-flink-qa
# CMF uses this SA at runtime to manage FlinkDeployments, pods, configmaps, etc.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: dah-flink-qa
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: flink
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
---
# Namespace-scoped Role granting CMF + Flink Operator + Flink Jobs the permissions they need
# Covers: CMF (manage apps, environments, catalogs), Flink Operator (manage deployments),
#         and Flink Jobs (pods, configmaps)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: dah-flink-qa
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: flink
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "delete", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/finalizers", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinkdeployments/finalizers", "flinkdeployments/status",
                "flinksessionjobs", "flinksessionjobs/finalizers", "flinksessionjobs/status",
                "flinkstatesnapshots", "flinkstatesnapshots/finalizers", "flinkstatesnapshots/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions"]
    resources: ["deployments", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
# RoleBinding connecting the SA to the Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: dah-flink-qa
  labels:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
    app.kubernetes.io/instance: flink
    app.kubernetes.io/component: cmf
    fcbint.net/app-id: "11547"
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: dah-flink-qa
roleRef:
  kind: Role
  name: flink
  apiGroup: rbac.authorization.k8s.io
